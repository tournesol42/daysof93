*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0A}
#sv{display:block;width:100vw;height:100vh;height:100dvh}
a.plink{text-decoration:none;cursor:pointer}
a.plink .ps{transition:opacity 0.15s}
a.plink:hover .ps{opacity:0.7}
a.plink .hit{fill:transparent;pointer-events:all}
/* ── D93 Extended Colour Chooser ── */
#d93cc{display:none;position:fixed;z-index:10000;background:#1a1a1a;border:1px solid #444;
  box-shadow:3px 5px 18px rgba(0,0,0,.6);width:292px;font-family:'Jost',sans-serif;font-weight:300;color:#bbb}
#d93cc.open{display:block}
#d93cc-hdr{padding:6px 10px;border-bottom:1px solid #333;display:flex;align-items:center;
  justify-content:space-between;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#666;cursor:move}
#d93cc-close{cursor:pointer;color:#555;font-size:16px;line-height:1;padding:0 2px}
#d93cc-close:hover{color:#bbb}
#d93cc-tabs{display:flex;border-bottom:1px solid #333}
.d93cct{flex:1;padding:5px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;text-align:center;
  cursor:pointer;color:#555;border-right:1px solid #333}
.d93cct:last-child{border-right:none}.d93cct.on{color:#6698bb;background:#222}
.d93ccp{display:none}.d93ccp.on{display:block}
#d93ral-s{width:100%;padding:5px 10px;font-size:10px;font-family:'Jost',sans-serif;font-weight:300;
  border:none;border-bottom:1px solid #333;background:#222;outline:none;color:#aaa}
#d93ral-g{display:flex;flex-wrap:wrap;gap:2px;padding:6px;max-height:180px;overflow-y:auto}
.d93rs{width:20px;height:20px;cursor:pointer;flex-shrink:0;border:1px solid transparent}
.d93rs:hover{outline:2px solid #6698bb;outline-offset:1px}
#d93neon-g{display:flex;flex-wrap:wrap;gap:3px;padding:8px}
.d93ns{width:40px;height:28px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:2px;font-size:7px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(0,0,0,.65);border:1px solid transparent}
.d93ns:hover{outline:2px solid #eee}
#d93mix{padding:8px}
#d93sv{width:100%;height:148px;cursor:crosshair;display:block;border:1px solid #333}
.d93sr{margin-top:4px;position:relative;height:12px}
.d93sr canvas{width:100%;height:12px;display:block;cursor:pointer;border:1px solid #333}
.d93sth{position:absolute;top:-1px;width:5px;height:14px;background:#ccc;border:1px solid #666;
  transform:translateX(-50%);pointer-events:none}
.d93fmts{display:flex;gap:2px;margin-top:5px}
.d93fg{flex:1;display:flex;flex-direction:column;align-items:center}
.d93fg label{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:1px}
.d93fg input{width:100%;font-size:9px;font-family:monospace;border:1px solid #333;background:#222;
  padding:2px;text-align:center;outline:none;color:#aaa}
.d93fg input:focus{border-color:#6698bb}
#d93prev{height:20px;margin-top:4px;border:1px solid #333;display:flex;align-items:center;
  padding:0 6px;gap:6px;font-size:9px;color:#666}
#d93prev-sw{width:28px;height:12px;border:1px solid #555;flex-shrink:0}
.d93gr,.d93ts{display:flex;gap:2px;margin-top:3px}
.d93gr div,.d93ts div{flex:1;height:14px;cursor:pointer}
#d93cust{display:flex;flex-wrap:wrap;gap:2px;padding:4px 8px;min-height:22px;border-top:1px solid #333}
.d93cs{width:16px;height:16px;cursor:pointer;border:1px solid #444}
.d93cs:hover{outline:2px solid #6698bb}
#d93savecs{font-size:8px;font-family:'Jost',sans-serif;border:1px dashed #444;background:transparent;
  padding:1px 5px;cursor:pointer;margin:2px 0 0 2px;color:#666}
#d93savecs:hover{color:#aaa}
@keyframes hint-pulse{0%,100%{opacity:0.25}50%{opacity:1}}
#hint-push{animation:hint-pulse 2.4s ease-in-out infinite}
#glitchCanvas{position:fixed;inset:0;width:100vw;height:100vh;z-index:10;pointer-events:none;image-rendering:auto;}

<!-- ── MAIN DRAWING SCRIPT ── -->
<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var SX = 132, SY = 421;

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for(var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  // Single source of truth: orbits, labels and dots all use this array
  var ORBITS = [
    {name:'mercury', cx:132.0, cy:421, r:115.5, pR:4.5,  labelable:false},
    {name:'venus',   cx:143.5, cy:421, r:129.5, pR:9,    labelable:false},
    {name:'mars',    cx:163.5, cy:421, r:152.5, pR:12,   labelable:true,  labelAngle:-29.6, labelText:'1998'},
    {name:'jupiter', cx:197.5, cy:421, r:189.5, pR:28,   labelable:true,  labelAngle:-32.8, labelText:'JOURNEY'},
    {name:'saturn',  cx:231.0, cy:421, r:225.5, pR:21.5, labelable:true,  labelAngle:-37,   labelText:'BINARY COUNTER'},
    {name:'uranus',  cx:260.5, cy:421, r:258.5, pR:10,   labelable:true,  labelAngle:-38.9, labelText:'GLITCHY VISUALS'},
    {name:'neptune', cx:280.5, cy:421, r:281.5, pR:12,   labelable:true,  labelAngle:-40,   labelText:'IN THE BEGINNING'}
  ];
  window._d93ORBITS = ORBITS;

  // Dynamic full-bleed viewBox
  // x always starts at 0; wide screens extend right; portrait extends height equally T&B
  var sv = document.getElementById('sv');
  function setVB(){
    var bcr = sv.getBoundingClientRect();
    var W = bcr.width || window.innerWidth, H = bcr.height || window.innerHeight;
    var asp = W / H, refAsp = 585 / 864;
    var x, y, w, h;
    var cropX = (W < H && window._d93P && window._d93P.mobileCropX) ? (window._d93P.mobileCropX || 0) : 0;
    if(asp >= refAsp){
      h = 864; w = 864 * asp;
      x = 0; y = 0;
    } else {
      w = 585 - cropX; h = w / asp;
      x = cropX; y = (864 - h) / 2;
    }
    sv.setAttribute('viewBox', x.toFixed(1)+' '+y.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
    updateHintSize();
    updatePlanetSizes();
    updateLabelSizes();
  }
  function updateHintSize(){
    var hint = document.getElementById('hint-push');
    if(!hint) return;
    var scale = sv.getScreenCTM() ? sv.getScreenCTM().a : 1;
    var hintSize = window._d93P && window._d93P.hintSize !== undefined ? window._d93P.hintSize : 11;
    var hintMinPx = window._d93P && window._d93P.hintMinPx !== undefined ? window._d93P.hintMinPx : 15;
    hint.setAttribute('font-size', Math.max(hintSize, hintMinPx / scale).toFixed(3));
    positionHint();
  }
  window._d93UpdateHintSize = updateHintSize;
  function positionHint(){
    var hint = document.getElementById('hint-push');
    if(!hint) return;
    hint.setAttribute('x', '132');
    hint.setAttribute('y', '421');
    hint.setAttribute('text-anchor', 'middle');
    hint.setAttribute('dominant-baseline', 'middle');
    // Set single line, then check if it overflows 85% of sun diameter
    while(hint.firstChild) hint.removeChild(hint.firstChild);
    hint.appendChild(document.createTextNode('push the dots →'));
    var sunEl = document.getElementById('sun');
    var sunR = sunEl ? parseFloat(sunEl.getAttribute('r')) : 56.5;
    var maxW = 0.85 * 2 * sunR;
    var bbox;
    try { bbox = hint.getBBox(); } catch(e) { bbox = null; }
    if(bbox && bbox.width > maxW){
      while(hint.firstChild) hint.removeChild(hint.firstChild);
      var t1 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      t1.setAttribute('x','132'); t1.setAttribute('dy','-0.6em'); t1.textContent='push the';
      var t2 = document.createElementNS('http://www.w3.org/2000/svg','tspan');
      t2.setAttribute('x','132'); t2.setAttribute('dy','1.2em'); t2.textContent='dots →';
      hint.appendChild(t1); hint.appendChild(t2);
    }
  }
  document.fonts.ready.then(positionHint);
  window.addEventListener('resize', positionHint);
  function updatePlanetSizes(){
    var scale = sv.getScreenCTM() ? sv.getScreenCTM().a : 1;
    var pMin = window._d93P && window._d93P.planetMinPx != null ? window._d93P.planetMinPx : 9;
    var tMin = window._d93P && window._d93P.tapMinPx    != null ? window._d93P.tapMinPx    : 44;
    var ORBITS = window._d93ORBITS;
    if(!ORBITS || !scale) return;
    ORBITS.forEach(function(orb){
      if(!orb.labelable) return;  // only linked planets
      var planet = document.getElementById('planet-' + orb.name);
      var link   = document.getElementById('al-'     + orb.name);
      if(!planet) return;
      var dispR = Math.max(orb.pR, pMin / scale);
      planet.setAttribute('r', dispR.toFixed(2));
      // hit circle is first child of link
      if(link){
        var hit = link.querySelector('circle.hit');
        if(hit){
          var baseHitR = parseFloat(hit.getAttribute('data-hr') || hit.getAttribute('r'));
          if(!hit.getAttribute('data-hr')) hit.setAttribute('data-hr', baseHitR);
          var tapR = Math.max(baseHitR, (tMin / 2) / scale);
          hit.setAttribute('r', tapR.toFixed(2));
        }
      }
    });
  }
  function updateLabelSizes(){
    var scale = sv.getScreenCTM() ? sv.getScreenCTM().a : 1;
    var lMin  = window._d93P && window._d93P.labelMinPx != null ? window._d93P.labelMinPx : 8;
    var tSize = window._d93P && window._d93P.textSize   != null ? window._d93P.textSize   : 6;
    var labelsG = document.getElementById('labels');
    if(!labelsG || !scale) return;
    var fs = Math.max(tSize, lMin / scale);
    labelsG.setAttribute('font-size', fs.toFixed(3));
  }
  window._d93UpdatePlanetSizes = updatePlanetSizes;
  window._d93UpdateLabelSizes  = updateLabelSizes;
  setVB();
  window.addEventListener('resize', setVB);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setVB);
  window.addEventListener('orientationchange', setVB);

  // Specks
  var sp = [[78,42,0.8],[218,28,0.6],[340,16,0.9],[472,52,0.7],[558,130,0.6],
            [570,240,0.8],[575,390,0.7],[562,530,0.9],[540,648,0.6],[488,748,0.8],
            [380,800,0.7],[248,820,0.6],[128,790,0.9],[52,680,0.7],[22,510,0.6],
            [36,350,0.8],[62,208,0.7],[408,88,0.6],[182,540,0.8],[492,310,0.7],
            [350,640,0.6],[140,320,0.8],[530,460,0.7],[90,480,0.6],
            [-80,200,0.7],[-120,400,0.6],[620,180,0.8],[650,420,0.7],
            [-60,600,0.9],[640,620,0.6]];
  var sg = document.getElementById('specks');
  sp.forEach(function(s){ sg.appendChild(mk('circle',{cx:s[0],cy:s[1],r:s[2]})); });

  // Radial rays — measured reference geometry [angle°, rStart, rEnd] (0=right, 90=down)
  var RAY_DATA = [
    [98.6,92,356],[24.5,93,333],[63.3,93,270],[296.9,92,241],[37.4,93,211],
    [124,93,206],[270,92,171],[309.5,92,167],[141,97,167],[43.9,174,354],
    [220.2,55,173],[199.6,55,137],[157.2,53,143],[179,56,132]
  ];
  var rg = document.getElementById('rays');
  RAY_DATA.forEach(function(ray){
    var a = ray[0] * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    rg.appendChild(mk('line',{
      x1:(SX + ray[1]*ca).toFixed(1), y1:(SY + ray[1]*sa).toFixed(1),
      x2:(SX + ray[2]*ca).toFixed(1), y2:(SY + ray[2]*sa).toFixed(1)
    }));
  });

  // Sun halo rings (16, r=63→90, seeded ±1.5 offsets)
  var ringsG = document.getElementById('sun-rings');
  var _hs = 42;
  function _hr(){ _hs = (_hs * 1664525 + 1013904223) >>> 0; return _hs / 4294967296; }
  for(var i=0;i<16;i++){
    var _ox = (_hr()-0.5)*3, _oy = (_hr()-0.5)*3;
    ringsG.appendChild(mk('circle',{cx:(SX+_ox).toFixed(2), cy:(SY+_oy).toFixed(2), r:(63+i*(90-63)/15).toFixed(2)}));
  }

  // Sun spokes — 19 measured angles (0=right, 90=down), r=56
  var SPOKE_ANGLES = [0,26,40,65,90,99,110,123,138.5,155,179,197.5,218,245.5,270,281.5,298,311.5,340];
  var spokesG = document.getElementById('spokes');
  SPOKE_ANGLES.forEach(function(deg){
    var a = deg * Math.PI / 180;
    spokesG.appendChild(mk('line',{
      x1:SX, y1:SY,
      x2:(SX + 56 * Math.cos(a)).toFixed(1),
      y2:(SY + 56 * Math.sin(a)).toFixed(1)
    }));
  });

  // Orbit rings from ORBITS: linked planets use <path> for tilt animation, others use <circle>
  var orbitG = document.getElementById('orbit-rings');
  ORBITS.forEach(function(o){
    if(o.labelable){
      orbitG.appendChild(mk('ellipse',{
        id:'orbit-'+o.name, cx:o.cx, cy:421, rx:o.r, ry:o.r,
        stroke:'#D0D0D0', 'stroke-width':'0.3', fill:'none',
        'vector-effect':'non-scaling-stroke'
      }));
    } else {
      orbitG.appendChild(mk('circle',{
        id:'orbit-'+o.name, cx:o.cx, cy:o.cy, r:o.r,
        stroke:'#D0D0D0', 'stroke-width':'0.3', fill:'none',
        'vector-effect':'non-scaling-stroke'
      }));
    }
  });

  // Three ellipse arcs — measured reference geometry
  function ellipsePolyline(cx,cy,rx,ry,phi,t0,t1,nPts){
    var pr=phi*Math.PI/180, cp=Math.cos(pr), sp=Math.sin(pr), d='M';
    for(var i=0;i<nPts;i++){
      var t=(t0+(t1-t0)*i/(nPts-1))*Math.PI/180;
      var x=cx+rx*Math.cos(t)*cp-ry*Math.sin(t)*sp;
      var y=cy+rx*Math.cos(t)*sp+ry*Math.sin(t)*cp;
      d+=(i>0?' L':'')+x.toFixed(2)+','+y.toFixed(2);
    }
    return d;
  }
  var arcsG = document.getElementById('arcs');
  var _ao=mk('path',{id:'arc-dotted',
    d:ellipsePolyline(300.4,310.4,183.0,461.2,57.0,144,243,500),
    stroke:'#D0D0D0','stroke-width':'0.3','stroke-dasharray':'1,3'});
  arcsG.appendChild(_ao);

  // Label path arcs — centred on labelAngle, r+4 radius, text-anchor middle
  var defs = document.querySelector('#sv defs');
  var labelsG = document.getElementById('labels');
  ORBITS.forEach(function(o){
    if(!o.labelable) return;
    var lr = o.r + 4, hs = 20;
    var a1r = (o.labelAngle - hs) * Math.PI / 180;
    var a2r = (o.labelAngle + hs) * Math.PI / 180;
    var x1 = (o.cx + lr * Math.cos(a1r)).toFixed(2);
    var y1 = (o.cy + lr * Math.sin(a1r)).toFixed(2);
    var x2 = (o.cx + lr * Math.cos(a2r)).toFixed(2);
    var y2 = (o.cy + lr * Math.sin(a2r)).toFixed(2);
    var pid = 'lp-'+o.name;
    var p = mk('path',{id:pid, d:'M '+x1+','+y1+' A '+lr+','+lr+' 0 0,1 '+x2+','+y2});
    defs.appendChild(p);
    var txt = mk('text',{'text-anchor':'middle'});
    var tp = mk('textPath',{href:'#'+pid, startOffset:'50%', id:'tp-'+o.name});
    tp.textContent = '• '+(window._d93Labels&&window._d93Labels[o.name]||o.labelText);
    txt.appendChild(tp);
    labelsG.appendChild(txt);
  });

  // Wire planet links
  var lmap = {
    'al-mars':    PLANET_LINKS.mars,
    'al-jupiter': PLANET_LINKS.jupiter,
    'al-saturn':  PLANET_LINKS.saturn,
    'al-uranus':  PLANET_LINKS.uranus,
    'al-neptune': PLANET_LINKS.neptune
  };
  Object.keys(lmap).forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    if(lmap[id]){ el.setAttribute('href', lmap[id]); }
    else { el.style.cursor='default'; el.style.pointerEvents='none'; }
  });

  // Orbiting dots — use ORBITS as single source of truth
  var DOT_ORBITS = ORBITS.filter(function(o){ return o.labelable; });
  var dotsG = document.getElementById('dots');
  var dotObjs = [];

  DOT_ORBITS.forEach(function(ring){
    var n = 3 + Math.floor(Math.random()*8);
    for(var i=0;i<n;i++){
      var rSize = 1.5 + Math.random()*2;
      var g = mk('g',{});
      var bloom = mk('circle',{r:(rSize*2.5).toFixed(1), fill:'#4E5754', filter:'url(#bloom)'});
      var sharp = mk('circle',{r:rSize.toFixed(1), fill:'#4E5754'});
      g.appendChild(bloom); g.appendChild(sharp);
      dotsG.appendChild(g);
      dotObjs.push({
        g:g, bloom:bloom, sharp:sharp,
        angle: Math.random()*Math.PI*2,
        speed: (0.4+Math.random()*1.2) * (Math.random()<0.5?1:-1),
        rSize: rSize,
        ring: ring
      });
    }
  });

  window._d93 = {
    dotObjs: dotObjs,
    _curSizeMul: 0.45,
    _curOpacity: 0.62,
    setDotColor: function(c){
      dotObjs.forEach(function(d){ d.bloom.setAttribute('fill',c); d.sharp.setAttribute('fill',c); });
    },
    setBloom: function(v){
      var f = document.getElementById('bloom');
      if(f) f.querySelector('feGaussianBlur').setAttribute('stdDeviation', v);
    },
    setDotSize: function(mul){
      this._curSizeMul = mul;
      dotObjs.forEach(function(d){
        d.sharp.setAttribute('r', (d.rSize * mul).toFixed(1));
        d.bloom.setAttribute('r', (d.rSize * mul * 2.5).toFixed(1));
      });
    },
    setDotOpacity: function(v){
      this._curOpacity = v;
      dotObjs.forEach(function(d){ d.g.setAttribute('opacity', v); });
    },
    speedMul: 1
  };

  // ── Tilt state ──
  var LINKED = ['mars','jupiter','saturn','uranus','neptune'];
  var ORBITS_BY_NAME = {};
  ORBITS.forEach(function(o){ ORBITS_BY_NAME[o.name] = o; });
  var tiltState = {};
  LINKED.forEach(function(n){
    tiltState[n] = { theta:0, targetFrac:0, hoverStart:null, spinPhase:false, spinStart:0, spinStartTheta:0, spinUsed:false, lastRy:-1, lastRx:-1 };
  });
  window._d93TiltParams = { tiltAngle:68, tiltEase:3.5, spinDelay:3, spinDur:2.6 };

  LINKED.forEach(function(name){
    var al = document.getElementById('al-'+name);
    if(!al) return;
    function enterHover(){
      var s = tiltState[name];
      if(!s.spinPhase){ s.targetFrac=1; if(s.hoverStart===null){ s.hoverStart=performance.now(); s.spinUsed=false; } }
    }
    function leaveHover(){
      var s = tiltState[name];
      s.targetFrac=0;
      if(!s.spinPhase){ s.hoverStart=null; }
    }
    var _lastPT = '';
    al.addEventListener('pointerenter', function(e){ if(e.pointerType==='mouse') enterHover(); });
    al.addEventListener('pointerleave', function(e){ if(e.pointerType==='mouse') leaveHover(); });
    al.addEventListener('pointerdown',  function(e){
      _lastPT = e.pointerType;
      if(e.pointerType==='touch'||e.pointerType==='pen'){
        enterHover();
        if(window._d93SetActivePlanet) window._d93SetActivePlanet(name);
        if(window._d93StartTouchNav)   window._d93StartTouchNav(name);
      }
    });
    al.addEventListener('pointerup', function(e){
      if(e.pointerType==='touch'||e.pointerType==='pen'){
        if(tiltState[name].spinUsed){
          leaveHover();
          if(window._d93SetActivePlanet) window._d93SetActivePlanet(null);
          if(window._d93CancelTouchNav)  window._d93CancelTouchNav(name);
        }
        // else: timer running — keep display visible until it fires
      }
    });
    al.addEventListener('pointercancel', function(e){
      if(e.pointerType==='touch'||e.pointerType==='pen'){
        leaveHover();
        if(window._d93SetActivePlanet) window._d93SetActivePlanet(null);
        if(window._d93CancelTouchNav)  window._d93CancelTouchNav(name);
      }
    });
    al.addEventListener('click', function(e){
      if(_lastPT==='touch'||_lastPT==='pen') e.preventDefault();
    });
  });

  // Animation loop
  var lastT = null;
  function frame(t){
    if(!lastT) lastT = t;
    var dt = Math.min((t-lastT)/1000, 0.1);
    lastT = t;
    var t_sec = t / 1000;
    var mul = window._d93.speedMul;
    var TP = window._d93TiltParams;
    var tiltRad = TP.tiltAngle * Math.PI / 180;

    // ── tilt state machine + ring paths ──
    LINKED.forEach(function(name){
      var s = tiltState[name];
      var orb = ORBITS_BY_NAME[name];
      // spin trigger
      if(!s.spinPhase && !s.spinUsed && s.hoverStart !== null){
        if((t - s.hoverStart) / 1000 >= TP.spinDelay){
          s.spinPhase=true; s.spinStart=t; s.spinStartTheta=s.theta; s.spinUsed=true;
          if(window._d93CancelTouchNav) window._d93CancelTouchNav(name);
        }
      }
      // update theta
      if(s.spinPhase){
        var spinS = Math.min(1, (t - s.spinStart) / 1000 / TP.spinDur);
        s.theta = s.spinStartTheta + (Math.PI*2 - s.spinStartTheta) * (1 - Math.cos(Math.PI*spinS)) / 2;
        if(spinS >= 1){ s.theta=0; s.spinPhase=false; s.targetFrac=0; s.hoverStart=null; }
      } else {
        var easeK = 1 - Math.exp(-TP.tiltEase * dt);
        s.theta += (s.targetFrac * tiltRad - s.theta) * easeK;
        if(s.targetFrac===1 && Math.abs(s.theta - tiltRad) < 0.05)
          s.theta = tiltRad + 0.06 * Math.sin(1.3 * t_sec);
        if(s.targetFrac===0 && Math.abs(s.theta) < 0.001) s.theta = 0;
      }
      // update ring ellipse rx/ry (ry tilts; rx scales with pulse)
      var _ps = window._d93PulseScale || 1;
      var ry = Math.max(0.5, orb.r * _ps * Math.abs(Math.cos(s.theta)));
      var rx = orb.r * _ps;
      if(Math.abs(ry - s.lastRy) >= 0.01 || Math.abs(rx - s.lastRx) >= 0.01){
        var el = document.getElementById('orbit-'+name);
        if(el){ el.setAttribute('rx', rx.toFixed(2)); el.setAttribute('ry', ry.toFixed(2)); }
        s.lastRy = ry; s.lastRx = rx;
      }
      // fade label when tilted
      var tp = document.getElementById('tp-'+name);
      if(tp && tp.parentElement){
        var lop = s.theta < 0.001 ? 1 : Math.max(0, 1 - Math.abs(s.theta) / 0.25);
        tp.parentElement.setAttribute('opacity', lop.toFixed(3));
      }
    });

    // ── dots ──
    var _sm = window._d93._curSizeMul;
    var _op = window._d93._curOpacity;
    dotObjs.forEach(function(d){
      d.angle += d.speed * mul * dt;
      var s = d.ring.labelable ? tiltState[d.ring.name] : null;
      var th = s ? s.theta : 0;
      if(th !== 0){
        var _ps2=window._d93PulseScale||1, r=d.ring.r*_ps2, cx=d.ring.cx;
        var cosA=Math.cos(d.angle), sinA=Math.sin(d.angle);
        var y0=r*sinA;
        var screenY=421 + y0*Math.cos(th);
        var z=y0*Math.sin(th);
        var tiltAmt=Math.abs(Math.sin(th));
        var k=Math.max(0.3, 1 + (z/r)*0.45*tiltAmt);
        d.sharp.setAttribute('r', (d.rSize*_sm*k).toFixed(2));
        d.bloom.setAttribute('r',  (d.rSize*_sm*k*2.5).toFixed(2));
        d.g.setAttribute('opacity', Math.min(1,(0.55+0.45*k)*_op).toFixed(3));
        d.g.setAttribute('transform','translate('+(cx+r*cosA).toFixed(2)+','+screenY.toFixed(2)+')');
      } else {
        d.sharp.setAttribute('r', (d.rSize*_sm).toFixed(2));
        d.bloom.setAttribute('r',  (d.rSize*_sm*2.5).toFixed(2));
        d.g.setAttribute('opacity', _op.toFixed(3));
        var _ps3=window._d93PulseScale||1;
        d.g.setAttribute('transform','translate('+(d.ring.cx+d.ring.r*_ps3*Math.cos(d.angle)).toFixed(2)+','+(d.ring.cy+d.ring.r*_ps3*Math.sin(d.angle)).toFixed(2)+')');
      }
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>

    {n:'Blaze Orange',h:'#FF6600'},{n:'Neon Orange',h:'#FF4500'},{n:'Safety Orange',h:'#FF6700'},
    {n:'Neon Coral',h:'#FF4466'},{n:'Ultra Rose',h:'#FF007B'},{n:'Acid Green',h:'#B0FC38'},
    {n:'Flash White',h:'#F5F5FF'},{n:'Electric Red',h:'#FF2400'},{n:'Gamma Green',h:'#00FFA0'}
  ];

  // ── Colour utils ──
  function h2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(function(x){return x+x;}).join('');return{r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}
  function rgb2h(r,g,b){return'#'+[r,g,b].map(function(x){return Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0');}).join('');}
  function hsv2rgb(h,s,v){var r,g,b,i=Math.floor(h/60),f=h/60-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;}return{r:Math.round(r*255),g:Math.round(g*255),b:Math.round(b*255)};}
  function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h,s=max===0?0:d/max,v=max;if(max===min){h=0;}else{switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h*=60;}return{h:h,s:s,v:v};}
  function hsv2hex(h,s,v){var c=hsv2rgb(h,s,v);return rgb2h(c.r,c.g,c.b);}
  function h2hsva(hex){try{if(!hex||!hex.startsWith('#'))hex='#808080';var c=h2rgb(hex),hsv=rgb2hsv(c.r,c.g,c.b);return{h:hsv.h,s:hsv.s,v:hsv.v,a:1};}catch(e){return{h:0,s:0,v:0.5,a:1};}}
  function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2;if(max===min){h=s=0;}else{var d=max-min;s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h*=60;}return{h:Math.round(h),s:Math.round(s*100),l:Math.round(l*100)};}
  function nearestRAL(hex){var c=h2rgb(hex),best=null,bd=Infinity;RAL.forEach(function(r2){var c2=h2rgb(r2.h),d=(c.r-c2.r)*(c.r-c2.r)+(c.g-c2.g)*(c.g-c2.g)+(c.b-c2.b)*(c.b-c2.b);if(d<bd){bd=d;best=r2;}});return best;}
  function hslHex(h,s,l){s/=100;l/=100;var a=s*Math.min(l,1-l),f=function(n){var k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};return rgb2h(Math.round(f(0)*255),Math.round(f(8)*255),Math.round(f(4)*255));}

  // ── Picker state ──
  var hsva = {h:0,s:0,v:0.5,a:1};
  var ccTarget = null;  // {swatch, onChange}
  var customSwatches = [];
  try{customSwatches=JSON.parse(localStorage.getItem('d93-cs')||'[]');}catch(e){}
  var svDrag=false, hueDrag=false, alpDrag=false;
  var ccDrag=false, ccDX=0, ccDY=0;
  var curTab = 'ral';

  function d93OpenCC(swatchEl, currentHex, onChange){
    ccTarget = {swatch:swatchEl, onChange:onChange};
    hsva = h2hsva(currentHex);
    var cc = document.getElementById('d93cc');
    var rect = swatchEl.getBoundingClientRect();
    var top = rect.bottom + 4;
    var left = rect.left;
    if(left + 292 > window.innerWidth) left = window.innerWidth - 296;
    if(top + 420 > window.innerHeight) top = Math.max(4, rect.top - 424);
    cc.style.top = top + 'px'; cc.style.left = left + 'px';
    cc.classList.add('open');
    if(curTab === 'mix') d93Redraw();
    d93UpdatePreview();
    d93UpdateNearestRAL();
  }
  window.d93OpenCC = d93OpenCC;

  function d93Apply(hex){
    if(!ccTarget) return;
    ccTarget.swatch.style.background = hex;
    ccTarget.onChange(hex);
    document.getElementById('d93prev-sw').style.background = hex;
  }

  function d93CloseCC(){document.getElementById('d93cc').classList.remove('open');}

  // ── Tab switching ──
  function d93ShowTab(t){
    curTab = t;
    document.querySelectorAll('.d93cct').forEach(function(el){ el.classList.toggle('on', el.dataset.t===t); });
    document.querySelectorAll('.d93ccp').forEach(function(el){ el.classList.remove('on'); });
    document.getElementById('d93-'+t).classList.add('on');
    if(t==='mix') d93Redraw();
  }
  document.querySelectorAll('.d93cct').forEach(function(el){ el.addEventListener('click', function(){ d93ShowTab(el.dataset.t); }); });
  document.getElementById('d93cc-close').addEventListener('click', d93CloseCC);

  // ── Mixer draw ──
  function d93Redraw(){d93DrawSV();d93DrawHue();d93DrawAlpha();d93UpdateFmts();d93UpdateGrey();d93UpdateTS();d93UpdateNearestRAL();d93UpdateCustom();}

  function d93DrawSV(){
    var cv=document.getElementById('d93sv'),c=cv.getContext('2d'),w=cv.width,hh=cv.height;
    var hc='hsl('+hsva.h+',100%,50%)';
    var gH=c.createLinearGradient(0,0,w,0);gH.addColorStop(0,'white');gH.addColorStop(1,hc);
    c.fillStyle=gH;c.fillRect(0,0,w,hh);
    var gV=c.createLinearGradient(0,0,0,hh);gV.addColorStop(0,'rgba(0,0,0,0)');gV.addColorStop(1,'rgba(0,0,0,1)');
    c.fillStyle=gV;c.fillRect(0,0,w,hh);
    var cx2=hsva.s*w,cy2=(1-hsva.v)*hh;
    c.beginPath();c.arc(cx2,cy2,5,0,Math.PI*2);c.strokeStyle='white';c.lineWidth=2;c.stroke();
    c.beginPath();c.arc(cx2,cy2,5,0,Math.PI*2);c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=1;c.stroke();
  }
  function d93DrawHue(){
    var cv=document.getElementById('d93hue'),c=cv.getContext('2d'),w=cv.width,hh=cv.height;
    var g=c.createLinearGradient(0,0,w,0);
    for(var i=0;i<=360;i+=60)g.addColorStop(i/360,'hsl('+i+',100%,50%)');
    c.fillStyle=g;c.fillRect(0,0,w,hh);
    var th=document.getElementById('d93hth');th.style.left=(hsva.h/360*w)+'px';
  }
  function d93DrawAlpha(){
    var cv=document.getElementById('d93alp'),c=cv.getContext('2d'),w=cv.width,hh=cv.height;
    for(var x=0;x<w;x+=8)for(var y=0;y<hh;y+=8){c.fillStyle=((Math.floor(x/8)+Math.floor(y/8))%2)?'#555':'#333';c.fillRect(x,y,8,8);}
    var rgb=hsv2rgb(hsva.h,hsva.s,hsva.v);
    var g2=c.createLinearGradient(0,0,w,0);
    g2.addColorStop(0,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',0)');g2.addColorStop(1,'rgba('+rgb.r+','+rgb.g+','+rgb.b+',1)');
    c.fillStyle=g2;c.fillRect(0,0,w,hh);
    document.getElementById('d93ath').style.left=(hsva.a*w)+'px';
  }
  function sf(id,v){var el=document.getElementById(id);if(el&&document.activeElement!==el)el.value=v;}
  function d93UpdateFmts(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v),c=h2rgb(hex),hsl=rgb2hsl(c.r,c.g,c.b);
    sf('d93fhex',hex);sf('d93fr',c.r);sf('d93fg2',c.g);sf('d93fb',c.b);sf('d93fa',hsva.a.toFixed(2));
  }
  function d93UpdatePreview(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v);
    document.getElementById('d93prev-sw').style.background=hex;
  }
  function d93UpdateNearestRAL(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v),r2=nearestRAL(hex);
    if(r2) document.getElementById('d93raltxt').textContent='≈ RAL '+r2.c+' '+r2.n;
  }
  function d93UpdateGrey(){
    var row=document.getElementById('d93gr');row.innerHTML='';
    for(var i=0;i<=10;i++){
      var v=Math.round(i/10*255),hex=rgb2h(v,v,v);
      var d=document.createElement('div');d.style.background=hex;d.title='Grey '+i*10+'%';
      (function(h){d.addEventListener('click',function(){d93Apply(h);hsva=h2hsva(h);d93Redraw();});})(hex);
      row.appendChild(d);
    }
  }
  function d93UpdateTS(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v),c=h2rgb(hex);
    var row=document.getElementById('d93ts');row.innerHTML='';
    for(var i=4;i>=0;i--){var t=i/5,tHex=rgb2h(Math.round(c.r+(255-c.r)*(1-t)),Math.round(c.g+(255-c.g)*(1-t)),Math.round(c.b+(255-c.b)*(1-t)));var d=document.createElement('div');d.style.background=tHex;(function(h){d.addEventListener('click',function(){d93Apply(h);hsva=h2hsva(h);d93Redraw();});})(tHex);row.appendChild(d);}
    for(var i=0;i<=4;i++){var t=i/5,shHex=rgb2h(Math.round(c.r*(1-t)),Math.round(c.g*(1-t)),Math.round(c.b*(1-t)));var d=document.createElement('div');d.style.background=shHex;(function(h){d.addEventListener('click',function(){d93Apply(h);hsva=h2hsva(h);d93Redraw();});})(shHex);row.appendChild(d);}
  }
  function d93UpdateCustom(){
    var cont=document.getElementById('d93cust');cont.innerHTML='';
    customSwatches.forEach(function(h){
      var d=document.createElement('div');d.className='d93cs';d.style.background=h;d.title=h;
      d.addEventListener('click',function(){d93Apply(h);hsva=h2hsva(h);d93Redraw();d93CloseCC();});
      cont.appendChild(d);
    });
  }

  // Format inputs
  function d93FmtInput(type,val){
    try{
      var hex=hsv2hex(hsva.h,hsva.s,hsva.v),c=h2rgb(hex),hh;
      if(type==='hex'){hh=val.startsWith('#')?val:'#'+val;if(hh.length<7)return;hsva=h2hsva(hh);}
      else if(type==='r'){hh=rgb2h(+val,c.g,c.b);hsva=h2hsva(hh);}
      else if(type==='g'){hh=rgb2h(c.r,+val,c.b);hsva=h2hsva(hh);}
      else if(type==='b'){hh=rgb2h(c.r,c.g,+val);hsva=h2hsva(hh);}
      else if(type==='a'){hsva.a=Math.max(0,Math.min(1,+val));}
      d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();
    }catch(e){}
  }
  document.getElementById('d93fhex').addEventListener('input',function(){d93FmtInput('hex',this.value);});
  document.getElementById('d93fr').addEventListener('input',function(){d93FmtInput('r',this.value);});
  document.getElementById('d93fg2').addEventListener('input',function(){d93FmtInput('g',this.value);});
  document.getElementById('d93fb').addEventListener('input',function(){d93FmtInput('b',this.value);});
  document.getElementById('d93fa').addEventListener('input',function(){d93FmtInput('a',this.value);});

  // SV canvas
  document.getElementById('d93sv').addEventListener('mousedown',function(e){svDrag=true;svMove(e);});
  document.getElementById('d93sv').addEventListener('mousemove',function(e){if(svDrag)svMove(e);});
  function svMove(e){var r=document.getElementById('d93sv').getBoundingClientRect();hsva.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));hsva.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();}
  // Hue canvas
  document.getElementById('d93hue').addEventListener('mousedown',function(e){hueDrag=true;hueMove(e);});
  document.getElementById('d93hue').addEventListener('mousemove',function(e){if(hueDrag)hueMove(e);});
  function hueMove(e){var r=document.getElementById('d93hue').getBoundingClientRect();hsva.h=Math.max(0,Math.min(360,(e.clientX-r.left)/r.width*360));d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();}
  // Alpha canvas
  document.getElementById('d93alp').addEventListener('mousedown',function(e){alpDrag=true;alpMove(e);});
  document.getElementById('d93alp').addEventListener('mousemove',function(e){if(alpDrag)alpMove(e);});
  function alpMove(e){var r=document.getElementById('d93alp').getBoundingClientRect();hsva.a=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));d93Redraw();}
  document.addEventListener('mouseup',function(){svDrag=false;hueDrag=false;alpDrag=false;});

  // Custom swatches save
  document.getElementById('d93savecs').addEventListener('click',function(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v);
    if(!customSwatches.includes(hex)){customSwatches.push(hex);try{localStorage.setItem('d93-cs',JSON.stringify(customSwatches));}catch(e){}}
    d93UpdateCustom();
  });

  // Drag the picker
  document.getElementById('d93cc-hdr').addEventListener('mousedown',function(e){
    var cc=document.getElementById('d93cc');
    ccDrag=true;ccDX=e.clientX-cc.offsetLeft;ccDY=e.clientY-cc.offsetTop;
  });
  document.addEventListener('mousemove',function(e){if(ccDrag){var cc=document.getElementById('d93cc');cc.style.left=(e.clientX-ccDX)+'px';cc.style.top=(e.clientY-ccDY)+'px';}});
  document.addEventListener('mouseup',function(){ccDrag=false;});

  // Close on outside click
  document.addEventListener('mousedown',function(e){
    var cc=document.getElementById('d93cc');
    if(cc.classList.contains('open')&&!cc.contains(e.target)&&(!ccTarget||!ccTarget.swatch.contains(e.target))){d93CloseCC();}
  });

  // ── Build RAL + Neon swatches ──
  function buildRAL(){
    var cont=document.getElementById('d93ral-g');cont.innerHTML='';
    RAL.forEach(function(r2){
      var d=document.createElement('div');d.className='d93rs';d.style.background=r2.h;d.title='RAL '+r2.c+' – '+r2.n+'\n'+r2.h;
      d.addEventListener('click',function(){d93Apply(r2.h);hsva=h2hsva(r2.h);if(curTab==='mix')d93Redraw();d93CloseCC();});
      cont.appendChild(d);
    });
  }
  document.getElementById('d93ral-s').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    document.querySelectorAll('#d93ral-g .d93rs').forEach(function(el){el.style.display=(!q||el.title.toLowerCase().includes(q))?'':'none';});
  });
  function buildNeon(){
    var cont=document.getElementById('d93neon-g');cont.innerHTML='';
    NEON.forEach(function(n){
      var d=document.createElement('div');d.className='d93ns';d.style.background=n.h;d.title=n.n;d.textContent=n.n;
      d.addEventListener('click',function(){d93Apply(n.h);hsva=h2hsva(n.h);if(curTab==='mix')d93Redraw();d93CloseCC();});
      cont.appendChild(d);
    });
  }

  buildRAL(); buildNeon();

})();
</script>

<script src="collider-embed.js"></script>
<script>
(function(){
  var _colliderHost = document.createElement('div');
  _colliderHost.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:0;';
  document.body.appendChild(_colliderHost);

  var _collider = null, _startPending = false;

  ColliderEmbed.create({
    container: _colliderHost,
    layout: 'collider-layout.json',
  }).then(function(c){
    _collider = c;
    window._d93Collider = c;
    if (_startPending){ _startPending = false; _doStart(); }
  });

  function _doStart(){
    _collider.start();
    var out = _collider.output;
    if (out && !window._d93VolGain){
      var ac = out.context;
      var vg = ac.createGain();
      var ap = window._d93AudioP || {volume:0.8, mute:false};
      vg.gain.value = ap.mute ? 0 : ap.volume;
      var dg = ac.createGain();
      dg.gain.value = 1;
      out.disconnect(ac.destination);
      out.connect(dg);
      dg.connect(vg);
      vg.connect(ac.destination);
      window._d93VolGain  = vg;
      window._d93DuckGain = dg;
      if(!window._d93Analyser){
        var an=ac.createAnalyser();
        an.fftSize=1024; an.smoothingTimeConstant=0;
        out.connect(an);
        window._d93Analyser=an;
      }
    }
  }

  window._d93Enter = function(){
    var ov = document.getElementById('enter-overlay');
    if (!ov || ov._gone) return;
    ov._gone = true;
    if (_collider){ _doStart(); } else { _startPending = true; }
    ov.style.transition = 'opacity 1s';
    ov.style.opacity = '0';
    setTimeout(function(){ if (ov.parentNode) ov.parentNode.removeChild(ov); }, 1050);
  };
})();
</script>

      ['dotColor','dotBloom','dotSize','dotOpacity','speedPos','ringColor','ringWidth','lineColor','lineWidth','bgColor','textColor','textSize','hintSize','hintMinPx','planetMinPx','tapMinPx','labelMinPx','mobileCropX']

<!-- ── GLITCH VIDEO ENGINE ── -->
<script>
(function(){
  var glitchVideos = [
    document.getElementById('m5gv1'),
    document.getElementById('m5gv3'),
    document.getElementById('m5gv5')
  ];
  var glitchCanvas = document.getElementById('glitchCanvas');
  var gctx = glitchCanvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  glitchCanvas.width  = window.innerWidth  * dpr;
  glitchCanvas.height = window.innerHeight * dpr;
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  window.addEventListener('resize', function(){
    dpr = window.devicePixelRatio || 1;
    glitchCanvas.width  = window.innerWidth  * dpr;
    glitchCanvas.height = window.innerHeight * dpr;
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  });

  // hook enter: play all 5 videos
  var _origEnter = window._d93Enter;
  window._d93Enter = function(){
    _origEnter && _origEnter();
    glitchVideos.forEach(function(v){ v && v.play().catch(function(){}); });
    glitchArmed = true;
    glitchTimer = performance.now() + scheduleGap();
  };

  // glitch state
  var glitchArmed = false;
  var glitchOn = false;
  var glitchEffect = 'blend';
  var glitchTimer = Infinity;
  var glitchCuts = [], glitchCutTimer = 0;
  var strobeOpacity = 0, strobeTimer = 0;
  var prevVideoIdx = -1;
  var curVideoIdx = 0;
  var stateEl = null;

  function scheduleGap(){
    var G = getG();
    return (G.gapMin + Math.random() * Math.abs(G.gapMax - G.gapMin)) * 1000;
  }
  function scheduleOn(){
    var G = getG();
    return (Math.min(G.onMin, G.onMax) + Math.random() * Math.abs(G.onMax - G.onMin)) * 1000;
  }
  function getG(){
    return (window._d93P && window._d93P.glitch) ? window._d93P.glitch : {
      on:true, force:'random', fxCuts:false, fxBlend:true, fxStrobe:true,
      blendMode:'screen', blendAlpha:0.79, strobeMax:0.65, strobeRateMs:54,
      cutCount:12, cutWMin:2, cutWMax:6, cutShuffleMs:20,
      gapMin:4, gapMax:8, onMin:0.10, onMax:0.25,
      fit:'contain'
    };
  }

  function pickVideo(){
    var idx;
    do { idx = Math.floor(Math.random() * glitchVideos.length); } while(idx === prevVideoIdx && glitchVideos.length > 1);
    prevVideoIdx = idx;
    curVideoIdx = idx;
    return glitchVideos[idx];
  }

  function pickEffect(){
    var G = getG();
    if(G.force !== 'random') return G.force;
    var choices = [];
    if(G.fxCuts)   choices.push('cuts');
    if(G.fxBlend)  choices.push('blend');
    if(G.fxStrobe) choices.push('strobe');
    return choices.length ? choices[Math.floor(Math.random() * choices.length)] : 'blend';
  }

  function updateState(label){
    if(stateEl) stateEl.textContent = 'State: ' + label;
  }

  var curSrc = null;

  function startGlitch(){
    curSrc = pickVideo();
    glitchEffect = pickEffect();
    glitchOn = true;
    glitchCuts = []; glitchCutTimer = 0; strobeOpacity = 0; strobeTimer = 0;
    glitchTimer = performance.now() + scheduleOn();
    glitchCanvas.style.mixBlendMode = 'normal';
    updateState(glitchEffect + ' v' + (curVideoIdx + 1));
  }

  function endGlitch(){
    glitchOn = false;
    curSrc = null;
    glitchCanvas.style.mixBlendMode = 'normal';
    glitchTimer = performance.now() + scheduleGap();
    updateState('off');
  }

  function frame(){
    requestAnimationFrame(frame);
    gctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
    if(!glitchArmed) return;
    var G = getG();
    var now = performance.now();
    if(!G.on){
      if(glitchOn) endGlitch();
      return;
    }
    if(!glitchOn && now >= glitchTimer) {
      startGlitch();
    } else if(glitchOn && now >= glitchTimer) {
      endGlitch();
    }
    if(!glitchOn || !curSrc || curSrc.readyState < 2) return;
    var VW = curSrc.videoWidth, VH = curSrc.videoHeight;
    if(!VW || !VH) return;
    var cw = window.innerWidth, ch = window.innerHeight;
    // compute source rect (in video px) and dest rect (in CSS px)
    var sx, sy, sw, sh, dx, dy, dw, dh;
    var fit = G.fit || 'contain';
    if(fit === 'cover'){
      var vAspect = VW/VH, cAspect = cw/ch;
      if(vAspect > cAspect){ sh=VH; sw=VH*cAspect; sx=(VW-sw)/2; sy=0; }
      else                  { sw=VW; sh=VW/cAspect; sx=0; sy=(VH-sh)/2; }
      dx=0; dy=0; dw=cw; dh=ch;
    } else if(fit === 'native'){
      sx=0; sy=0; sw=VW; sh=VH;
      dw=VW; dh=VH; dx=(cw-dw)/2; dy=(ch-dh)/2;
    } else { // contain
      sx=0; sy=0; sw=VW; sh=VH;
      var scale = Math.min(cw/VW, ch/VH);
      dw=VW*scale; dh=VH*scale; dx=(cw-dw)/2; dy=(ch-dh)/2;
    }
    if(glitchEffect === 'cuts'){
      glitchCanvas.style.mixBlendMode = 'normal';
      if(!glitchCuts.length || now - glitchCutTimer > G.cutShuffleMs){
        glitchCuts = [];
        for(var i=0; i<G.cutCount; i++){
          glitchCuts.push({ x: dx + Math.random()*dw, w: G.cutWMin + Math.random()*(G.cutWMax-G.cutWMin) });
        }
        glitchCutTimer = now;
      }
      glitchCuts.forEach(function(cut){
        var vx = sx + ((cut.x - dx) / dw) * sw;
        var vwc = Math.max(1, (cut.w / dw) * sw);
        gctx.drawImage(curSrc, vx, sy, vwc, sh, cut.x, dy, cut.w, dh);
      });
    } else if(glitchEffect === 'blend'){
      glitchCanvas.style.mixBlendMode = G.blendMode;
      gctx.globalAlpha = G.blendAlpha;
      gctx.drawImage(curSrc, sx, sy, sw, sh, dx, dy, dw, dh);
      gctx.globalAlpha = 1;
    } else if(glitchEffect === 'strobe'){
      glitchCanvas.style.mixBlendMode = 'normal';
      if(now - strobeTimer > G.strobeRateMs){
        strobeOpacity = Math.random() < 0.55 ? 0 : G.strobeMax * (0.6 + Math.random()*0.4);
        strobeTimer = now;
      }
      if(strobeOpacity > 0){
        gctx.globalAlpha = strobeOpacity;
        gctx.drawImage(curSrc, sx, sy, sw, sh, dx, dy, dw, dh);
        gctx.globalAlpha = 1;
      }
    }
  }
  requestAnimationFrame(frame);

  // expose API for console
  window._d93Glitch = {
    syncOn: function(){ if(!getG().on && glitchOn) endGlitch(); },
    testNow: function(){
      if(!glitchArmed) return;
      if(glitchOn) endGlitch();
      glitchTimer = 0; // fire immediately on next frame
    },
    setStateEl: function(el){ stateEl = el; }
  };
  if(window._d93GlitchStateEl) { stateEl = window._d93GlitchStateEl; delete window._d93GlitchStateEl; }
})();
</script>

<!-- ── ECLIPSE ANIMATION ENGINE ── -->
<script>
(function(){
  var state = 'idle'; // idle→pending→animating→holding→fadingDown→modulating
  var rafId=null, timer=null, strobeTimer=null;
  var strobeOn=true;
  var env=0, modOp=0, lastRafT=0;
  var holdStart=0, fadeStart=0, fadeFrom=1;
  var buf=null;

  function getEl(){ return document.getElementById('eclipse-ring'); }
  function getP(){ return window._d93P; }
  function clamp(v,lo,hi){ return v<lo?lo:v>hi?hi:v; }

  function setElOp(v){
    var el=getEl(); if(el) el.setAttribute('opacity', strobeOn ? v : 0);
  }

  function getRMS(){
    var an=window._d93Analyser; if(!an) return 0;
    if(!buf||buf.length!==an.fftSize) buf=new Float32Array(an.fftSize);
    an.getFloatTimeDomainData(buf);
    var sum=0; for(var i=0;i<buf.length;i++) sum+=buf[i]*buf[i];
    return Math.sqrt(sum/buf.length);
  }

  function startStrobe(){
    if(strobeTimer){ clearTimeout(strobeTimer); strobeTimer=null; }
    var E=getP().eclipse;
    var gMin=(E.strobeGapMin||15)*1000, gMax=(E.strobeGapMax||20)*1000;
    var offMs=E.strobeOffMs||80;
    strobeTimer=setTimeout(function(){
      strobeOn=false;
      strobeTimer=setTimeout(function(){
        strobeOn=true; startStrobe();
      }, offMs);
    }, gMin+Math.random()*(gMax-gMin));
  }

  function mainRaf(now){
    var P=getP(); if(!P){rafId=requestAnimationFrame(mainRaf);return;}
    var E=P.eclipse;
    var dt=lastRafT>0?(now-lastRafT)/1000:0.016;
    lastRafT=now;

    var rms=getRMS();
    var aCoef=1-Math.exp(-dt/(E.modAttack||0.03));
    var rCoef=1-Math.exp(-dt/(E.modRelease||0.4));
    env=rms>env?env+(rms-env)*aCoef:env+(rms-env)*rCoef;
    modOp=window._d93Analyser?clamp(env*(E.modGain||4),0,E.modMax||1):0;

    if(window._d93EclipseEnvEl)
      window._d93EclipseEnvEl.textContent='env '+env.toFixed(3)+'  op '+modOp.toFixed(3);

    var rendOp;
    if(state==='holding'){
      rendOp=E.opacity;
      if((now-holdStart)>=(E.holdBeforeMod||4)*1000){
        state='fadingDown'; fadeStart=now; fadeFrom=E.opacity;
      }
    } else if(state==='fadingDown'){
      var t=Math.min(1,(now-fadeStart)/((E.fadeDownDur||2)*1000));
      var ease=t<0.5?2*t*t:-1+(4-2*t)*t;
      rendOp=fadeFrom+(modOp-fadeFrom)*ease;
      if(t>=1){ state='modulating'; rendOp=modOp; }
    } else if(state==='modulating'){
      rendOp=modOp;
    } else {
      rafId=requestAnimationFrame(mainRaf); return;
    }
    setElOp(rendOp);
    rafId=requestAnimationFrame(mainRaf);
  }

  function runAnim(){
    var P=getP(); if(!P) return;
    var E=P.eclipse;
    var dur=(E.animDur||3)*1000;
    var el=getEl(); if(!el) return;
    var fromX=E.startX!==undefined?E.startX:280.5;
    var fromY=E.startY!==undefined?E.startY:E.y;
    state='animating'; lastRafT=0;
    var t0=performance.now();
    function step(now){
      if(state!=='animating') return;
      var E2=getP().eclipse;
      var t=Math.min(1,(now-t0)/dur);
      var ease=t<0.5?2*t*t:-1+(4-2*t)*t;
      var el2=getEl(); if(!el2) return;
      el2.setAttribute('cx', fromX+(E2.x-fromX)*ease);
      el2.setAttribute('cy', fromY+(E2.y-fromY)*ease);
      setElOp(E2.opacity*ease);
      if(t<1){ rafId=requestAnimationFrame(step); }
      else{
        el2.setAttribute('cx',E2.x); el2.setAttribute('cy',E2.y);
        setElOp(E2.opacity);
        state='holding'; holdStart=performance.now();
        startStrobe(); lastRafT=0;
        if(window._d93OnEclipseMoveIn) window._d93OnEclipseMoveIn();
        rafId=requestAnimationFrame(mainRaf);
      }
    }
    rafId=requestAnimationFrame(step);
  }

  function skipToFinal(){
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(timer){ clearTimeout(timer); timer=null; }
    var E=getP().eclipse, el=getEl(); if(!el) return;
    el.setAttribute('cx',E.x); el.setAttribute('cy',E.y);
    state='modulating'; lastRafT=0;
    if(!strobeTimer) startStrobe();
    if(window._d93OnEclipseMoveIn) window._d93OnEclipseMoveIn();
    rafId=requestAnimationFrame(mainRaf);
  }

  function replay(){
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(timer){ clearTimeout(timer); timer=null; }
    if(strobeTimer){ clearTimeout(strobeTimer); strobeTimer=null; }
    strobeOn=true; env=0; modOp=0; lastRafT=0;
    state='pending';
    var P=getP(); if(!P) return;
    var E=P.eclipse, el=getEl(); if(!el) return;
    el.setAttribute('cx', E.startX!==undefined?E.startX:280.5);
    el.setAttribute('cy', E.startY!==undefined?E.startY:E.y);
    setElOp(0);
    if(window._d93OnEclipseReplay) window._d93OnEclipseReplay();
    timer=setTimeout(runAnim,0);
  }

  (function init(){
    var P=getP(); if(!P) return;
    var E=P.eclipse, el=getEl(); if(!el) return;
    el.setAttribute('cx', E.startX!==undefined?E.startX:280.5);
    el.setAttribute('cy', E.startY!==undefined?E.startY:E.y);
    el.setAttribute('fill', E.color);
    setElOp(0);
  })();

  var _prev=window._d93Enter;
  window._d93Enter=function(){
    _prev&&_prev();
    if(rafId){ cancelAnimationFrame(rafId); rafId=null; }
    if(timer){ clearTimeout(timer); timer=null; }
    if(strobeTimer){ clearTimeout(strobeTimer); strobeTimer=null; }
    strobeOn=true; env=0; modOp=0;
    state='pending';
    var P=getP(); if(!P) return;
    var E=P.eclipse;
    var waitMs=((P.intro&&P.intro.duration?P.intro.duration:5)+(E.delay||4))*1000;
    timer=setTimeout(runAnim,waitMs);
  };

  window._d93EclipseAnim={
    skipToFinal: skipToFinal,
    replay: replay,
    getState: function(){ return state; },
    suspendStrobe: function(){
      if(strobeTimer){ clearTimeout(strobeTimer); strobeTimer=null; }
      strobeOn=true;
    },
    resumeStrobe: function(){
      var active=state==='holding'||state==='fadingDown'||state==='modulating';
      if(active&&!strobeTimer) startStrobe();
    }
  };
})();
</script>

<!-- ── KICK SCHEDULER ── -->
<script>
(function(){
  var URLS = [
    'https://daysof93-cdn.b-cdn.net/Music5_kickdrums/Music5_kicks1.wav',
    'https://daysof93-cdn.b-cdn.net/Music5_kickdrums/Music5_kicks2.wav',
    'https://daysof93-cdn.b-cdn.net/Music5_kickdrums/Music5_kicks3.wav',
    'https://daysof93-cdn.b-cdn.net/Music5_kickdrums/Music5_kicks4.wav',
    'https://daysof93-cdn.b-cdn.net/Music5_kickdrums/Music5_kicks5.wav'
  ];
  var buffers = [];
  var kickRafId = null, lastRafT = 0;
  var env = 0, kTarget = 0, pulsePhase = "release";
  var schedRafId = null;
  var nextBar = null, lastBuf = -1;
  var active = false, kicksFired = 0;

  window._d93PulseScale = 1;

  function getK(){ return window._d93P && window._d93P.kicks; }
  function getCol(){ return window._d93Collider; }

  // ── Sample loader ──
  function loadSamples(){
    var col = getCol();
    if(!col || !col.output) return;
    var ac = col.output.context;
    URLS.forEach(function(url){
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function(){
        if(xhr.status >= 400) return;
        ac.decodeAudioData(xhr.response.slice(0), function(buf){ buffers.push(buf); }, function(){});
      };
      xhr.send();
    });
  }

  function pickBuf(){
    if(!buffers.length) return null;
    var idx;
    do { idx = Math.floor(Math.random() * buffers.length); } while(buffers.length > 1 && idx === lastBuf);
    lastBuf = idx;
    return buffers[idx];
  }

  // ── Fire a kick at audio time `when` (default: now) ──
  function fireKick(when){
    var col = getCol(), K = getK();
    if(!col || !col.output) return;
    var ac = col.output.context;
    var buf = pickBuf();
    if(!buf) return;
    var src = ac.createBufferSource();
    src.buffer = buf;
    var g = ac.createGain();
    g.gain.value = K ? K.volume : 0.9;
    src.connect(g);
    var vg = window._d93VolGain;
    if(vg) g.connect(vg); else g.connect(ac.destination);
    var t = (when !== undefined) ? when : ac.currentTime;
    src.start(t);
    if(when !== undefined && window._d93StartOrch) window._d93StartOrch(t);
    var delayMs = Math.max(0, (t - ac.currentTime) * 1000);
    setTimeout(triggerPulse, delayMs);
  }

  // ── Ring pulse envelope ──
  function triggerPulse(){
    var K = getK();
    var mn = K ? K.pulseMin : 0.10, mx = K ? K.pulseMax : 0.15;
    kTarget = mn + Math.random() * (mx - mn);
    pulsePhase = 'attack';
    if(!kickRafId){ lastRafT = 0; kickRafId = requestAnimationFrame(pulseRaf); }
  }

  function applyPulseScale(s){
    window._d93PulseScale = s;
    var ORBITS = window._d93ORBITS;
    if(!ORBITS) return;
    // non-labelable orbit rings (circles): scale r
    ORBITS.forEach(function(orb){
      if(!orb.labelable){
        var el = document.getElementById('orbit-' + orb.name);
        if(el) el.setAttribute('r', (orb.r * s).toFixed(2));
      }
      // labelable rx handled by tilt loop reading _d93PulseScale
    });
    // sun-rings halo circles
    var ringsG = document.getElementById('sun-rings');
    if(ringsG){
      ringsG.querySelectorAll('circle').forEach(function(c){
        var br = parseFloat(c.getAttribute('data-br'));
        if(isNaN(br)){ br = parseFloat(c.getAttribute('r')); c.setAttribute('data-br', String(br)); }
        c.setAttribute('r', (br * s).toFixed(2));
      });
    }
    // eclipse ring — base r = neptune r
    var er = document.getElementById('eclipse-ring');
    if(er && ORBITS.length){
      var neptune = ORBITS[ORBITS.length - 1];
      er.setAttribute('r', (neptune.r * s).toFixed(2));
    }
  }

  function pulseRaf(now){
    var K = getK();
    if(!lastRafT){ lastRafT = now; kickRafId = requestAnimationFrame(pulseRaf); return; }
    var dt = Math.min((now - lastRafT) / 1000, 0.1);
    lastRafT = now;
    var attack  = K ? K.attack  : 0.08;
    var release = K ? K.release : 1.5;
    var aCoef = 1 - Math.exp(-dt / attack);
    var rCoef = 1 - Math.exp(-dt / release);
    if(pulsePhase === 'attack'){
      env += (kTarget - env) * aCoef;
      if(env >= 0.97 * kTarget) pulsePhase = 'release';
    } else {
      env += (0 - env) * rCoef;
    }
    if(env > 0.0005){
      applyPulseScale(1 + env);
      kickRafId = requestAnimationFrame(pulseRaf);
    } else {
      env = 0; kTarget = 0; pulsePhase = 'release';
      applyPulseScale(1);
      kickRafId = null; lastRafT = 0;
    }
  }

  // ── Scheduler ──
  function pickNextBar(){
    var col = getCol(), K = getK();
    if(!col) return;
    var bp = col.barPos();
    if(bp === null) return;
    var mn, mx;
    if(kicksFired === 0){
      mn = K ? K.barsMin : 14; mx = K ? K.barsMax : 18;
    } else {
      mn = K ? K.repeatMin : 7; mx = K ? K.repeatMax : 9;
    }
    var gap = mn + Math.floor(Math.random() * (mx - mn + 1));
    nextBar = Math.ceil(bp) + gap;
    window._d93KicksNextBar = nextBar;
  }

  function schedRaf(){
    if(!active){ schedRafId = null; return; }
    var col = getCol(), K = getK();
    if(!col || !K || !K.on){ schedRafId = requestAnimationFrame(schedRaf); return; }
    var ac = col.output ? col.output.context : null;
    if(!ac){ schedRafId = requestAnimationFrame(schedRaf); return; }
    if(nextBar === null) pickNextBar();
    var tb = col.timeOfBar(nextBar);
    if(tb === null){ schedRafId = requestAnimationFrame(schedRaf); return; }
    var now = ac.currentTime;
    if(tb < now - 0.001){
      // in the past (tab was hidden) — skip ahead
      pickNextBar();
    } else if(tb - now < 0.15){
      fireKick(tb);
      kicksFired++;
      pickNextBar();
    }
    schedRafId = requestAnimationFrame(schedRaf);
  }

  function startScheduler(){
    active = true; nextBar = null; kicksFired = 0;
    if(!schedRafId) schedRafId = requestAnimationFrame(schedRaf);
  }

  window._d93OnEclipseMoveIn = function(){ startScheduler(); };
  window._d93OnEclipseReplay = function(){ active = false; nextBar = null; kicksFired = 0; };
  window._d93KicksFireNow = function(){ fireKick(); };
  window._d93KicksTriggerPulse = triggerPulse;
  window._d93KicksNextBar = null;

  // hook enter tap to load samples
  var _prevEnter = window._d93Enter;
  window._d93Enter = function(){
    _prevEnter && _prevEnter();
    loadSamples();
  };
})();
</script>

<!-- ── ECLIPSE SHIFT-DRAG ── -->
<script>
(function(){
  var shiftDown = false, dragging = false;
  var svg, ctm, startSVGX, startSVGY, startCX, startCY;

  function svgPtFrom(e){
    var pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(ctm);
  }

  document.addEventListener('keydown', function(e){
    if(e.key !== 'Shift' || shiftDown) return;
    shiftDown = true;
    var el = document.getElementById('eclipse-ring');
    if(!el) return;
    el.setAttribute('pointer-events', 'all');
    el.setAttribute('stroke', '#808080');
    el.setAttribute('stroke-width', '1.5');
    el.setAttribute('stroke-dasharray', '8 6');
    el.style.cursor = 'grab';
  });

  document.addEventListener('keyup', function(e){
    if(e.key !== 'Shift') return;
    shiftDown = false;
    if(dragging) return;
    var el = document.getElementById('eclipse-ring');
    if(!el) return;
    el.setAttribute('pointer-events', 'none');
    el.setAttribute('stroke', 'none');
    el.removeAttribute('stroke-dasharray');
    el.style.cursor = '';
  });

  document.addEventListener('pointerdown', function(e){
    if(!shiftDown) return;
    var el = document.getElementById('eclipse-ring');
    if(!el || e.target !== el) return;
    if(window._d93EclipseAnim){ window._d93EclipseAnim.skipToFinal(); window._d93EclipseAnim.suspendStrobe(); }
    svg = el.ownerSVGElement;
    ctm = svg.getScreenCTM().inverse();
    var sp = svgPtFrom(e);
    startSVGX = sp.x; startSVGY = sp.y;
    startCX = parseFloat(el.getAttribute('cx'));
    startCY = parseFloat(el.getAttribute('cy'));
    dragging = true;
    el.style.cursor = 'grabbing';
    el.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  document.addEventListener('pointermove', function(e){
    if(!dragging) return;
    var el = document.getElementById('eclipse-ring');
    if(!el) return;
    var sp = svgPtFrom(e);
    el.setAttribute('cx', startCX + (sp.x - startSVGX));
    el.setAttribute('cy', startCY + (sp.y - startSVGY));
  });

  document.addEventListener('pointerup', function(e){
    if(!dragging) return;
    dragging = false;
    var el = document.getElementById('eclipse-ring');
    if(el && window._d93P){
      window._d93P.eclipse.x = parseFloat(el.getAttribute('cx'));
      window._d93P.eclipse.y = parseFloat(el.getAttribute('cy'));
      try{ localStorage.setItem('do93_music5', JSON.stringify(window._d93P)); }catch(ex){}
    }
    if(window._d93EclipseAnim) window._d93EclipseAnim.resumeStrobe();
    if(!shiftDown && el){
      el.setAttribute('pointer-events', 'none');
      el.setAttribute('stroke', 'none');
      el.removeAttribute('stroke-dasharray');
      el.style.cursor = '';
    } else if(el){
      el.style.cursor = 'grab';
    }
  });
})();
</script>
