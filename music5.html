<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#f0f0ee}
#sv{display:block;width:100vw;height:100vh}
a.plink{text-decoration:none;cursor:pointer}
a.plink .ps{transition:opacity 0.15s}
a.plink:hover .ps{opacity:0.7}
a.plink .hit{fill:transparent}
</style>

<body>

<script>
const PLANET_LINKS = {
  mars:    'explore.html',
  jupiter: 'journey.html',
  saturn:  'explore4.html',
  uranus:  'music.html',
  neptune: 'explore3.html'
};
</script>

<svg id="sv" width="100%" height="100%" preserveAspectRatio="none"
     shape-rendering="geometricPrecision"
     xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.68 0.60" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply" result="b"/>
    <feComposite in="b" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- label textPath arcs: CW sweep=1 -->
  <!-- Mars    cx=178 cy=435 r=163 -->
  <path id="la" d="M 257.0,292.6 A 163,163 0 0,1 333.9,387.5"/>
  <!-- Jupiter cx=216 cy=435 r=201 -->
  <path id="lj" d="M 294.5,249.3 A 201,201 0 0,1 395.2,344.3"/>
  <!-- Saturn  cx=250 cy=435 r=235 -->
  <path id="ls" d="M 322.6,211.5 A 235,235 0 0,1 455.5,321.1"/>
  <!-- Uranus  cx=273 cy=435 r=258 -->
  <path id="lu" d="M 331.6,183.7 A 258,258 0 0,1 491.8,298.0"/>
  <!-- Neptune cx=289 cy=435 r=274 -->
  <path id="ln" d="M 336.6,165.0 A 274,274 0 0,1 510.7,273.9"/>
</defs>

<!-- Oversized background (covers extended viewBox at any aspect) -->
<rect id="bg" x="-2000" y="-2000" width="6000" height="6000" fill="#f0f0ee"/>
<rect id="grain-rect" x="-2000" y="-2000" width="6000" height="6000" fill="#f0f0ee" filter="url(#grain)" opacity="0.04"/>

<!-- Paper specks -->
<g id="specks" fill="rgba(0,0,0,0.2)" stroke="none"></g>

<!-- Radial rays -->
<g id="rays" stroke="#ccccca" stroke-width="0.55" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Orbit circles (eccentric: each cx differs, cy=435) -->
<circle id="orbit-mercury" cx="142" cy="435" r="127" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-venus"   cx="154" cy="435" r="139" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-mars"    cx="178" cy="435" r="163" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-jupiter" cx="216" cy="435" r="201" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-saturn"  cx="250" cy="435" r="235" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-uranus"  cx="273" cy="435" r="258" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<circle id="orbit-neptune" cx="289" cy="435" r="274" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>
<!-- Earth orbit -->
<circle id="orbit-earth"   cx="175" cy="440" r="335" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>

<!-- Second large decorative circle -->
<circle cx="315" cy="435" r="188" stroke="#949490" stroke-width="0.6" fill="none" vector-effect="non-scaling-stroke"/>

<!-- Dotted diagonal arc (extended) -->
<path id="diag-arc" d="M -600,900 Q 260,248 1200,-300"
      stroke="#ccccca" stroke-width="0.6" fill="none"
      stroke-dasharray="1.5,4.5" vector-effect="non-scaling-stroke"/>

<!-- Dashed ellipse lower half -->
<ellipse cx="315" cy="568" rx="188" ry="40"
         stroke="#ccccca" stroke-width="0.6" fill="none"
         stroke-dasharray="4,5.5" transform="rotate(-8 315 568)"
         vector-effect="non-scaling-stroke"/>

<!-- Sun halo rings (16, r=72→132) -->
<g id="sun-rings" stroke="rgba(0,0,0,0.28)" stroke-width="0.48" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Sun spokes (24) -->
<g id="spokes" stroke="rgba(0,0,0,0.40)" stroke-width="0.45" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Sun disc -->
<circle id="sun" cx="155" cy="435" r="70"
        stroke="rgba(0,0,0,0.88)" stroke-width="1.8" fill="#f0f0ee"
        vector-effect="non-scaling-stroke"/>

<!-- Mercury (non-clickable) -->
<circle id="planet-mercury" cx="268" cy="435" r="8"
        stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
        vector-effect="non-scaling-stroke"/>

<!-- Venus (non-clickable) -->
<circle id="planet-venus" cx="293" cy="435" r="13"
        stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
        vector-effect="non-scaling-stroke"/>

<!-- Mars (clickable) -->
<a id="al-mars" class="plink">
  <circle class="hit" cx="340" cy="435" r="27"/>
  <circle id="planet-mars" class="ps" cx="340" cy="435" r="9"
          stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Jupiter (clickable) -->
<a id="al-jupiter" class="plink">
  <circle class="hit" cx="416" cy="435" r="87"/>
  <circle id="planet-jupiter" class="ps" cx="416" cy="435" r="29"
          stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Saturn (clickable, plain circle) -->
<a id="al-saturn" class="plink">
  <circle class="hit" cx="484" cy="435" r="64"/>
  <circle id="planet-saturn" class="ps" cx="484" cy="435" r="21"
          stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Uranus (clickable) -->
<a id="al-uranus" class="plink">
  <circle class="hit" cx="530" cy="435" r="42"/>
  <circle id="planet-uranus" class="ps" cx="530" cy="435" r="14"
          stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Neptune (clickable) -->
<a id="al-neptune" class="plink">
  <circle class="hit" cx="562" cy="435" r="36"/>
  <circle id="planet-neptune" class="ps" cx="562" cy="435" r="12"
          stroke="#949490" stroke-width="0.7" fill="#f0f0ee"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Orbiting dots -->
<g id="dots"></g>

<!-- Labels: Mars, Jupiter, Saturn, Uranus, Neptune only -->
<g id="labels" font-family="'Jost',sans-serif" font-size="7" font-weight="300"
   letter-spacing="1.3" fill="rgba(0,0,0,0.56)" text-anchor="start">
  <text><textPath href="#la" startOffset="1%">&#x2022; MARS</textPath></text>
  <text><textPath href="#lj" startOffset="1%">&#x2022; JUPITER</textPath></text>
  <text><textPath href="#ls" startOffset="1%">&#x2022; SATURN</textPath></text>
  <text><textPath href="#lu" startOffset="1%">&#x2022; URANUS</textPath></text>
  <text><textPath href="#ln" startOffset="1%">&#x2022; NEPTUNE</textPath></text>
</g>

</svg>

<!-- ── MAIN DRAWING SCRIPT ── -->
<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var SX = 155, SY = 435;

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for(var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  // Dynamic full-bleed viewBox
  var sv = document.getElementById('sv');
  function setVB(){
    var W = window.innerWidth, H = window.innerHeight;
    var asp = W / H, refAsp = 585 / 864;
    var x, y, w, h;
    if(asp >= refAsp){
      w = 864 * asp; h = 864;
      x = (585 - w) / 2; y = 0;
    } else {
      w = 585; h = 585 / asp;
      x = 0; y = (864 - h) / 2;
    }
    sv.setAttribute('viewBox', x.toFixed(1)+' '+y.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
  }
  setVB();
  window.addEventListener('resize', setVB);

  // Specks
  var sp = [[78,42,0.8],[218,28,0.6],[340,16,0.9],[472,52,0.7],[558,130,0.6],
            [570,240,0.8],[575,390,0.7],[562,530,0.9],[540,648,0.6],[488,748,0.8],
            [380,800,0.7],[248,820,0.6],[128,790,0.9],[52,680,0.7],[22,510,0.6],
            [36,350,0.8],[62,208,0.7],[408,88,0.6],[182,540,0.8],[492,310,0.7],
            [350,640,0.6],[140,320,0.8],[530,460,0.7],[90,480,0.6],
            [-80,200,0.7],[-120,400,0.6],[620,180,0.8],[650,420,0.7],
            [-60,600,0.9],[640,620,0.6]];
  var sg = document.getElementById('specks');
  sp.forEach(function(s){ sg.appendChild(mk('circle',{cx:s[0],cy:s[1],r:s[2]})); });

  // Radial rays (extended to cover wide viewBox)
  var rayA = [12,28,46,61,76,92,112,138,162,205,248,272,308,342];
  var rg = document.getElementById('rays');
  rayA.forEach(function(d){
    var r = d * Math.PI / 180;
    rg.appendChild(mk('line',{
      x1:SX, y1:SY,
      x2:(SX + 1400*Math.cos(r)).toFixed(1),
      y2:(SY - 1400*Math.sin(r)).toFixed(1)
    }));
  });

  // Sun halo rings (16, r=72→132)
  var ringsG = document.getElementById('sun-rings');
  for(var i=0;i<16;i++) ringsG.appendChild(mk('circle',{cx:SX,cy:SY,r:72+i*4}));

  // Sun spokes (24)
  var spokesG = document.getElementById('spokes');
  for(var i=0;i<24;i++){
    var a = i*15*Math.PI/180;
    spokesG.appendChild(mk('line',{
      x1:SX, y1:SY,
      x2:(SX+70*Math.cos(a)).toFixed(1),
      y2:(SY-70*Math.sin(a)).toFixed(1)
    }));
  }

  // Wire planet links
  var lmap = {
    'al-mars':    PLANET_LINKS.mars,
    'al-jupiter': PLANET_LINKS.jupiter,
    'al-saturn':  PLANET_LINKS.saturn,
    'al-uranus':  PLANET_LINKS.uranus,
    'al-neptune': PLANET_LINKS.neptune
  };
  Object.keys(lmap).forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    if(lmap[id]){ el.setAttribute('href', lmap[id]); }
    else { el.style.cursor='default'; el.style.pointerEvents='none'; }
  });

  // Orbiting dots (5 rings × 3–10 dots each)
  var RING_DATA = [
    {name:'mars',    cx:178, cy:435, r:163},
    {name:'jupiter', cx:216, cy:435, r:201},
    {name:'saturn',  cx:250, cy:435, r:235},
    {name:'uranus',  cx:273, cy:435, r:258},
    {name:'neptune', cx:289, cy:435, r:274}
  ];

  var dotsG = document.getElementById('dots');
  var dotObjs = [];

  RING_DATA.forEach(function(ring){
    var n = 3 + Math.floor(Math.random()*8);
    for(var i=0;i<n;i++){
      var rSize = 1.5 + Math.random()*2;
      var g = mk('g',{});
      var bloom = mk('circle',{r:(rSize*2.5).toFixed(1), fill:'#a8d4ea', filter:'url(#bloom)'});
      var sharp = mk('circle',{r:rSize.toFixed(1), fill:'#a8d4ea'});
      g.appendChild(bloom);
      g.appendChild(sharp);
      dotsG.appendChild(g);
      dotObjs.push({
        g:g, bloom:bloom, sharp:sharp,
        angle: Math.random()*Math.PI*2,
        speed: (0.4+Math.random()*1.2) * (Math.random()<0.5?1:-1),
        rSize: rSize,
        ring:  ring
      });
    }
  });

  // Expose for console
  window._d93 = {
    dotObjs: dotObjs,
    setDotColor: function(c){
      dotObjs.forEach(function(d){ d.bloom.setAttribute('fill',c); d.sharp.setAttribute('fill',c); });
    },
    setBloom: function(v){
      var f = document.getElementById('bloom');
      if(f) f.querySelector('feGaussianBlur').setAttribute('stdDeviation', v);
    },
    speedMul: 1
  };

  // Animation loop
  var lastT = null;
  function frame(t){
    if(!lastT) lastT = t;
    var dt = Math.min((t-lastT)/1000, 0.1);
    lastT = t;
    var mul = window._d93.speedMul;
    dotObjs.forEach(function(d){
      d.angle += d.speed * mul * dt;
      var x = (d.ring.cx + d.ring.r*Math.cos(d.angle)).toFixed(2);
      var y = (d.ring.cy + d.ring.r*Math.sin(d.angle)).toFixed(2);
      d.g.setAttribute('transform','translate('+x+','+y+')');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>

<!-- ── PARAM CONSOLE ── -->
<script>
(function(){
  var LS_KEY = 'do93_music5';

  var PARAMS_DEFAULT = {
    rings: {
      mars:    {color:'#949490', planet:'#f0f0ee'},
      jupiter: {color:'#949490', planet:'#f0f0ee'},
      saturn:  {color:'#949490', planet:'#f0f0ee'},
      uranus:  {color:'#949490', planet:'#f0f0ee'},
      neptune: {color:'#949490', planet:'#f0f0ee'}
    },
    dotColor:  '#a8d4ea',
    dotBloom:  3,
    speed:     1,
    ringWidth: 0.6,
    lineColor: '#ccccca',
    lineWidth: 0.55,
    bgColor:   '#f0f0ee',
    textColor: '#808080',
    textSize:  7
  };

  // Deep clone
  function cloneDefaults(){ return JSON.parse(JSON.stringify(PARAMS_DEFAULT)); }

  var P = cloneDefaults();
  try {
    var saved = localStorage.getItem(LS_KEY);
    if(saved){
      var sp2 = JSON.parse(saved);
      // Merge top-level
      ['dotColor','dotBloom','speed','ringWidth','lineColor','lineWidth','bgColor','textColor','textSize']
        .forEach(function(k){ if(sp2[k]!==undefined) P[k]=sp2[k]; });
      // Merge rings
      if(sp2.rings){
        Object.keys(PARAMS_DEFAULT.rings).forEach(function(n){
          if(sp2.rings[n]){
            if(sp2.rings[n].color)  P.rings[n].color  = sp2.rings[n].color;
            if(sp2.rings[n].planet) P.rings[n].planet = sp2.rings[n].planet;
          }
        });
      }
    }
  } catch(e){}

  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(P)); }catch(e){} }

  // ── Apply helpers ──

  function applyRingColor(name, color){
    var el = document.getElementById('orbit-'+name);
    if(el){ el.setAttribute('stroke', color); }
    var pl = document.getElementById('planet-'+name);
    if(pl){ pl.setAttribute('stroke', color); }
  }
  function applyPlanetFill(name, color){
    var el = document.getElementById('planet-'+name);
    if(el) el.setAttribute('fill', color);
  }

  function applyAll(p){
    ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
      applyRingColor(n, p.rings[n].color);
      applyPlanetFill(n, p.rings[n].planet);
    });
    if(window._d93){
      window._d93.setDotColor(p.dotColor);
      window._d93.setBloom(p.dotBloom);
      window._d93.speedMul = p.speed;
    }
    ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
      var el=document.getElementById('orbit-'+n);
      if(el) el.setAttribute('stroke-width', p.ringWidth);
    });
    var rg=document.getElementById('rays');
    if(rg){ rg.setAttribute('stroke',p.lineColor); rg.setAttribute('stroke-width',p.lineWidth); }
    var da=document.getElementById('diag-arc');
    if(da) da.setAttribute('stroke',p.lineColor);
    var bg=document.getElementById('bg');
    if(bg) bg.setAttribute('fill',p.bgColor);
    var gr=document.getElementById('grain-rect');
    if(gr) gr.setAttribute('fill',p.bgColor);
    document.body.style.background = p.bgColor;
    var sun=document.getElementById('sun');
    if(sun) sun.setAttribute('fill',p.bgColor);
    ['mercury','venus'].forEach(function(n){
      var el=document.getElementById('planet-'+n);
      if(el) el.setAttribute('fill',p.bgColor);
    });
    var labels=document.getElementById('labels');
    if(labels){ labels.setAttribute('fill',p.textColor); labels.setAttribute('font-size',p.textSize); }
  }

  applyAll(P);

  // ── Build UI ──

  var CSS_BTN  = 'position:fixed;bottom:16px;left:16px;z-index:9999;background:rgba(24,24,24,0.88);color:#bbb;border:1px solid #555;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1.5px;padding:5px 10px;cursor:pointer;border-radius:3px;';
  var CSS_PAN  = 'position:fixed;bottom:48px;left:16px;z-index:9998;background:rgba(18,18,18,0.94);color:#bbb;font-family:Jost,sans-serif;font-weight:300;font-size:11px;border:1px solid #444;border-radius:4px;padding:12px 14px;width:270px;max-height:82vh;overflow-y:auto;';

  var btn = document.createElement('button');
  btn.textContent = '◆ P';
  btn.style.cssText = CSS_BTN;
  document.body.appendChild(btn);

  var panel = document.createElement('div');
  panel.style.cssText = CSS_PAN + 'display:none;';
  document.body.appendChild(panel);

  // Helpers to create controls
  function sec(title){
    var d=document.createElement('div');
    d.style.cssText='color:#555;font-size:9px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #2a2a2a;padding-bottom:3px;margin:10px 0 5px;';
    d.textContent=title;
    return d;
  }
  function rowEl(label, ctrl){
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;';
    var l=document.createElement('span');
    l.style.minWidth='105px';
    l.textContent=label;
    d.appendChild(l);
    d.appendChild(ctrl);
    return d;
  }
  function colorPick(val, onchange){
    var inp=document.createElement('input');
    inp.type='color'; inp.value=val;
    inp.style.cssText='width:34px;height:22px;padding:0;border:1px solid #444;cursor:pointer;background:none;';
    inp.addEventListener('input',function(){ onchange(inp.value); });
    return inp;
  }
  function slider(val, min, max, step, onchange){
    var wrap=document.createElement('div');
    wrap.style.cssText='display:flex;align-items:center;';
    var inp=document.createElement('input');
    inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    inp.style.cssText='width:100px;accent-color:#6698bb;';
    var lbl=document.createElement('span');
    lbl.textContent=parseFloat(val).toFixed(1);
    lbl.style.cssText='margin-left:6px;min-width:28px;color:#666;font-size:10px;';
    inp.addEventListener('input',function(){
      lbl.textContent=parseFloat(inp.value).toFixed(1);
      onchange(parseFloat(inp.value));
    });
    wrap.appendChild(inp); wrap.appendChild(lbl);
    return wrap;
  }

  // Two colour pickers on one row (ring + planet)
  function dualColor(label, ringVal, fillVal, onRing, onFill){
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;margin-bottom:5px;';
    var l=document.createElement('span');
    l.textContent=label;
    l.style.cssText='min-width:64px;';
    d.appendChild(l);
    var r1=document.createElement('span');
    r1.textContent='ring';
    r1.style.cssText='font-size:9px;color:#555;margin-right:3px;';
    d.appendChild(r1);
    d.appendChild(colorPick(ringVal, onRing));
    var r2=document.createElement('span');
    r2.textContent='fill';
    r2.style.cssText='font-size:9px;color:#555;margin:0 3px 0 10px;';
    d.appendChild(r2);
    d.appendChild(colorPick(fillVal, onFill));
    return d;
  }

  // ── Section: Rings ──
  panel.appendChild(sec('Rings'));
  ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
    panel.appendChild(dualColor(
      n.charAt(0).toUpperCase()+n.slice(1),
      P.rings[n].color,
      P.rings[n].planet,
      function(c){ P.rings[n].color=c; applyRingColor(n,c); save(); },
      function(c){ P.rings[n].planet=c; applyPlanetFill(n,c); save(); }
    ));
  });

  // ── Section: Dots ──
  panel.appendChild(sec('Dots'));
  panel.appendChild(rowEl('Colour', colorPick(P.dotColor, function(c){
    P.dotColor=c;
    if(window._d93) window._d93.setDotColor(c);
    save();
  })));
  panel.appendChild(rowEl('Bloom 0–10', slider(P.dotBloom, 0, 10, 0.5, function(v){
    P.dotBloom=v;
    if(window._d93) window._d93.setBloom(v);
    save();
  })));

  // ── Section: Motion ──
  panel.appendChild(sec('Motion'));
  panel.appendChild(rowEl('Speed 0–5', slider(P.speed, 0, 5, 0.1, function(v){
    P.speed=v;
    if(window._d93) window._d93.speedMul=v;
    save();
  })));

  // ── Section: Orbit width ──
  panel.appendChild(sec('Orbit rings'));
  panel.appendChild(rowEl('Width 0.2–3', slider(P.ringWidth, 0.2, 3, 0.1, function(v){
    P.ringWidth=v;
    ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
      var el=document.getElementById('orbit-'+n);
      if(el) el.setAttribute('stroke-width',v);
    });
    save();
  })));

  // ── Section: Lines ──
  panel.appendChild(sec('Lines'));
  panel.appendChild(rowEl('Colour', colorPick(P.lineColor, function(c){
    P.lineColor=c;
    var rg=document.getElementById('rays'); if(rg) rg.setAttribute('stroke',c);
    var da=document.getElementById('diag-arc'); if(da) da.setAttribute('stroke',c);
    save();
  })));
  panel.appendChild(rowEl('Width 0.2–3', slider(P.lineWidth, 0.2, 3, 0.1, function(v){
    P.lineWidth=v;
    var rg=document.getElementById('rays'); if(rg) rg.setAttribute('stroke-width',v);
    save();
  })));

  // ── Section: Display ──
  panel.appendChild(sec('Display'));
  panel.appendChild(rowEl('Background', colorPick(P.bgColor, function(c){
    P.bgColor=c;
    var bg=document.getElementById('bg'); if(bg) bg.setAttribute('fill',c);
    var gr=document.getElementById('grain-rect'); if(gr) gr.setAttribute('fill',c);
    document.body.style.background=c;
    var sun=document.getElementById('sun'); if(sun) sun.setAttribute('fill',c);
    ['mercury','venus'].forEach(function(n){
      var el=document.getElementById('planet-'+n); if(el) el.setAttribute('fill',c);
    });
    save();
  })));
  panel.appendChild(rowEl('Text colour', colorPick(P.textColor, function(c){
    P.textColor=c;
    var l=document.getElementById('labels'); if(l) l.setAttribute('fill',c);
    save();
  })));
  panel.appendChild(rowEl('Text size 4–24', slider(P.textSize, 4, 24, 1, function(v){
    P.textSize=v;
    var l=document.getElementById('labels'); if(l) l.setAttribute('font-size',v);
    save();
  })));

  // ── Buttons ──
  var brow=document.createElement('div');
  brow.style.cssText='display:flex;gap:8px;margin-top:12px;';

  var bEx=document.createElement('button');
  bEx.textContent='Export JSON';
  bEx.style.cssText='flex:1;background:#222;color:#aaa;border:1px solid #444;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1px;padding:6px;cursor:pointer;border-radius:2px;';
  bEx.addEventListener('click',function(){
    var a=document.createElement('a');
    a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(P,null,2));
    a.download='music5-params.json';
    a.click();
  });
  brow.appendChild(bEx);

  var bRe=document.createElement('button');
  bRe.textContent='Reset';
  bRe.style.cssText='flex:1;background:#222;color:#aaa;border:1px solid #444;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1px;padding:6px;cursor:pointer;border-radius:2px;';
  bRe.addEventListener('click',function(){
    P=cloneDefaults();
    applyAll(P);
    save();
    location.reload();
  });
  brow.appendChild(bRe);
  panel.appendChild(brow);

  // Toggle
  var open=false;
  function toggle(){ open=!open; panel.style.display=open?'block':'none'; }
  btn.addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){
    if(e.altKey && e.key.toLowerCase()==='p'){ e.preventDefault(); toggle(); }
  });

})();
</script>
</body>
</html>
