<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0A0A0A}
#sv{display:block;width:100vw;height:100vh}
a.plink{text-decoration:none;cursor:pointer}
a.plink .ps{transition:opacity 0.15s}
a.plink:hover .ps{opacity:0.7}
a.plink .hit{fill:transparent}
/* ── D93 Extended Colour Chooser ── */
#d93cc{display:none;position:fixed;z-index:10000;background:#1a1a1a;border:1px solid #444;
  box-shadow:3px 5px 18px rgba(0,0,0,.6);width:292px;font-family:'Jost',sans-serif;font-weight:300;color:#bbb}
#d93cc.open{display:block}
#d93cc-hdr{padding:6px 10px;border-bottom:1px solid #333;display:flex;align-items:center;
  justify-content:space-between;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#666;cursor:move}
#d93cc-close{cursor:pointer;color:#555;font-size:16px;line-height:1;padding:0 2px}
#d93cc-close:hover{color:#bbb}
#d93cc-tabs{display:flex;border-bottom:1px solid #333}
.d93cct{flex:1;padding:5px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;text-align:center;
  cursor:pointer;color:#555;border-right:1px solid #333}
.d93cct:last-child{border-right:none}.d93cct.on{color:#6698bb;background:#222}
.d93ccp{display:none}.d93ccp.on{display:block}
#d93ral-s{width:100%;padding:5px 10px;font-size:10px;font-family:'Jost',sans-serif;font-weight:300;
  border:none;border-bottom:1px solid #333;background:#222;outline:none;color:#aaa}
#d93ral-g{display:flex;flex-wrap:wrap;gap:2px;padding:6px;max-height:180px;overflow-y:auto}
.d93rs{width:20px;height:20px;cursor:pointer;flex-shrink:0;border:1px solid transparent}
.d93rs:hover{outline:2px solid #6698bb;outline-offset:1px}
#d93neon-g{display:flex;flex-wrap:wrap;gap:3px;padding:8px}
.d93ns{width:40px;height:28px;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:2px;font-size:7px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(0,0,0,.65);border:1px solid transparent}
.d93ns:hover{outline:2px solid #eee}
#d93mix{padding:8px}
#d93sv{width:100%;height:148px;cursor:crosshair;display:block;border:1px solid #333}
.d93sr{margin-top:4px;position:relative;height:12px}
.d93sr canvas{width:100%;height:12px;display:block;cursor:pointer;border:1px solid #333}
.d93sth{position:absolute;top:-1px;width:5px;height:14px;background:#ccc;border:1px solid #666;
  transform:translateX(-50%);pointer-events:none}
.d93fmts{display:flex;gap:2px;margin-top:5px}
.d93fg{flex:1;display:flex;flex-direction:column;align-items:center}
.d93fg label{font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:#555;margin-bottom:1px}
.d93fg input{width:100%;font-size:9px;font-family:monospace;border:1px solid #333;background:#222;
  padding:2px;text-align:center;outline:none;color:#aaa}
.d93fg input:focus{border-color:#6698bb}
#d93prev{height:20px;margin-top:4px;border:1px solid #333;display:flex;align-items:center;
  padding:0 6px;gap:6px;font-size:9px;color:#666}
#d93prev-sw{width:28px;height:12px;border:1px solid #555;flex-shrink:0}
.d93gr,.d93ts{display:flex;gap:2px;margin-top:3px}
.d93gr div,.d93ts div{flex:1;height:14px;cursor:pointer}
#d93cust{display:flex;flex-wrap:wrap;gap:2px;padding:4px 8px;min-height:22px;border-top:1px solid #333}
.d93cs{width:16px;height:16px;cursor:pointer;border:1px solid #444}
.d93cs:hover{outline:2px solid #6698bb}
#d93savecs{font-size:8px;font-family:'Jost',sans-serif;border:1px dashed #444;background:transparent;
  padding:1px 5px;cursor:pointer;margin:2px 0 0 2px;color:#666}
#d93savecs:hover{color:#aaa}
@keyframes hint-pulse{0%,100%{opacity:0.25}50%{opacity:1}}
#hint-push{animation:hint-pulse 2.4s ease-in-out infinite}
</style>
</head>
<body>

<script>
const PLANET_LINKS = {
  mars:    'explore.html',
  jupiter: 'journey.html',
  saturn:  'explore4.html',
  uranus:  'music.html',
  neptune: 'explore3.html'
};
</script>

<svg id="sv" width="100%" height="100%" preserveAspectRatio="none"
     shape-rendering="geometricPrecision"
     xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="grain" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.68 0.60" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0" in="n" result="g"/>
    <feBlend in="SourceGraphic" in2="g" mode="multiply" result="b"/>
    <feComposite in="b" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="bloom" x="-150%" y="-150%" width="400%" height="400%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- label textPath arcs generated by JS -->
</defs>

<!-- Background -->
<rect id="bg" x="-2000" y="-2000" width="6000" height="6000" fill="#0A0A0A"/>
<rect id="grain-rect" x="-2000" y="-2000" width="6000" height="6000" fill="#0A0A0A" filter="url(#grain)" opacity="0.04"/>

<!-- Paper specks -->
<g id="specks" fill="rgba(0,0,0,0.2)" stroke="none"></g>

<!-- Radial rays (JS-generated, measured geometry) -->
<g id="rays" stroke="#A5A5A5" stroke-width="0.2" opacity="0.35" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Orbit circles (JS-generated from ORBITS) -->
<g id="orbit-rings" opacity="0.6"></g>

<!-- Ellipse arcs: earth curve, dashed, dotted (JS-generated) -->
<g id="arcs" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Sun halo rings (JS-generated, seeded offsets) -->
<g id="sun-rings" stroke="#D0D0D0" stroke-width="0.3" opacity="0.45" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Sun spokes (JS-generated, 19 measured angles) -->
<g id="spokes" stroke="#A5A5A5" stroke-width="0.2" opacity="0.5" fill="none" vector-effect="non-scaling-stroke"></g>

<!-- Sun disc -->
<circle id="sun" cx="132" cy="421" r="56.5"
        stroke="rgba(0,0,0,0.88)" stroke-width="1.8" fill="#0A0A0A"
        vector-effect="non-scaling-stroke"/>

<!-- Mercury (non-clickable) -->
<circle id="planet-mercury" cx="247.5" cy="421" r="4.5"
        stroke="#000" stroke-width="0.9" stroke-opacity="0.85" fill="#0A0A0A"
        vector-effect="non-scaling-stroke"/>

<!-- Venus (non-clickable) -->
<circle id="planet-venus" cx="273" cy="421" r="9"
        stroke="#000" stroke-width="0.9" stroke-opacity="0.85" fill="#0A0A0A"
        vector-effect="non-scaling-stroke"/>

<!-- Mars (clickable) -->
<a id="al-mars" class="plink">
  <circle class="hit" cx="316" cy="421" r="36"/>
  <circle id="planet-mars" class="ps" cx="316" cy="421" r="12"
          stroke="#D0D0D0" stroke-width="0.9" stroke-opacity="0.85" fill="#FFFFFF"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Jupiter (clickable) -->
<a id="al-jupiter" class="plink">
  <circle class="hit" cx="387" cy="421" r="50"/>
  <circle id="planet-jupiter" class="ps" cx="387" cy="421" r="28"
          stroke="#D0D0D0" stroke-width="0.9" stroke-opacity="0.85" fill="#FFFFFF"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Saturn (clickable, plain circle) -->
<a id="al-saturn" class="plink">
  <circle class="hit" cx="456.5" cy="421" r="42"/>
  <circle id="planet-saturn" class="ps" cx="456.5" cy="421" r="21.5"
          stroke="#D0D0D0" stroke-width="0.9" stroke-opacity="0.85" fill="#FFFFFF"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Uranus (clickable) -->
<a id="al-uranus" class="plink">
  <circle class="hit" cx="519" cy="421" r="22"/>
  <circle id="planet-uranus" class="ps" cx="519" cy="421" r="10"
          stroke="#D0D0D0" stroke-width="0.9" stroke-opacity="0.85" fill="#FFFFFF"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Neptune (clickable) -->
<a id="al-neptune" class="plink">
  <circle class="hit" cx="562" cy="421" r="30"/>
  <circle id="planet-neptune" class="ps" cx="562" cy="421" r="12"
          stroke="#D0D0D0" stroke-width="0.9" stroke-opacity="0.85" fill="#FFFFFF"
          vector-effect="non-scaling-stroke"/>
</a>

<!-- Labels: JS-generated textPaths on orbit arcs -->
<g id="labels" font-family="'Jost',sans-serif" font-size="6" font-weight="300"
   letter-spacing="1.3" fill="#808080" text-anchor="middle">
  <text id="hint-push" x="582" y="421"
    dominant-baseline="middle" text-anchor="start"
    letter-spacing="0.12em" pointer-events="none">&#x2190; push the dots</text>
</g>

<!-- Orbiting dots -->
<g id="dots"></g>

</svg>

<!-- ── Extended Colour Chooser ── -->
<div id="d93cc">
  <div id="d93cc-hdr">Colour <span id="d93cc-close">✕</span></div>
  <div id="d93cc-tabs">
    <div class="d93cct on" data-t="ral">RAL</div>
    <div class="d93cct" data-t="neon">Neon</div>
    <div class="d93cct" data-t="mix">Mixer</div>
  </div>
  <div id="d93-ral" class="d93ccp on">
    <input type="text" id="d93ral-s" placeholder="Search RAL…">
    <div id="d93ral-g"></div>
  </div>
  <div id="d93-neon" class="d93ccp">
    <div id="d93neon-g"></div>
  </div>
  <div id="d93-mix" class="d93ccp">
    <div id="d93mix">
      <canvas id="d93sv" width="276" height="148"></canvas>
      <div class="d93sr"><canvas id="d93hue" width="276" height="12"></canvas><div class="d93sth" id="d93hth"></div></div>
      <div class="d93sr"><canvas id="d93alp" width="276" height="12"></canvas><div class="d93sth" id="d93ath"></div></div>
      <div class="d93fmts">
        <div class="d93fg"><label>HEX</label><input id="d93fhex" maxlength="9"></div>
        <div class="d93fg"><label>R</label><input id="d93fr" maxlength="3"></div>
        <div class="d93fg"><label>G</label><input id="d93fg2" maxlength="3"></div>
        <div class="d93fg"><label>B</label><input id="d93fb" maxlength="3"></div>
        <div class="d93fg"><label>A</label><input id="d93fa" maxlength="5"></div>
      </div>
      <div id="d93prev"><div id="d93prev-sw"></div><span id="d93raltxt"></span></div>
      <div class="d93gr" id="d93gr"></div>
      <div class="d93ts" id="d93ts"></div>
      <div style="font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:#555;padding:4px 0 2px">Custom Swatches</div>
      <div id="d93cust"></div>
      <button id="d93savecs">+ Save</button>
    </div>
  </div>
</div>

<!-- ── MAIN DRAWING SCRIPT ── -->
<script>
(function(){
  var NS = 'http://www.w3.org/2000/svg';
  var SX = 132, SY = 421;

  function mk(tag, a){
    var e = document.createElementNS(NS, tag);
    for(var k in a) e.setAttribute(k, a[k]);
    return e;
  }

  // Single source of truth: orbits, labels and dots all use this array
  var ORBITS = [
    {name:'mercury', cx:132.0, cy:421, r:115.5, pR:4.5,  labelable:false},
    {name:'venus',   cx:143.5, cy:421, r:129.5, pR:9,    labelable:false},
    {name:'mars',    cx:163.5, cy:421, r:152.5, pR:12,   labelable:true,  labelAngle:-29.6, labelText:'EXPLORE'},
    {name:'jupiter', cx:197.5, cy:421, r:189.5, pR:28,   labelable:true,  labelAngle:-32.8, labelText:'JOURNEY'},
    {name:'saturn',  cx:231.0, cy:421, r:225.5, pR:21.5, labelable:true,  labelAngle:-37,   labelText:'EXPLORE 4'},
    {name:'uranus',  cx:260.5, cy:421, r:258.5, pR:10,   labelable:true,  labelAngle:-38.9, labelText:'MUSIC'},
    {name:'neptune', cx:280.5, cy:421, r:281.5, pR:12,   labelable:true,  labelAngle:-40,   labelText:'EXPLORE 3'}
  ];
  window._d93ORBITS = ORBITS;

  // Dynamic full-bleed viewBox
  // x always starts at 0; wide screens extend right; portrait extends height equally T&B
  var sv = document.getElementById('sv');
  function setVB(){
    var W = window.innerWidth, H = window.innerHeight;
    var asp = W / H, refAsp = 585 / 864;
    var x, y, w, h;
    if(asp >= refAsp){
      h = 864; w = 864 * asp;
      x = 0; y = 0;
    } else {
      w = 585; h = 585 / asp;
      x = 0; y = (864 - h) / 2;
    }
    sv.setAttribute('viewBox', x.toFixed(1)+' '+y.toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1));
    positionHint();
  }
  function positionHint(){
    var hint = document.getElementById('hint-push');
    if(!hint) return;
    var vb = sv.getAttribute('viewBox').split(' ');
    var vbRight = parseFloat(vb[0]) + parseFloat(vb[2]);
    // "← push the dots" ~15 chars @ font-size 6
    var approxW = 15 * 6 * 0.62;
    if(582 + approxW > vbRight - 8){
      hint.setAttribute('x', '574');
      hint.setAttribute('y', '447');
      hint.setAttribute('text-anchor', 'end');
    } else {
      hint.setAttribute('x', '582');
      hint.setAttribute('y', '421');
      hint.setAttribute('text-anchor', 'start');
    }
  }
  setVB();
  window.addEventListener('resize', setVB);

  // Specks
  var sp = [[78,42,0.8],[218,28,0.6],[340,16,0.9],[472,52,0.7],[558,130,0.6],
            [570,240,0.8],[575,390,0.7],[562,530,0.9],[540,648,0.6],[488,748,0.8],
            [380,800,0.7],[248,820,0.6],[128,790,0.9],[52,680,0.7],[22,510,0.6],
            [36,350,0.8],[62,208,0.7],[408,88,0.6],[182,540,0.8],[492,310,0.7],
            [350,640,0.6],[140,320,0.8],[530,460,0.7],[90,480,0.6],
            [-80,200,0.7],[-120,400,0.6],[620,180,0.8],[650,420,0.7],
            [-60,600,0.9],[640,620,0.6]];
  var sg = document.getElementById('specks');
  sp.forEach(function(s){ sg.appendChild(mk('circle',{cx:s[0],cy:s[1],r:s[2]})); });

  // Radial rays — measured reference geometry [angle°, rStart, rEnd] (0=right, 90=down)
  var RAY_DATA = [
    [98.6,92,356],[24.5,93,333],[63.3,93,270],[296.9,92,241],[37.4,93,211],
    [124,93,206],[270,92,171],[309.5,92,167],[141,97,167],[43.9,174,354],
    [220.2,55,173],[199.6,55,137],[157.2,53,143],[179,56,132]
  ];
  var rg = document.getElementById('rays');
  RAY_DATA.forEach(function(ray){
    var a = ray[0] * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    rg.appendChild(mk('line',{
      x1:(SX + ray[1]*ca).toFixed(1), y1:(SY + ray[1]*sa).toFixed(1),
      x2:(SX + ray[2]*ca).toFixed(1), y2:(SY + ray[2]*sa).toFixed(1)
    }));
  });

  // Sun halo rings (16, r=63→90, seeded ±1.5 offsets)
  var ringsG = document.getElementById('sun-rings');
  var _hs = 42;
  function _hr(){ _hs = (_hs * 1664525 + 1013904223) >>> 0; return _hs / 4294967296; }
  for(var i=0;i<16;i++){
    var _ox = (_hr()-0.5)*3, _oy = (_hr()-0.5)*3;
    ringsG.appendChild(mk('circle',{cx:(SX+_ox).toFixed(2), cy:(SY+_oy).toFixed(2), r:(63+i*(90-63)/15).toFixed(2)}));
  }

  // Sun spokes — 19 measured angles (0=right, 90=down), r=56
  var SPOKE_ANGLES = [0,26,40,65,90,99,110,123,138.5,155,179,197.5,218,245.5,270,281.5,298,311.5,340];
  var spokesG = document.getElementById('spokes');
  SPOKE_ANGLES.forEach(function(deg){
    var a = deg * Math.PI / 180;
    spokesG.appendChild(mk('line',{
      x1:SX, y1:SY,
      x2:(SX + 56 * Math.cos(a)).toFixed(1),
      y2:(SY + 56 * Math.sin(a)).toFixed(1)
    }));
  });

  // Orbit circles from ORBITS
  var orbitG = document.getElementById('orbit-rings');
  ORBITS.forEach(function(o){
    orbitG.appendChild(mk('circle',{
      id:'orbit-'+o.name, cx:o.cx, cy:o.cy, r:o.r,
      stroke:'#D0D0D0', 'stroke-width':'0.3', fill:'none',
      'vector-effect':'non-scaling-stroke'
    }));
  });

  // Three ellipse arcs — measured reference geometry
  function ellipsePolyline(cx,cy,rx,ry,phi,t0,t1,nPts){
    var pr=phi*Math.PI/180, cp=Math.cos(pr), sp=Math.sin(pr), d='M';
    for(var i=0;i<nPts;i++){
      var t=(t0+(t1-t0)*i/(nPts-1))*Math.PI/180;
      var x=cx+rx*Math.cos(t)*cp-ry*Math.sin(t)*sp;
      var y=cy+rx*Math.cos(t)*sp+ry*Math.sin(t)*cp;
      d+=(i>0?' L':'')+x.toFixed(2)+','+y.toFixed(2);
    }
    return d;
  }
  var arcsG = document.getElementById('arcs');
  var _ao=mk('path',{id:'arc-dotted',
    d:ellipsePolyline(300.4,310.4,183.0,461.2,57.0,144,243,500),
    stroke:'#D0D0D0','stroke-width':'0.3','stroke-dasharray':'1,3'});
  arcsG.appendChild(_ao);

  // Label path arcs — centred on labelAngle, r+4 radius, text-anchor middle
  var defs = document.querySelector('#sv defs');
  var labelsG = document.getElementById('labels');
  ORBITS.forEach(function(o){
    if(!o.labelable) return;
    var lr = o.r + 4, hs = 20;
    var a1r = (o.labelAngle - hs) * Math.PI / 180;
    var a2r = (o.labelAngle + hs) * Math.PI / 180;
    var x1 = (o.cx + lr * Math.cos(a1r)).toFixed(2);
    var y1 = (o.cy + lr * Math.sin(a1r)).toFixed(2);
    var x2 = (o.cx + lr * Math.cos(a2r)).toFixed(2);
    var y2 = (o.cy + lr * Math.sin(a2r)).toFixed(2);
    var pid = 'lp-'+o.name;
    var p = mk('path',{id:pid, d:'M '+x1+','+y1+' A '+lr+','+lr+' 0 0,1 '+x2+','+y2});
    defs.appendChild(p);
    var txt = mk('text',{'text-anchor':'middle'});
    var tp = mk('textPath',{href:'#'+pid, startOffset:'50%', id:'tp-'+o.name});
    tp.textContent = '• '+(window._d93Labels&&window._d93Labels[o.name]||o.labelText);
    txt.appendChild(tp);
    labelsG.appendChild(txt);
  });

  // Wire planet links
  var lmap = {
    'al-mars':    PLANET_LINKS.mars,
    'al-jupiter': PLANET_LINKS.jupiter,
    'al-saturn':  PLANET_LINKS.saturn,
    'al-uranus':  PLANET_LINKS.uranus,
    'al-neptune': PLANET_LINKS.neptune
  };
  Object.keys(lmap).forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    if(lmap[id]){ el.setAttribute('href', lmap[id]); }
    else { el.style.cursor='default'; el.style.pointerEvents='none'; }
  });

  // Orbiting dots — use ORBITS as single source of truth
  var DOT_ORBITS = ORBITS.filter(function(o){ return o.labelable; });
  var dotsG = document.getElementById('dots');
  var dotObjs = [];

  DOT_ORBITS.forEach(function(ring){
    var n = 3 + Math.floor(Math.random()*8);
    for(var i=0;i<n;i++){
      var rSize = 1.5 + Math.random()*2;
      var g = mk('g',{});
      var bloom = mk('circle',{r:(rSize*2.5).toFixed(1), fill:'#4E5754', filter:'url(#bloom)'});
      var sharp = mk('circle',{r:rSize.toFixed(1), fill:'#4E5754'});
      g.appendChild(bloom); g.appendChild(sharp);
      dotsG.appendChild(g);
      dotObjs.push({
        g:g, bloom:bloom, sharp:sharp,
        angle: Math.random()*Math.PI*2,
        speed: (0.4+Math.random()*1.2) * (Math.random()<0.5?1:-1),
        rSize: rSize,
        ring: ring
      });
    }
  });

  window._d93 = {
    dotObjs: dotObjs,
    setDotColor: function(c){
      dotObjs.forEach(function(d){ d.bloom.setAttribute('fill',c); d.sharp.setAttribute('fill',c); });
    },
    setBloom: function(v){
      var f = document.getElementById('bloom');
      if(f) f.querySelector('feGaussianBlur').setAttribute('stdDeviation', v);
    },
    setDotSize: function(mul){
      dotObjs.forEach(function(d){
        d.sharp.setAttribute('r', (d.rSize * mul).toFixed(1));
        d.bloom.setAttribute('r', (d.rSize * mul * 2.5).toFixed(1));
      });
    },
    setDotOpacity: function(v){
      dotObjs.forEach(function(d){ d.g.setAttribute('opacity', v); });
    },
    speedMul: 1
  };

  // Animation loop
  var lastT = null;
  function frame(t){
    if(!lastT) lastT = t;
    var dt = Math.min((t-lastT)/1000, 0.1);
    lastT = t;
    var mul = window._d93.speedMul;
    dotObjs.forEach(function(d){
      d.angle += d.speed * mul * dt;
      var x = (d.ring.cx + d.ring.r * Math.cos(d.angle)).toFixed(2);
      var y = (d.ring.cy + d.ring.r * Math.sin(d.angle)).toFixed(2);
      d.g.setAttribute('transform','translate('+x+','+y+')');
    });
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>

    c.fillStyle=g2;c.fillRect(0,0,w,hh);

      if(type==='hex'){hh=val.startsWith('#')?val:'#'+val;if(hh.length<7)return;hsva=h2hsva(hh);}
      else if(type==='r'){hh=rgb2h(+val,c.g,c.b);hsva=h2hsva(hh);}
      else if(type==='g'){hh=rgb2h(c.r,+val,c.b);hsva=h2hsva(hh);}
      else if(type==='b'){hh=rgb2h(c.r,c.g,+val);hsva=h2hsva(hh);}
      else if(type==='a'){hsva.a=Math.max(0,Math.min(1,+val));}
      d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();
    }catch(e){}
  }
  document.getElementById('d93fhex').addEventListener('input',function(){d93FmtInput('hex',this.value);});
  document.getElementById('d93fr').addEventListener('input',function(){d93FmtInput('r',this.value);});
  document.getElementById('d93fg2').addEventListener('input',function(){d93FmtInput('g',this.value);});
  document.getElementById('d93fb').addEventListener('input',function(){d93FmtInput('b',this.value);});
  document.getElementById('d93fa').addEventListener('input',function(){d93FmtInput('a',this.value);});

  // SV canvas
  document.getElementById('d93sv').addEventListener('mousedown',function(e){svDrag=true;svMove(e);});
  document.getElementById('d93sv').addEventListener('mousemove',function(e){if(svDrag)svMove(e);});
  function svMove(e){var r=document.getElementById('d93sv').getBoundingClientRect();hsva.s=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));hsva.v=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();}
  // Hue canvas
  document.getElementById('d93hue').addEventListener('mousedown',function(e){hueDrag=true;hueMove(e);});
  document.getElementById('d93hue').addEventListener('mousemove',function(e){if(hueDrag)hueMove(e);});
  function hueMove(e){var r=document.getElementById('d93hue').getBoundingClientRect();hsva.h=Math.max(0,Math.min(360,(e.clientX-r.left)/r.width*360));d93Apply(hsv2hex(hsva.h,hsva.s,hsva.v));d93Redraw();}
  // Alpha canvas
  document.getElementById('d93alp').addEventListener('mousedown',function(e){alpDrag=true;alpMove(e);});
  document.getElementById('d93alp').addEventListener('mousemove',function(e){if(alpDrag)alpMove(e);});
  function alpMove(e){var r=document.getElementById('d93alp').getBoundingClientRect();hsva.a=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));d93Redraw();}
  document.addEventListener('mouseup',function(){svDrag=false;hueDrag=false;alpDrag=false;});

  // Custom swatches save
  document.getElementById('d93savecs').addEventListener('click',function(){
    var hex=hsv2hex(hsva.h,hsva.s,hsva.v);
    if(!customSwatches.includes(hex)){customSwatches.push(hex);try{localStorage.setItem('d93-cs',JSON.stringify(customSwatches));}catch(e){}}
    d93UpdateCustom();
  });

  // Drag the picker
  document.getElementById('d93cc-hdr').addEventListener('mousedown',function(e){
    var cc=document.getElementById('d93cc');
    ccDrag=true;ccDX=e.clientX-cc.offsetLeft;ccDY=e.clientY-cc.offsetTop;
  });
  document.addEventListener('mousemove',function(e){if(ccDrag){var cc=document.getElementById('d93cc');cc.style.left=(e.clientX-ccDX)+'px';cc.style.top=(e.clientY-ccDY)+'px';}});
  document.addEventListener('mouseup',function(){ccDrag=false;});

  // Close on outside click
  document.addEventListener('mousedown',function(e){
    var cc=document.getElementById('d93cc');
    if(cc.classList.contains('open')&&!cc.contains(e.target)&&(!ccTarget||!ccTarget.swatch.contains(e.target))){d93CloseCC();}
  });

  // ── Build RAL + Neon swatches ──
  function buildRAL(){
    var cont=document.getElementById('d93ral-g');cont.innerHTML='';
    RAL.forEach(function(r2){
      var d=document.createElement('div');d.className='d93rs';d.style.background=r2.h;d.title='RAL '+r2.c+' – '+r2.n+'\n'+r2.h;
      d.addEventListener('click',function(){d93Apply(r2.h);hsva=h2hsva(r2.h);if(curTab==='mix')d93Redraw();d93CloseCC();});
      cont.appendChild(d);
    });
  }
  document.getElementById('d93ral-s').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    document.querySelectorAll('#d93ral-g .d93rs').forEach(function(el){el.style.display=(!q||el.title.toLowerCase().includes(q))?'':'none';});
  });
  function buildNeon(){
    var cont=document.getElementById('d93neon-g');cont.innerHTML='';
    NEON.forEach(function(n){
      var d=document.createElement('div');d.className='d93ns';d.style.background=n.h;d.title=n.n;d.textContent=n.n;
      d.addEventListener('click',function(){d93Apply(n.h);hsva=h2hsva(n.h);if(curTab==='mix')d93Redraw();d93CloseCC();});
      cont.appendChild(d);
    });
  }

  buildRAL(); buildNeon();

})();
</script>

<!-- ── PARAM CONSOLE ── -->
<script>
(function(){
  var LS_KEY = 'do93_music5';

  var PARAMS_DEFAULT = {
    rings: {
      mars:    {color:'#D0D0D0', planet:'#FFFFFF'},
      jupiter: {color:'#D0D0D0', planet:'#FFFFFF'},
      saturn:  {color:'#D0D0D0', planet:'#FFFFFF'},
      uranus:  {color:'#D0D0D0', planet:'#FFFFFF'},
      neptune: {color:'#D0D0D0', planet:'#FFFFFF'}
    },
    labelTexts: {
      mars: 'EXPLORE', jupiter: 'JOURNEY', saturn: 'EXPLORE 4',
      uranus: 'MUSIC', neptune: 'EXPLORE 3'
    },
    dotColor:   '#4E5754',
    dotBloom:   2.5,
    dotSize:    0.45,
    dotOpacity: 0.62,
    speedPos:   0.157,
    ringColor:  '#D0D0D0',
    ringWidth:  0.3,
    lineColor:  '#A5A5A5',
    lineWidth:  0.2,
    bgColor:    '#0A0A0A',
    textColor:  '#D0D0D0',
    textSize:   6
  };

  function cloneDefaults(){ return JSON.parse(JSON.stringify(PARAMS_DEFAULT)); }

  var P = cloneDefaults();
  try {
    var saved = localStorage.getItem(LS_KEY);
    if(saved){
      var sp2 = JSON.parse(saved);
      ['dotColor','dotBloom','dotSize','dotOpacity','speedPos','ringColor','ringWidth','lineColor','lineWidth','bgColor','textColor','textSize']
        .forEach(function(k){ if(sp2[k]!==undefined) P[k]=sp2[k]; });
      if(sp2.speed !== undefined && sp2.speedPos === undefined){
        P.speedPos = Math.pow(sp2.speed / 5, 1/3);
      }
      if(sp2.rings){
        Object.keys(PARAMS_DEFAULT.rings).forEach(function(n){
          if(sp2.rings[n]){
            if(sp2.rings[n].color)  P.rings[n].color  = sp2.rings[n].color;
            if(sp2.rings[n].planet) P.rings[n].planet = sp2.rings[n].planet;
          }
        });
      }
      if(sp2.labelTexts){
        Object.keys(PARAMS_DEFAULT.labelTexts).forEach(function(n){
          if(sp2.labelTexts[n]!==undefined) P.labelTexts[n]=sp2.labelTexts[n];
        });
      }
    }
  } catch(e){}

  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(P)); }catch(e){} }

  function applyRingColor(name, color){
    var el = document.getElementById('orbit-'+name);
    if(el){ el.setAttribute('stroke', color); }
    var pl = document.getElementById('planet-'+name);
    if(pl){ pl.setAttribute('stroke', color); }
  }
  function applyPlanetFill(name, color){
    var el = document.getElementById('planet-'+name);
    if(el) el.setAttribute('fill', color);
  }

  function applyAll(p){
    ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
      applyRingColor(n, p.rings[n].color);
      applyPlanetFill(n, p.rings[n].planet);
    });
    if(window._d93){
      window._d93.setDotColor(p.dotColor);
      window._d93.setBloom(p.dotBloom);
      window._d93.setDotSize(p.dotSize);
      window._d93.setDotOpacity(p.dotOpacity);
      window._d93.speedMul = 5 * Math.pow(p.speedPos, 3);
    }
    window._d93ORBITS.forEach(function(o){
      var el=document.getElementById('orbit-'+o.name);
      if(el) el.setAttribute('stroke-width', p.ringWidth);
    });
    var hr=document.getElementById('sun-rings');
    if(hr) hr.querySelectorAll('circle').forEach(function(c){ c.setAttribute('stroke-width',p.ringWidth); });
    var ag=document.getElementById('arcs');
    if(ag) ag.querySelectorAll('path').forEach(function(pt){ pt.setAttribute('stroke-width',p.ringWidth); });
    // ringColor: mercury/venus orbits, halo rings, arcs
    ['mercury','venus'].forEach(function(n){
      var erc=document.getElementById('orbit-'+n); if(erc) erc.setAttribute('stroke',p.ringColor);
    });
    var hr2=document.getElementById('sun-rings');
    if(hr2) hr2.querySelectorAll('circle').forEach(function(ci){ ci.setAttribute('stroke',p.ringColor); });
    var ag2=document.getElementById('arcs');
    if(ag2) ag2.querySelectorAll('path').forEach(function(pt){ pt.setAttribute('stroke',p.ringColor); });
    var rg=document.getElementById('rays');
    if(rg){ rg.setAttribute('stroke',p.lineColor); rg.setAttribute('stroke-width',p.lineWidth); }
    var sg=document.getElementById('spokes');
    if(sg){ sg.setAttribute('stroke',p.lineColor); sg.setAttribute('stroke-width',p.lineWidth); }
    var bg=document.getElementById('bg');
    if(bg) bg.setAttribute('fill',p.bgColor);
    var gr=document.getElementById('grain-rect');
    if(gr) gr.setAttribute('fill',p.bgColor);
    document.body.style.background = p.bgColor;
    var sun=document.getElementById('sun');
    if(sun) sun.setAttribute('fill',p.bgColor);
    ['mercury','venus'].forEach(function(n){
      var el=document.getElementById('planet-'+n);
      if(el) el.setAttribute('fill',p.bgColor);
    });
    var labels=document.getElementById('labels');
    if(labels){ labels.setAttribute('fill',p.textColor); labels.setAttribute('font-size',p.textSize); }
  }

  function applyLabelTexts(lt){
    window._d93Labels = lt;
    Object.keys(lt).forEach(function(n){
      var tp = document.getElementById('tp-'+n);
      if(tp) tp.textContent = '• '+lt[n];
    });
  }
  applyAll(P);
  applyLabelTexts(P.labelTexts);

  // ── Build UI ──
  var CSS_BTN = 'position:fixed;bottom:16px;left:16px;z-index:9999;background:rgba(24,24,24,0.88);color:#bbb;border:1px solid #555;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1.5px;padding:5px 10px;cursor:pointer;border-radius:3px;';

  var btn = document.createElement('button');
  btn.textContent = '◆ P';
  btn.style.cssText = CSS_BTN;
  document.body.appendChild(btn);

  var panel = document.createElement('div');
  panel.style.cssText = 'position:fixed;bottom:48px;left:16px;right:16px;z-index:9998;background:rgba(18,18,18,0.94);color:#bbb;font-family:Jost,sans-serif;font-weight:300;font-size:11px;border:1px solid #444;border-radius:4px;padding:12px 14px;max-height:40vh;overflow-x:auto;overflow-y:auto;display:none;';
  document.body.appendChild(panel);

  var panelInner = document.createElement('div');
  panelInner.style.cssText = 'display:flex;flex-direction:row;gap:18px;min-height:0;';
  panel.appendChild(panelInner);

  function col(){
    var d = document.createElement('div');
    d.style.cssText = 'min-width:260px;flex-shrink:0;';
    panelInner.appendChild(d);
    return d;
  }

  function sec(title){
    var d=document.createElement('div');
    d.style.cssText='color:#555;font-size:9px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #2a2a2a;padding-bottom:3px;margin:0 0 6px;';
    d.textContent=title; return d;
  }
  function rowEl(label, ctrl){
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;';
    var l=document.createElement('span'); l.style.minWidth='105px'; l.textContent=label;
    d.appendChild(l); d.appendChild(ctrl); return d;
  }

  // Extended colour swatch — opens d93cc picker
  function colorPick(initVal, onchange){
    var cur = initVal;
    var sw = document.createElement('div');
    sw.style.cssText='width:34px;height:22px;border:1px solid #555;cursor:pointer;flex-shrink:0;background:'+cur+';border-radius:2px;';
    sw.addEventListener('click', function(){
      if(window.d93OpenCC) window.d93OpenCC(sw, cur, function(hex){ cur=hex; sw.style.background=hex; onchange(hex); });
    });
    return sw;
  }

  function slider(val, min, max, step, onchange, decimals){
    var dp = (decimals !== undefined) ? decimals : 1;
    var wrap=document.createElement('div'); wrap.style.cssText='display:flex;align-items:center;';
    var inp=document.createElement('input'); inp.type='range'; inp.min=min; inp.max=max; inp.step=step; inp.value=val;
    inp.style.cssText='width:100px;accent-color:#6698bb;';
    var lbl=document.createElement('span'); lbl.textContent=parseFloat(val).toFixed(dp);
    lbl.style.cssText='margin-left:6px;min-width:28px;color:#666;font-size:10px;';
    inp.addEventListener('input',function(){ lbl.textContent=parseFloat(inp.value).toFixed(dp); onchange(parseFloat(inp.value)); });
    wrap.appendChild(inp); wrap.appendChild(lbl); return wrap;
  }

  var ringSwatches = {};

  // ── Rings column ──
  var colRings = col();
  colRings.appendChild(sec('Rings'));
  ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
    var d=document.createElement('div'); d.style.cssText='display:flex;align-items:center;margin-bottom:5px;';
    var l=document.createElement('span'); l.textContent=n.charAt(0).toUpperCase()+n.slice(1); l.style.cssText='min-width:64px;';
    d.appendChild(l);
    var r1=document.createElement('span'); r1.textContent='line'; r1.style.cssText='font-size:9px;color:#555;margin-right:3px;';
    d.appendChild(r1);
    var ringSw=colorPick(P.rings[n].color,(function(name){return function(c){P.rings[name].color=c;applyRingColor(name,c);save();};})(n));
    ringSwatches[n]=ringSw; d.appendChild(ringSw);
    var r2=document.createElement('span'); r2.textContent='planet'; r2.style.cssText='font-size:9px;color:#555;margin:0 3px 0 10px;';
    d.appendChild(r2);
    d.appendChild(colorPick(P.rings[n].planet,(function(name){return function(c){P.rings[name].planet=c;applyPlanetFill(name,c);save();};})(n)));
    colRings.appendChild(d);
    var lrow=document.createElement('div');
    lrow.style.cssText='display:flex;align-items:center;margin-bottom:5px;margin-left:64px;';
    var linp=document.createElement('input'); linp.type='text'; linp.value=P.labelTexts[n];
    linp.style.cssText='flex:1;background:#1a1a1a;color:#aaa;border:1px solid #444;font-family:Jost,sans-serif;font-weight:300;font-size:10px;padding:3px 5px;';
    (function(name,inp){inp.addEventListener('input',function(){P.labelTexts[name]=inp.value;applyLabelTexts(P.labelTexts);save();});})(n,linp);
    lrow.appendChild(linp); colRings.appendChild(lrow);
  });

  // ── Dots column ──
  var colDots = col();
  colDots.appendChild(sec('Dots'));
  colDots.appendChild(rowEl('Colour', colorPick(P.dotColor, function(c){
    P.dotColor=c; if(window._d93) window._d93.setDotColor(c); save();
  })));
  colDots.appendChild(rowEl('Bloom 0–10', slider(P.dotBloom, 0, 10, 0.5, function(v){
    P.dotBloom=v; if(window._d93) window._d93.setBloom(v); save();
  })));
  colDots.appendChild(rowEl('Dot size 0.2–3', slider(P.dotSize, 0.2, 3, 0.05, function(v){
    P.dotSize=v; if(window._d93) window._d93.setDotSize(v); save();
  })));
  colDots.appendChild(rowEl('Opacity 0–1', slider(P.dotOpacity, 0, 1, 0.01, function(v){
    P.dotOpacity=v; if(window._d93) window._d93.setDotOpacity(v); save();
  }, 2)));

  // ── Motion column ──
  var colMotion = col();
  colMotion.appendChild(sec('Motion'));
  (function(){
    var d=document.createElement('div');
    d.style.cssText='display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;';
    var l=document.createElement('span'); l.style.cssText='min-width:105px;'; l.textContent='Speed';
    d.appendChild(l);
    var wrap=document.createElement('div'); wrap.style.cssText='display:flex;align-items:center;';
    var inp=document.createElement('input'); inp.type='range'; inp.min=0; inp.max=1; inp.step=0.001; inp.value=P.speedPos;
    inp.style.cssText='width:100px;accent-color:#6698bb;';
    var lbl=document.createElement('span');
    lbl.textContent=(5*Math.pow(P.speedPos,3)).toFixed(3)+'×';
    lbl.style.cssText='margin-left:6px;min-width:46px;color:#666;font-size:10px;';
    inp.addEventListener('input',function(){
      var s=parseFloat(inp.value); P.speedPos=s;
      var mul=5*Math.pow(s,3); lbl.textContent=mul.toFixed(3)+'×';
      if(window._d93) window._d93.speedMul=mul; save();
    });
    wrap.appendChild(inp); wrap.appendChild(lbl); d.appendChild(wrap); colMotion.appendChild(d);
  })();

  // ── Orbit rings column ──
  var colOrbit = col();
  colOrbit.appendChild(sec('Orbit rings'));
  colOrbit.appendChild(rowEl('All rings', colorPick(P.ringColor, function(c){
    P.ringColor=c;
    ['mars','jupiter','saturn','uranus','neptune'].forEach(function(n){
      P.rings[n].color=c; applyRingColor(n,c);
      if(ringSwatches[n]) ringSwatches[n].style.background=c;
    });
    ['mercury','venus'].forEach(function(n){
      var erc=document.getElementById('orbit-'+n); if(erc) erc.setAttribute('stroke',c);
    });
    var hr=document.getElementById('sun-rings');
    if(hr) hr.querySelectorAll('circle').forEach(function(ci){ci.setAttribute('stroke',c);});
    var ag=document.getElementById('arcs');
    if(ag) ag.querySelectorAll('path').forEach(function(pt){pt.setAttribute('stroke',c);});
    save();
  })));
  colOrbit.appendChild(rowEl('Width 0.2–3', slider(P.ringWidth, 0.2, 3, 0.1, function(v){
    P.ringWidth=v;
    window._d93ORBITS.forEach(function(o){
      var el=document.getElementById('orbit-'+o.name); if(el) el.setAttribute('stroke-width',v);
    });
    var hr=document.getElementById('sun-rings');
    if(hr) hr.querySelectorAll('circle').forEach(function(c){c.setAttribute('stroke-width',v);});
    var ag=document.getElementById('arcs');
    if(ag) ag.querySelectorAll('path').forEach(function(pt){pt.setAttribute('stroke-width',v);});
    save();
  })));

  // ── Lines column ──
  var colLines = col();
  colLines.appendChild(sec('Lines'));
  colLines.appendChild(rowEl('Colour', colorPick(P.lineColor, function(c){
    P.lineColor=c;
    var rg=document.getElementById('rays'); if(rg) rg.setAttribute('stroke',c);
    var sg=document.getElementById('spokes'); if(sg) sg.setAttribute('stroke',c);
    save();
  })));
  colLines.appendChild(rowEl('Width 0.2–3', slider(P.lineWidth, 0.2, 3, 0.1, function(v){
    P.lineWidth=v;
    var rg=document.getElementById('rays'); if(rg) rg.setAttribute('stroke-width',v);
    var sg=document.getElementById('spokes'); if(sg) sg.setAttribute('stroke-width',v);
    save();
  })));

  // ── Display column ──
  var colDisplay = col();
  colDisplay.appendChild(sec('Display'));
  colDisplay.appendChild(rowEl('Background', colorPick(P.bgColor, function(c){
    P.bgColor=c;
    var bg=document.getElementById('bg'); if(bg) bg.setAttribute('fill',c);
    var gr=document.getElementById('grain-rect'); if(gr) gr.setAttribute('fill',c);
    document.body.style.background=c;
    var sun=document.getElementById('sun'); if(sun) sun.setAttribute('fill',c);
    ['mercury','venus'].forEach(function(n){var el=document.getElementById('planet-'+n);if(el)el.setAttribute('fill',c);});
    save();
  })));
  colDisplay.appendChild(rowEl('Text colour', colorPick(P.textColor, function(c){
    P.textColor=c; var l=document.getElementById('labels'); if(l) l.setAttribute('fill',c); save();
  })));
  colDisplay.appendChild(rowEl('Text size 4–24', slider(P.textSize, 4, 24, 1, function(v){
    P.textSize=v; var l=document.getElementById('labels'); if(l) l.setAttribute('font-size',v); save();
  })));

  // ── Buttons column ──
  var colButtons = col();
  colButtons.appendChild(sec('Buttons'));
  var bEx=document.createElement('button');
  bEx.textContent='Export JSON';
  bEx.style.cssText='display:block;width:100%;background:#222;color:#aaa;border:1px solid #444;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1px;padding:6px;cursor:pointer;border-radius:2px;margin-bottom:8px;';
  bEx.addEventListener('click',function(){
    var a=document.createElement('a'); a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(P,null,2)); a.download='music5-params.json'; a.click();
  });
  colButtons.appendChild(bEx);
  var bRe=document.createElement('button');
  bRe.textContent='Reset';
  bRe.style.cssText='display:block;width:100%;background:#222;color:#aaa;border:1px solid #444;font-family:Jost,sans-serif;font-weight:300;font-size:10px;letter-spacing:1px;padding:6px;cursor:pointer;border-radius:2px;';
  bRe.addEventListener('click',function(){ P=cloneDefaults(); applyAll(P); save(); location.reload(); });
  colButtons.appendChild(bRe);

  // Toggle
  var open=false;
  function toggle(){ open=!open; panel.style.display=open?'block':'none'; }
  btn.addEventListener('click',toggle);
  document.addEventListener('keydown',function(e){ if(e.altKey&&e.key.toLowerCase()==='p'){ e.preventDefault(); toggle(); } });

})();
</script>
</body>
</html>
