<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>days of 93 — music</title>
<!-- build: v5-music3 -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300..800&family=Jost:wght@200;300;400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --field: #D0D0D0; /* RAL 7047 Telegrey 4 */
    --line:  rgba(0,0,0,0.13);
    --axis-x: rgba(0,0,0,0.30);
    --axis-y: rgba(0,0,0,0.30);
    --ink:   #1a1a1a;
    --hair:  1.2px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--field); }
  body{
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  header{
    position: fixed; top:0; left:0; right:0; z-index:50;
    padding: 20px 28px; display:flex; align-items:center; justify-content:flex-end;
  }
  nav{ display:flex; gap:28px; align-items:center; }
  nav a{
    font-family:'Jost', 'Helvetica Neue', sans-serif;
    font-size:11px; letter-spacing:0.22em; font-weight:300;
    text-transform:uppercase; color:var(--ink); text-decoration:none; opacity:1;
  }
  nav a:hover{ opacity:0.6; }
  nav a.nav-active{ border-bottom:1.5px solid currentColor; padding-bottom:1px; opacity:1; }
  @media (max-width:720px){
    header{ padding:16px 18px; }
    nav{ gap:18px; }
    nav a{ font-size:10px; }
  }

  .hero{
    position:relative; z-index:20;
    padding: 52px 28px 20px;
    min-height:54vh; display:flex; flex-direction:row;
    align-items:flex-start; justify-content:space-between;
  }
  .hero-title{
    font-family:'Jost', 'Helvetica Neue', sans-serif;
    font-size: clamp(5rem, 14vw, 20rem);
    font-weight:700; text-transform:uppercase;
    letter-spacing:-0.02em; line-height:0.88;
    color:var(--ink);
    margin-top: auto; margin-right: 4vw;
  }
  @media (max-width:720px){
    .hero{ padding:80px 18px 30px; min-height:42vh; flex-direction:column; align-items:flex-start; gap:28px; }
    .hero-title{ margin-top:18vw; margin-right:0; align-self:flex-end; }
  }

  .field{ position:fixed; inset:0; z-index:15; pointer-events:none; }

  .full-video-wrap{
    position: relative; z-index: 10;
    margin-top: -24vh;
  }
  .full-video-wrap video{
    width: 100%; display: block;
  }

  @media (max-width:720px){
    .full-video-wrap{ margin-top: -20vh; }
  }

  #play-btn{
    display:none;
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:none; border:none; padding:0; margin:0;
    cursor:pointer; z-index:25;
    -webkit-tap-highlight-color:transparent;
    width:72px; height:72px;
    opacity:1; transition:opacity 0.35s ease;
  }
  #play-btn.gone{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html#about">about</a>
      <a href="music.html" class="nav-active">music</a>
      <a href="index.html">work</a>
      <a href="past-clients.html">past clients</a>
      <a href="mailto:contact@daysof93.com">contact</a>
      <a href="https://www.instagram.com/days_of_93/" target="_blank" rel="noopener" aria-label="Instagram" style="display:flex;align-items:center;" onmouseover="this.style.opacity=0.6" onmouseout="this.style.opacity=1">
        <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="18" height="18" rx="4" ry="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
          <circle cx="17" cy="7" r="1.2" fill="#1a1a1a"/>
        </svg>
      </a>
      <div id="d93-vol-wrap" style="position:relative;display:inline-flex;align-items:center;margin-left:4px;">
        <button id="d93-mute-btn" aria-label="Volume" style="background:none;border:none;padding:0 0 0 2px;cursor:pointer;display:flex;align-items:center;color:var(--ink,#000);opacity:0.65;transition:opacity .2s;-webkit-tap-highlight-color:transparent;" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=0.65">
          <svg id="d93-spk" width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
            <path id="d93-spk-path" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
        </button>
        <div id="d93-vol-popup" style="position:absolute;display:none;flex-direction:column;align-items:center;padding:10px 8px;z-index:9998;background:var(--field,#fff);border:1px solid rgba(128,128,128,0.2);">
          <input type="range" id="d93-vol-sl" min="0" max="1" step="0.01" style="height:72px;writing-mode:vertical-lr;direction:rtl;accent-color:var(--ink,#000);cursor:pointer;width:18px;">
        </div>
      </div>
    </nav>
  </header>

  <div class="hero" style="pointer-events:none;"></div>

  <div id="days-label" style="position:fixed; top:52px; right:28px; z-index:40; pointer-events:none;">
    <div class="hero-title" style="font-size:clamp(4.5rem,13vw,16rem); font-weight:900; opacity:0.07; text-align:right;">DAYS<br>OF 93.</div>
  </div>

  <div class="full-video-wrap">
    <video loop muted playsinline preload="auto">
      <source src="https://daysof93-cdn.b-cdn.net/ICELAND1993V3.mov" type="video/mp4">
    </video>
    <button id="play-btn" aria-label="Play">
      <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="30" fill="rgba(0,0,0,0.12)" stroke="#1a1a1a" stroke-width="1.5"/>
        <polygon points="29,20 29,52 56,36" fill="#1a1a1a"/>
      </svg>
    </button>
  </div>

  <p style="font-family:'Jost','Helvetica Neue',sans-serif; font-size:11px; letter-spacing:0.14em; font-weight:300; text-transform:uppercase; color:var(--ink); opacity:0.55; padding:12px 28px 0; position:relative; z-index:20;">Reykjavik 1993. Modular synths, no grid, live orchestrals</p>

  <div style="display:flex; justify-content:space-between; align-items:center; padding:28px 28px 60px; position:relative; z-index:20;">
    <a href="music2.html" id="back-arrow" class="hero-title" style="display:block; margin:0; opacity:0; transition:opacity 1.2s ease; color:var(--ink); text-decoration:none;">&lt;</a>
    <a href="music4.html" id="fwd-arrow" class="hero-title" style="display:block; margin:0; color:var(--ink); text-decoration:none;">&gt;</a>
  </div>

  <svg class="field" id="field" preserveAspectRatio="xMidYMid slice"></svg>

<script>
function daySeed(){ const d=new Date(); return d.getFullYear()*1000 + dayOfYear(d); }
function dayOfYear(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
const SEED = daySeed();

function drawField(){
  const svg = document.getElementById('field');
  const w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', "0 0 "+w+" "+h);
  const camX = (seededRand(SEED+1)-0.5)*40;
  const camTilt = (seededRand(SEED+2)-0.5)*0.02;
  const vpX = w*0.5 + camX, vpY = h*0.62;
  let lines = '';
  const bands = 18;
  for(let i=0;i<=bands;i++){
    const t=i/bands, y=vpY+Math.pow(t,1.8)*(h-vpY), op=0.34*(1-t*0.65);
    lines += '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+op.toFixed(3)+'"/>';
  }
  const cols=16;
  for(let i=0;i<=cols;i++){
    const x=(i/cols)*w;
    lines += '<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="0.18"/>';
  }
  const ay=Math.sin(camTilt);
  lines += '<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+(vpY+ay*w)+'" stroke="var(--axis-x)" stroke-width="var(--hair)" opacity="0.48"/>';
  lines += '<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="var(--axis-y)" stroke-width="var(--hair)" opacity="0.42"/>';
  const gx=vpX, gy=vpY, r=9;
  lines += '<circle cx="'+gx+'" cy="'+gy+'" r="'+r+'" fill="none" stroke="var(--ink)" stroke-width="var(--hair)" stroke-dasharray="2 3" opacity="0.55"/>';
  lines += '<line x1="'+(gx-r-4)+'" y1="'+gy+'" x2="'+(gx+r+4)+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="var(--hair)" opacity="0.55"/>';
  lines += '<line x1="'+gx+'" y1="'+(gy-r-4)+'" x2="'+gx+'" y2="'+(gy+r+4)+'" stroke="var(--ink)" stroke-width="var(--hair)" opacity="0.55"/>';

  if(w >= 720){
    const upperBand = vpY * 0.72;
    const strays = 4;
    for(let i=0;i<strays;i++){
      const s1 = seededRand(SEED + 100 + i*3.1);
      const s2 = seededRand(SEED + 200 + i*5.7);
      const s3 = seededRand(SEED + 300 + i*2.3);
      const s4 = seededRand(SEED + 350 + i*4.9);
      const x1 = s1 * w, y1 = s2 * upperBand;
      const x2 = s3 * w, y2 = s4 * upperBand;
      if(s2 > 0.5){
        const mx = (x1+x2)/2 + (s3-0.5)*140;
        const my = (y1+y2)/2 + (s1-0.5)*70;
        lines += '<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s4*0.12).toFixed(3)+'"/>';
      } else {
        lines += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s1*0.12).toFixed(3)+'"/>';
      }
    }
  }
  svg.innerHTML = lines;
}

drawField();
let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(drawField,150); });

setTimeout(()=>{ document.getElementById('back-arrow').style.opacity='1'; }, 600);

(function(){
  var vid = document.querySelector('.full-video-wrap video');
  var btn = document.getElementById('play-btn');
  if(!vid) return;

  // same behaviour on desktop and mobile: show play button, render first frame muted
  if(btn) btn.style.display = 'block';
  vid.muted = true;
  vid.play().then(function(){ vid.pause(); vid.currentTime = 0; }).catch(function(){});

  if(btn){
    btn.addEventListener('click', function(){
      vid.muted = false;
      vid.play()
        .then(function(){ btn.classList.add('gone'); })
        .catch(function(){});
    }, { once: true });
  }
})();
</script>

<script>
(function(){
  var DFLT=0.3162;
  var s=parseFloat(localStorage.getItem('d93vol'));
  var vol=isNaN(s)?DFLT:Math.max(0,Math.min(1,s));
  var muted=localStorage.getItem('d93mute')==='1';
  var wrap=document.getElementById('d93-vol-wrap');
  var popup=document.getElementById('d93-vol-popup');
  var sl=document.getElementById('d93-vol-sl');
  var btn=document.getElementById('d93-mute-btn');
  var sp=document.getElementById('d93-spk-path');
  var ON='M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z';
  var OFF='M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  sl.value=vol;
  sp.setAttribute('d',muted?OFF:ON);
  window._d93vol=function(){ return muted?0:vol; };
  function applyAll(){
    var v=muted?0:vol;
    document.querySelectorAll('audio,video').forEach(function(el){ el.volume=v; });
  }
  document.addEventListener('play',applyAll,true);
  function openPopup(){
    var rect=wrap.getBoundingClientRect();
    if(rect.top>window.innerHeight/2){
      popup.style.top='auto'; popup.style.bottom=(wrap.offsetHeight+4)+'px';
    } else {
      popup.style.bottom='auto'; popup.style.top=(wrap.offsetHeight+4)+'px';
    }
    popup.style.display='flex';
  }
  wrap.addEventListener('mouseenter',openPopup);
  wrap.addEventListener('mouseleave',function(){ popup.style.display='none'; });
  wrap.addEventListener('touchstart',function(e){
    e.stopPropagation();
    if(!popup.contains(e.target)){ popup.style.display==='flex'?popup.style.display='none':openPopup(); }
  },{passive:true});
  document.addEventListener('touchstart',function(){ popup.style.display='none'; },{passive:true});
  sl.addEventListener('input',function(){
    vol=parseFloat(this.value); localStorage.setItem('d93vol',vol); applyAll();
  });
  btn.addEventListener('click',function(){
    muted=!muted; localStorage.setItem('d93mute',muted?'1':'0');
    sp.setAttribute('d',muted?OFF:ON); applyAll();
  });
  applyAll();
})();
</script>
</body>
</html>
