(function(){
'use strict';

/* ===== PARAMETERS ===== */
const P = {
  AUDIO_URL: 'https://daysof93-cdn.b-cdn.net/journey150bpm.mp3',

  TD_N2:   1.93,   // noise2.amp
  TD_FRAC: 0.44,   // fractal1.scale

  BASE_ROWS: 20, BASE_COLS: 20, DIV: 4, SEED: 1,

  N1_FREQ: 1.0,  N1_EXP: 0.7,   N1_K: 0.30,

  LN_FAR:  [1.0, 1.0,    1.0,   0.124],

  INTRO_SEC: 3

/* ===== RENDERER ===== */
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setClearColor(0x000000, 1);
document.body.prepend(renderer.domElement);
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(P.FOV, 1, 0.1, 1000);

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  // pt size = 0.74 × PT_DEFAULT_PX × (canvasHeight/1920) × dpr
  U.uPxBase.value = P.TD_PT * P.PT_DEFAULT_PX * (innerHeight / 1920) * dpr;
  if (typeof composer !== 'undefined') composer.setSize(innerWidth, innerHeight);
}

/* ===== GEOMETRY: sphere → fractal subdivide → 77×80 fine quad grid ===== */
function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildGeometry(){
  const rand = rng(P.SEED);
  // fine grid: FR rows (0=top pole, FR-1=bottom pole), FC cols (wrap)
  const FR = (P.BASE_ROWS - 1) * P.DIV + 1;  // 77
  const FC = P.BASE_COLS * P.DIV;              // 80
  const pos = [], grid = [], jit = [], edges = [];
  const id = (r,c) => r * FC + (c % FC);

  // scalar jitter per fine point (for vtxnms=True: jitter is along sphere normal)
  const poleJit = [rand()*2-1, rand()*2-1];   // top pole, bottom pole
  for (let r = 0; r < FR; r++){
    const r_norm = r / (FR - 1);
    const th = r_norm * Math.PI;
    for (let c = 0; c < FC; c++){
      const ph = c / FC * Math.PI * 2;
      pos.push(Math.sin(th)*Math.cos(ph), Math.cos(th), Math.sin(th)*Math.sin(ph));
      grid.push(r, c);
      // scalar in x; yz unused (normal-direction jitter uses only magnitude)
      if (r === 0)        jit.push(poleJit[0], 0, 0);
      else if (r === FR-1) jit.push(poleJit[1], 0, 0);
      else                 jit.push(rand()*2-1, 0, 0);
    }
  }

  // lines on rows/cols only; poles: no fan edges (skip r=0 and r=FR-1 row edges, skip col edges touching poles)
  for (let r = 0; r < FR; r++){
    for (let c = 0; c < FC; c++){
      if (r > 0 && r < FR-1) edges.push(id(r,c), id(r,(c+1)%FC));   // row ring (non-pole only)
      if (r > 0 && r < FR-1) edges.push(id(r,c), id(r+1,c));         // col segment (skip pole fans)
    }
  }

  const pAttr = new THREE.Float32BufferAttribute(pos, 3);
  const gAttr = new THREE.Float32BufferAttribute(grid, 2);
  const jAttr = new THREE.Float32BufferAttribute(jit, 3);
  const mk = () => { const g = new THREE.BufferGeometry();
    g.setAttribute('position', pAttr); g.setAttribute('aGrid', gAttr); g.setAttribute('aJit', jAttr); return g; };
  const gPts = mk(), gLin = mk();
  gLin.setIndex(edges);
  gPts.boundingSphere = gLin.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 50);
  return {gPts, gLin, FR, FC};
}

/* ===== SHADERS ===== */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 snoise3(vec3 p){return vec3(snoise(p),snoise(p+vec3(31.4,17.1,7.3)),snoise(p+vec3(-11.7,53.2,23.9)));}
vec3 shapeE(vec3 n,float e){return sign(n)*pow(abs(n),vec3(e));}
`;

const VERT = `
precision highp float;
uniform float uBias,uTime,uN1,uN2,uFrac,uPt,uPxBase,uNear,uSpan,uFogNear,uFogFar;
uniform float uN1Freq,uN1Exp,uN2Freq,uN2Exp,uN1K,uN2K,uFK,uBR,uBC,uDiv;
attribute vec2 aGrid; attribute vec3 aJit;
varying float vT; varying float vFog;
${NOISE}
vec3 sph(float r,float c){ float th=r/uBR*3.14159265; float ph=c/uBC*6.28318531;
  return vec3(sin(th)*cos(ph),cos(th),sin(th)*sin(ph)); }
vec3 n1(float r,float c,vec3 tz){
  vec3 q=sph(r,c)*uN1Freq+tz;
  return shapeE(0.7*snoise3(q)+0.3*snoise3(q*2.0),uN1Exp);
}
void main(){
  vec3 tz=vec3(0.0,0.0,uTime);
  // noise1: bilinear from base grid (fractal subdivision)
  vec2 b=aGrid/uDiv; vec2 b0=floor(b); vec2 f=b-b0;
  vec3 nA=n1(b0.x,b0.y,tz), nB=n1(b0.x,b0.y+1.0,tz), nC=n1(b0.x+1.0,b0.y,tz), nD=n1(b0.x+1.0,b0.y+1.0,tz);
  vec3 nz=mix(mix(nA,nB,f.y),mix(nC,nD,f.y),f.x);
  vec3 p=position+nz*uN1*uN1K;
  // fractal1 jitter along sphere normal (vtxnms=True)
  p+=normalize(p)*aJit.x*uFrac*uFK;
  // noise2
  p+=shapeE(snoise3(p*uN2Freq+tz+vec3(100.0)),uN2Exp)*uN2*uN2K;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  float d=-mv.z;
  vT=clamp((d-uNear)/uSpan+uBias,0.0,1.0);
  vFog=1.0-smoothstep(uFogNear,uFogFar,d);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=uPt*uPxBase;
}`;

// sphere-shaded point sprite (Phong-like diffuse + ambient)
const FRAG_PTS = `
precision highp float;
uniform vec4 uNearC,uFarC; uniform float uIntro;
varying float vT; varying float vFog;
void main(){
  vec2 c=gl_PointCoord-0.5;
  float r2=dot(c,c); if(r2>0.25) discard;
  float z=sqrt(0.25-r2);
  vec3 N=normalize(vec3(c.x,-c.y,z));
  vec3 L=normalize(vec3(0.6,0.8,0.7));
  float diff=max(dot(N,L),0.0)*0.75+0.25;
  vec4 col=mix(uNearC,uFarC,vT);
  float a=col.a*vFog*uIntro;
  gl_FragColor=vec4(col.rgb*diff*a,a);  // premultiplied: blendSrc=ONE requires RGB*alpha
}`;

const FRAG_LIN = `
precision highp float;
uniform vec4 uNearC,uFarC; uniform float uIntro,uLineA;
varying float vT; varying float vFog;
void main(){
  vec4 col=mix(uNearC,uFarC,vT);
  float a=col.a*vFog*uIntro*uLineA;
  gl_FragColor=vec4(col.rgb*a,a);  // premultiplied: blendSrc=ONE requires RGB*alpha
}`;

/* ===== MESH ===== */
const U = {
  uTime:{value:0}, uN1:{value:P.TD_N1}, uN2:{value:P.TD_N2}, uFrac:{value:P.TD_FRAC},
  uPt:{value:P.TD_PT}, uPxBase:{value:1}, uNear:{value:0}, uSpan:{value:P.FADE_SPAN},
  uFogNear:{value:P.FOG_NEAR}, uFogFar:{value:P.FOG_FAR},
  uN1Freq:{value:P.N1_FREQ}, uN1Exp:{value:P.N1_EXP}, uN2Freq:{value:P.N2_FREQ}, uN2Exp:{value:P.N2_EXP},
  uN1K:{value:P.N1_K}, uN2K:{value:P.N2_K}, uFK:{value:P.FRACTAL_K}, uIntro:{value:0},
  uBias:{value:P.COLOR_BIAS}, uLineA:{value:P.LINE_ALPHA},
  uBR:{value:P.BASE_ROWS}, uBC:{value:P.BASE_COLS}, uDiv:{value:P.DIV}
};
const v4 = a => new THREE.Vector4(a[0],a[1],a[2],a[3]);
const mkMat = (frag, near, far) => new THREE.ShaderMaterial({
  uniforms: Object.assign({}, U, {uNearC:{value:v4(near)}, uFarC:{value:v4(far)}}),
  vertexShader: VERT, fragmentShader: frag,
  transparent: true, depthWrite: false, depthTest: false,
  blending: THREE.CustomBlending,
  blendSrc: THREE.OneFactor,
  blendDst: THREE.OneMinusSrcAlphaFactor
});

const {gPts, gLin} = buildGeometry();
const group = new THREE.Group();
const lines  = new THREE.LineSegments(gLin, mkMat(FRAG_LIN, P.LN_NEAR, P.LN_FAR));
const points = new THREE.Points(gPts, mkMat(FRAG_PTS, P.PT_NEAR, P.PT_FAR));
lines.renderOrder = 0; points.renderOrder = 1;
group.add(lines, points);
scene.add(group);

/* ===== POST-PROCESSING ===== */

composer.addPass(new THREE.RenderPass(scene, camera));
const bloomPass = new THREE.UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.4, 0.5, 0.2);
composer.addPass(bloomPass);

function vnoise(px, py, pz) {
  const ix=Math.floor(px),iy=Math.floor(py),iz=Math.floor(pz);
  const fx=px-ix,fy=py-iy,fz=pz-iz;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy),uz=fz*fz*(3-2*fz);
  const h=(a,b,c)=>{let n=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return n-Math.floor(n);};
  return -1+2*(h(ix,iy,iz)*(1-ux)*(1-uy)*(1-uz)+h(ix+1,iy,iz)*ux*(1-uy)*(1-uz)+
    h(ix,iy+1,iz)*(1-ux)*uy*(1-uz)+h(ix+1,iy+1,iz)*ux*uy*(1-uz)+
    h(ix,iy,iz+1)*(1-ux)*(1-uy)*uz+h(ix+1,iy,iz+1)*ux*(1-uy)*uz+
    h(ix,iy+1,iz+1)*(1-ux)*uy*uz+h(ix+1,iy+1,iz+1)*ux*uy*uz);
}

const wordGroup = new THREE.Group();
scene.add(wordGroup);
let wordSprites = [], lastWordCount = -1, lastWordColor = '';

function buildWordSprites() {
  while (wordGroup.children.length) {
    const s = wordGroup.children[0];
    if (s.material.map) s.material.map.dispose();
    s.material.dispose();
    wordGroup.remove(s);
  }
  wordSprites = [];
  const count = gwords.WORD_COUNT;
  const color = gwords.WORD_COLOR;
  const rand = rng(42);
  for (let i = 0; i < count; i++) {
    const word = WORDS[Math.floor(rand() * WORDS.length)];
    const fs = 32;
    const cvs = document.createElement('canvas');
    const ctx2d = cvs.getContext('2d');
    ctx2d.font = `${fs}px 'Press Start 2P', monospace`;
    const tw = Math.ceil(ctx2d.measureText(word).width) + 8;
    const th = fs + 12;
    cvs.width = tw; cvs.height = th;
    ctx2d.font = `${fs}px 'Press Start 2P', monospace`;
    ctx2d.fillStyle = color;
    ctx2d.textBaseline = 'middle';
    ctx2d.fillText(word, 4, th / 2);
    const tex = new THREE.CanvasTexture(cvs);
    const mat = new THREE.SpriteMaterial({map:tex, transparent:true, opacity:0, depthWrite:false});
    const spr = new THREE.Sprite(mat);
    const aspect = tw / th;
    const sz = gwords.WORD_SIZE;
    spr.scale.set(aspect * sz, sz, 1);
    const angle = rand() * Math.PI * 2;
    const radius = rand() * 3.0;
    const bx = Math.cos(angle) * radius;
    const by = Math.sin(angle) * radius;
    const bz = -15 - rand() * 25;
    spr.position.set(bx, by, bz);
    spr.userData = {bx, by, bz, nx: rand()*100, ny: rand()*100, nz: rand()*100, aspect};
    wordGroup.add(spr);
    wordSprites.push(spr);
  }
  lastWordCount = count;
  lastWordColor = color;
}

/* ===== AUDIO (XHR + decodeAudioData, iOS-safe) ===== */
let actx = null, analyser = null, abuf = null, env = 0;

function playBuffer(arr){
  actx.decodeAudioData(arr, buf => {
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    analyser = actx.createAnalyser(); analyser.fftSize = 2048;
    abuf = new Float32Array(analyser.fftSize);
    src.connect(analyser); analyser.connect(actx.destination);
    src.start(0);
  });
}
function loadURL(url){
  const x = new XMLHttpRequest();
  x.open('GET', url, true); x.responseType = 'arraybuffer';
  x.onload = () => playBuffer(x.response);
  x.send();
}
function readLevel(dt){
  let ms = 0;
  if (analyser){
    analyser.getFloatTimeDomainData(abuf);
    for (let i = 0; i < abuf.length; i++) ms += abuf[i]*abuf[i];
    ms /= abuf.length;
  }
  if (ms >= env) env = ms;
  else env += (ms - env) * (1 - Math.exp(-dt / P.LAG_DOWN));
  return env;
}

const startEl = document.getElementById('start');
const fileEl  = document.getElementById('file');
startEl.addEventListener('click', () => {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  if (P.AUDIO_URL) loadURL(P.AUDIO_URL);
  else fileEl.click();
  startEl.style.display = 'none';
  introStart = performance.now();
});
fileEl.addEventListener('change', () => {
  const f = fileEl.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => playBuffer(r.result);
  r.readAsArrayBuffer(f);
});

/* ===== SCROLL → CAMERA ===== */
let target = 0, prog = 0, introStart = null;
addEventListener('wheel', e => {
  e.preventDefault();
  target = Math.min(1, Math.max(0, target + e.deltaY / P.SCROLL_PX));
}, {passive:false});
let ty = null;
addEventListener('touchstart', e => { ty = e.touches[0].clientY; }, {passive:true});
addEventListener('touchmove', e => {
  e.preventDefault();
  const y = e.touches[0].clientY;
  target = Math.min(1, Math.max(0, target + (ty - y) * P.TOUCH_K / P.SCROLL_PX));
  ty = y;
}, {passive:false});

const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2;
const look = new THREE.Vector3();

/* ===== LOOP ===== */
const t0 = performance.now(); let last = t0;
function frame(now){
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = (now - t0) / 1000;

  // base amplitudes always at TD constants; audio modulates the K/scale multipliers via GUI
  U.uN1.value   = P.TD_N1;
  U.uN2.value   = P.TD_N2;
  U.uFrac.value = P.TD_FRAC;
  const rawLevel = readLevel(dt);
  U.uTime.value = t * gfx.SPEED;
  U.uIntro.value = introStart === null ? 0.6 : Math.min(1, 0.6 + (now - introStart) / 1000 / P.INTRO_SEC);

  group.rotation.y = THREE.MathUtils.degToRad(t * 60 * P.ROT_DEG_PER_FRAME);

  prog += (target - prog) * P.CAM_EASE;
  const e = ease(prog), s = P.CAM_START;
  camera.position.set(s[0]*(1-e) + Math.sin(t*0.31)*0.04,
                      s[1]*(1-e) + Math.sin(t*0.23)*0.03,
                      s[2] + (P.CAM_END_Z - s[2]) * e);
  look.set(0, 0, camera.position.z - 5);
  if (e < 0.5) look.lerp(new THREE.Vector3(0,0,0), 1 - e*2);
  camera.lookAt(look);

  U.uNear.value = Math.max(0, camera.position.length() - P.MESH_RADIUS);

  // GUI faders → uniforms (every frame)
  U.uN2K.value     = gfx.N2_K;
  U.uLineA.value   = glines.LINE_ALPHA;
  lines.material.linewidth = glines.LINE_WIDTH; // no-op on most WebGL impls; wire kept for future

  const nc = points.material.uniforms.uNearC.value;
  const hex = gpts.PT_COLOR.replace('#','');
  nc.x = parseInt(hex.slice(0,2),16)/255;
  nc.y = parseInt(hex.slice(2,4),16)/255;
  nc.z = parseInt(hex.slice(4,6),16)/255;
  nc.w = gpts.PT_ALPHA;

  // audio modulates N1_K, FRAC_K, PT_SCALE, N1_FREQ when AUDIO_ON; otherwise use GUI values directly
  if (gaudio.AUDIO_ON) {
    const thresh = gaudio.AUDIO_THRESH;
    const amod = Math.max(0, (rawLevel - thresh) / Math.max(0.001, 1 - thresh));
    U.uN1K.value    = gfx.N1_K    * (1 + amod * 8);
    U.uFK.value     = gfx.FRAC_K  * (1 + amod * 3);
    U.uPt.value     = gpts.PT_SCALE * (1 + amod * 2);
    U.uN1Freq.value = gfx.N1_FREQ + amod * gaudio.AUDIO_FREQ_MOD;
  } else {
    U.uN1K.value    = gfx.N1_K;
    U.uFK.value     = gfx.FRAC_K;
    U.uPt.value     = gpts.PT_SCALE;
    U.uN1Freq.value = gfx.N1_FREQ;
  }

  U.uFogNear.value = gatmos.FOG_NEAR;
  U.uFogFar.value  = gatmos.FOG_FAR;

  // ENGINE 2: Binary Scatter Words
  wordGroup.visible = gwords.WORDS_ON;
  if (gwords.WORDS_ON) {
    if (gwords.WORD_COUNT !== lastWordCount || gwords.WORD_COLOR !== lastWordColor) {
      buildWordSprites();
    }
    if (wordSprites.length > 0) {
      const camZ = camera.position.z;
      const zoneFade = Math.min(1, Math.max(0, -camZ / 8));
      const noiseK  = gwords.WORD_NOISE / 50;
      const timeN   = t * gwords.WORD_SPEED / 100;
      const sz      = gwords.WORD_SIZE;
      const targetOp = gwords.WORD_OPACITY * zoneFade;
      for (let i = 0; i < wordSprites.length; i++) {
        const s = wordSprites[i];
        const ud = s.userData;
        s.position.x = ud.bx + vnoise(ud.nx + timeN, 0, 0) * noiseK;
        s.position.y = ud.by + vnoise(0, ud.ny + timeN, 0) * noiseK;
        s.scale.set(ud.aspect * sz, sz, 1);
        s.material.opacity = targetOp;
      }
    }
  }

  if (gbloom.BLOOM_ON) {
    bloomPass.strength  = gbloom.BLOOM_STRENGTH;
    bloomPass.radius    = gbloom.BLOOM_RADIUS;
    bloomPass.threshold = gbloom.BLOOM_THRESHOLD;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
