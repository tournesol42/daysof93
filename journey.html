  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildGeometry(rows, cols, div, seed, showRows, showCols){
  const rand = rng(seed);
  // fine grid: FR rows (0=top pole, FR-1=bottom pole), FC cols (wrap)
  const FR = (rows - 1) * div + 1;
  const FC = cols * div;
  const pos = [], grid = [], jit = [], edges = [];
  const id = (r,c) => r * FC + (c % FC);

  // scalar jitter per fine point (for vtxnms=True: jitter is along sphere normal)
  const poleJit = [rand()*2-1, rand()*2-1];   // top pole, bottom pole
  for (let r = 0; r < FR; r++){
    const r_norm = r / (FR - 1);
    const th = r_norm * Math.PI;
    for (let c = 0; c < FC; c++){
      const ph = c / FC * Math.PI * 2;
      pos.push(Math.sin(th)*Math.cos(ph), Math.cos(th), Math.sin(th)*Math.sin(ph));
      grid.push(r, c);
      // scalar in x; yz unused (normal-direction jitter uses only magnitude)
      if (r === 0)        jit.push(poleJit[0], 0, 0);
      else if (r === FR-1) jit.push(poleJit[1], 0, 0);
      else                 jit.push(rand()*2-1, 0, 0);
    }
  }

  // lines on rows/cols only; poles: no fan edges (skip r=0 and r=FR-1 row edges, skip col edges touching poles)
  for (let r = 0; r < FR; r++){
    for (let c = 0; c < FC; c++){
      if (showRows && r > 0 && r < FR-1) edges.push(id(r,c), id(r,(c+1)%FC));
      if (showCols && r > 0 && r < FR-1) edges.push(id(r,c), id(r+1,c));
    }
  }

  const pAttr = new THREE.Float32BufferAttribute(pos, 3);
  const gAttr = new THREE.Float32BufferAttribute(grid, 2);
  const jAttr = new THREE.Float32BufferAttribute(jit, 3);
  const mk = () => { const g = new THREE.BufferGeometry();
    g.setAttribute('position', pAttr); g.setAttribute('aGrid', gAttr); g.setAttribute('aJit', jAttr); return g; };
  const gPts = mk(), gLin = mk();
  gLin.setIndex(edges);
  gPts.boundingSphere = gLin.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 50);
  return {gPts, gLin, FR, FC};
}

/* ===== SHADERS ===== */
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy; i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 snoise3(vec3 p){return vec3(snoise(p),snoise(p+vec3(31.4,17.1,7.3)),snoise(p+vec3(-11.7,53.2,23.9)));}
vec3 shapeE(vec3 n,float e){return sign(n)*pow(abs(n),vec3(e));}
`;

const VERT = `
precision highp float;
uniform float uBias,uTime,uN1,uN2,uFrac,uPt,uPxBase,uNear,uSpan,uFogNear,uFogFar;
uniform float uN1Freq,uN1Exp,uN2Freq,uN2Exp,uN1K,uN2K,uFK,uBR,uBC,uDiv;
attribute vec2 aGrid; attribute vec3 aJit;
varying float vT; varying float vFog;
${NOISE}
vec3 sph(float r,float c){ float th=r/uBR*3.14159265; float ph=c/uBC*6.28318531;
  return vec3(sin(th)*cos(ph),cos(th),sin(th)*sin(ph)); }
vec3 n1(float r,float c,vec3 tz){
  vec3 q=sph(r,c)*uN1Freq+tz;
  return shapeE(0.7*snoise3(q)+0.3*snoise3(q*2.0),uN1Exp);
}
void main(){
  vec3 tz=vec3(0.0,0.0,uTime);
  // noise1: bilinear from base grid (fractal subdivision)
  vec2 b=aGrid/uDiv; vec2 b0=floor(b); vec2 f=b-b0;
  vec3 nA=n1(b0.x,b0.y,tz), nB=n1(b0.x,b0.y+1.0,tz), nC=n1(b0.x+1.0,b0.y,tz), nD=n1(b0.x+1.0,b0.y+1.0,tz);
  vec3 nz=mix(mix(nA,nB,f.y),mix(nC,nD,f.y),f.x);
  vec3 p=position+nz*uN1*uN1K;
  // fractal1 jitter along sphere normal (vtxnms=True)
  p+=normalize(p)*aJit.x*uFrac*uFK;
  // noise2
  p+=shapeE(snoise3(p*uN2Freq+tz+vec3(100.0)),uN2Exp)*uN2*uN2K;
  vec4 mv=modelViewMatrix*vec4(p,1.0);
  float d=-mv.z;
  vT=clamp((d-uNear)/uSpan+uBias,0.0,1.0);
  vFog=1.0-smoothstep(uFogNear,uFogFar,d);
  gl_Position=projectionMatrix*mv;
  gl_PointSize=uPt*uPxBase;
}`;

const FRAG_PTS = `
precision highp float;
uniform vec4 uNearC,uFarC; uniform float uIntro;
varying float vT; varying float vFog;
void main(){
  vec2 c=gl_PointCoord-0.5;
  float r2=dot(c,c); if(r2>0.25) discard;
  float z=sqrt(0.25-r2);
  vec3 N=normalize(vec3(c.x,-c.y,z));
  vec3 L=normalize(vec3(0.6,0.8,0.7));
  float diff=max(dot(N,L),0.0)*0.75+0.25;
  vec4 col=mix(uNearC,uFarC,vT);
  float a=col.a*vFog*uIntro;
  gl_FragColor=vec4(col.rgb*diff*a,a);  // premultiplied: blendSrc=ONE requires RGB*alpha
}`;

const gs2 = {
  S2_ON: true,
  COUNT: 21, WIN: 322,
  SMIN: 120, SMAX: 120, SBIAS: 83,
  OPACITY: 100, OP_SPREAD: 40,
  NOISE_AMT: 11, NOISE_SPD: 1230, NOISE_MOD: 23,
  TEXT_COLOR: '#F4F4F4',
  FOCUS_CX: 0.7930817610062892,
  LINES_ON: true, LINES_MAX_DIST: 343, LINES_MAX_PER: 3,
  LINES_DUR: 203, LINES_OPAC: 46,
  S2_AUDIO_NOISE: 3, S2_AUDIO_SIZE: 0.3, S2_AUDIO_LINES: 1.5,
};

function gaussRand2() {
  const u = 1 - Math.random(), v = 1 - Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}
function lerp2(a, b, t) { return a + (b - a) * t; }
function biasExp2(slider) {
  if (slider <= 50) return 4.0 - (slider / 50) * 3.0;
  return 1.0 - ((slider - 50) / 50) * 0.75;
}
function sizeSample2(sMin, sMax, bExp) {
  return Math.round(sMin + Math.pow(Math.random(), bExp) * (sMax - sMin));
}

let s2pts = [], s2conns = [], s2anim = 0, s2LastMS = null, s2ConnLastMS = 0;

function makePoints2() {
  const bExp = biasExp2(gs2.SBIAS);
  const attract = 2 / 100;
  s2pts = Array.from({ length: gs2.COUNT }, () => {
    const rx = Math.random(), ry = Math.random();
    const ox2 = gs2.FOCUS_CX, oy2 = Math.random();
    const jitter = 0.018 * (1 - attract * 0.4);
    const bx = Math.max(0, Math.min(1, lerp2(rx, ox2, attract) + gaussRand2() * jitter));
    const by = Math.max(0, Math.min(1, lerp2(ry, oy2, attract) + gaussRand2() * jitter));
    return {
      bx, by,
      ox: Math.random() * 64,
      oy: Math.random() * 64,
      sz: sizeSample2(gs2.SMIN, gs2.SMAX, bExp),
      opacityRand: Math.random(),
      noiseMod: Math.random(),
    };
  });
  s2conns = [];
}
makePoints2();

const S2_CW = 1080, S2_CH = 1920;

s2Canvas.width  = S2_CW; s2Canvas.height = S2_CH;

function drawScatter2(ms, opacity) {
  if (s2LastMS === null) s2LastMS = ms;
  const dt = Math.min((ms - s2LastMS) / 1000, 0.05);
  s2LastMS = ms;

  s2ctx.clearRect(0, 0, S2_CW, S2_CH);

  const noiseAmt    = gs2.NOISE_AMT / 100;
  const noiseSpd    = gs2.NOISE_SPD / 100;
  const noiseModAmt = gs2.NOISE_MOD / 100;
  const gOpacity    = gs2.OPACITY / 100;
  const opSpread    = gs2.OP_SPREAD / 100;
  const textCol     = gs2.TEXT_COLOR;

  s2anim += dt * noiseSpd * 1.8;

  const aDispMax  = noiseAmt * 120 * (1 + lastAmod * gs2.S2_AUDIO_NOISE);

  s2ctx.fillStyle    = textCol;
  s2ctx.textBaseline = 'middle';
  s2ctx.textAlign    = 'left';

  for (let i = 0; i < s2pts.length; i++) {
    const wi = gs2.WIN + i;
    if (wi >= WORDS.length) continue;
    const word = WORDS[wi];
    if (!word) continue;
    const p = s2pts[i];
    const nx   = vnoise2(p.ox + s2anim * 0.6, p.oy + 17.3      ) * 2 - 1;
    const ny   = vnoise2(p.ox + 31.7,         p.oy + s2anim * 0.6) * 2 - 1;
    const nMod = 1 + ((p.noiseMod - 0.5) * noiseModAmt * 2);
    const fsz  = Math.max(4, Math.round(p.sz * (1 + lastAmod * gs2.S2_AUDIO_SIZE)));
    s2ctx.font        = fsz + "px 'DigitTech9', 'Courier New', monospace";
    s2ctx.globalAlpha = Math.max(0.01, Math.min(1, gOpacity + (p.opacityRand - 0.5) * opSpread)) * opacity;
    s2ctx.fillText(word, p.bx * S2_CW + nx * aDispMax * nMod, p.by * S2_CH + ny * aDispMax * nMod);
  }
  s2ctx.globalAlpha = 1;

  if (gs2.LINES_ON && s2pts.length > 1) {
    const now     = ms;
    const maxDist = gs2.LINES_MAX_DIST;
    const maxPer  = gs2.LINES_MAX_PER;
    const durMs   = gs2.LINES_DUR * 16;
    const lMaxOp  = Math.min(1, (gs2.LINES_OPAC / 100) * (1 + lastAmod * gs2.S2_AUDIO_LINES));

    if (now - s2ConnLastMS > 48) {
      s2ConnLastMS = now;
      const used  = new Map();
      const cands = [];
      for (let a = 0; a < s2pts.length; a++) {
        const pa = s2pts[a];
        const ax = pa.bx * S2_CW + (vnoise2(pa.ox + s2anim * 0.6, pa.oy + 17.3      ) * 2 - 1) * aDispMax;
        const ay = pa.by * S2_CH + (vnoise2(pa.ox + 31.7,          pa.oy + s2anim * 0.6) * 2 - 1) * aDispMax;
        for (let b = a + 1; b < s2pts.length; b++) {
          const pb = s2pts[b];
          const bx = pb.bx * S2_CW + (vnoise2(pb.ox + s2anim * 0.6, pb.oy + 17.3      ) * 2 - 1) * aDispMax;
          const by = pb.by * S2_CH + (vnoise2(pb.ox + 31.7,          pb.oy + s2anim * 0.6) * 2 - 1) * aDispMax;
          const ddx = ax - bx, ddy = ay - by;
          const dist = Math.sqrt(ddx * ddx + ddy * ddy);
          if (dist < maxDist) cands.push({a, b, dist});
        }
      }
      cands.sort(function(x, y) { return x.dist - y.dist; });
      for (let k = 0; k < cands.length; k++) {
        const c = cands[k], a = c.a, b = c.b;
        const ca = used.get(a) || 0, cb = used.get(b) || 0;
        if (ca >= maxPer || cb >= maxPer) continue;
        let already = false;
        for (let m = 0; m < s2conns.length; m++) {
          const sc = s2conns[m];
          if ((sc.i === a && sc.j === b) || (sc.i === b && sc.j === a)) { already = true; break; }
        }
        if (already) continue;
        s2conns.push({i: a, j: b, born: now,
          dur: durMs * (0.7 + Math.random() * 0.6),
          maxOpacity: lMaxOp * (0.4 + Math.random() * 0.6)});
        used.set(a, ca + 1);
        used.set(b, cb + 1);
      }
    }

    s2ctx.strokeStyle = textCol;
    s2ctx.lineWidth   = 0.75;
    s2conns = s2conns.filter(function(c) {
      const age = now - c.born;
      if (age > c.dur) return false;
      const tl  = age / c.dur;
      const opT = tl < 0.15 ? tl / 0.15 : tl > 0.6 ? 1 - (tl - 0.6) / 0.4 : 1;
      const pa  = s2pts[c.i], pb = s2pts[c.j];
      if (!pa || !pb) return false;
      const ax = pa.bx * S2_CW + (vnoise2(pa.ox + s2anim * 0.6, pa.oy + 17.3      ) * 2 - 1) * aDispMax;
      const ay = pa.by * S2_CH + (vnoise2(pa.ox + 31.7,          pa.oy + s2anim * 0.6) * 2 - 1) * aDispMax;
      const bx = pb.bx * S2_CW + (vnoise2(pb.ox + s2anim * 0.6, pb.oy + 17.3      ) * 2 - 1) * aDispMax;
      const by = pb.by * S2_CH + (vnoise2(pb.ox + 31.7,          pb.oy + s2anim * 0.6) * 2 - 1) * aDispMax;
      s2ctx.globalAlpha = c.maxOpacity * opT * opacity;
      s2ctx.beginPath(); s2ctx.moveTo(ax, ay); s2ctx.lineTo(bx, by); s2ctx.stroke();
      return true;
    });
    s2ctx.globalAlpha = 1;
  }
}

/* ===== ENGINE 2: 2D BINARY SCATTER CANVAS ===== */
const PERM = new Uint8Array(512);
const NVAL = new Float32Array(256);
(function buildNoise() {
  for (let i = 0; i < 256; i++) PERM[i] = i;
  for (let i = 255; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const tmp = PERM[i]; PERM[i] = PERM[j]; PERM[j] = tmp;
  }
  for (let i = 0; i < 256; i++) { PERM[i + 256] = PERM[i]; NVAL[i] = Math.random(); }
})();
function vnoise2(x, y) {
  const xi = Math.floor(x) & 255, yi = Math.floor(y) & 255;
  const xf = (function(t){return t*t*t*(t*(t*6-15)+10);})(x - Math.floor(x));
  const yf = (function(t){return t*t*t*(t*(t*6-15)+10);})(y - Math.floor(y));
  const aa = NVAL[PERM[PERM[xi]     + yi    ]];
  const ba = NVAL[PERM[PERM[xi + 1] + yi    ]];
  const ab = NVAL[PERM[PERM[xi]     + yi + 1]];
  const bb = NVAL[PERM[PERM[xi + 1] + yi + 1]];
  return (aa + (ba - aa) * xf) + ((ab - aa + (aa - ab - ba + bb) * xf) * yf);
}

function makeScatterPoints(count) {
  const smin = gwords.WORD_SIZE_MIN;
  const smax = Math.max(smin + 1, gwords.WORD_SIZE_MAX);
  scatterPts = Array.from({length: count}, () => ({
    bx: Math.random(), by: Math.random(),
    ox: Math.random() * 64, oy: Math.random() * 64,
    sz: Math.round(smin + Math.random() * (smax - smin)),
    opacityRand: Math.random(),
    wordIdx: (Math.random() * WORDS.length) | 0,
  }));
  scatterConns = [];
}

function drawScatter(ms) {
  if (scatterLastMS === null) scatterLastMS = ms;
  const dt = Math.min((ms - scatterLastMS) / 1000, 0.05);
  scatterLastMS = ms;

  // use CSS pixel dimensions (sctx transform handles DPR)
  const W = innerWidth, H = innerHeight;
  sctx.clearRect(0, 0, W, H);

  // depth scale: 0.05 when cam Z = -6 → 1.0 when cam Z = -35
  const camZs    = camera.position.z;
  const s        = Math.min(1.0, Math.max(0.05, 0.05 + 0.95 * (-camZs - 6) / 29));
  // zone fade in: 0 at camZ > -2, ramps to 1 at camZ < -6
  const zoneFade = Math.min(1, Math.max(0, (-camZs - 2) / 4));
  // scatter fade out: 1 at camZ > -28, ramps to 0 at camZ < -32
  const scatterFade = Math.min(1, Math.max(0, (camZs + 32) / 4));
  const combinedFade = zoneFade * scatterFade;

  const noiseAmt = gwords.WORD_NOISE / 100;
  const noiseSpd = gwords.WORD_SPEED / 100;
  const dispMax  = noiseAmt * Math.min(W, H) * 0.12 * s * (1 + lastAmod * gwords.WORD_AUDIO_NOISE);
  const gOpacity = gwords.WORD_OPACITY / 100;
  const opSpread = 0.49;
  const textCol  = gwords.WORD_COLOR;

  scatterAnim += dt * noiseSpd * 1.8;

  // ── words + lines — only when in scroll zone ─────────────────────────────
  if (gwords.WORDS_ON && scatterPts.length > 0 && combinedFade > 0) {
    sctx.textBaseline = 'middle';
    sctx.textAlign    = 'left';
    sctx.fillStyle    = textCol;

    for (let i = 0; i < scatterPts.length; i++) {
      const p    = scatterPts[i];
      const word = WORDS[p.wordIdx];
      const nx   = vnoise2(p.ox + scatterAnim * 0.6, p.oy + 17.3) * 2 - 1;
      const ny   = vnoise2(p.ox + 31.7, p.oy + scatterAnim * 0.6) * 2 - 1;
      const px   = (0.5 + (p.bx - 0.5) * s) * W + nx * dispMax;
      const py   = (0.5 + (p.by - 0.5) * s) * H + ny * dispMax;
      const fsz  = Math.max(4, Math.round(p.sz * s * (1 + lastAmod * gwords.WORD_AUDIO_SIZE)));
      sctx.font        = fsz + "px 'VectorBattle', 'Courier New', monospace";
      sctx.globalAlpha = Math.min(1, Math.max(0, gOpacity + (p.opacityRand - 0.5) * opSpread)) * combinedFade;
      sctx.fillText(word, px, py);
    }
    sctx.globalAlpha = 1;

    if (gwords.LINES_ON && scatterPts.length > 1) {
      const now     = ms;
      const maxDist = Math.min(W, H) * 0.25 * s;
      const maxPer  = 2;
      const durMs   = 1664;
      const lMaxOp  = Math.min(1, (gwords.LINES_OPACITY / 100) * (1 + lastAmod * gwords.WORD_AUDIO_LINES));

      if (now - scatterConnLastMS > 48) {
        scatterConnLastMS = now;
        const used  = new Map();
        const cands = [];
        for (let a = 0; a < scatterPts.length; a++) {
          const pa = scatterPts[a];
          const ax = (0.5 + (pa.bx - 0.5) * s) * W + (vnoise2(pa.ox + scatterAnim * 0.6, pa.oy + 17.3) * 2 - 1) * dispMax;
          const ay = (0.5 + (pa.by - 0.5) * s) * H + (vnoise2(pa.ox + 31.7, pa.oy + scatterAnim * 0.6) * 2 - 1) * dispMax;
          for (let b = a + 1; b < scatterPts.length; b++) {
            const pb = scatterPts[b];
            const bx = (0.5 + (pb.bx - 0.5) * s) * W + (vnoise2(pb.ox + scatterAnim * 0.6, pb.oy + 17.3) * 2 - 1) * dispMax;
            const by = (0.5 + (pb.by - 0.5) * s) * H + (vnoise2(pb.ox + 31.7, pb.oy + scatterAnim * 0.6) * 2 - 1) * dispMax;
            const ddx = ax - bx, ddy = ay - by;
            const dist = Math.sqrt(ddx * ddx + ddy * ddy);
            if (dist < maxDist) cands.push({a, b, dist});
          }
        }
        cands.sort(function(x, y) { return x.dist - y.dist; });
        for (let k = 0; k < cands.length; k++) {
          const c = cands[k], a = c.a, b = c.b;
          const ca = used.get(a) || 0, cb = used.get(b) || 0;
          if (ca >= maxPer || cb >= maxPer) continue;
          let already = false;
          for (let m = 0; m < scatterConns.length; m++) {
            const sc = scatterConns[m];
            if ((sc.i === a && sc.j === b) || (sc.i === b && sc.j === a)) { already = true; break; }
          }
          if (already) continue;
          scatterConns.push({i: a, j: b, born: now,
            dur: durMs * (0.7 + Math.random() * 0.6),
            maxOpacity: lMaxOp * (0.4 + Math.random() * 0.6)});
          used.set(a, ca + 1);
          used.set(b, cb + 1);
        }
      }

      sctx.strokeStyle = textCol;
      sctx.lineWidth   = 0.75;
      scatterConns = scatterConns.filter(function(c) {
        const age = now - c.born;
        if (age > c.dur) return false;
        const tl  = age / c.dur;
        const opT = tl < 0.15 ? tl / 0.15 : tl > 0.6 ? 1 - (tl - 0.6) / 0.4 : 1;
        const pa  = scatterPts[c.i], pb = scatterPts[c.j];
        if (!pa || !pb) return false;
        const ax = (0.5 + (pa.bx - 0.5) * s) * W + (vnoise2(pa.ox + scatterAnim * 0.6, pa.oy + 17.3) * 2 - 1) * dispMax;
        const ay = (0.5 + (pa.by - 0.5) * s) * H + (vnoise2(pa.ox + 31.7, pa.oy + scatterAnim * 0.6) * 2 - 1) * dispMax;
        const bx = (0.5 + (pb.bx - 0.5) * s) * W + (vnoise2(pb.ox + scatterAnim * 0.6, pb.oy + 17.3) * 2 - 1) * dispMax;
        const by = (0.5 + (pb.by - 0.5) * s) * H + (vnoise2(pb.ox + 31.7, pb.oy + scatterAnim * 0.6) * 2 - 1) * dispMax;
        sctx.globalAlpha = c.maxOpacity * opT * combinedFade;
        sctx.beginPath();
        sctx.moveTo(ax, ay);
        sctx.lineTo(bx, by);
        sctx.stroke();
        return true;
      });
      sctx.globalAlpha = 1;
    }
  }

  requestAnimationFrame(drawScatter);
}


/* ===== AUDIO (XHR + decodeAudioData, iOS-safe) ===== */
let actx = null, analyser = null, abuf = null, env = 0, smoothTarget = 0, freqEnv = 0, audioStartTime = null, lastAmod = 0;

function playBuffer(arr){
  actx.decodeAudioData(arr, buf => {
    const src = actx.createBufferSource();
    src.buffer = buf; src.loop = true;
    src.loopStart = 0; src.loopEnd = LOOP_SEC;
    analyser = actx.createAnalyser(); analyser.fftSize = 2048;
    abuf = new Float32Array(analyser.fftSize);
    src.connect(analyser); analyser.connect(actx.destination);
    audioStartTime = actx.currentTime;
    src.start(0);
  });
}
function loadURL(url){
  const x = new XMLHttpRequest();
  x.open('GET', url, true); x.responseType = 'arraybuffer';
  x.onload = () => playBuffer(x.response);
  x.send();
}
function musicBeat(){ return actx && audioStartTime != null ? ((actx.currentTime - audioStartTime) % LOOP_SEC) / BEAT_SEC : 0; }
function readLevel(dt){
  let rms = 0;
  if (analyser){
    analyser.getFloatTimeDomainData(abuf);
    for (let i = 0; i < abuf.length; i++) rms += abuf[i]*abuf[i];
    rms = Math.sqrt(rms / abuf.length);
  }
  const db     = 20 * Math.log10(Math.max(rms, 1e-6));
  const over   = Math.max(0, db - gaudio.AUDIO_THRESH_DB);
  const target = gaudio.AUDIO_GAIN * (over / gaudio.AUDIO_RATIO) / 10;
  // pre-smooth target before attack/release
  const smoothMs = gaudio.AUDIO_SMOOTH_MS;
  if (smoothMs > 0) smoothTarget += (target - smoothTarget) * (1 - Math.exp(-dt / (smoothMs / 1000)));
  else              smoothTarget = target;
  if (smoothTarget > env) env += (smoothTarget - env) * (1 - Math.exp(-dt / (gaudio.AUDIO_ATTACK_MS  / 1000)));
  else                    env += (smoothTarget - env) * (1 - Math.exp(-dt / (gaudio.AUDIO_RELEASE_MS / 1000)));
  // separate slow envelope for frequency modulation
  const freqSmoothMs = gaudio.AUDIO_FREQ_SMOOTH_MS;
  if (freqSmoothMs > 0) freqEnv += (env - freqEnv) * (1 - Math.exp(-dt / (freqSmoothMs / 1000)));
  else                  freqEnv = env;
  return env;
}

varying vec3 vWorldPos;
uniform float uDustSize;
void main(){
  vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
  gl_PointSize = uDustSize;
}`;
const DUST_FRAG = `
varying vec3 vWorldPos;
uniform float uDustAlpha;
uniform vec3  uCamPos;
uniform float uNearFade;
uniform float uFar;
void main(){
  if(dot(gl_PointCoord-0.5,gl_PointCoord-0.5)>0.25) discard;
  float d = distance(vWorldPos, uCamPos);
  float fi = smoothstep(0.2, 1.5, d);
  float fo = 1.0 - smoothstep(uNearFade, uFar, d);
  gl_FragColor = vec4(1.0,1.0,1.0, uDustAlpha * fi * fo);
}`;
const RING_VERT = `
varying vec3 vWorldPos;
void main(){
  vWorldPos = (modelMatrix * vec4(position,1.0)).xyz;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}`;

varying vec3 vWorldPos;
uniform float uRingsAlpha;
uniform vec3  uCamPos;
uniform float uNearFade;
uniform float uFar;
void main(){
  float d = distance(vWorldPos, uCamPos);
  float fi = smoothstep(0.2, 1.5, d);
  float fo = 1.0 - smoothstep(uNearFade, uFar, d);
  gl_FragColor = vec4(1.0,1.0,1.0, uRingsAlpha * fi * fo);
}`;

// seeded RNG (mulberry32) — always produces the same sequence
function rng55(){
  let s = 55;
  return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ===== GUIDE LINES ===== */
function rng91fn(){
  let s = 91;
  return function(){ s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const gg = {
  GUIDE_ON: true, GUIDE_COUNT: 321, GUIDE_OFF_MIN: 0.03, GUIDE_OFF_MAX: 0.12,
  GUIDE_ORTHO: true, GUIDE_LEN_VAR: 0.5, GUIDE_EXTEND: 0.08,
  GUIDE_ALPHA: 0.42, GUIDE_VIBRATE: 0, GUIDE_COLOR: '#DE600D'
};
let guideLines    = null;
let guideMat      = null;
let guideBasePos  = null;
let guideSpeeds   = null;
let guidePhases   = null;
let guideCount5   = 0;

function buildGuides(){
  if (guideLines){ guideLines.geometry.dispose(); group5.remove(guideLines); guideLines = null; }
  guideMat = null; guideBasePos = null; guideSpeeds = null; guidePhases = null; guideCount5 = 0;
  if (!glbScene || !group5Beams.length) return;
  const rng = rng91fn();
  // collect unique edge vertices in group5-local space + find Y extent
  const seen = new Set();
  const verts = [];
  let meshYMin = Infinity, meshYMax = -Infinity;
  for (const b of group5Beams){
    const epa = b.lines.geometry.attributes.position;
    for (let vi = 0; vi < epa.count; vi++){
      const vx = epa.getX(vi), vy = epa.getY(vi), vz = epa.getZ(vi);
      const gv = new THREE.Vector3(vx, vy, vz).applyMatrix4(b.baseMat);
      const key = gv.x.toFixed(4)+','+gv.y.toFixed(4)+','+gv.z.toFixed(4);
      if (seen.has(key)) continue;
      seen.add(key);
      verts.push(gv);
      if (gv.y < meshYMin) meshYMin = gv.y;
      if (gv.y > meshYMax) meshYMax = gv.y;
    }
  }
  if (!verts.length) return;
  const meshSpan = meshYMax - meshYMin;
  const extend   = meshSpan * gg.GUIDE_EXTEND;
  const yLow     = meshYMin - extend / 2;
  const span     = meshSpan * (1 + gg.GUIDE_EXTEND);
  const count    = gg.GUIDE_COUNT;
  const base     = new Float32Array(count * 6);
  const spds     = new Float32Array(count);
  const phs      = new Float32Array(count * 3);
  for (let i = 0; i < count; i++){
    const v   = verts[Math.floor(i / count * verts.length)];
    const mag = gg.GUIDE_OFF_MIN + rng() * (gg.GUIDE_OFF_MAX - gg.GUIDE_OFF_MIN);
    let ox, oz;
    if (gg.GUIDE_ORTHO){
      const dir = Math.floor(rng() * 4);
      ox = dir === 0 ? mag : dir === 1 ? -mag : 0;
      oz = dir === 2 ? mag : dir === 3 ? -mag : 0;
    } else {
      const angle = rng() * Math.PI * 2;
      ox = Math.cos(angle) * mag; oz = Math.sin(angle) * mag;
    }
    const len    = span * (1 - rng() * gg.GUIDE_LEN_VAR);
    const yRoom  = Math.max(0, span - len);
    const yStart = yLow + rng() * yRoom;
    const bx = v.x + ox, bz = v.z + oz;
    const i6 = i * 6;
    base[i6]   = bx; base[i6+1] = yStart;     base[i6+2] = bz;
    base[i6+3] = bx; base[i6+4] = yStart+len; base[i6+5] = bz;
    spds[i] = 0.7 + rng() * 0.6;
    const i3 = i * 3;
    phs[i3] = rng()*Math.PI*2; phs[i3+1] = rng()*Math.PI*2; phs[i3+2] = rng()*Math.PI*2;
  }
  guideBasePos = base;
  guideSpeeds  = spds;
  guidePhases  = phs;
  guideCount5  = count;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(base.slice(), 3));
  guideMat = new THREE.LineBasicMaterial({
    color: new THREE.Color(gg.GUIDE_COLOR), transparent: true, opacity: 0,
    depthWrite: false, depthTest: true
  });
  guideLines = new THREE.LineSegments(geo, guideMat);
  group5.add(guideLines);
}

function buildMesh5(){
  while(group5.children.length){
    const c = group5.children[0];
    if(c.geometry) c.geometry.dispose();
    group5.remove(c);
  }
  group5Mats = [];
  group5SolidMats = [];
  group5Beams = [];
  if(!glbScene) return;
  glbScene.updateMatrixWorld(true);
  glbScene.traverse(obj => {
    if(!obj.isMesh) return;
    // solid mesh
    const solidMat = new THREE.MeshLambertMaterial({
      color: new THREE.Color(g5m.SOLID_COLOR),
      transparent: true, opacity: 0, depthWrite: true,
      flatShading: true,
      polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
    });
    const solidMesh = new THREE.Mesh(obj.geometry, solidMat);
    solidMesh.matrixAutoUpdate = false;
    solidMesh.matrix.copy(obj.matrixWorld);
    group5.add(solidMesh);
    group5SolidMats.push(solidMat);
    // edge lines (render on top)
    const edgesGeo = new THREE.EdgesGeometry(obj.geometry, g5m.MESH_EDGE_ANGLE);
    const mat = new THREE.LineBasicMaterial({
      color: new THREE.Color(g5m.MESH_COLOR),
      transparent: true, opacity: 0, depthWrite: false
    });
    const lines = new THREE.LineSegments(edgesGeo, mat);
    lines.matrixAutoUpdate = false;
    lines.matrix.copy(obj.matrixWorld);
    group5.add(lines);
    group5Mats.push(mat);
    // vibration seed — deterministic per-beam random data
    const beamIdx = group5Beams.length;
    group5Beams.push({
      lines, solid: solidMesh,
      baseMat: obj.matrixWorld.clone(),
      speed:  0.7 + _rng() * 0.6,
      phase1: _rng() * Math.PI * 2,
      phase2: _rng() * Math.PI * 2,
      phase3: _rng() * Math.PI * 2,
      vdx: 0, vdz: 0
    });
  });
  buildGuides();
}

function applyMeshTransform(){
  // cross-section: fit outer radius to 90% of smallest coloured ring
  const minRingR  = P.RINGS_RADIUS * (1 - g4.RINGS4_SIZE_VAR);
  const fitOuterR = 0.9 * minRingR;
  const sR   = (fitOuterR / MESH_MAX_R_GLTF) * g5m.MESH_SCALE_R;
  // length: span Z -70 to -140
  const sLen = (70 / MESH_LONG_SPAN) * g5m.MESH_SCALE_LEN;
  group5.scale.set(sR, sLen, sR);
  group5.rotation.set(
    THREE.MathUtils.degToRad(g5m.MESH_ROT_X),
    THREE.MathUtils.degToRad(g5m.MESH_ROT_Y),
    THREE.MathUtils.degToRad(g5m.MESH_ROT_Z)
  );
  // offsets are fractions of fitted outer radius; z is relative to orbit pivot
  group5.position.set(
    g5m.MESH_OFFSET_X * fitOuterR,
    g5m.MESH_OFFSET_Y * fitOuterR,
    (-70 + g5m.MESH_Z_OFFSET) - group5orbit.position.z
  );
}

  U.uFrac.value = P.TD_FRAC;
  const rawLevel = readLevel(dt);
  U.uTime.value = t * gfx.SPEED;
  U.uIntro.value = introStart === null ? 0.6 : Math.min(1, 0.6 + (now - introStart) / 1000 / P.INTRO_SEC);

  // orbit physics
  const orbitF = Math.pow(P.ORBIT_FRICTION, dt * 60);
  orbitYaw   += yawVel;   yawVel   *= orbitF;
  orbitPitch += pitchVel; pitchVel *= orbitF;
  orbitPitch = Math.max(-1.4, Math.min(1.4, orbitPitch));

  const autoYaw = THREE.MathUtils.degToRad(t * 60 * P.ROT_DEG_PER_FRAME);
  group.rotation.set(orbitPitch, autoYaw + orbitYaw, 0);

  // velocity drift
  target += vel;
  vel *= Math.pow(P.DRIFT_FRICTION, dt * 60);
  if (target <= 0) { target = 0; vel = 0; }
  if (target >= 1) { target = 1; vel = 0; }
  prog += (target - prog) * P.CAM_EASE;

  const s = P.CAM_START;
  const camZ = s[2] + (P.CAM_END_Z - s[2]) * prog;
  gmotion.CAM_SPEED += (Math.abs(camZ - prevCamZ) / dt - gmotion.CAM_SPEED) * Math.min(1, dt / 0.5);
  prevCamZ = camZ;
  // approach: 1 at start, 0 at Z=2 (just before mesh)
  const approach = Math.min(1, Math.max(0, (camZ - 2) / (s[2] - 2)));
  camera.position.set(
    s[0] * approach + Math.sin(t*0.31)*0.04,
    s[1] * approach + Math.sin(t*0.23)*0.03,
    camZ
  );
  look.set(0, 0, camZ - 5);
  look.lerp(new THREE.Vector3(0, 0, 0), approach * approach);
  camera.lookAt(look);

  U.uNear.value = Math.max(0, camera.position.length() - P.MESH_RADIUS);

  // GUI faders → uniforms (every frame)
  U.uN2K.value     = gfx.N2_K;
  U.uLineA.value   = glines.LINE_ALPHA;
  lines.material.linewidth = glines.LINE_WIDTH; // no-op on most WebGL impls; wire kept for future

  const nc = points.material.uniforms.uNearC.value;
  const hex = gpts.PT_COLOR.replace('#','');
  nc.x = parseInt(hex.slice(0,2),16)/255;
  nc.y = parseInt(hex.slice(2,4),16)/255;
  nc.z = parseInt(hex.slice(4,6),16)/255;
  nc.w = gpts.PT_ALPHA;

  // compute amod once; shared with drawScatter and zone 3
  const amod = gaudio.AUDIO_ON ? rawLevel : 0;
  lastAmod = amod;
  if (now - _aLevelT >= 100) { audioLevelDisplay.AUDIO_LEVEL = amod.toFixed(3); _aLevelT = now; }
  U.uN1K.value    = gfx.N1_K    * (1 + amod * 8);
  U.uFK.value     = gfx.FRAC_K  * (1 + amod * 3);
  U.uPt.value     = gpts.PT_SCALE * (1 + amod * 2);
  U.uN1Freq.value = gfx.N1_FREQ + freqEnv * gaudio.AUDIO_FREQ_MOD;

  U.uFogNear.value = gatmos.FOG_NEAR;
  U.uFogFar.value  = gatmos.FOG_FAR;

  // ── group2 / zone 3 ────────────────────────────────────────────────────────
  group2.rotation.set(orbitPitch, autoYaw + orbitYaw, 0);

  const camZf = camera.position.z;
  // zone3Factor: 0 when camZ > -28, ramps to 1 at camZ < -32
  const zone3Factor = Math.min(1, Math.max(0, (-camZf - 28) / 4));
  // mesh2 fade-in: 0 at camZ=-32, 1 at camZ=-34
  const mesh2Fade = Math.min(1, Math.max(0, (-camZf - 32) / 2));

  U2.uN1.value     = P.TD_N1;
  U2.uN2.value     = P.TD_N2;
  U2.uFrac.value   = P.TD_FRAC;
  U2.uTime.value   = t * ZONE3.SPEED;
  U2.uN1K.value    = ZONE3.N1_K    * (1 + amod * 8);
  U2.uN1Freq.value = ZONE3.N1_FREQ + freqEnv * gaudio.AUDIO_FREQ_MOD;
  U2.uFK.value     = ZONE3.FRAC_K  * (1 + amod * 3);
  U2.uN2K.value    = ZONE3.N2_K;
  U2.uFogNear.value  = ZONE3.FOG_NEAR;
  U2.uFogFar.value   = ZONE3.FOG_FAR;
  U2.uLineA.value    = ZONE3.LINE_ALPHA;
  U2.uPt.value       = ZONE3.PT_SCALE * (1 + amod * 2);
  U2.uNear.value     = Math.max(0, camera.position.distanceTo(mesh2Pos) - P.MESH_RADIUS);
  U2.uIntro.value    = mesh2Fade;
  lines2.material.linewidth = ZONE3.LINE_WIDTH;

  const nc2 = points2.material.uniforms.uNearC.value;
  const hex2 = ZONE3.PT_COLOR.replace('#','');
  nc2.x = parseInt(hex2.slice(0,2),16)/255;
  nc2.y = parseInt(hex2.slice(2,4),16)/255;
  nc2.z = parseInt(hex2.slice(4,6),16)/255;
  nc2.w = ZONE3.PT_ALPHA;

  // ── group3 / zone 6 ─────────────────────────────────────────────────────────
  group3.rotation.set(orbitPitch, autoYaw + orbitYaw, 0);
  if (Math.abs(camZf + 158) < 40) {
    U3.uN1.value     = P.TD_N1;
    U3.uN2.value     = P.TD_N2;
    U3.uFrac.value   = P.TD_FRAC;
    U3.uTime.value   = t * ZONE6.SPEED;
    U3.uN1K.value    = ZONE6.N1_K    * (1 + amod * 8);
    U3.uN1Freq.value = ZONE6.N1_FREQ + freqEnv * gaudio.AUDIO_FREQ_MOD;
    U3.uFK.value     = ZONE6.FRAC_K  * (1 + amod * 3);
    U3.uN2K.value    = ZONE6.N2_K;
    U3.uFogNear.value  = ZONE6.FOG_NEAR;
    U3.uFogFar.value   = ZONE6.FOG_FAR;
    U3.uLineA.value    = Math.min(1, ZONE6.LINE_ALPHA + amod * ZONE6.LINE_AUDIO);
    U3.uPt.value       = ZONE6.PT_SCALE * (1 + amod * 2);
    U3.uNear.value     = Math.max(0, camera.position.distanceTo(mesh3Pos) - P.MESH_RADIUS);
    U3.uIntro.value    = 1;
    lines3.material.linewidth = ZONE6.LINE_WIDTH;
    const nc3 = points3.material.uniforms.uNearC.value;
    const hex3 = ZONE6.PT_COLOR.replace('#','');
    nc3.x = parseInt(hex3.slice(0,2),16)/255;
    nc3.y = parseInt(hex3.slice(2,4),16)/255;
    nc3.z = parseInt(hex3.slice(4,6),16)/255;
    nc3.w = ZONE6.PT_ALPHA;
  }

  // ── space layer ──
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  dustUniforms.uCamPos.value.copy(camera.position);
  dustUniforms.uDustAlpha.value = gspace.DUST_ALPHA;
  dustUniforms.uDustSize.value  = gspace.SPACE_DUST_SIZE * dpr;
  dustUniforms.uNearFade.value  = P.SPACE_NEAR_FADE;
  dustUniforms.uFar.value       = gspace.SPACE_FAR;
  ringUniforms.uCamPos.value.copy(camera.position);
  { const t = Math.max(0, Math.min(1, -camZf / 6)); const k = t * t * (3 - 2 * t);
    ringUniforms.uRingsAlpha.value = gspace.RINGS_ALPHA_START + (gspace.RINGS_ALPHA - gspace.RINGS_ALPHA_START) * k; }
  ringUniforms.uNearFade.value   = P.SPACE_NEAR_FADE;
  ringUniforms.uFar.value        = gspace.SPACE_FAR;
  dustMesh.visible  = gspace.DUST_ON;
  ringsMesh.visible = gspace.RINGS_ON;

  // ── scene 4 ──
  if (g4.RINGS4_ON) {
    group4.visible = true;
    const zoneFade = Math.min(1, Math.max(0, (-camZf - 60) / 6));
    for (const {mat, z} of group4.userData.rings4) {
      const dist = Math.abs(camera.position.z - z);
      const tf = Math.max(0, Math.min(1, (dist - P.SPACE_NEAR_FADE) / Math.max(0.001, gspace.SPACE_FAR - P.SPACE_NEAR_FADE)));
      const distFade = 1 - tf * tf * (3 - 2 * tf);
      mat.opacity = g4.RINGS4_ALPHA * distFade * zoneFade;
    }
  } else {
    group4.visible = false;
  }

  // ── scene 5 ──
  meshZoneFade = Math.min(1, Math.max(0, (-camZf - 58) / 10));
  if (g5m.MESH_ON && group5Mats.length) {
    group5orbit.visible = true;
    group5orbit.position.set(0, 0, camera.position.z - g5m.MESH_PIVOT_AHEAD);
    group5orbit.rotation.set(0, 0, t * g5m.MESH_SPIN);
    // update z offset since pivot moves with camera
    const _minRingR5  = P.RINGS_RADIUS * (1 - g4.RINGS4_SIZE_VAR);
    const _fitOuterR5 = 0.9 * _minRingR5;
    group5.position.set(
      g5m.MESH_OFFSET_X * _fitOuterR5,
      g5m.MESH_OFFSET_Y * _fitOuterR5,
      (-70 + g5m.MESH_Z_OFFSET) - group5orbit.position.z
    );
    // Y-rotation accumulation
    rotY5 += g5m.MESH_ROT_Y_SPEED * dt;
    group5.rotation.set(
      THREE.MathUtils.degToRad(g5m.MESH_ROT_X),
      THREE.MathUtils.degToRad(g5m.MESH_ROT_Y + rotY5),
      THREE.MathUtils.degToRad(g5m.MESH_ROT_Z)
    );
    const audioScale5 = 1 + amod * g5m.MESH_AUDIO_SCALE;
    const sR5 = (_fitOuterR5 / MESH_MAX_R_GLTF) * g5m.MESH_SCALE_R * audioScale5;
    const sLen5 = (70 / MESH_LONG_SPAN) * g5m.MESH_SCALE_LEN;
    group5.scale.set(sR5, sLen5, sR5);
    const mc = new THREE.Color(g5m.MESH_COLOR);
    for (const mat of group5Mats) {
      mat.color.copy(mc);
      mat.opacity = g5m.MESH_ALPHA * meshZoneFade * (1 + amod * g5m.MESH_AUDIO_ALPHA);
    }
    const sc = new THREE.Color(g5m.SOLID_COLOR);
    const solidOpacity = Math.min(1, g5m.SOLID_ALPHA * meshZoneFade * (1 + amod * g5m.MESH_AUDIO_ALPHA));
    for (const mat of group5SolidMats) {
      mat.color.copy(sc);
      mat.opacity = g5m.MESH_SOLID ? solidOpacity : 0;
      mat.visible = g5m.MESH_SOLID;
    }
    // per-beam vibration (stores vdx/vdz for plexus)
    const doVib = g5m.MESH_VIBRATE > 0 && amod > 0;
    const tau = Math.PI * 2 * g5m.MESH_VIB_FREQ;
    for (const b of group5Beams) {
      if (doVib) {
        const sp = b.speed;
        b.vdx = (Math.sin(t * tau * sp + b.phase1) * 0.6 + Math.sin(t * tau * 1.7 * sp + b.phase2) * 0.4) * amod * g5m.MESH_VIBRATE;
        b.vdz = (Math.sin(t * tau * sp + b.phase2) * 0.6 + Math.sin(t * tau * 1.7 * sp + b.phase3) * 0.4) * amod * g5m.MESH_VIBRATE;
        _vibMat.copy(b.baseMat);
        _vibMat.elements[12] += b.vdx;
        _vibMat.elements[14] += b.vdz;
        b.lines.matrix.copy(_vibMat);
        b.solid.matrix.copy(_vibMat);
      } else {
        b.vdx = 0; b.vdz = 0;
        b.lines.matrix.copy(b.baseMat);
        b.solid.matrix.copy(b.baseMat);
      }
    }
    // guide lines
    if (gg.GUIDE_ON && guideLines) {
      guideLines.visible = meshZoneFade > 0;
      if (meshZoneFade > 0) {
        guideMat.color.set(gg.GUIDE_COLOR);
        guideMat.opacity = gg.GUIDE_ALPHA * meshZoneFade * (1 + amod * g5m.MESH_AUDIO_ALPHA);
        const geoAttr = guideLines.geometry.attributes.position;
        const arr = geoAttr.array;
        if (amod > 0 && gg.GUIDE_VIBRATE > 0) {
          const tau = Math.PI * 2 * g5m.MESH_VIB_FREQ;
          for (let i = 0; i < guideCount5; i++){
            const sp = guideSpeeds[i];
            const i3 = i * 3;
            const ph1 = guidePhases[i3], ph2 = guidePhases[i3+1], ph3 = guidePhases[i3+2];
            const gdx = (Math.sin(t * tau * sp + ph1) * 0.6 + Math.sin(t * tau * 1.7 * sp + ph2) * 0.4) * amod * gg.GUIDE_VIBRATE;
            const gdz = (Math.sin(t * tau * sp + ph2) * 0.6 + Math.sin(t * tau * 1.7 * sp + ph3) * 0.4) * amod * gg.GUIDE_VIBRATE;
            const i6 = i * 6;
            arr[i6]   = guideBasePos[i6]   + gdx; arr[i6+2] = guideBasePos[i6+2] + gdz;
            arr[i6+3] = guideBasePos[i6+3] + gdx; arr[i6+5] = guideBasePos[i6+5] + gdz;
          }
        } else {
          for (let i = 0; i < guideCount5; i++){
            const i6 = i * 6;
            arr[i6]   = guideBasePos[i6];   arr[i6+2] = guideBasePos[i6+2];
            arr[i6+3] = guideBasePos[i6+3]; arr[i6+5] = guideBasePos[i6+5];
          }
        }
        geoAttr.needsUpdate = true;
      }
    } else if (guideLines) {
      guideLines.visible = false;
    }
  } else {
    group5orbit.visible = false;
    if (guideLines) guideLines.visible = false;
  }

  // ── scene 5 slabs ──
  const slabNearZ = -70 + g5m.MESH_Z_OFFSET - 2;
  const slabFarZ  = -140 + g5m.MESH_Z_OFFSET + 2;
  const slabsActive = gslabs.SLAB_ON && camZf < slabNearZ && camZf > slabFarZ;
  if (slabsActive || slabsWereActive) {
    group5.updateWorldMatrix(true, false);
    group5.matrixWorld.decompose(_slabPos5, _slabQuat5, _slabScaleW);
    slab5.position.copy(_slabPos5);
    slab5.quaternion.copy(_slabQuat5);
    slab5.updateMatrixWorld(true);

    _camLocalSlab.copy(camera.position);
    slab5.worldToLocal(_camLocalSlab);
    let camDeltaY = _camLocalSlab.y - _prevCamLocalSlabY;

    if (!slabsWereActive && slabsActive) {
      camDeltaY = 0;
      const r2 = rng(789);
      for (let i = 0; i < SLAB_COUNT_MAX; i++) {
        const s = slabs[i];
        s.angle   = r2() * Math.PI * 2;
        s.radius  = gslabs.SLAB_R_MIN + r2() * (gslabs.SLAB_R_MAX - gslabs.SLAB_R_MIN);
        s.y       = _camLocalSlab.y - gslabs.SLAB_BEHIND + r2() * (gslabs.SLAB_AHEAD + gslabs.SLAB_BEHIND);
        s.growT = 0; s.growing = true; s.growDir = 1;
        s.mesh.visible = i < gslabs.SLAB_COUNT;
      }
      slabRespawnRng = rng(456);
    } else if (slabsWereActive && !slabsActive) {
      for (const s of slabs) { s.growing = true; s.growDir = -1; }
    }
    _prevCamLocalSlabY = _camLocalSlab.y;

    const audioMul = 1 + amod * gslabs.SLAB_AUDIO;
    for (let i = 0; i < SLAB_COUNT_MAX; i++) {
      const s = slabs[i];
      // fully shrunk and leaving — hide and skip
      if (!slabsActive && s.growDir < 0 && s.growT >= gslabs.SLAB_GROW) { s.mesh.visible = false; continue; }
      // beyond active count
      if (slabsActive && i >= gslabs.SLAB_COUNT) { s.mesh.visible = false; continue; }

      if (s.growing) {
        s.growT = Math.min(s.growT + dt, gslabs.SLAB_GROW);
        if (s.growDir > 0 && s.growT >= gslabs.SLAB_GROW) s.growing = false;
      }
      const gf = s.growT / Math.max(0.001, gslabs.SLAB_GROW);
      const gs = gf * gf * (3 - 2 * gf); // smoothstep
      const scale = s.growDir > 0 ? gs : (1 - gs);

      s.y += (camDeltaY * s.speedFactor + gslabs.SLAB_DRIFT * s.driftFactor * dt) * audioMul;

      if (slabsActive) {
        if (s.y < _camLocalSlab.y - gslabs.SLAB_BEHIND) {
          s.angle = slabRespawnRng() * Math.PI * 2;
          s.radius = gslabs.SLAB_R_MIN + slabRespawnRng() * (gslabs.SLAB_R_MAX - gslabs.SLAB_R_MIN);
          s.y = _camLocalSlab.y + (0.6 + slabRespawnRng() * 0.4) * gslabs.SLAB_AHEAD;
          s.growT = 0; s.growing = true; s.growDir = 1;
        } else if (s.y > _camLocalSlab.y + gslabs.SLAB_AHEAD) {
          s.angle = slabRespawnRng() * Math.PI * 2;
          s.radius = gslabs.SLAB_R_MIN + slabRespawnRng() * (gslabs.SLAB_R_MAX - gslabs.SLAB_R_MIN);
          s.y = _camLocalSlab.y - gslabs.SLAB_BEHIND;
          s.growT = 0; s.growing = true; s.growDir = 1;
        }
      }

      _slabV3.set(Math.cos(s.angle) * s.radius, s.y, Math.sin(s.angle) * s.radius);
      _slabQ4.setFromAxisAngle(_slabUp, s.rotY);
      _slabScl.set(s.w * scale, s.len * scale, s.th * scale);
      s.mesh.matrix.compose(_slabV3, _slabQ4, _slabScl);
      s.mesh.visible = scale > 0.001;
    }
  } else if (!slabsActive && !slabsWereActive) {
    // never entered or fully done
    if (slabs.length && slabs[0].mesh.visible) for (const s of slabs) s.mesh.visible = false;
  }
  slabsWereActive = slabsActive;

  // blend bloom between dat.GUI and ZONE3 as we transition
  const blmStrength  = gbloom.BLOOM_STRENGTH  * (1 - zone3Factor) + ZONE3.BLOOM_STRENGTH  * zone3Factor;
  const blmRadius    = gbloom.BLOOM_RADIUS    * (1 - zone3Factor) + ZONE3.BLOOM_RADIUS    * zone3Factor;
  const blmThreshold = gbloom.BLOOM_THRESHOLD * (1 - zone3Factor) + ZONE3.BLOOM_THRESHOLD * zone3Factor;
  const blmOn = gbloom.BLOOM_ON || (zone3Factor > 0 && ZONE3.BLOOM_ON);

  if (blmOn) {
    bloomPass.strength  = blmStrength;
    bloomPass.radius    = blmRadius;
    bloomPass.threshold = blmThreshold;
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  // scatter2 opacity: smoothstep camZ -150(0) to -153(1)
  const s2Raw     = Math.min(1, Math.max(0, (-camZf - 150) / 3));
  const s2opacity = s2Raw * s2Raw * (3 - 2 * s2Raw);
  if (gs2.S2_ON && s2opacity > 0) {
    drawScatter2(now, s2opacity);
    s2Texture.needsUpdate = true;
  }
  if (window._s2Plane) window._s2Plane.visible = gs2.S2_ON && s2opacity > 0;

  // composite scene4 after bloom — crisp, no glow
  const scene6Active = s2opacity > 0 || Math.abs(camZf + 158) < 40;
  if (g4.RINGS4_ON || g5m.MESH_ON || scene6Active) {
    renderer.autoClear = false;
    renderer.clearDepth();
    renderer.render(scene4, camera);
    renderer.autoClear = true;
  }
  // glitch video overlay
  gctx.clearRect(0, 0, innerWidth, innerHeight);
  if (camZf > GLITCH_START_Z) {
    // outside glitch zone — reset immediately
    if (glitchOn) { glitchOn = false; ggfx.GLITCH_NOW = 'off'; glitchCanvas.style.mixBlendMode = 'normal'; }
    if (glitchZoneActive) { glitchZoneActive = false; glitchTimer = Infinity; }
  } else {
    // inside glitch zone — arm scheduler on first entry
    if (!glitchZoneActive) {
      glitchZoneActive = true;
      glitchTimer = now + (ggfx.GAP_MIN + Math.random() * Math.abs(ggfx.GAP_MAX - ggfx.GAP_MIN)) * 1000;
    }
    if (ggfx.GLITCH_ON) {
      if (!glitchOn && now >= glitchTimer) {
        const choices = [];
        if (ggfx.FX_CUTS)   choices.push('cuts');
        if (ggfx.FX_BLEND)  choices.push('blend');
        if (ggfx.FX_STROBE) choices.push('strobe');
        if (choices.length) {
          glitchOn = true;
          glitchEffect = ggfx.GLITCH_FORCE !== 'random' ? ggfx.GLITCH_FORCE
            : choices[Math.floor(Math.random() * choices.length)];
          ggfx.GLITCH_NOW = glitchEffect;
          if (glitchEffect === 'blend' && ggfx.BLEND_MODE === 'alternate') {
            glitchBlendCurrent = glitchBlendAlt % 2 === 0 ? 'color-dodge' : 'screen';
            glitchBlendAlt++;
          }
          const onDur = Math.min(ggfx.ON_MIN, ggfx.ON_MAX) + Math.random() * Math.abs(ggfx.ON_MAX - ggfx.ON_MIN);
          glitchTimer = now + onDur * 1000;
          glitchCuts = []; glitchCutTimer = 0; strobeOpacity = 0; strobeTimer = 0;
        }
      } else if (glitchOn && now >= glitchTimer) {
        glitchOn = false;
        ggfx.GLITCH_NOW = 'off';
        glitchCanvas.style.mixBlendMode = 'normal';
        glitchTimer = now + (ggfx.GAP_MIN + Math.random() * Math.abs(ggfx.GAP_MAX - ggfx.GAP_MIN)) * 1000;
      }
      const glitchSrc = camZf < -144 ? glitchVideo4 : (meshZoneFade > 0 ? glitchVideo5 : glitchVideo);
      if (glitchOn && glitchSrc.readyState >= 2) {
        const VW = glitchSrc.videoWidth, VH = glitchSrc.videoHeight;
        if (VW > 0 && VH > 0) {
          const cw = innerWidth, ch = innerHeight;
          const vAspect = VW / VH, cAspect = cw / ch;
          let sx, sy, sw, sh;
          if (vAspect > cAspect) {
            sh = VH; sw = VH * cAspect; sx = (VW - sw) / 2; sy = 0;
          } else {
            sw = VW; sh = VW / cAspect; sx = 0; sy = (VH - sh) / 2;
          }
          if (glitchEffect === 'cuts') {
            glitchCanvas.style.mixBlendMode = 'normal';
            if (now - glitchCutTimer > ggfx.CUT_SHUFFLE_MS || !glitchCuts.length) {
              glitchCuts = [];
              for (let i = 0; i < ggfx.CUT_COUNT; i++) {
                glitchCuts.push({
                  x: Math.random() * cw,
                  w: ggfx.CUT_W_MIN + Math.random() * (ggfx.CUT_W_MAX - ggfx.CUT_W_MIN)
                });
              }
              glitchCutTimer = now;
            }
            for (const cut of glitchCuts) {
              const vx = sx + (cut.x / cw) * sw;
              const vwc = Math.max(1, (cut.w / cw) * sw);
              gctx.drawImage(glitchSrc, vx, sy, vwc, sh, cut.x, 0, cut.w, ch);
            }
          } else if (glitchEffect === 'blend') {
            const bmode = (glitchSrc === glitchVideo5) ? 'color-dodge'
              : (ggfx.BLEND_MODE === 'alternate' ? glitchBlendCurrent : ggfx.BLEND_MODE);
            glitchCanvas.style.mixBlendMode = bmode;
            gctx.globalAlpha = ggfx.BLEND_ALPHA;
            gctx.drawImage(glitchSrc, sx, sy, sw, sh, 0, 0, cw, ch);
            gctx.globalAlpha = 1;
          } else if (glitchEffect === 'strobe') {
            glitchCanvas.style.mixBlendMode = 'normal';
            if (now - strobeTimer > ggfx.STROBE_RATE_MS) {
              strobeOpacity = Math.random() < 0.55 ? 0
                : ggfx.STROBE_MAX * (0.6 + Math.random() * 0.4);
              strobeTimer = now;
            }
            if (strobeOpacity > 0) {
              gctx.globalAlpha = strobeOpacity;
              gctx.drawImage(glitchSrc, sx, sy, sw, sh, 0, 0, cw, ch);
              gctx.globalAlpha = 1;
            }
          }
        }
      }
    } else {
      if (glitchOn) { glitchOn = false; ggfx.GLITCH_NOW = 'off'; glitchCanvas.style.mixBlendMode = 'normal'; }
    }
  }
  requestAnimationFrame(frame);
}
