<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Collider Embed Test</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #1a1a1a;
  font-family: 'Space Mono', 'Courier New', monospace;
  font-size: 11px;
  color: #ccc;
  display: flex;
  height: 100vh;
  overflow: hidden;
}
#sidebar {
  width: 220px;
  flex-shrink: 0;
  background: #111;
  border-right: 1px solid #333;
  padding: 16px 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
#sidebar h2 {
  font-size: 9px;
  letter-spacing: .2em;
  color: #FF6B00;
  text-transform: uppercase;
  margin-bottom: 4px;
}
#main {
  flex: 1;
  position: relative;
  background: #0a0a0a;
}
#collider-container {
  width: 100%;
  height: 100%;
}
button#playBtn {
  font-family: inherit;
  font-size: 10px;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: #FF6B00;
  background: transparent;
  border: 1px solid #FF6B00;
  padding: 6px 14px;
  cursor: pointer;
  width: 100%;
}
button#playBtn:hover { background: #FF6B00; color: #111; }
button#playBtn.playing { background: #FF6B00; color: #111; }

.layer-row {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 18px;
}
.layer-row label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: #aaa;
  font-size: 9px;
  letter-spacing: .1em;
}
.layer-row input[type=checkbox] {
  accent-color: #FF6B00;
  width: 12px;
  height: 12px;
  cursor: pointer;
}
#status {
  font-size: 8px;
  color: #666;
  letter-spacing: .08em;
  margin-top: 4px;
}
.sep {
  border-top: 1px solid #222;
  margin: 2px 0;
}
</style>
</head>
<body>
<div id="sidebar">
  <h2>Collider Embed</h2>
  <button id="playBtn">▶ Play</button>
  <div id="status">loading…</div>

  <div class="sep"></div>
  <h2>Layers</h2>

  <div class="layer-row"><label><input type="checkbox" data-layer="rings"> RINGS</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="seqDots"> SEQ DOTS</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="pistonDots"> PISTON DOTS</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="cadCircles"> CAD CIRCLES</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="chart"> CHART</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="analyzer"> ANALYZER</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="faders"> FADERS</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="rhythm"> RHYTHM</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="transport"> TRANSPORT</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="valueDisplay"> VALUE DISPLAY</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="presetNumber"> PRESET NUM</label></div>
  <div class="layer-row"><label><input type="checkbox" data-layer="panel"> PANEL</label></div>

  <div class="sep"></div>
  <h2>All Layers</h2>
  <button id="showAllBtn" style="font-family:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#ccc;background:transparent;border:1px solid #444;padding:4px 10px;cursor:pointer;width:100%;">SHOW ALL</button>
  <button id="hideAllBtn" style="font-family:inherit;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#ccc;background:transparent;border:1px solid #444;padding:4px 10px;cursor:pointer;width:100%;margin-top:4px;">HIDE ALL</button>
</div>

<div id="main">
  <div id="collider-container"></div>
</div>

<script src="collider-embed.js"></script>
<script>
(async function () {
  const statusEl = document.getElementById('status');
  const playBtn  = document.getElementById('playBtn');
  let collider   = null;
  let playing    = false;

  try {
    collider = await ColliderEmbed.create({
      container: document.getElementById('collider-container'),
      layout: 'collider-layout.json',
    });
    statusEl.textContent = 'ready';
  } catch (err) {
    statusEl.textContent = 'error: ' + err.message;
    console.error(err);
    return;
  }

  // play / stop button
  playBtn.addEventListener('click', () => {
    if (!playing) {
      collider.start();
      playing = true;
      playBtn.textContent = '■ Stop';
      playBtn.classList.add('playing');
    } else {
      collider.stop();
      playing = false;
      playBtn.textContent = '▶ Play';
      playBtn.classList.remove('playing');
    }
  });

  // layer checkboxes
  document.querySelectorAll('input[data-layer]').forEach(cb => {
    cb.addEventListener('change', () => {
      if (cb.checked) collider.show(cb.dataset.layer);
      else            collider.hide(cb.dataset.layer);
    });
  });

  // show all / hide all
  document.getElementById('showAllBtn').addEventListener('click', () => {
    document.querySelectorAll('input[data-layer]').forEach(cb => {
      cb.checked = true;
      collider.show(cb.dataset.layer);
    });
  });
  document.getElementById('hideAllBtn').addEventListener('click', () => {
    document.querySelectorAll('input[data-layer]').forEach(cb => {
      cb.checked = false;
      collider.hide(cb.dataset.layer);
    });
  });

  // expose for Playwright tests
  window._collider = collider;
  statusEl.textContent = 'ready — click ▶ to start audio';
}());
</script>
</body>
</html>
