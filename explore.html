<script>
// ── Preset configuration (matches production screenshot) ─────────────────────
const CFG = {
  holdMode:       'RANGE',
  holdFixed:      800,
  holdMin:        300,
  holdMax:        4500,
  holdCurve:      'BOTH',
  transType:      'NONE',
  // Silence: ~8% probability, white flash
  silenceProb:    0.08,
  silenceDurMin:  4800,
  silenceDurMax:  5000,
  silenceFade:    450,
  silenceInColor: '#ffffff',
  silenceOutColor:'#ffffff',
  silenceOpacity: 1.0,
  // Cutter: thin white static clusters
  cutterAmount:   8,
  cutterCluster:  3,
  cutterSpread:   60,
  cutterWideness: 1,
  cutterOrganics: 35,
  cutterSkew:     4,
  cutterColor:    '#ffffff',
  cutterSpeed:    0,
  cutterRenewal:  40,
};

// ── Audio configuration ───────────────────────────────────────────────────────
const AUDIO_CFG = {
  shortPoolCount:  21,
  longPoolCount:   10,
  shortPoly:       false,
  longPoly:        false,
  shortPolyVoices: 4,
  longPolyVoices:  4,
  masterVol:       1.0,
};

// ── Mesh overlay configuration ────────────────────────────────────────────────
const MESH_CFG = {
  meshOverlapDurMin: 2000,
  meshOverlapDurMax: 3000,
  meshFadeIn:        300,
  meshFadeOut:       500,
  meshCountMin:      2,
  meshCountMax:      3,
  meshColor:         '#FF6600',
};

// ── Image paths — put 60 files in explore/ named 001.jpg … 060.jpg ──────────
const IMAGE_SRCS = Array.from({length: 60}, (_, i) =>
  `explore/${String(i + 1).padStart(3, '0')}.jpg`
);

// ── Canvas ───────────────────────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let CW, CH;

function sizeCanvas() {
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  CW = cv.width; CH = cv.height;
}
sizeCanvas();
window.addEventListener('resize', () => {
  sizeCanvas();
  if (cutterActive) spawnCuts(CFG.cutterAmount);
  updateMeshCamera();
});

// ── Engine state ─────────────────────────────────────────────────────────────
let images        = [];
let currentIndex  = 0;
let outgoingIndex = 0;
let incomingIndex = 0;
let shuffleQueue  = [];

let engineState    = 'IDLE';
let stateStartTs   = 0;
let currentHoldMs  = 0;
let currentTransMs = 0;
let isPlaying      = false;
let rafId          = null;
let lastTs         = 0;

let silFadeMs  = CFG.silenceFade;
let silHoldMs  = 0;
let silOpacity = CFG.silenceOpacity;

let cutterActive = false;
let cuts = [];

// ── Helpers ───────────────────────────────────────────────────────────────────
function applyDistribution(curve, lo, hi) {
  const r = Math.random();
  switch (curve) {
    case 'EXP':  return lo + (hi - lo) * Math.pow(r, 3);
    case 'LOG':  return lo + (hi - lo) * (1 - Math.pow(1 - r, 3));
    case 'BOTH': return Math.random() < 0.5
      ? lo + (hi - lo) * Math.pow(Math.random(), 4)
      : hi - (hi - lo) * Math.pow(Math.random(), 4);
    default: return lo + r * (hi - lo);
  }
}

function computeHoldMs() {
  if (CFG.holdMode === 'FIXED') return CFG.holdFixed;
  const lo = CFG.holdMin, hi = CFG.holdMax;
  return Math.max(lo, applyDistribution(CFG.holdCurve, lo, hi));
}

function computeNext(current) {
  const total = images.length;
  if (!total) return 0;
  return Math.floor(Math.random() * total);
}

// ── Cutter ────────────────────────────────────────────────────────────────────
function cutColorHex(val) {
  const v = Math.round(255 - 255 * (val / 100));
  const h = v.toString(16).padStart(2, '0');
  return `#${h}${h}${h}`;
}

function rebakeCorners(cut) {
  const org = CFG.cutterOrganics / 100;
  cut.orgCorners = Array.from({length: 4}, () => org * 10 * (Math.random() - 0.5));
}

function spawnCut() {
  const spreadPct   = CFG.cutterSpread / 100;
  const widenessPct = CFG.cutterWideness / 100;
  const organicsPct = CFG.cutterOrganics / 100;
  const speedVal    = CFG.cutterSpeed;
  const renewalPct  = CFG.cutterRenewal / 100;
  const skewPct     = CFG.cutterSkew / 100;

  const axis     = Math.random() < 0.5 ? 'H' : 'V';
  const crossLen = axis === 'H' ? CH : CW;

  const halfSpread = 0.2 + 0.3 * spreadPct;
  const pos = crossLen * (0.5 - halfSpread) + Math.random() * crossLen * halfSpread * 2;

  const isWide = Math.random() < widenessPct * 0.8 + 0.1;
  const width  = isWide
    ? 8 + Math.pow(Math.random(), Math.max(0.01, 1 - widenessPct * 0.7)) * 52
    : 1 + Math.random() * 3;

  const speedPct = speedVal / 100;
  const speed    = Math.random() < speedPct ? (Math.random() * 2 - 1) * speedVal * 3 : 0;

  const orgCorners = Array.from({length: 4}, () => organicsPct * 10 * (Math.random() - 0.5));

  const maxAge = renewalPct === 0
    ? Infinity
    : (2000 + Math.random() * 6000) * (1 - renewalPct * 0.85);

  const skew = (Math.random() * 2 - 1) * skewPct * Math.max(CW, CH) * 0.5;

  return { axis, pos, width, speed, skew, orgCorners, age: 0, maxAge, fadingOut: false, fadeOutStart: 0 };
}

function spawnCuts(n) {
  cuts = [];
  const strength   = CFG.cutterCluster;
  const organicsPct = CFG.cutterOrganics / 100;
  const skewPct    = CFG.cutterSkew / 100;
  const speedVal   = CFG.cutterSpeed;
  const renewalPct = CFG.cutterRenewal / 100;
  const spreadPct  = CFG.cutterSpread / 100;

  if (strength === 0 || n === 0) {
    for (let i = 0; i < n; i++) cuts.push(spawnCut());
  } else {
    const numZones = Math.max(1, Math.round(1 + Math.random() * strength * 0.7));
    let placed = 0;

    for (let z = 0; z < numZones && placed < n; z++) {
      const axis     = Math.random() < 0.5 ? 'H' : 'V';
      const crossLen = axis === 'H' ? CH : CW;
      const halfSpread = 0.2 + 0.3 * spreadPct;
      let pos = crossLen * (0.5 - halfSpread) + Math.random() * crossLen * halfSpread * 2;

      const density   = Math.pow(Math.random(), 0.4);
      const numStrips = Math.round(2 + density * strength * 4);

      for (let i = 0; i < numStrips && placed < n; i++) {
        if (pos >= crossLen) break;
        const r = Math.random();
        let thick;
        if      (r < 0.60) thick = 1  + Math.floor(Math.random() * 3);
        else if (r < 0.85) thick = 4  + Math.floor(Math.random() * 6);
        else               thick = 10 + Math.floor(Math.random() * 14);
        const ct = Math.min(thick, crossLen - pos);
        if (ct < 1) break;

        const speedPct   = speedVal / 100;
        const speed      = Math.random() < speedPct ? (Math.random() * 2 - 1) * speedVal * 3 : 0;
        const skew       = (Math.random() * 2 - 1) * skewPct * Math.max(CW, CH) * 0.5;
        const orgCorners = Array.from({length: 4}, () => organicsPct * 10 * (Math.random() - 0.5));
        const maxAge     = renewalPct === 0
          ? Infinity
          : (2000 + Math.random() * 6000) * (1 - renewalPct * 0.85);

        cuts.push({ axis, pos, width: ct, speed, skew, orgCorners, age: 0, maxAge, fadingOut: false, fadeOutStart: 0 });
        pos += ct;
        placed++;
      }
    }
    while (placed < n) { cuts.push(spawnCut()); placed++; }
  }
}

function updateCuts(dt) {
  const target   = CFG.cutterAmount;
  const toRemove = [];

  cuts.forEach((cut, idx) => {
    cut.age += dt * 1000;

    if (cut.speed !== 0) {
      cut.pos += cut.speed * dt;
      const crossLen = cut.axis === 'H' ? CH : CW;
      if (cut.speed > 0 && cut.pos > crossLen) {
        cut.pos = -cut.width; rebakeCorners(cut);
        cut.age = 0; cut.fadingOut = false;
      } else if (cut.speed < 0 && cut.pos + cut.width < 0) {
        cut.pos = crossLen; rebakeCorners(cut);
        cut.age = 0; cut.fadingOut = false;
      }
    }

    if (!cut.fadingOut && isFinite(cut.maxAge) && cut.age >= cut.maxAge) {
      cut.fadingOut = true; cut.fadeOutStart = cut.age;
    }
    if (cut.fadingOut && (cut.age - cut.fadeOutStart) >= 200) toRemove.push(idx);
  });

  for (let i = toRemove.length - 1; i >= 0; i--) {
    cuts.splice(toRemove[i], 1);
    if (cuts.length < target) cuts.push(spawnCut());
  }
  while (cuts.length < target) cuts.push(spawnCut());
}

function drawSingleCut(c, cut, W, H, scale) {
  const pos = cut.pos * scale;
  const w   = cut.width * scale;
  const sk  = cut.skew * scale;
  const oc  = cut.orgCorners.map(v => v * scale);

  c.beginPath();
  if (cut.axis === 'H') {
    c.moveTo(0, pos + oc[0]);
    c.lineTo(W, pos + sk + oc[1]);
    c.lineTo(W, pos + w + sk + oc[2]);
    c.lineTo(0, pos + w + oc[3]);
  } else {
    c.moveTo(pos + oc[0],    0);
    c.lineTo(pos + sk + oc[3], H);
    c.lineTo(pos + w + sk + oc[2], H);
    c.lineTo(pos + w + oc[1], 0);
  }
  c.closePath();
  c.fill();
}

function drawCuts(c, W, H) {
  if (!cuts.length) return;
  c.fillStyle = CFG.cutterColor;
  cuts.forEach(cut => {
    const alpha = cut.fadingOut
      ? Math.max(0, 1 - (cut.age - cut.fadeOutStart) / 200)
      : Math.min(1, cut.age / 200);
    if (alpha <= 0) return;
    c.globalAlpha = alpha;
    drawSingleCut(c, cut, W, H, 1);
  });
  c.globalAlpha = 1;
}

// ── Silence ───────────────────────────────────────────────────────────────────
function enterSilence(ts) {
  const totalMs = CFG.silenceDurMin + Math.random() * (CFG.silenceDurMax - CFG.silenceDurMin);
  silFadeMs  = CFG.silenceFade;
  silHoldMs  = Math.max(0, totalMs - silFadeMs * 2);
  silOpacity = CFG.silenceOpacity;
  engineState  = 'SILENCE';
  stateStartTs = ts;
  if (shortEls.length) { shortEls[shortIdx].pause(); shortEls[shortIdx].currentTime = 0; }
  audioTriggerLong();
  enterMeshOverlay();
}

function drawSilenceOverlay(c, W, H, elapsed) {
  const p1End = silFadeMs;
  const p2End = silFadeMs + silHoldMs;
  const p3End = silFadeMs + silHoldMs + silFadeMs;
  let alpha = 0, color = CFG.silenceInColor;
  if      (elapsed < p1End) { alpha = silOpacity * (elapsed / silFadeMs); color = CFG.silenceInColor; }
  else if (elapsed < p2End) { alpha = silOpacity; color = CFG.silenceInColor; }
  else if (elapsed < p3End) { alpha = silOpacity * (1 - (elapsed - p2End) / silFadeMs); color = CFG.silenceOutColor; }
  else return;
  c.fillStyle = color;
  c.globalAlpha = Math.max(0, Math.min(1, alpha));
  c.fillRect(0, 0, W, H);
  c.globalAlpha = 1;
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawImageCovered(c, img, W, H) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
  c.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function drawTransitionFrame(c, out, inc, progress, W, H) {
  drawImageCovered(c, images[out], W, H);
  c.globalAlpha = progress;
  drawImageCovered(c, images[inc], W, H);
  c.globalAlpha = 1;
}

function drawFrame(elapsed) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);

  if (!images.length) return;

  if (!isPlaying || engineState === 'HOLD') {
    drawImageCovered(ctx, images[currentIndex], CW, CH);
  } else if (engineState === 'TRANSITION') {
    const progress = Math.min(elapsed / currentTransMs, 1);
    drawTransitionFrame(ctx, outgoingIndex, incomingIndex, progress, CW, CH);
  } else if (engineState === 'SILENCE') {
    drawImageCovered(ctx, images[currentIndex], CW, CH);
    drawSilenceOverlay(ctx, CW, CH, elapsed);
  }

  if (cutterActive) drawCuts(ctx, CW, CH);
}

// ── Audio system ──────────────────────────────────────────────────────────────
(function() {
  var s = parseFloat(localStorage.getItem('d93vol'));
  var vol   = isNaN(s) ? 0.3162 : Math.max(0, Math.min(1, s));
  var muted = localStorage.getItem('d93mute') === '1';
  window._d93vol = function() { return muted ? 0 : vol; };
})();

var shortEls   = [];
var longEls    = [];
var shortIdx   = 0;
var longIdx    = 0;
var audioReady = false;
var unlocking  = false;

var keepAlive = (function() {
  var el = document.createElement('audio');
  el.src = 'https://daysof93-cdn.b-cdn.net/pool%20short/short_01.wav';
  el.loop = true; el.volume = 0;
  document.body.appendChild(el);
  return el;
}());

function getVol() { return (window._d93vol ? window._d93vol() : 1) * AUDIO_CFG.masterVol; }

function initAudioEls() {
  var NUM_SHORT = 4, NUM_LONG = 3;
  var sBase = 'https://daysof93-cdn.b-cdn.net/pool%20short/short_';
  var lBase = 'https://daysof93-cdn.b-cdn.net/pool%20long/long_';

  var sAll = Array.from({length: AUDIO_CFG.shortPoolCount}, function(_, i) {
    return sBase + String(i+1).padStart(2,'0') + '.wav';
  }).sort(function() { return Math.random()-0.5; });
  var lAll = Array.from({length: AUDIO_CFG.longPoolCount}, function(_, i) {
    return lBase + String(i+1).padStart(2,'0') + '.wav';
  }).sort(function() { return Math.random()-0.5; });

  for (var i = 0; i < NUM_SHORT; i++) {
    var a = document.createElement('audio');
    a.preload = 'auto'; a.src = sAll[i]; document.body.appendChild(a); shortEls.push(a);
  }
  for (var j = 0; j < NUM_LONG; j++) {
    var b = document.createElement('audio');
    b.preload = 'auto'; b.src = lAll[j]; document.body.appendChild(b); longEls.push(b);
  }
  console.log('d93: audio elements created', NUM_SHORT, 'short', NUM_LONG, 'long');
}

function unlockAudio() {
  if (audioReady || unlocking) return;
  unlocking = true;
  var all = [keepAlive].concat(shortEls, longEls);
  var pending = all.length;
  var succeeded = 0;
  function onDone(ok) {
    if (ok) succeeded++;
    if (--pending === 0) {
      if (succeeded === all.length) {
        audioReady = true;
        console.log('d93: audio unlocked');
        if (isPlaying && engineState === 'HOLD') audioTriggerShort();
      } else {
        unlocking = false;
      }
    }
  }
  all.forEach(function(a) {
    a.volume = 0;
    var p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(function() {
        if (a !== keepAlive) { a.pause(); a.currentTime = 0; }
        a.volume = (a === keepAlive) ? 0 : getVol();
        onDone(true);
      }).catch(function() { a.volume = (a === keepAlive) ? 0 : getVol(); onDone(false); });
    } else {
      if (a !== keepAlive) { a.pause(); a.currentTime = 0; }
      a.volume = (a === keepAlive) ? 0 : getVol();
      onDone(true);
    }
  });
}

['touchstart', 'mousedown', 'keydown'].forEach(function(type) {
  document.addEventListener(type, unlockAudio, { once: true });
});

function audioTriggerShort() {
  if (!audioReady || !shortEls.length) return;
  shortEls[shortIdx].pause(); shortEls[shortIdx].currentTime = 0;
  shortIdx = (shortIdx + 1) % shortEls.length;
  var a = shortEls[shortIdx];
  a.volume = getVol(); a.currentTime = 0;
  a.play().catch(function() {});
}

function audioTriggerLong() {
  if (!audioReady || !longEls.length) return;
  longEls[longIdx].pause(); longEls[longIdx].currentTime = 0;
  longIdx = (longIdx + 1) % longEls.length;
  var a = longEls[longIdx];
  a.volume = getVol(); a.currentTime = 0;
  a.play().catch(function() {});
}

function audioStopLong() {
  if (!longEls.length) return;
  longEls[longIdx].pause(); longEls[longIdx].currentTime = 0;
}

// ── Mesh overlay (Three.js) ───────────────────────────────────────────────────
const meshCv = document.getElementById('mesh-cv');
let meshRenderer   = null;
let meshScene      = null;
let meshCamera     = null;
let meshGlbs       = [];   // loaded THREE.Group, one per GLB file
let activeMeshes   = [];   // physics state objects
let meshAnimActive = false;
let meshRafId      = null;
let meshFadeTimer  = null;

// (audio reactivity removed — createMediaElementSource breaks long audio routing)

function initThree() {
  if (typeof THREE === 'undefined') { console.log('d93: Three.js not found'); return; }
  try {
    meshCv.width  = window.innerWidth;
    meshCv.height = window.innerHeight;
    meshRenderer = new THREE.WebGLRenderer({ canvas: meshCv, alpha: true, antialias: true });
    meshRenderer.setSize(window.innerWidth, window.innerHeight);
    meshRenderer.setClearColor(0x000000, 0);
    meshScene = new THREE.Scene();
    const W = window.innerWidth, H = window.innerHeight;
    meshCamera = new THREE.OrthographicCamera(-W/2, W/2, H/2, -H/2, -1000, 1000);
    meshCamera.position.z = 100;
    console.log('d93: Three.js init');
  } catch(e) {
    console.log('d93: Three.js init failed', e && (e.message || e));
    meshRenderer = null;
  }
}

function updateMeshCamera() {
  if (!meshCamera || !meshRenderer) return;
  const W = window.innerWidth, H = window.innerHeight;
  meshCamera.left   = -W/2; meshCamera.right  =  W/2;
  meshCamera.top    =  H/2; meshCamera.bottom = -H/2;
  meshCamera.updateProjectionMatrix();
  meshRenderer.setSize(W, H);
}

function loadMeshGlbs() {
  if (typeof THREE === 'undefined' || !THREE.GLTFLoader) {
    console.log('d93: GLTFLoader unavailable'); return;
  }
  const lineMat = new THREE.LineBasicMaterial({
    color: new THREE.Color(MESH_CFG.meshColor),
    depthTest: false
  });
  const loader = new THREE.GLTFLoader();
  for (let i = 1; i <= 5; i++) {
    (function(idx) {
      loader.load('Explore_mesh' + idx + '.glb', function(gltf) {
        const grp = gltf.scene;
        const toRemove = [], toAdd = [];
        grp.traverse(function(child) {
          if (child.isMesh) {
            // Convert solid mesh → edge wireframe
            const edges = new THREE.EdgesGeometry(child.geometry, 15);
            const lines = new THREE.LineSegments(edges, lineMat);
            lines.position.copy(child.position);
            lines.rotation.copy(child.rotation);
            lines.scale.copy(child.scale);
            lines.renderOrder = 999;
            toAdd.push({ parent: child.parent, obj: lines });
            toRemove.push(child);
          }
        });
        toRemove.forEach(function(c) { c.parent.remove(c); });
        toAdd.forEach(function(item) { item.parent.add(item.obj); });
        grp.visible = false;
        meshScene.add(grp);
        meshGlbs.push(grp);
        console.log('d93: mesh loaded (wire)', idx, '(' + meshGlbs.length + '/5)');
      }, undefined, function(err) {
        console.log('d93: mesh load error', idx, err && (err.message || err));
      });
    }(i));
  }
}

function getAudioEnergy() { return 0; } // placeholder — audio reactivity removed

function scaleMeshGroup(grp) {
  grp.scale.set(1, 1, 1); // reset before measuring so scale doesn't compound across SILENCE cycles
  const box = new THREE.Box3().setFromObject(grp);
  const sz  = new THREE.Vector3();
  box.getSize(sz);
  const maxDim = Math.max(sz.x, sz.y, sz.z);
  if (maxDim > 0) {
    const target = Math.min(window.innerWidth, window.innerHeight) * 0.25;
    const s = target / maxDim;
    grp.scale.set(s, s, s);
  }
}

function enterMeshOverlay() {
  if (!meshRenderer || !meshScene) return;
  if (!meshGlbs.length) { console.log('d93: no GLBs loaded yet'); return; }

  if (meshFadeTimer) { clearTimeout(meshFadeTimer); meshFadeTimer = null; }
  meshGlbs.forEach(function(g) { g.visible = false; });
  activeMeshes = [];

  // Pick 2–3 random meshes without repeats
  const count = MESH_CFG.meshCountMin +
    Math.floor(Math.random() * (MESH_CFG.meshCountMax - MESH_CFG.meshCountMin + 1));
  const pool   = meshGlbs.slice();
  const chosen = [];
  for (let i = 0; i < count && pool.length; i++) {
    chosen.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }

  const W = window.innerWidth, H = window.innerHeight;
  chosen.forEach(function(grp) {
    scaleMeshGroup(grp);
    const userScale = 0.4 + Math.random() * 0.8; // 0.4–1.2
    grp.scale.multiplyScalar(userScale);

    const margin = 80;
    grp.position.set(
      (Math.random() - 0.5) * (W - margin * 2),
      (Math.random() - 0.5) * (H - margin * 2),
      0
    );
    // 2D: flat on screen, random Z rotation only
    grp.rotation.set(0, 0, Math.random() * Math.PI * 2);
    grp.visible = true;

    const spd = 0.2 + Math.random() * 0.5;
    const ang = Math.random() * Math.PI * 2;
    const sign = Math.random() < 0.5 ? 1 : -1;
    activeMeshes.push({
      mesh:         grp,
      vel:          { x: Math.cos(ang) * spd, y: Math.sin(ang) * spd },
      angVelZ:      sign * (0.003 + Math.random() * 0.012), // Z-only spin
      drag:         0.996,
      gravity:      0.0005, // very light drift
      mass:         0.8 + Math.random() * 0.6,
      impulseTimer: 90 + Math.floor(Math.random() * 120),
      impulseCount: Math.floor(Math.random() * 90), // stagger impulses
      phase:        Math.random() * Math.PI * 2,    // unique oscillation phase
      driftAmp:     0.08 + Math.random() * 0.14,    // sinusoidal drift strength
      driftFreq:    0.00025 + Math.random() * 0.00025 // oscillation speed
    });
  });

  // Fade in
  meshCv.style.display    = 'block';
  meshCv.style.transition = 'none';
  meshCv.style.opacity    = '0';
  requestAnimationFrame(function() {
    meshCv.style.transition = 'opacity ' + MESH_CFG.meshFadeIn + 'ms ease';
    requestAnimationFrame(function() { meshCv.style.opacity = '1'; });
  });

  meshAnimActive = true;
  if (!meshRafId) meshLoop();
  console.log('d93: mesh overlay SILENCE enter,', activeMeshes.length, 'meshes');
}

function exitMeshOverlay() {
  const dur = MESH_CFG.meshOverlapDurMin +
    Math.random() * (MESH_CFG.meshOverlapDurMax - MESH_CFG.meshOverlapDurMin);
  console.log('d93: mesh overlay SILENCE exit, overlap', Math.round(dur), 'ms');

  meshFadeTimer = setTimeout(function() {
    meshCv.style.transition = 'opacity ' + MESH_CFG.meshFadeOut + 'ms ease';
    meshCv.style.opacity    = '0';
    meshFadeTimer = setTimeout(function() {
      meshAnimActive = false;
      meshCv.style.display = 'none';
      meshGlbs.forEach(function(g) { g.visible = false; });
      activeMeshes  = [];
      meshFadeTimer = null;
      console.log('d93: mesh overlay hidden');
    }, MESH_CFG.meshFadeOut);
  }, dur);
}

function meshLoop() {
  if (!meshAnimActive) { meshRafId = null; return; }
  meshRafId = requestAnimationFrame(meshLoop);

  const W     = window.innerWidth;
  const H     = window.innerHeight;
  const halfW = W / 2, halfH = H / 2;
  const margin = 60;
  const t = performance.now();

  activeMeshes.forEach(function(s) {
    // Light gravity + drag
    s.vel.y -= s.gravity * s.mass;
    s.vel.x *= s.drag;
    s.vel.y *= s.drag;

    // Sinusoidal drift layered on top of velocity — gives slow organic float
    s.mesh.position.x += s.vel.x + Math.sin(t * s.driftFreq + s.phase) * s.driftAmp;
    s.mesh.position.y += s.vel.y + Math.cos(t * s.driftFreq * 0.71 + s.phase * 1.3) * s.driftAmp * 0.85;

    // Z-only rotation with gentle oscillation in speed
    s.mesh.rotation.z += s.angVelZ * (1 + 0.35 * Math.sin(t * 0.0006 + s.phase));

    // Soft bounce — wider tolerance so mesh lingers near edges
    if (s.mesh.position.x >  halfW - margin) { s.mesh.position.x =  halfW - margin; s.vel.x *= -0.5; }
    if (s.mesh.position.x < -(halfW - margin)) { s.mesh.position.x = -(halfW - margin); s.vel.x *= -0.5; }
    if (s.mesh.position.y >  halfH - margin) { s.mesh.position.y =  halfH - margin; s.vel.y *= -0.5; }
    if (s.mesh.position.y < -(halfH - margin)) { s.mesh.position.y = -(halfH - margin); s.vel.y *= -0.5; }

    // Infrequent gentle impulse — keeps motion from settling
    s.impulseCount++;
    if (s.impulseCount >= s.impulseTimer) {
      const ia = Math.random() * Math.PI * 2;
      const is = 0.3 + Math.random() * 0.8;
      s.vel.x += Math.cos(ia) * is;
      s.vel.y += Math.sin(ia) * is;
      // Occasionally flip spin direction for organics
      if (Math.random() < 0.25) s.angVelZ *= -1;
      s.impulseCount = 0;
      s.impulseTimer = 90 + Math.floor(Math.random() * 120);
    }
  });

  meshRenderer.render(meshScene, meshCamera);
}

// ── State machine ─────────────────────────────────────────────────────────────
function enterHold(ts) {
  engineState   = 'HOLD';
  stateStartTs  = ts;
  currentHoldMs = computeHoldMs();
}

function doAdvance(ts) {
  const fromSilence = engineState === 'SILENCE';
  currentIndex = computeNext(currentIndex);
  enterHold(ts);
  audioTriggerShort();
  if (fromSilence) {
    audioStopLong();
    exitMeshOverlay();
  }
}

function advanceFromHold(ts) {
  if (Math.random() < CFG.silenceProb) enterSilence(ts);
  else                                  doAdvance(ts);
}

// ── Frame loop ────────────────────────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  rafId  = requestAnimationFrame(frame);

  if (cutterActive) updateCuts(dt);

  if (isPlaying && images.length) {
    const elapsed = ts - stateStartTs;
    if (engineState === 'HOLD' && elapsed >= currentHoldMs) {
      advanceFromHold(ts);
    } else if (engineState === 'SILENCE' && elapsed >= silFadeMs + silHoldMs + silFadeMs) {
      doAdvance(ts);
    }
  }

  drawFrame(ts - stateStartTs);
}

function startAnim() {
  if (rafId) cancelAnimationFrame(rafId);
  lastTs = performance.now();
  rafId  = requestAnimationFrame(frame);
}

// ── Image loading ─────────────────────────────────────────────────────────────
async function loadImages() {
  const loaded = [];
  await Promise.all(IMAGE_SRCS.map(src => new Promise(resolve => {
    const img = new Image();
    img._filename = src.split('/').pop();
    img.onload  = () => { loaded.push(img); resolve(); };
    img.onerror = () => resolve();
    img.src     = src;
  })));

  if (!loaded.length) return;

  images = loaded.sort((a, b) =>
    (a._filename || '').localeCompare(b._filename || '', undefined, {numeric: true, sensitivity: 'base'})
  );

  currentIndex = Math.floor(Math.random() * images.length);
  isPlaying    = true;
  engineState  = 'HOLD';
  stateStartTs = performance.now();
  currentHoldMs = computeHoldMs();

  cutterActive = true;
  spawnCuts(CFG.cutterAmount);

  setTimeout(() => { document.getElementById('back').style.opacity = '1'; }, 2000);
}

// ── Init ──────────────────────────────────────────────────────────────────────
startAnim();
loadImages();
initAudioEls();
setTimeout(unlockAudio, 300);
initThree();
loadMeshGlbs();
</script>
