<script>
// ── Preset configuration (matches production screenshot) ─────────────────────
function dayOfYear(d){ var s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function daySeed(){ var d=new Date(); return d.getFullYear()*1000+dayOfYear(d); }
function seededRand(seed){ var x=Math.sin(seed)*10000; return x-Math.floor(x); }
var SIL_SEED = daySeed();

function drawSilField() {
  var svg = document.getElementById('sil-field');
  if (!svg) return;
  var w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', '0 0 '+w+' '+h);
  var camX = (seededRand(SIL_SEED+1)-0.5)*40;
  var camTilt = (seededRand(SIL_SEED+2)-0.5)*0.02;
  var vpX = w*0.5+camX, vpY = h*0.62;
  var lines = '';
  var bands = 18;
  for (var i=0; i<=bands; i++) {
    var t=i/bands, y=vpY+Math.pow(t,1.8)*(h-vpY), op=(0.70*(1-t*0.55)).toFixed(3);
    lines += '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.55)" stroke-width="0.75" opacity="'+op+'"/>';
  }
  var cols = 16;
  for (var i=0; i<=cols; i++) {
    var x=(i/cols)*w;
    lines += '<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="rgba(255,255,255,0.55)" stroke-width="0.75" opacity="0.55"/>';
  }
  var ay = Math.sin(camTilt);
  lines += '<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+(vpY+ay*w)+'" stroke="rgba(255,255,255,0.70)" stroke-width="0.75" opacity="0.75"/>';
  lines += '<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="rgba(255,255,255,0.70)" stroke-width="0.75" opacity="0.70"/>';
  var gx=vpX, gy=vpY, r=9;
  lines += '<circle cx="'+gx+'" cy="'+gy+'" r="'+r+'" fill="none" stroke="#fff" stroke-width="1.0" stroke-dasharray="2 3" opacity="0.55"/>';
  lines += '<line x1="'+(gx-r-4)+'" y1="'+gy+'" x2="'+(gx+r+4)+'" y2="'+gy+'" stroke="#fff" stroke-width="1.0" opacity="0.55"/>';
  lines += '<line x1="'+gx+'" y1="'+(gy-r-4)+'" x2="'+gx+'" y2="'+(gy+r+4)+'" stroke="#fff" stroke-width="1.0" opacity="0.55"/>';
  if (w >= 720) {
    var upperBand = vpY*0.72;
    for (var i=0; i<4; i++) {
      var s1=seededRand(SIL_SEED+100+i*3.1), s2=seededRand(SIL_SEED+200+i*5.7);
      var s3=seededRand(SIL_SEED+300+i*2.3), s4=seededRand(SIL_SEED+350+i*4.9);
      var x1=s1*w, y1=s2*upperBand, x2=s3*w, y2=s4*upperBand;
      if (s2>0.5) {
        var mx=(x1+x2)/2+(s3-0.5)*140, my=(y1+y2)/2+(s1-0.5)*70;
        lines += '<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="rgba(255,255,255,0.50)" stroke-width="0.75" opacity="'+(0.40+s4*0.20).toFixed(3)+'"/>';
      } else {
        lines += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="rgba(255,255,255,0.50)" stroke-width="0.75" opacity="'+(0.40+s1*0.20).toFixed(3)+'"/>';
      }
    }
    var s1=seededRand(SIL_SEED+600), s2=seededRand(SIL_SEED+700);
    lines += '<line x1="'+(s1*w*0.4).toFixed(1)+'" y1="'+(s2*upperBand*0.5).toFixed(1)+'" x2="'+((0.5+s2*0.5)*w).toFixed(1)+'" y2="'+((0.4+s1*0.6)*upperBand).toFixed(1)+'" stroke="rgba(255,255,255,0.50)" stroke-width="0.75" opacity="0.40"/>';
  }
  svg.innerHTML = lines;
}

// ── Shape appearance timing constants ─────────────────────────────────────────
const SHAPES_HINT_MS     = 500;
const SHAPES_PULSE_MS    = 2700;
const SHAPES_CONVERGE_MS = 6000;
const SHAPES_MACRO_MS    = 15000;

const CFG = {
  holdMode:       'CLUSTER',
  holdFixed:      120,
  holdMin:        5,
  holdMax:        50,
  holdSlowMin:    80,
  holdSlowMax:    250,
  holdCurve:      'BOTH',
  clusterFastMin: 4,
  clusterFastMax: 12,
  clusterSlowMin: 3,
  clusterSlowMax: 8,
  transType:      'NONE',
  musicVolHigh: 0.7,          // volume during SILENCE
  musicVolLow:  0.22,         // volume during fast sequence (~-10dB)
  musicFadeIn:  1.5,          // seconds to fade up when silence starts
  musicFadeOut: 2.5,          // seconds to fade down when silence ends
  // Silence: ~16% probability, white flash
  silenceIntervalMin: 6000,
  silenceIntervalMax: 16000,
  silenceDurMin:  4800,
  silenceDurMax:  5000,
  silenceFade:    450,
  silenceInColor: '#ffffff',
  silenceOutColor:'#ffffff',
  silenceOpacity: 1.0,
  // Cutter: thin white static clusters
  cutterAmount:   8,
  cutterCluster:  3,
  cutterSpread:   60,
  cutterWideness: 1,
  cutterOrganics: 35,
  cutterSkew:     4,
  cutterColor:    '#ffffff',
  cutterSpeed:    0,
  cutterRenewal:  40,
};

// ── Audio configuration ───────────────────────────────────────────────────────
const AUDIO_CFG = {
  shortPoolCount:  21,
  longPoolCount:   10,
  shortPoly:       false,  // true = up to shortPolyVoices simultaneous
  longPoly:        false,  // true = up to longPolyVoices simultaneous
  shortPolyVoices: 4,
  longPolyVoices:  4,
  masterVol:       1.0,
};

// ── Image paths — put 60 files in explore/ named 001.jpg … 060.jpg ──────────
const IMAGE_SRCS = Array.from({length: 60}, (_, i) =>
  `explore/${String(i + 1).padStart(3, '0')}.jpg`
);

// ── Canvas ───────────────────────────────────────────────────────────────────
const cv  = document.getElementById('cv');
const ctx = cv.getContext('2d');
let CW, CH;

function sizeCanvas() {
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  CW = cv.width; CH = cv.height;
}
sizeCanvas();
window.addEventListener('resize', () => {

});

// ── Engine state ─────────────────────────────────────────────────────────────
let engineState    = 'IDLE';
let stateStartTs   = 0;
let currentHoldMs  = 0;
let currentTransMs = 0;
let isPlaying      = false;
let rafId          = null;
let lastTs         = 0;

// ── Images ────────────────────────────────────────────────────────────────────
let images        = [];
let currentIndex  = 0;
let outgoingIndex = 0;
let incomingIndex = 0;
let shuffleQueue  = [];

// ── Silence ───────────────────────────────────────────────────────────────────
let lastSilenceEndTs = -Infinity;
let nextSilenceMs    = 3000 + Math.random() * 5000;
let silTotalMs       = 5000;
let silenceBlack     = 0;
let silFadeMs        = CFG.silenceFade;
let silHoldMs        = 0;
let silOpacity       = CFG.silenceOpacity;

// ── Cluster / Roll ────────────────────────────────────────────────────────────
let clusterMode      = 'FAST';
let clusterRemaining = 0;
let rollMode         = false;
let rollRampUp       = true;
let rollStartTs      = 0;
let rollDurMs        = 0;
let lastRollEndTs    = 0;
let nextRollMs       = 10000;

// ── Cutter ────────────────────────────────────────────────────────────────────
let cutterActive = false;
let cuts         = [];

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx        = null;
let shortBuffers    = [];
let currentShortSrc = null;
let shortFilter     = null;
let shortPitchRate  = 1.0;
let audioReady      = false;
let unlocking       = false;
let musicEl         = null;
let musicGain       = null;
let musicStarted    = false;
let longPool        = null;
let long2Pool       = null;
let transPool       = null;

// ── Riser ─────────────────────────────────────────────────────────────────────
let musicFadeTimer = null;
let riserPlaying = false;
let riserEl      = null;
let riserStartTs = 0;
let riserLeadMs  = 3500;

// ── Macro pull ────────────────────────────────────────────────────────────────
let macroActive    = false;
let macroPull      = 0;
let macroDragging  = false;
let macroStartY    = 0;
let macroPullStart = 0;
let macroYOffset   = 0;
let reverbNode     = null;
let reverbGain     = null;
let music2El       = null;
let music2Gain     = null;

// ── First silence mesh ────────────────────────────────────────────────────────
let silMeshRenderer = null;
let silMeshScene    = null;
let silMeshCamera   = null;
let silMeshRoot     = null;
let silMeshRaf       = null;
let silMeshStartTs   = 0;
let firstSilenceDone = false;
let filterRampDone   = false;
let silMeshBaseScale = 1.0;

// ── Shapes ────────────────────────────────────────────────────────────────────
let shapesFloating    = false;
let shapeFloatT       = 0;
let shapesConverging  = false;
let silenceCount      = 0;
let shapesShown       = false;
let convergeProgress  = 0;
let helperFadeStartTs = 0;
let convergeDriftRect = {x:0, y:0};
let convergeDriftTri  = {x:0, y:0};
let convergeDriftCirc = {x:0, y:0};
let shape1Touched     = false;
let shape1Active      = false;
let shape1Fading      = false;
let shape1MacroActive = false;
let shape2Active      = false;
let shape2ExitCount   = 0;
let shape2BrightFrom  = 1.0;
let shape2FadeStart   = null;
let shape3Active      = false;

// ── Interaction / Visual ──────────────────────────────────────────────────────
let tempoScale       = 1.0;
let tempoTweenStart  = null;
let tempoTweenFrom   = 1.0;
let brightnessOverlay = 0;
let audioSpike       = 0;
let lfoFreq          = 2000;
let lfoTarget        = 2000;
let lfoTimer         = 0;
let triEffectStrength = 0;
let mouseBrightness  = 1.0;

// ── Pixel effect ──────────────────────────────────────────────────────────────
let pixelSpikeVal   = 0;
let pixelSpikeTimer = 0;
let effectivePixel  = 0;
let pixelCanvas     = null;
let pixelCtx        = null;

// ── Helpers ───────────────────────────────────────────────────────────────────
function randBetween(lo, hi) {
  return lo + Math.random() * (hi - lo);
}

function computeHoldMs() {
  if (rollMode) {
    var rollElapsed = performance.now() - rollStartTs;
    var t = Math.min(rollElapsed / rollDurMs, 1);
    var interval = rollRampUp ? (3 + t * 17) : (20 - t * 17);
    return interval * tempoScale;
  }
  if (clusterRemaining <= 0) {
    clusterMode = (clusterMode === 'FAST') ? 'SLOW' : 'FAST';
    var runMin = (clusterMode === 'FAST') ? CFG.clusterFastMin : CFG.clusterSlowMin;
    var runMax = (clusterMode === 'FAST') ? CFG.clusterFastMax : CFG.clusterSlowMax;
    clusterRemaining = Math.round(randBetween(runMin, runMax));
  }
  clusterRemaining--;
  if (clusterMode === 'FAST') return randBetween(CFG.holdMin, CFG.holdMax) * tempoScale;
  else                        return randBetween(CFG.holdSlowMin, CFG.holdSlowMax) * tempoScale;
}

function computeNext(current) {
  const total = images.length;
  if (!total) return 0;
  return Math.floor(Math.random() * total); // always RANDOM
}

// ── Cutter ────────────────────────────────────────────────────────────────────
function cutColorHex(val) {
  const v = Math.round(255 - 255 * (val / 100));
  const h = v.toString(16).padStart(2, '0');
  return `#${h}${h}${h}`;
}

function rebakeCorners(cut) {
  const org = CFG.cutterOrganics / 100;
  cut.orgCorners = Array.from({length: 4}, () => org * 10 * (Math.random() - 0.5));
}

function spawnCut() {
  const spreadPct   = CFG.cutterSpread / 100;
  const widenessPct = CFG.cutterWideness / 100;
  const organicsPct = CFG.cutterOrganics / 100;
  const speedVal    = CFG.cutterSpeed;
  const renewalPct  = CFG.cutterRenewal / 100;
  const skewPct     = CFG.cutterSkew / 100;

  const axis     = Math.random() < 0.5 ? 'H' : 'V';
  const crossLen = axis === 'H' ? CH : CW;

  const halfSpread = 0.2 + 0.3 * spreadPct;
  const pos = crossLen * (0.5 - halfSpread) + Math.random() * crossLen * halfSpread * 2;

  const isWide = Math.random() < widenessPct * 0.8 + 0.1;
  const width  = isWide
    ? 8 + Math.pow(Math.random(), Math.max(0.01, 1 - widenessPct * 0.7)) * 52
    : 1 + Math.random() * 3;

  const speedPct = speedVal / 100;
  const speed    = Math.random() < speedPct ? (Math.random() * 2 - 1) * speedVal * 3 : 0;

  const orgCorners = Array.from({length: 4}, () => organicsPct * 10 * (Math.random() - 0.5));

  const maxAge = renewalPct === 0
    ? Infinity
    : (2000 + Math.random() * 6000) * (1 - renewalPct * 0.85);

  const skew = (Math.random() * 2 - 1) * skewPct * Math.max(CW, CH) * 0.5;

  return { axis, pos, width, speed, skew, orgCorners, age: 0, maxAge, fadingOut: false, fadeOutStart: 0 };
}

function spawnCuts(n) {
  cuts = [];
  const strength   = CFG.cutterCluster;
  const organicsPct = CFG.cutterOrganics / 100;
  const skewPct    = CFG.cutterSkew / 100;
  const speedVal   = CFG.cutterSpeed;
  const renewalPct = CFG.cutterRenewal / 100;
  const spreadPct  = CFG.cutterSpread / 100;

  if (strength === 0 || n === 0) {
    for (let i = 0; i < n; i++) cuts.push(spawnCut());
  } else {
    const numZones = Math.max(1, Math.round(1 + Math.random() * strength * 0.7));
    let placed = 0;

    for (let z = 0; z < numZones && placed < n; z++) {
      const axis     = Math.random() < 0.5 ? 'H' : 'V';
      const crossLen = axis === 'H' ? CH : CW;
      const halfSpread = 0.2 + 0.3 * spreadPct;
      let pos = crossLen * (0.5 - halfSpread) + Math.random() * crossLen * halfSpread * 2;

      const density   = Math.pow(Math.random(), 0.4);
      const numStrips = Math.round(2 + density * strength * 4);

      for (let i = 0; i < numStrips && placed < n; i++) {
        if (pos >= crossLen) break;
        const r = Math.random();
        let thick;
        if      (r < 0.60) thick = 1  + Math.floor(Math.random() * 3);
        else if (r < 0.85) thick = 4  + Math.floor(Math.random() * 6);
        else               thick = 10 + Math.floor(Math.random() * 14);
        const ct = Math.min(thick, crossLen - pos);
        if (ct < 1) break;

        const speedPct   = speedVal / 100;
        const speed      = Math.random() < speedPct ? (Math.random() * 2 - 1) * speedVal * 3 : 0;
        const skew       = (Math.random() * 2 - 1) * skewPct * Math.max(CW, CH) * 0.5;
        const orgCorners = Array.from({length: 4}, () => organicsPct * 10 * (Math.random() - 0.5));
        const maxAge     = renewalPct === 0
          ? Infinity
          : (2000 + Math.random() * 6000) * (1 - renewalPct * 0.85);

        cuts.push({ axis, pos, width: ct, speed, skew, orgCorners, age: 0, maxAge, fadingOut: false, fadeOutStart: 0 });
        pos += ct;
        placed++;
      }
    }
    while (placed < n) { cuts.push(spawnCut()); placed++; }
  }
}

function updateCuts(dt) {
  const target   = CFG.cutterAmount;
  const toRemove = [];

  cuts.forEach((cut, idx) => {
    cut.age += dt * 1000;

    if (cut.speed !== 0) {
      cut.pos += cut.speed * dt;
      const crossLen = cut.axis === 'H' ? CH : CW;
      if (cut.speed > 0 && cut.pos > crossLen) {
        cut.pos = -cut.width; rebakeCorners(cut);
        cut.age = 0; cut.fadingOut = false;
      } else if (cut.speed < 0 && cut.pos + cut.width < 0) {
        cut.pos = crossLen; rebakeCorners(cut);
        cut.age = 0; cut.fadingOut = false;
      }
    }

    if (!cut.fadingOut && isFinite(cut.maxAge) && cut.age >= cut.maxAge) {
      cut.fadingOut = true; cut.fadeOutStart = cut.age;
    }
    if (cut.fadingOut && (cut.age - cut.fadeOutStart) >= 200) toRemove.push(idx);
  });

  for (let i = toRemove.length - 1; i >= 0; i--) {
    cuts.splice(toRemove[i], 1);
    if (cuts.length < target) cuts.push(spawnCut());
  }
  while (cuts.length < target) cuts.push(spawnCut());
}

function drawSingleCut(c, cut, W, H, scale) {
  const pos = cut.pos * scale;
  const w   = cut.width * scale;
  const sk  = cut.skew * scale;
  const oc  = cut.orgCorners.map(v => v * scale);

  c.beginPath();
  if (cut.axis === 'H') {
    c.moveTo(0, pos + oc[0]);
    c.lineTo(W, pos + sk + oc[1]);
    c.lineTo(W, pos + w + sk + oc[2]);
    c.lineTo(0, pos + w + oc[3]);
  } else {
    c.moveTo(pos + oc[0],    0);
    c.lineTo(pos + sk + oc[3], H);
    c.lineTo(pos + w + sk + oc[2], H);
    c.lineTo(pos + w + oc[1], 0);
  }
  c.closePath();
  c.fill();
}

function drawCuts(c, W, H) {
  if (!cuts.length) return;
  c.fillStyle = CFG.cutterColor;
  cuts.forEach(cut => {
    const alpha = cut.fadingOut
      ? Math.max(0, 1 - (cut.age - cut.fadeOutStart) / 200)
      : Math.min(1, cut.age / 200);
    if (alpha <= 0) return;
    c.globalAlpha = alpha;
    drawSingleCut(c, cut, W, H, 1);
  });
  c.globalAlpha = 1;
}

// ── Silence ───────────────────────────────────────────────────────────────────
function enterSilence(ts) {
  stopRiser();
  if (musicFadeTimer) { clearTimeout(musicFadeTimer); musicFadeTimer = null; }
  if (firstSilenceDone && !filterRampDone) {
    filterRampDone = true;
    if (reverbGain && audioCtx) reverbGain.gain.value = 0;
  }
  silenceCount++;
  if (silenceCount === 2 && !shapesShown && images.length) {
    shapesShown = true;
    showShapes();
    scheduleShapeTimers();
  }
  const baseDur = CFG.silenceDurMin + Math.random() * (CFG.silenceDurMax - CFG.silenceDurMin);
  const totalMs = firstSilenceDone ? baseDur : 999999;
  silTotalMs   = totalMs;
  silenceBlack = 0;
  silFadeMs    = CFG.silenceFade;
  silHoldMs    = Math.max(0, totalMs - silFadeMs * 2);
  silOpacity   = CFG.silenceOpacity;
  engineState  = 'SILENCE';
  stateStartTs = ts;
  longPool.trigger();
  long2Pool.trigger();
  if (!musicStarted) initMusic();
  else musicFadeTo(CFG.musicVolHigh, CFG.musicFadeIn);
  drawSilField();
  if (!firstSilenceDone) {
    cutterActive = false;
    cuts = [];
    setTimeout(function() { showSilMesh(performance.now()); }, 310);
    document.addEventListener('mousemove',  onFirstSilenceDismiss, { once: true });
    document.addEventListener('touchstart', onFirstSilenceDismiss, { once: true, passive: true });
  }
}

function drawSilenceOverlay(c, W, H, elapsed) {
  const sf = document.getElementById('sil-field');

  // Past total silence duration: hide grid and stop
  if (elapsed >= silTotalMs) {
    if (sf) sf.style.opacity = '0';
    return;
  }

  // 0–8ms: pure white flash
  if (elapsed < 8) {
    c.fillStyle = '#ffffff';
    c.globalAlpha = 1.0;
    c.fillRect(0, 0, W, H);
    c.globalAlpha = 1;
    if (sf) sf.style.opacity = '0';
    return;
  }

  // 8ms–308ms: white fades out, black fades in
  const fadeMs = 300;
  const ft = Math.min((elapsed - 8) / fadeMs, 1);

  const whiteAlpha = Math.pow(1 - ft, 3);
  if (whiteAlpha > 0.005) {
    c.fillStyle = '#ffffff';
    c.globalAlpha = whiteAlpha;
    c.fillRect(0, 0, W, H);
    c.globalAlpha = 1;
  }

  const blackAlpha = Math.pow(ft, 2);
  if (blackAlpha > 0.005) {
    c.fillStyle = '#000000';
    c.globalAlpha = blackAlpha;
    c.fillRect(0, 0, W, H);
    c.globalAlpha = 1;
  }

  // Grid: hidden until gridStart, then fades in over 1500ms
  if (sf) {
    const gridStart = firstSilenceDone ? 2000 : 7000;
    if (elapsed < gridStart) {
      sf.style.opacity = '0';
    } else {
      const gridT = Math.min((elapsed - gridStart) / 1500, 1);
      sf.style.opacity = gridT.toFixed(3);
    }
  }
}

// ── Drawing ───────────────────────────────────────────────────────────────────
function drawImageCovered(c, img, W, H) {
  if (!img || !img.complete || !img.naturalWidth) return;
  const sc = Math.max(W / img.naturalWidth, H / img.naturalHeight);
  const dw = img.naturalWidth * sc, dh = img.naturalHeight * sc;
  c.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
}

function drawTransitionFrame(c, out, inc, progress, W, H) {
  // TRANS is always NONE in this config — kept for completeness
  drawImageCovered(c, images[out], W, H);
  c.globalAlpha = progress;
  drawImageCovered(c, images[inc], W, H);
  c.globalAlpha = 1;
}

function drawFrame(elapsed) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, CW, CH);

  if (!images.length) return;

  if (!isPlaying || engineState === 'HOLD') {
    drawImageCovered(ctx, images[currentIndex], CW, CH);
  } else if (engineState === 'TRANSITION') {
    const progress = Math.min(elapsed / currentTransMs, 1);
    drawTransitionFrame(ctx, outgoingIndex, incomingIndex, progress, CW, CH);
  } else if (engineState === 'SILENCE') {
    drawImageCovered(ctx, images[currentIndex], CW, CH);
    drawSilenceOverlay(ctx, CW, CH, elapsed);
  }

  if (cutterActive) drawCuts(ctx, CW, CH);

  // Brightness overlay — after cuts so it affects everything
  if (brightnessOverlay > 0.01 && engineState !== 'SILENCE') {
    ctx.save();
    ctx.globalAlpha = brightnessOverlay;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, CW, CH);
    ctx.restore();
  }

  // Silence blackout — quartic crash to black in final 65% of silence window
  if (engineState === 'SILENCE') {
    var sp = Math.min(elapsed / silTotalMs, 1);
    if (sp >= 0.30) {
      var t = (sp - 0.30) / (0.95 - 0.30);
      silenceBlack = Math.pow(Math.min(t, 1), 12);
    } else {
      silenceBlack = 0;
    }
  } else {
    silenceBlack = silenceBlack > 0.005 ? silenceBlack * 0.88 : 0;
  }
  if (silenceBlack > 0.005) {
    ctx.save();
    ctx.globalAlpha = silenceBlack;
    ctx.fillStyle   = '#000';
    ctx.fillRect(0, 0, CW, CH);
    ctx.restore();
  }

  if (effectivePixel > 0.01 && pixelCanvas && engineState !== 'SILENCE') {
    var blockSize = Math.max(2, Math.round(2 + effectivePixel * 30));
    var colorBits = Math.max(1, Math.round(8 - effectivePixel * 7));
    var sw = Math.ceil(CW / blockSize);
    var sh = Math.ceil(CH / blockSize);
    pixelCanvas.width  = sw;
    pixelCanvas.height = sh;
    pixelCtx.drawImage(cv, 0, 0, sw, sh);
    if (colorBits < 7) {
      var id = pixelCtx.getImageData(0, 0, sw, sh);
      var d  = id.data;
      var step = 256 / Math.pow(2, colorBits);
      for (var i = 0; i < d.length; i += 4) {
        d[i]   = Math.floor(d[i]   / step) * step;
        d[i+1] = Math.floor(d[i+1] / step) * step;
        d[i+2] = Math.floor(d[i+2] / step) * step;
      }
      pixelCtx.putImageData(id, 0, 0);
    }
    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(pixelCanvas, 0, 0, CW, CH);
    ctx.restore();
  }
}

// ── Audio ─────────────────────────────────────────────────────────────────────
// Short sounds: Web Audio API (AudioContext + BufferSource, iOS-reliable)
// Long sounds:  <audio> elements (sustained, already work on iOS)

(function() {
  var s = parseFloat(localStorage.getItem('d93vol'));
  var vol   = isNaN(s) ? 0.3162 : Math.max(0, Math.min(1, s));
  var muted = localStorage.getItem('d93mute') === '1';
  window._d93vol = function() { return muted ? 0 : vol; };
})();

function getVol() { return (window._d93vol ? window._d93vol() : 1) * AUDIO_CFG.masterVol; }

function dismissFirstSilence(ts) {
  if (firstSilenceDone) return;
  firstSilenceDone = true;
  hideSilMesh();
  initReverb();
  cutterActive = true;
  spawnCuts(CFG.cutterAmount);
  longPool.stop();
  long2Pool.stop();
  lastSilenceEndTs = ts;
  nextSilenceMs    = CFG.silenceIntervalMin + Math.random() * (CFG.silenceIntervalMax - CFG.silenceIntervalMin);
  riserLeadMs      = Math.min(3000 + Math.random() * 1000, nextSilenceMs - 500);
  const fadeAt = Math.max(2000, nextSilenceMs - 500);
  musicFadeTimer = setTimeout(function() {
    musicFadeTo(CFG.musicVolLow, 0.5);
    musicFadeTimer = null;
  }, fadeAt);
  currentIndex = computeNext(currentIndex);
  enterHold(ts);
  audioTriggerShort();
  console.log('d93: first silence dismissed by interaction');
}

function onFirstSilenceDismiss() {
  if (engineState !== 'SILENCE' || firstSilenceDone) return;
  dismissFirstSilence(performance.now());
}

function initSilMesh() {
  if (typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined') {
    console.warn('d93: Three.js not loaded, skipping sil mesh'); return;
  }
  const canvas = document.getElementById('sil-mesh-canvas');
  if (!canvas || silMeshRenderer) return;
  silMeshRenderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  silMeshRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  silMeshRenderer.setSize(window.innerWidth, window.innerHeight);
  silMeshScene  = new THREE.Scene();
  silMeshCamera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
  silMeshCamera.position.set(0, 0, 5);
  new THREE.GLTFLoader().load('/Indexvector5.glb',
    function(gltf) {
      const root   = gltf.scene;
      const box    = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      root.position.sub(center);
      silMeshBaseScale = 3.0 / Math.max(size.x, size.y, size.z);
      root.scale.setScalar(silMeshBaseScale);
      root.traverse(function(child) {
        if (child.isMesh) {
          child.material = new THREE.MeshBasicMaterial({ color: 0xE85500, wireframe: true });
        }
      });
      silMeshScene.add(root);
      silMeshRoot = root;
      console.log('d93: sil mesh loaded');
    },
    null,
    function(err) { console.error('d93: sil mesh load error', err); }
  );
  window.addEventListener('resize', function() {
    if (!silMeshRenderer) return;
    silMeshCamera.aspect = window.innerWidth / window.innerHeight;
    silMeshCamera.updateProjectionMatrix();
    silMeshRenderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function showSilMesh(ts) {
  const canvas = document.getElementById('sil-mesh-canvas');
  if (canvas) canvas.style.opacity = '1';
  silMeshStartTs = ts || performance.now();
  if (silMeshRaf) cancelAnimationFrame(silMeshRaf);

  let velX = 0;
  let velY = 0.22;   // fast horizontal right from the start
  let velZ = 0;
  const damp = 0.992;

  (function animateSilMesh(now) {
    silMeshRaf = requestAnimationFrame(animateSilMesh);
    if (!silMeshRoot || !silMeshRenderer || !silMeshScene || !silMeshCamera) return;

    const elapsed = now - silMeshStartTs;
    const t       = Math.min(elapsed / 9000, 1);
    const decay   = Math.exp(-t * 3.5);
    const sec     = now / 1000;

    // Phase 2: after 1s, organic X and Z start building in
    if (elapsed > 1000) {
      const t2 = Math.min((elapsed - 1000) / 1000, 1);
      velX += Math.sin(sec * 1.37)         * 0.0010 * decay * t2;
      velZ += Math.sin(sec * 2.11 + 0.73)  * 0.0008 * decay * t2;
    }
    // Slight organic nudge on Y always
    velY += Math.sin(sec * 0.83 + 1.1) * 0.0006 * decay;

    velX *= damp;
    velY *= damp;
    velZ *= damp;

    silMeshRoot.rotation.x += velX;
    silMeshRoot.rotation.y += velY + 0.003;
    silMeshRoot.rotation.z += velZ;

    // Scale: slightly bigger at start, settles to base
    silMeshRoot.scale.setScalar(silMeshBaseScale * (1 + 0.35 * decay));

    silMeshRenderer.render(silMeshScene, silMeshCamera);
  })(silMeshStartTs);
}

function hideSilMesh() {
  const canvas = document.getElementById('sil-mesh-canvas');
  if (canvas) canvas.style.opacity = '0';
  if (silMeshRaf) { cancelAnimationFrame(silMeshRaf); silMeshRaf = null; }
}

function createReverbIR(ctx, duration, decay) {
  const rate     = ctx.sampleRate;
  const length   = Math.ceil(rate * duration);
  const preDelay = Math.floor(rate * 0.04);
  const ir       = ctx.createBuffer(2, length, rate);
  for (let c = 0; c < 2; c++) {
    const ch = ir.getChannelData(c);
    for (let i = preDelay; i < length; i++) {
      const t = (i - preDelay) / (length - preDelay);
      ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
    }
  }
  return ir;
}

function initReverb() {
  if (reverbNode || !audioCtx || !shortFilter) return;
  reverbNode        = audioCtx.createConvolver();
  reverbNode.buffer = createReverbIR(audioCtx, 8.0, 1.2);
  reverbGain        = audioCtx.createGain();
  reverbGain.gain.value = 0;
  shortFilter.connect(reverbNode);
  reverbNode.connect(reverbGain);
  reverbGain.connect(audioCtx.destination);
  console.log('d93: church reverb ready (8s tail)');
}

function loadMusic2() {
  if (music2El) return;
  music2El = document.createElement('audio');
  music2El.crossOrigin = 'anonymous';
  music2El.src = 'https://daysof93-cdn.b-cdn.net/pool-music/Exploremain2.mp3';
  music2El.loop = true;
  music2El.preload = 'auto';
  document.body.appendChild(music2El);
  console.log('d93: music2 preloading');
}

function makeAudioPool(urls, preloadCount) {
  const els = [];
  let idx = 0;
  urls.slice(0, preloadCount).forEach(function(src) {
    const el = document.createElement('audio');
    el.preload = 'auto'; el.src = src;
    document.body.appendChild(el);
    els.push(el);
  });
  return {
    els,
    unlock(defaultVol) {
      els.forEach(function(a) {
        a.volume = 0;
        const p = a.play();
        const v = (typeof defaultVol === 'function') ? defaultVol() : (defaultVol || 0);
        if (p && p.then) {
          p.then(function() { a.pause(); a.currentTime = 0; a.volume = v; })
           .catch(function()  { a.volume = v; });
        } else { a.pause(); a.currentTime = 0; a.volume = v; }
      });
    },
    trigger() {
      if (!audioReady || !els.length) return;
      els[idx].pause(); els[idx].currentTime = 0;
      idx = (idx + 1) % els.length;
      const a = els[idx];
      a.volume = getVol(); a.currentTime = 0;
      a.play().catch(function() {});
    },
    stop() {
      if (!els.length) return;
      els[idx].pause(); els[idx].currentTime = 0;
    },
    random() {
      return els.length ? els[Math.floor(Math.random() * els.length)] : null;
    }
  };
}

function unlockAudio() {
  if (audioReady) {
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
      if (musicEl) musicEl.play().catch(function(){});
    }
    return;
  }
  if (unlocking) return;
  unlocking = true;

  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch(e) { console.log('d93: AudioContext failed', e); unlocking = false; return; }

  shortFilter = audioCtx.createBiquadFilter();
  shortFilter.type = 'lowpass';
  shortFilter.frequency.value = 20000;
  shortFilter.Q.value = 0.5;
  shortFilter.connect(audioCtx.destination);

  // Resume must be called synchronously within gesture context
  if (audioCtx.state === 'suspended') audioCtx.resume();

  // Long <audio> unlock must also be synchronous within gesture context
  longPool.unlock(getVol);
  long2Pool.unlock(getVol);
  transPool.unlock(0);

  // XHR + callback-style decodeAudioData — avoids fetch() CORS mode issues on iOS
  var sBase = 'https://daysof93-cdn.b-cdn.net/pool%20short/short_';
  var sAll  = Array.from({length: AUDIO_CFG.shortPoolCount}, function(_, i) {
    return sBase + String(i+1).padStart(2,'0') + '.wav';
  }).sort(function() { return Math.random()-0.5; });
  var urls = sAll.slice(0, 21);

  function xhrDecode(url) {
    return new Promise(function(resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function() {
        if (xhr.status === 200) {
          audioCtx.decodeAudioData(xhr.response, resolve, reject);
        } else {
          reject(new Error('HTTP ' + xhr.status + ' ' + url));
        }
      };
      xhr.onerror = function() { reject(new Error('XHR error ' + url)); };
      xhr.send();
    });
  }

  Promise.all(urls.map(xhrDecode)).then(function(buffers) {
    shortBuffers = buffers;
    audioReady   = true;
    console.log('d93: audio unlocked, short buffers:', shortBuffers.length);
    if (typeof initMusic === 'function') initMusic();
    if (isPlaying && engineState === 'HOLD') audioTriggerShort();
  }).catch(function(err) {
    console.log('d93: audio unlock failed', err);
    ['touchstart', 'mousedown', 'keydown'].forEach(function(type) {
      document.addEventListener(type, unlockAudio, { once: true });
    });
    unlocking = false;
  });
}

function audioTriggerShort() {
  if (!audioReady || !shortBuffers.length || !audioCtx) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (currentShortSrc) { try { currentShortSrc.stop(); } catch(e) {} currentShortSrc = null; }
  var src  = audioCtx.createBufferSource();
  src.buffer = shortBuffers[Math.floor(Math.random() * shortBuffers.length)];
  src.playbackRate.value = shortPitchRate;
  var gain = audioCtx.createGain();
  gain.gain.value = getVol();
  src.connect(gain);
  gain.connect(shortFilter || audioCtx.destination);
  src.start(0);
  currentShortSrc = src;
  src.onended = function() { if (currentShortSrc === src) currentShortSrc = null; };
  audioSpike = 1.0;
}

function startRiser(ts) {
  if (riserPlaying || !audioReady || !transPool) return;
  riserEl = transPool.random();
  if (!riserEl) return;
  riserEl.currentTime = 0;
  riserEl.volume = 0;
  riserEl.play().catch(function() {});
  riserPlaying = true;
  riserStartTs = ts;
  console.log('d93: riser start, lead=' + riserLeadMs.toFixed(0) + 'ms');
}

function stopRiser() {
  if (riserEl) {
    riserEl.pause();
    riserEl.currentTime = 0;
    riserEl.volume = 0;
    riserEl = null;
  }
  riserPlaying = false;
}


function initMusic() {
  if (musicStarted || !audioCtx) return;
  musicStarted = true;
  musicEl = document.createElement('audio');
  musicEl.src = 'https://daysof93-cdn.b-cdn.net/pool-music/Exploremain.mp3';
  musicEl.loop = true;
  musicEl.crossOrigin = 'anonymous';
  document.body.appendChild(musicEl);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = CFG.musicVolLow;
  audioCtx.createMediaElementSource(musicEl).connect(musicGain);
  musicGain.connect(audioCtx.destination);
  musicEl.play().catch(function(e) { console.log('d93: music error', e); });
}

function musicFadeTo(target, dur) {
  if (!musicGain || !audioCtx) return;
  var now = audioCtx.currentTime;
  musicGain.gain.cancelScheduledValues(now);
  musicGain.gain.setValueAtTime(musicGain.gain.value, now);
  musicGain.gain.linearRampToValueAtTime(target, now + dur);
}

// ── State machine ─────────────────────────────────────────────────────────────
function enterHold(ts) {
  engineState   = 'HOLD';
  stateStartTs  = ts;
  currentHoldMs = computeHoldMs();
}

function showShapes() {
  if (!window.d93GeoEls) return;
  window.d93GeoEls.rect.style.opacity = '1';
  window.d93GeoEls.tri.style.opacity  = '0.3';
  window.d93GeoEls.circ.style.opacity = '1';
  shapesFloating = true;
}

function scheduleShapeTimers() {
  setTimeout(function() {
    if (typeof startConverge === 'function') startConverge();
  }, SHAPES_CONVERGE_MS);
  setTimeout(function() {
    var rect = window.d93GeoEls ? window.d93GeoEls.rect : null;
    if (rect) rect.style.animation = 'geo-rect-pulse 0.6s ease-in-out 4';
  }, SHAPES_PULSE_MS);
  setTimeout(function() { shape1MacroActive = true; }, SHAPES_MACRO_MS);
}

function doAdvance(ts) {
  const fromSilence = engineState === 'SILENCE';
  currentIndex = computeNext(currentIndex);
  enterHold(ts);
  audioTriggerShort();
  if (fromSilence) {
    longPool.stop();
    long2Pool.stop();
    lastSilenceEndTs = ts;
    nextSilenceMs    = CFG.silenceIntervalMin + Math.random() * (CFG.silenceIntervalMax - CFG.silenceIntervalMin);
    riserLeadMs      = Math.min(3000 + Math.random() * 1000, nextSilenceMs - 500);
    const fadeAt = Math.max(2000, nextSilenceMs - 500);
    if (!filterRampDone) {
      musicFadeTimer = setTimeout(function() {
        musicFadeTo(CFG.musicVolLow, 0.5);
        musicFadeTimer = null;
      }, fadeAt);
    } else {
      musicFadeTo(CFG.musicVolLow, CFG.musicFadeOut);
    }
  }
}

function updateRollMode(ts) {
  if (rollMode && (ts - rollStartTs) >= rollDurMs) {
    rollMode        = false;
    lastRollEndTs   = ts;
    nextRollMs      = 10000;
    tempoTweenFrom  = tempoScale;
    tempoTweenStart = ts;
    console.log('d93: roll end, next in 10000ms');
  }
  if (!rollMode && (ts - lastRollEndTs) >= nextRollMs) {
    const timeToSilence = nextSilenceMs - (ts - lastSilenceEndTs);
    if (timeToSilence > 4000) {
      rollMode    = true;
      rollStartTs = ts;
      rollDurMs   = 2000 + Math.random() * 1000;
      rollRampUp  = Math.random() > 0.5;
      console.log('d93: roll start, dur=' + rollDurMs.toFixed(0) + 'ms ramp=' + (rollRampUp ? 'up' : 'down'));
    }
  }
}

function advanceFromHold(ts) {
  updateRollMode(ts);
  if ((ts - lastSilenceEndTs) >= nextSilenceMs) {
    enterSilence(ts);
  } else {
    if (!riserPlaying && (ts - lastSilenceEndTs) >= (nextSilenceMs - riserLeadMs)) startRiser(ts);
    doAdvance(ts);
  }
}

// ── Frame loop ────────────────────────────────────────────────────────────────
function frame(ts) {
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  rafId  = requestAnimationFrame(frame);
  // Turntable slowdown during roll
  if (rollMode) {
    const rollT    = Math.min((ts - rollStartTs) / 2000, 1);
    const curve    = rollT * rollT;           // quadratic — slow start, accelerates
    const speed    = 1 - curve * 0.80;        // 1.0 → 0.20
    tempoScale     = Math.min(1 / speed, 5);  // 1.0 → 5×
    shortPitchRate = speed;                   // pitch drops with speed
  } else if (!macroActive && !shape3Active) {
    shortPitchRate += (1.0 - shortPitchRate) * Math.min(dt * 2, 1);
  }

  // Riser volume: exponential fade-in toward silence
  if (riserPlaying && riserEl) {
    var rt = Math.min((ts - riserStartTs) / riserLeadMs, 1);
    riserEl.volume = Math.pow(rt, 3) * getVol();
  }

  if (audioCtx && shortFilter && !shape1Active && !shape1Fading) {
    // Reverb fade-in during first HOLD after mesh silence (5s ramp to 0.5)
    if (firstSilenceDone && !filterRampDone && !macroActive &&
        engineState === 'HOLD' && reverbGain && audioCtx) {
      const reverbT = Math.min((ts - lastSilenceEndTs) / 5000, 1);
      reverbGain.gain.value = reverbT * 0.5;
    }
    if (firstSilenceDone && !filterRampDone && !macroActive && engineState === 'HOLD') {
      // Filter ramp: 20000 → 200hz over 1.5s, then back to 20000 before next silence
      const holdElapsed = ts - lastSilenceEndTs;
      const rampDownEnd = 1500;
      const rampUpEnd   = Math.max(rampDownEnd + 500, nextSilenceMs - 500);
      let targetFreq;
      if (holdElapsed < rampDownEnd) {
        const t = holdElapsed / rampDownEnd;
        targetFreq = 20000 * Math.pow(300 / 20000, t);
      } else if (holdElapsed < rampUpEnd) {
        const tRaw = (holdElapsed - rampDownEnd) / (rampUpEnd - rampDownEnd);
        const t = Math.pow(tRaw, 5);
        targetFreq = 300 * Math.pow(20000 / 300, t);
      } else {
        targetFreq = 20000;
      }
      shortFilter.frequency.setValueAtTime(targetFreq, audioCtx.currentTime);
    } else if (shape1Touched && !firstSilenceDone) {
      lfoTimer -= dt;
      if (lfoTimer <= 0) {
        lfoTarget = 300 + Math.random() * 5000;
        lfoTimer  = 3 + Math.random() * 7;
      }
      lfoFreq += (lfoTarget - lfoFreq) * 0.006;
      shortFilter.frequency.setValueAtTime(lfoFreq, audioCtx.currentTime);
    }
  }

  // Audio spike decay (shape 2)
  audioSpike = audioSpike > 0.005 ? audioSpike * 0.78 : 0;

  // Shape 2 brightness calculation
  var targetBright = shape2Active ? mouseBrightness : 1.0;
  if (shape2FadeStart !== null) {
    var fadeDur = shape1MacroActive ? 1500 : 6000;
    var fp = Math.min((ts - shape2FadeStart) / fadeDur, 1);
    targetBright = shape2BrightFrom + (1 - shape2BrightFrom) * fp;
    if (fp >= 1) shape2FadeStart = null;
  }
  var effectiveBright = Math.min(1, targetBright + audioSpike * (1 - targetBright));
  if (shape1MacroActive && !macroActive && shortFilter && audioCtx) {
    var fv = shortFilter.frequency.value;
    // log-normalise 200Hz→0.0, 20kHz→1.0
    var fNorm = Math.max(0, Math.min(1,
      (Math.log(fv) - Math.log(200)) / (Math.log(20000) - Math.log(200))
    ));
    effectiveBright *= Math.max(0.12, fNorm);
  }
  brightnessOverlay = 1 - effectiveBright;

  if (shape1MacroActive && !macroActive && window.d93GeoEls) {
    var shapeOpacity = Math.max(0.08, effectiveBright);
    if (window.d93GeoEls.tri)  window.d93GeoEls.tri.style.opacity  = String(shapeOpacity);
    if (window.d93GeoEls.circ) window.d93GeoEls.circ.style.opacity = String(shapeOpacity);
    if (window.d93GeoEls.rect) window.d93GeoEls.rect.style.opacity = String(shapeOpacity);
  }

  // triEffect decay
  if (!shape2Active && triEffectStrength > 0.005) triEffectStrength *= 0.90;
  else if (!shape2Active) triEffectStrength = 0;

  if (shape2Active) {
    pixelSpikeTimer -= dt;
    if (pixelSpikeTimer <= 0) {
      pixelSpikeVal   = 0.7 + Math.random() * 0.3;
      pixelSpikeTimer = 1.5 + Math.random() * 3.5;
    }
    pixelSpikeVal *= 0.82;
  } else {
    pixelSpikeVal   = 0;
    pixelSpikeTimer = 0;
  }
  effectivePixel = Math.max(triEffectStrength, pixelSpikeVal);

  if (macroActive && macroPull > 0) {
    brightnessOverlay = macroPull * 0.9;
    tempoScale        = 1 + macroPull * 5;
    shortPitchRate    = Math.pow(0.5, macroPull);
    if (shortFilter && audioCtx) {
      shortFilter.frequency.setValueAtTime(
        20000 * Math.pow(100 / 20000, macroPull), audioCtx.currentTime
      );
    }
    triEffectStrength = macroPull > 0.5 ? (macroPull - 0.5) * 2 : 0;
    effectivePixel    = triEffectStrength;
    if (reverbGain && audioCtx) {
      reverbGain.gain.setValueAtTime(macroPull * 0.9, audioCtx.currentTime);
    }
  } else if (macroActive) {
    brightnessOverlay = 0;
    tempoScale        = 1.0;
    shortPitchRate    = 1.0;
    if (reverbGain && audioCtx) {
      reverbGain.gain.setValueAtTime(0, audioCtx.currentTime);
    }
  }

  if (macroActive && music2Gain && audioCtx) {
    if (macroPull >= 0.5) {
      const vol2 = 0.562 + (macroPull - 0.5) * 2 * (1.0 - 0.562);
      music2Gain.gain.value = vol2;
    } else {
      music2Gain.gain.value = 0;
    }
  }

  // Shape 3 tempo tween back to normal
  if (tempoTweenStart !== null) {
    var tp = Math.min((ts - tempoTweenStart) / 1000, 1);
    tempoScale = tempoTweenFrom + (1 - tempoTweenFrom) * tp;
    if (tp >= 1) { tempoScale = 1.0; tempoTweenStart = null; }
  }

  if (shapesFloating && window.d93GeoEls) {
    if (!macroActive) shapeFloatT += dt;
    if (macroActive) {
      macroYOffset = macroPull * window.innerHeight * 0.52;
    } else {
      macroYOffset = 0;
    }

    if (shapesConverging && convergeProgress < 1) {
      convergeProgress = Math.min(convergeProgress + dt * 0.07, 1);
      if (convergeProgress >= 1 && helperFadeStartTs === 0) {
        helperFadeStartTs = ts;
        setTimeout(function() {
          macroActive = true;
          loadMusic2();
          initReverb();
          var dh = document.getElementById('drag-hint');
          if (dh) dh.classList.add('active');
          console.log('d93: macro pull active');
        }, 4000);
      }
    }
    var cp  = convergeProgress;
    var ec  = cp * cp * (3 - 2 * cp); // smoothstep

    var gels = window.d93GeoEls;

    // Circle 2 (orange, rect) → 3 lower bowl
    var fs = macroActive ? 0 : 1;
    var rfx = Math.sin(shapeFloatT*0.41)*5*fs + Math.sin(shapeFloatT*0.79)*2*fs + convergeDriftRect.x * ec;
    var rfy = Math.sin(shapeFloatT*0.53+1.2)*4*fs + Math.sin(shapeFloatT*0.67)*2*fs + convergeDriftRect.y * ec + macroYOffset;
    if (gels.rect) gels.rect.style.transform =
      'translate(' + rfx.toFixed(1) + 'px,' + rfy.toFixed(1) + 'px)';

    // Triangle → 3 upper, rotates -90° as it moves
    var triRot = ec * (-90);
    var tfx = Math.sin(shapeFloatT*0.37+2.1)*5*fs + Math.sin(shapeFloatT*0.61)*2*fs + convergeDriftTri.x * ec;
    var tfy = Math.sin(shapeFloatT*0.59+0.7)*4*fs + Math.sin(shapeFloatT*0.83)*2*fs + convergeDriftTri.y * ec + macroYOffset;
    if (gels.tri) gels.tri.style.transform =
      'translate(' + tfx.toFixed(1) + 'px,' + tfy.toFixed(1) + 'px) rotate(' + triRot.toFixed(1) + 'deg)';
    if (gels.tri) {
      var triOpacity = shapesConverging ? Math.min(1, 0.3 + ec * 0.7) : 0.3;
      gels.tri.style.opacity = triOpacity.toFixed(3);
    }

    // Circle 1 (dark grey, circ) → 9 bowl
    var cfx = Math.sin(shapeFloatT*0.29+1.0)*5*fs + Math.sin(shapeFloatT*0.71)*2*fs + convergeDriftCirc.x * ec;
    var cfy = Math.sin(shapeFloatT*0.47+2.5)*4*fs + Math.sin(shapeFloatT*0.57)*2*fs + convergeDriftCirc.y * ec + macroYOffset;
    if (gels.circ) gels.circ.style.transform =
      'translate(' + cfx.toFixed(1) + 'px,' + cfy.toFixed(1) + 'px)';


    // Helper lines: fade in after 30% convergence, update positions
    var helpers = document.getElementById('geo-helpers');
    if (helpers && ec > 0.3) {
      helpers.style.opacity = String(Math.min(1, (ec - 0.3) / 0.4));

      var cb2 = gels.circ.getBoundingClientRect();
      var rb2 = gels.rect.getBoundingClientRect();
      var tb2 = gels.tri.getBoundingClientRect();

      // 9 tail: from bottom-right of Circle 1 downward
      var sc2    = Math.min(1.2, window.innerWidth / 1100);
      var tailX  = cb2.left + cb2.width  * 0.5 + 138;
      var tailY1 = cb2.top  + cb2.height * 0.5 + 52;
      var tailY2 = tailY1 + 245 * sc2;
      var tailEl = document.getElementById('helper-tail');
      if (tailEl) {
        tailEl.setAttribute('x1', tailX.toFixed(1));
        tailEl.setAttribute('y1', tailY1.toFixed(1));
        tailEl.setAttribute('x2', tailX.toFixed(1));
        tailEl.setAttribute('y2', tailY2.toFixed(1));
      }
    }
  }

  if (cutterActive) updateCuts(dt);

  if (isPlaying && images.length) {
    const elapsed = ts - stateStartTs;
    if (engineState === 'HOLD' && elapsed >= currentHoldMs) {
      advanceFromHold(ts);
    } else if (engineState === 'SILENCE' && elapsed >= silFadeMs + silHoldMs + silFadeMs) {
      doAdvance(ts);
    }
  }

  drawFrame(ts - stateStartTs);
}

function startConverge() {
  if (shapesConverging || !window.d93GeoEls) return;
  var gels = window.d93GeoEls;
  var rb = gels.rect.getBoundingClientRect();
  var tb = gels.tri.getBoundingClientRect();
  var cb = gels.circ.getBoundingClientRect();
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  var mobile = vw < 720;

  var circ9X, circ9Y, triX, triY, circ3X, circ3Y;

  if (mobile) {
    circ3X = vw * 0.74;  circ3Y = vh * 0.62;
    triX   = circ3X - 52; triY   = circ3Y - 63 - 60;
    circ9X = vw * 0.24;  circ9Y = vh * 0.40;
  } else {
    circ3X = vw * 0.62;  circ3Y = vh * 0.60;
    triX   = circ3X + 20; triY  = circ3Y - 253;
    circ9X = vw * 0.30;  circ9Y = vh * 0.40;
  }

  convergeDriftRect = {
    x: circ3X - (rb.left + rb.width  * 0.5),
    y: circ3Y - (rb.top  + rb.height * 0.5)
  };
  convergeDriftTri = {
    x: triX - (tb.left + tb.width  * 0.5),
    y: triY - (tb.top  + tb.height * 0.5)
  };
  convergeDriftCirc = {
    x: circ9X - (cb.left + cb.width  * 0.5),
    y: circ9Y - (cb.top  + cb.height * 0.5)
  };
  shapesConverging = true;
  shapesFloating   = true;
}

function startAnim() {
  if (rafId) cancelAnimationFrame(rafId);
  lastTs = performance.now();
  rafId  = requestAnimationFrame(frame);
}

function startEngine() {
  if (isPlaying) return;
  isPlaying         = true;
  window.d93Playing = true;
  lastSilenceEndTs  = performance.now();
  engineState       = 'HOLD';
  stateStartTs      = performance.now();
  currentHoldMs     = computeHoldMs();
  cutterActive      = true;
  spawnCuts(CFG.cutterAmount);
  setTimeout(function() {
    var b = document.getElementById('back');
    if (b) b.style.opacity = '1';
  }, 2000);
}

// ── Image loading ─────────────────────────────────────────────────────────────
async function loadImages() {
  const loaded = [];
  await Promise.all(IMAGE_SRCS.map(src => new Promise(resolve => {
    const img = new Image();
    img._filename = src.split('/').pop();
    img.onload  = () => { loaded.push(img); resolve(); };
    img.onerror = () => resolve();
    img.src     = src;
  })));

  if (!loaded.length) return;

  images = loaded.sort((a, b) =>
    (a._filename || '').localeCompare(b._filename || '', undefined, {numeric: true, sensitivity: 'base'})
  );

  currentIndex = Math.floor(Math.random() * images.length);
  lastRollEndTs = performance.now();
  startEngine();
}

startAnim();
pixelCanvas = document.createElement('canvas');
pixelCtx    = pixelCanvas.getContext('2d');
const LONG_URLS = [
  'long_01','long_03','long_04','long_05','long_06',
  'long_07','long_08','long_09','long_10'
].map(function(n) {
  return 'https://daysof93-cdn.b-cdn.net/pool%20long/' + n + '.wav';
}).sort(function() { return Math.random()-0.5; });

const LONG2_URLS = Array.from({length: 8}, function(_, i) {
  return 'https://daysof93-cdn.b-cdn.net/pool%20long%202/long2_' + String(i+1).padStart(2,'0') + '.wav';
}).sort(function() { return Math.random()-0.5; });

const TRANS_URLS = Array.from({length: 5}, function(_, i) {
  return 'https://daysof93-cdn.b-cdn.net/Transitions/transition_' + (i+1) + '.wav';
}).sort(function() { return Math.random()-0.5; });

initSilMesh();
longPool  = makeAudioPool(LONG_URLS,  3);
long2Pool = makeAudioPool(LONG2_URLS, 3);
transPool = makeAudioPool(TRANS_URLS, 5);

<script>
(function() {
  var rectEl = document.getElementById('geo-rect');
  var triEl  = document.getElementById('geo-tri');
  var circEl = document.getElementById('geo-circ');
  window.d93GeoEls = { rect: rectEl, tri: triEl, circ: circEl };
  if (!rectEl || !triEl || !circEl) return;

  function inRect(mx, my, b) {
    return mx >= b.left && mx <= b.right && my >= b.top && my <= b.bottom;
  }
  function inTriangle(mx, my, b) {
    var ax = b.left + b.width*0.5, ay = b.top;
    var bx = b.left,               by = b.bottom;
    var cx = b.right,              cy = b.bottom;
    var d1 = (mx-bx)*(ay-by)-(ax-bx)*(my-by);
    var d2 = (mx-cx)*(by-cy)-(bx-cx)*(my-cy);
    var d3 = (mx-ax)*(cy-ay)-(cx-ax)*(my-ay);
    return !((d1<0||d2<0||d3<0) && (d1>0||d2>0||d3>0));
  }
  function inCircle(mx, my, b) {
    var cx = b.left+b.width*0.5, cy = b.top+b.height*0.5, r = b.width*0.5;
    var dx = mx-cx, dy = my-cy;

    var tb = triEl.getBoundingClientRect();

    var r2vis = parseFloat(triEl.style.opacity)  > 0.1;
    var r3vis = parseFloat(circEl.style.opacity) > 0.5;

        if (th) { th.classList.remove('active'); th.style.opacity = '0'; }

      var yFrac2 = Math.max(0, Math.min(1, (my - tb.top) / tb.height));

      shape2FadeStart  = performance.now();

    var wasCirc = shape3Active;
    shape3Active = r3vis && inCircle(mx, my, cb);
    if (shape3Active) {
      if (!wasCirc) {
        var ch = document.getElementById('geo-circ-hint');
        if (ch) { ch.classList.remove('active'); ch.style.opacity = '0'; }
      }
      tempoTweenStart = null;
      var ccx  = cb.left + cb.width*0.5;
      var ccy  = cb.top  + cb.height*0.5;
      var r    = cb.width * 0.5;
      var dx   = mx - ccx, dy = my - ccy;
      var dist = Math.min(1, Math.sqrt(dx*dx + dy*dy) / r);
      var upness = -(dy / (r || 1));
      upness = Math.max(-1, Math.min(1, upness));

        shortPitchRate = 1.0;

        shortPitchRate = 1.0 - slowness * 0.5;
      }

      tempoTweenFrom  = tempoScale;
      tempoTweenStart = performance.now();
      shortPitchRate  = 1.0;
    }
  }

  document.addEventListener('mousemove', function(e) {
    handlePointer(e.clientX, e.clientY);
  });

  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 0) {

  }, { passive: false });

  document.addEventListener('touchend', function() {

  });

  document.addEventListener('mousedown', function(e) {
    if (!macroActive) return;
    macroDragging  = true;
    macroStartY    = e.clientY;
    macroPullStart = macroPull;

    if (dh) { dh.classList.remove('active'); dh.style.opacity = '0'; }
    if (music2El && !music2Started && audioCtx) {

      }

      }).catch(function(e) { console.error('d93: music2 play error', e); });

    macroPullStart = macroPull;
    var dh = document.getElementById('drag-hint');
    if (dh) { dh.classList.remove('active'); dh.style.opacity = '0'; }
    if (music2El && !music2Started && audioCtx) {
      if (!music2Gain) {
        try {
          const src2 = audioCtx.createMediaElementSource(music2El);
          music2Gain = audioCtx.createGain();
          music2Gain.gain.value = 0;
          src2.connect(music2Gain);
          music2Gain.connect(audioCtx.destination);
        } catch(e) { console.error('d93: music2 connect error', e); }
      }
      music2El.volume = 1;
      music2El.play().then(function() {
        music2Started = true;
        console.log('d93: music2 playing, gain=', music2Gain ? music2Gain.gain.value : 'no gain node');
      }).catch(function(e) { console.error('d93: music2 play error', e); });
    }
  }, { passive: true });

  document.addEventListener('mouseup', function() {
    if (macroActive) macroDragging = false;
  });
})();
</script>

<script>
(function(){
  var gone = false;
  var months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  function tickClock(){
    var n = new Date();
    var el = document.getElementById('c64-datetime');
    if (el) el.textContent =
      String(n.getDate()).padStart(2,'0')+' '+months[n.getMonth()]+' 1993  '+
      String(n.getHours()).padStart(2,'0')+':'+
      String(n.getMinutes()).padStart(2,'0')+':'+
      String(n.getSeconds()).padStart(2,'0');
  }
  tickClock();
  var clockInterval = setInterval(tickClock, 1000);

  function dismiss() {
    if (gone) return; gone = true;
    clearInterval(clockInterval);
    var boot = document.getElementById('c64-boot');
    if (boot) boot.style.display = 'none';
    document.documentElement.style.background = '#000';
    document.body.style.background = '#000';
    unlockAudio();
    loadImages();
  }

  setTimeout(function(){
    document.addEventListener('keydown',    dismiss, { once: true });
    document.addEventListener('click',      dismiss, { once: true });
    document.addEventListener('touchstart', dismiss, { once: true, passive: true });
  }, 500);
})();
</script>
<script>
(function(){
  var DFLT = 0.3162;
  var s = parseFloat(localStorage.getItem('d93vol'));
  var vol = isNaN(s) ? DFLT : Math.max(0, Math.min(1, s));
  var muted = localStorage.getItem('d93mute') === '1';
  var wrap  = document.getElementById('d93-vol-wrap');

  var OFF = 'M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z';
  sl.value = vol;
  sp.setAttribute('d', muted ? OFF : ON);
  window._d93vol = function() { return muted ? 0 : vol; };
  function applyAll() {
    var v = muted ? 0 : vol;
    document.querySelectorAll('audio,video').forEach(function(el) { el.volume = v; });
  }
  document.addEventListener('play', applyAll, true);
  var volHideTimer;
  wrap.addEventListener('mouseenter', function() {
    clearTimeout(volHideTimer);
    popup.style.display = 'flex';
  });
  wrap.addEventListener('mouseleave', function() {
    volHideTimer = setTimeout(function() { popup.style.display = 'none'; }, 250);
  });
  popup.addEventListener('mouseenter', function() { clearTimeout(volHideTimer); });
  popup.addEventListener('mouseleave', function() {
    volHideTimer = setTimeout(function() { popup.style.display = 'none'; }, 250);
  });
  wrap.addEventListener('touchstart', function(e) {
    e.stopPropagation();
    if (!popup.contains(e.target)) {
      popup.style.display === 'flex' ? popup.style.display = 'none' : popup.style.display = 'flex';
    }
  }, {passive: true});
  document.addEventListener('touchstart', function(e) {
    if (!wrap.contains(e.target)) popup.style.display = 'none';
  }, {passive: true});
  sl.addEventListener('input', function() {
    vol = parseFloat(this.value); localStorage.setItem('d93vol', vol); applyAll();
  });
  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    muted = !muted; localStorage.setItem('d93mute', muted ? '1' : '0');
    sp.setAttribute('d', muted ? OFF : ON); applyAll();
  });
  applyAll();
})();
</script>
