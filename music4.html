<style>
  :root{
    --field: #ffffff;
    --line:  rgba(0,0,0,0.13);
    --axis-x: rgba(0,0,0,0.30);
    --axis-y: rgba(0,0,0,0.30);
    --ink:   #000000;
    --hair:  1.2px;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--field); }
  body{
    font-family: "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--ink);
  }
  header{
    position: fixed; top:0; left:0; right:0; z-index:50;
    padding: 20px 28px; display:flex; align-items:center; justify-content:flex-end;
  }
  nav{ display:flex; gap:28px; align-items:center; }
  nav a{
    font-family:'Jost', 'Helvetica Neue', sans-serif;
    font-size:11px; letter-spacing:0.22em; font-weight:300;
    text-transform:uppercase; color:var(--ink); text-decoration:none; opacity:1;
  }
  nav a:hover{ opacity:0.6; }
  nav a.nav-active{ border-bottom:1.5px solid currentColor; padding-bottom:1px; opacity:1; }
  @media (max-width:720px){
    header{ padding:16px 18px; }
    nav{ gap:18px; }
    nav a{ font-size:10px; }
  }

  .hero{
    position:relative; z-index:20;
    padding: 52px 28px 20px;
    min-height:54vh; display:flex; flex-direction:row;
    align-items:flex-start; justify-content:space-between;
  }
  .hero-title{
    font-family:'Jost', 'Helvetica Neue', sans-serif;
    font-size: clamp(5rem, 14vw, 20rem);
    font-weight:700; text-transform:uppercase;
    letter-spacing:-0.02em; line-height:0.88;
    color:var(--ink);
    margin-top: auto; margin-right: 4vw;
  }
  @media (max-width:720px){
    .hero{ padding:80px 18px 30px; min-height:42vh; flex-direction:column; align-items:flex-start; gap:28px; }
    .hero-title{ margin-top:18vw; margin-right:0; align-self:flex-end; }
  }

  .field{ position:fixed; inset:0; z-index:15; pointer-events:none; }

  .video-wrap{
    position: relative; z-index: 10;
    display: flex; justify-content: center; align-items: flex-start;
    padding-top: 20px; padding-bottom: 60px;
    margin-top: -38vh;
  }
  .video-wrap video{
    width: 53vw;
    display: block;
  }
  .video-wrap + .video-wrap{
    margin-top: 0;
    padding-top: 0;
  }
  @media (max-width:720px){
    .video-wrap{ padding: 40px 18px 40px; margin-top: -20vh; }
    .video-wrap + .video-wrap{ margin-top: 0; padding-top: 0; }
    .video-wrap video{ width: 88vw; }
  }

  #play-btn{
    display:none;
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    background:none; border:none; padding:0; margin:0;
    cursor:pointer; z-index:25;
    -webkit-tap-highlight-color:transparent;
    width:72px; height:72px;
    opacity:1; transition:opacity 0.35s ease;
  }
  #play-btn.gone{ opacity:0; pointer-events:none; }
</style>
</head>
<body>

  <header>
    <nav>
      <a href="index.html#about">about</a>

      <a href="index.html">work</a>

      <a href="mailto:contact@daysof93.com">contact</a>
      <a href="https://www.instagram.com/days_of_93/" target="_blank" rel="noopener" aria-label="Instagram" style="display:flex;align-items:center;" onmouseover="this.style.opacity=0.6" onmouseout="this.style.opacity=1">
        <svg width="28" height="28" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="#000">
          <rect x="0" y="0" width="24" height="24" rx="6" ry="6" fill="#000"/>
          <rect x="3" y="3" width="18" height="18" rx="4" ry="4" fill="#000" stroke="white" stroke-width="2"/>
          <circle cx="12" cy="12" r="4.5" fill="none" stroke="white" stroke-width="2"/>
          <circle cx="17" cy="7" r="1.2" fill="white"/>
        </svg>
      </a>
    </nav>
  </header>

  <div class="hero">
    <div style="margin-top:auto; margin-left:4vw; position:relative; display:inline-block;">
      <a href="music3.html" class="hero-title" style="display:inline-block; opacity:0; transition:opacity 1.2s ease; color:var(--ink); text-decoration:none;" id="back-arrow">&lt;</a>
    </div>
  </div>

  <div id="days-label" style="position:fixed; top:52px; right:28px; z-index:40; pointer-events:none;">
    <div class="hero-title" style="font-size:clamp(4.5rem,13vw,16rem); font-weight:900; opacity:0.07; text-align:right;">DAYS<br>OF 93.</div>
  </div>

  <div class="video-wrap">
    <video autoplay loop muted playsinline preload="auto">
      <source src="https://daysof93-cdn.b-cdn.net/ALBINO2.webm" type="video/webm">
    </video>
    <button id="play-btn" aria-label="Play">
      <svg width="72" height="72" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <circle cx="36" cy="36" r="30" fill="rgba(0,0,0,0.18)" stroke="white" stroke-width="1.5"/>
        <polygon points="29,20 29,52 56,36" fill="white"/>
      </svg>
    </button>
  </div>

  <svg class="field" id="field" preserveAspectRatio="xMidYMid slice"></svg>

<script>
function daySeed(){ const d=new Date(); return d.getFullYear()*1000 + dayOfYear(d); }
function dayOfYear(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
const SEED = daySeed();

function drawField(){
  const svg = document.getElementById('field');
  const w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', "0 0 "+w+" "+h);
  const camX = (seededRand(SEED+1)-0.5)*40;
  const camTilt = (seededRand(SEED+2)-0.5)*0.02;
  const vpX = w*0.5 + camX, vpY = h*0.62;
  let lines = '';
  const bands = 18;
  for(let i=0;i<=bands;i++){
    const t=i/bands, y=vpY+Math.pow(t,1.8)*(h-vpY), op=0.34*(1-t*0.65);
    lines += '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+op.toFixed(3)+'"/>';
  }
  const cols=16;
  for(let i=0;i<=cols;i++){
    const x=(i/cols)*w;
    lines += '<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="0.18"/>';
  }
  const ay=Math.sin(camTilt);
  lines += '<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+(vpY+ay*w)+'" stroke="var(--axis-x)" stroke-width="var(--hair)" opacity="0.48"/>';
  lines += '<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="var(--axis-y)" stroke-width="var(--hair)" opacity="0.42"/>';
  const gx=vpX, gy=vpY, r=9;
  lines += '<circle cx="'+gx+'" cy="'+gy+'" r="'+r+'" fill="none" stroke="var(--ink)" stroke-width="var(--hair)" stroke-dasharray="2 3" opacity="0.55"/>';
  lines += '<line x1="'+(gx-r-4)+'" y1="'+gy+'" x2="'+(gx+r+4)+'" y2="'+gy+'" stroke="var(--ink)" stroke-width="var(--hair)" opacity="0.55"/>';
  lines += '<line x1="'+gx+'" y1="'+(gy-r-4)+'" x2="'+gx+'" y2="'+(gy+r+4)+'" stroke="var(--ink)" stroke-width="var(--hair)" opacity="0.55"/>';

  if(w >= 720){
    const upperBand = vpY * 0.72;
    const strays = 4;
    for(let i=0;i<strays;i++){
      const s1 = seededRand(SEED + 100 + i*3.1);
      const s2 = seededRand(SEED + 200 + i*5.7);
      const s3 = seededRand(SEED + 300 + i*2.3);
      const s4 = seededRand(SEED + 350 + i*4.9);
      const x1 = s1 * w, y1 = s2 * upperBand;
      const x2 = s3 * w, y2 = s4 * upperBand;
      if(s2 > 0.5){
        const mx = (x1+x2)/2 + (s3-0.5)*140;
        const my = (y1+y2)/2 + (s1-0.5)*70;
        lines += '<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s4*0.12).toFixed(3)+'"/>';
      } else {
        lines += '<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s1*0.12).toFixed(3)+'"/>';
      }
    }
  }
  svg.innerHTML = lines;
}

drawField();
let rt;
window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(drawField,150); });

setTimeout(()=>{ document.getElementById('back-arrow').style.opacity='1'; }, 600);

(function(){
  var vid = document.querySelector('.video-wrap video');
  var btn = document.getElementById('play-btn');
  if(!vid) return;

  vid.muted = false;
  vid.play()
    .then(function(){ if(btn) btn.classList.add('gone'); })
    .catch(function(){
      vid.muted = true;
      vid.play().catch(function(){});
      if(btn) btn.style.display = 'block';
    });

  if(btn){
    btn.addEventListener('click', function(){
      vid.muted = false;
      vid.play()
        .then(function(){ btn.classList.add('gone'); })
        .catch(function(){});
    }, { once: true });
  }
})();
</script>
</body>
