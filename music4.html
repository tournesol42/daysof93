<!doctype html>
<html lang="en">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:#fff; min-height:100%; }
  body{ font-family:'Jost','Helvetica Neue',sans-serif; -webkit-font-smoothing:antialiased; }

  header{
    position:fixed; top:0; left:0; right:0; z-index:200;
    padding:20px 28px; display:flex; align-items:center; justify-content:flex-end;
  }
  nav{ display:flex; gap:28px; align-items:center; }
  nav a{
    font-family:'Jost','Helvetica Neue',sans-serif;
    font-size:11px; letter-spacing:0.22em; font-weight:300;
    text-transform:uppercase; color:#000; text-decoration:none; opacity:0.85;
  }
  nav a:hover{ opacity:1; }
  @media(max-width:720px){
    header{ padding:14px 18px; }
    nav{ gap:18px; }
    nav a{ font-size:10px; }
  }

  .field{ position:fixed; inset:0; z-index:15; pointer-events:none; }

  .slot{ position:relative; overflow:hidden; }
  .slot video{
    position:absolute; inset:0;
    width:100%; height:100%; object-fit:cover;
    opacity:0; will-change:opacity;
  }

  /* slot 1: full-width, always on — pushed down from nav */
  #slot1{ width:100%; height:92vh; z-index:1; margin-top:100px; }
  #slot1 video{ opacity:1; }

  /* slots 2-6: nearly full-width, 16:9 aspect, gaps set randomly by JS */
  #slot2{ width:96vw; aspect-ratio:9/16; margin-left:2vw; z-index:2; pointer-events:all; }
  #slot3{ width:96vw; aspect-ratio:9/16; margin-left:2vw; z-index:3; pointer-events:all; }
  #slot4{ width:96vw; aspect-ratio:9/16; margin-left:2vw; z-index:4; pointer-events:all; }
  #slot5{ width:96vw; aspect-ratio:9/16; margin-left:2vw; z-index:5; pointer-events:all; }
  #slot6{ width:96vw; aspect-ratio:9/16; margin-left:2vw; z-index:6; pointer-events:all; margin-bottom:12vh; }

  /* jitter slots: video slightly oversized so translate doesn't reveal edges */
  .slot--jitter video{
    width:calc(100% + 14px); height:calc(100% + 14px);
    left:-7px; top:-7px; inset:unset;
    will-change:transform;
  }

  @media(max-width:720px){
    #slot2,#slot3,#slot4,#slot5,#slot6{ width:96vw; margin-left:2vw; }
  }
</style>
</head>
<body>

  <nav>

<!-- slot 1: full size, always playing, random dim -->
<div class="slot" id="slot1">
  <video muted loop playsinline preload="auto">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Botanic1.webm" type="video/webm">
  </video>
</div>

<!-- slot 2: random opacity pulse -->
<div class="slot slot--pulse" id="slot2">
  <video muted loop playsinline preload="none">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Manypeople1.webm" type="video/webm">
  </video>
</div>

<!-- slot 3: simple fade reveal -->
<div class="slot slot--fade" id="slot3">
  <video muted loop playsinline preload="none">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Botanic3.webm" type="video/webm">
  </video>
</div>

<!-- slot 4: simple fade reveal -->
<div class="slot slot--fade" id="slot4">
  <video muted loop playsinline preload="none">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Manypeople3.webm" type="video/webm">
  </video>
</div>

<!-- slot 5: jitter movement + random video every ~30s -->
<div class="slot slot--jitter" id="slot5">
  <video muted loop playsinline preload="none">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Botanic5.webm" type="video/webm">
  </video>
</div>

<!-- slot 6: jitter movement + random video every ~30s -->
<div class="slot slot--jitter" id="slot6">
  <video muted loop playsinline preload="none">
    <source src="https://daysof93-cdn.b-cdn.net/Cutups_various/Manypeople7.webm" type="video/webm">
  </video>

<svg class="field" id="field" preserveAspectRatio="xMidYMid slice"></svg>

<script>
(function(){
'use strict';
console.log('d93: music4 v49 init');

/* ---- perspective grid ---- */
function daySeed(){ var d=new Date(); return d.getFullYear()*1000+dayOfYear(d); }
function dayOfYear(d){ var s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function seededRand(seed){ var x=Math.sin(seed)*10000; return x-Math.floor(x); }
var SEED=daySeed();
function drawField(){
  var svg=document.getElementById('field');
  var w=window.innerWidth, h=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  var camX=(seededRand(SEED+1)-0.5)*40, camTilt=(seededRand(SEED+2)-0.5)*0.02;
  var vpX=w*0.5+camX, vpY=h*0.62, ln='';
  for(var i=0;i<=18;i++){
    var t=i/18, y=vpY+Math.pow(t,1.8)*(h-vpY), op=(0.34*(1-t*0.65)).toFixed(3);
    ln+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(0,0,0,0.13)" stroke-width="1.2" opacity="'+op+'"/>';
  }
  for(var i=0;i<=16;i++){
    var x=(i/16)*w;
    ln+='<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="rgba(0,0,0,0.13)" stroke-width="1.2" opacity="0.18"/>';
  }
  var ay=Math.sin(camTilt);
  ln+='<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+(vpY+ay*w)+'" stroke="rgba(0,0,0,0.30)" stroke-width="1.2" opacity="0.48"/>';
  ln+='<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="rgba(0,0,0,0.30)" stroke-width="1.2" opacity="0.42"/>';
  var r=9;
  ln+='<circle cx="'+vpX+'" cy="'+vpY+'" r="'+r+'" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.55"/>';
  ln+='<line x1="'+(vpX-r-4)+'" y1="'+vpY+'" x2="'+(vpX+r+4)+'" y2="'+vpY+'" stroke="#000" stroke-width="1.2" opacity="0.55"/>';
  ln+='<line x1="'+vpX+'" y1="'+(vpY-r-4)+'" x2="'+vpX+'" y2="'+(vpY+r+4)+'" stroke="#000" stroke-width="1.2" opacity="0.55"/>';
  svg.innerHTML=ln;
}
drawField();
var _rt; window.addEventListener('resize',function(){ clearTimeout(_rt); _rt=setTimeout(drawField,150); });

/* ---- video pool for random swap ---- */
var CDN='https://daysof93-cdn.b-cdn.net/Cutups_various/';
var POOL=[
  'Botanic1.webm','Botanic2.webm','Botanic3.webm','Botanic4.webm',
  'Botanic5.webm','Botanic6.webm','Botanic7.webm',
  'Manypeople1.webm','Manypeople2.webm','Manypeople3.webm',
  'Manypeople4.webm','manypeople5.webm','Manypeople7.webm'
];
function pickOther(currentSrc){
  var others=POOL.filter(function(f){ return currentSrc.indexOf(f)===-1; });
  return others[Math.floor(Math.random()*others.length)];
}
function swapVideo(vid){
  var newFile=pickOther(vid.src||'');
  console.log('d93: video swap →',newFile);
  vid.style.transition='opacity 0.35s ease'; vid.style.opacity='0';
  setTimeout(function(){
    vid.src=CDN+newFile; vid.load();
    vid.addEventListener('canplay',function h(){ vid.removeEventListener('canplay',h); vid.play().catch(function(){}); vid.style.opacity='1'; },{once:true});
  },350);
}

/* ---- slot 1: auto-play + random dim to 40-50% ---- */
(function(){
  var vid=document.querySelector('#slot1 video');
  if(!vid) return;
  vid.play().catch(function(){ console.warn('d93: slot1 play blocked'); });
  console.log('d93: slot1 auto-play');

  function scheduleDim(){
    var wait=12000+Math.random()*15000;
    setTimeout(function(){
      var target=(0.40+Math.random()*0.10).toFixed(2);
      var dimMs=1200+Math.random()*1000;
      var holdMs=1800+Math.random()*3000;
      var upMs=1500+Math.random()*800;
      vid.style.transition='opacity '+dimMs+'ms ease-in-out';
      vid.style.opacity=target;
      setTimeout(function(){
        vid.style.transition='opacity '+upMs+'ms ease-in-out';
        vid.style.opacity='1';
        setTimeout(scheduleDim,upMs+400);
      },dimMs+holdMs);
    },wait);
  }
  scheduleDim();
})();

/* ---- random size + position + gaps for slots 2-6 ---- */
['slot2','slot3','slot4','slot5','slot6'].forEach(function(id){
  var el=document.getElementById(id); if(!el) return;
  var w=Math.round(84+Math.random()*13);   /* 84-97vw */
  var ml=Math.round(1+Math.random()*4);    /* 1-5vw left inset */
  if(ml+w>99) w=99-ml;                     /* never overflow right edge */
  el.style.width=w+'vw';
  el.style.marginLeft=ml+'vw';
  el.style.marginTop=Math.round(6+Math.random()*16)+'px';
});

/* ---- FADE: simple show/hide ---- */
function makeFade(slot){
  var vid=slot.querySelector('video');
  return {
    show:function(){ vid.play().catch(function(){}); vid.style.transition='opacity 0.7s ease-in-out'; vid.style.opacity='1'; },
    hide:function(){ vid.style.transition='opacity 0.7s ease-in-out'; vid.style.opacity='0'; }
  };
}

/* ---- PULSE: random slow opacity fades ---- */
function makePulse(slot){
  var vid=slot.querySelector('video');
  var showing=false, timer=null;

  function pulse(){
    if(!showing) return;
    var op=(0.45+Math.random()*0.55).toFixed(2);
    var ms=700+Math.random()*1800;
    vid.style.transition='opacity '+ms+'ms ease-in-out';
    vid.style.opacity=op;
    timer=setTimeout(pulse, ms+Math.random()*400);
  }

  return {
    show:function(){
      showing=true;
      vid.play().catch(function(){});
      vid.style.transition='opacity 0.8s ease-in-out'; vid.style.opacity='1';
      clearTimeout(timer); timer=setTimeout(pulse,1000);
    },
    hide:function(){
      showing=false; clearTimeout(timer);
      vid.style.transition='opacity 0.7s ease-in-out'; vid.style.opacity='0';
    }
  };
}

/* ---- LFO: 10Hz flicker → glow-die; 30% chance of fast burst ---- */
function makeLFO(slot){
  var vid=slot.querySelector('video');
  var anim=null, inView=false, restartTimer=null;

  function startFlicker(){
    if(anim) anim.cancel();
    clearTimeout(restartTimer);
    vid.play().catch(function(){});

    var fast=Math.random()<0.30;
    var dur=fast?320:1000;
    var hz=fast?35:95;          /* ms per square-wave half-cycle */
    var peak=fast?1.25:1.5;

    vid.style.transition=''; vid.style.opacity='1'; vid.style.filter='brightness(1)';
    console.log('d93: lfo start',slot.id,fast?'FAST':'');

    var t0=performance.now(), rafId=null, dead=false;
    function tick(now){
      if(dead) return;
      var el=now-t0;
      if(el<dur){
        vid.style.filter='brightness('+(Math.floor(el/hz)%2===0?1:0)+')';
        rafId=requestAnimationFrame(tick);
      } else {
        var g0=performance.now();
        (function glow(n){
          if(dead) return;
          var p=Math.min((n-g0)/200,1);
          vid.style.filter='brightness('+(1+p*(peak-1)).toFixed(2)+')';
          if(p<1){ rafId=requestAnimationFrame(glow); }
          else {
            vid.style.filter='brightness('+peak+')';
            vid.style.transition='opacity 500ms ease';
            vid.style.opacity='0';
            setTimeout(function(){
              if(dead) return;
              vid.style.transition=''; vid.style.filter=''; anim=null;
              if(inView) restartTimer=setTimeout(startFlicker,fast?600:1800);
            },520);
          }
        })(performance.now());
      }
    }
    rafId=requestAnimationFrame(tick);
    anim={cancel:function(){ dead=true; if(rafId) cancelAnimationFrame(rafId); vid.style.transition=''; vid.style.filter=''; vid.style.opacity='0'; anim=null; }};
  }

  return {
    show:function(){ inView=true; if(!anim) startFlicker(); },
    hide:function(){ inView=false; clearTimeout(restartTimer); if(anim) anim.cancel(); }
  };
}

/* ---- JITTER: fast low-amplitude position flutter + random video swap ---- */
function makeJitter(slot){
  var vid=slot.querySelector('video');
  var showing=false, jTimer=null, swapTimer=null;

  function doJitter(){
    if(!showing){ vid.style.transform='translate(0,0)'; return; }
    if(Math.random()<0.18){
      vid.style.transform='translate(0,0)';
    } else {
      var x=((Math.random()-0.5)*2*3).toFixed(1);
      var y=((Math.random()-0.5)*2*3).toFixed(1);
      vid.style.transform='translate('+x+'px,'+y+'px)';
    }
    jTimer=setTimeout(doJitter,25+Math.random()*90);
  }

  function scheduleSwap(){
    swapTimer=setTimeout(function(){
      if(!showing) return;
      swapVideo(vid);
      scheduleSwap();
    },28000+Math.random()*8000);
  }

  return {
    show:function(){
      showing=true;
      vid.play().catch(function(){});
      vid.style.transition='opacity 0.5s ease'; vid.style.opacity='1';
      doJitter();
      scheduleSwap();
    },
    hide:function(){
      showing=false;
      clearTimeout(jTimer); clearTimeout(swapTimer);
      vid.style.transform='translate(0,0)';
      vid.style.transition='opacity 0.5s ease'; vid.style.opacity='0';
    }
  };
}

/* ---- AUDIO ---- */
/* on window so GC never drops them; both loop forever once started */
window._d93drone = new Audio('COLLAGEdrone.mp3'); window._d93drone.loop=true; window._d93drone.volume=0.1; /* -20dB */
window._d93serge = new Audio('COLLAGEserge.mp3'); window._d93serge.loop=true; window._d93serge.volume=0.316;
(function(){
  var drone=window._d93drone, serge=window._d93serge;
  var unlocked=false, sergeStarted=false, sergeReady=false;

  function startSerge(){
    if(sergeStarted) return; sergeStarted=true;
    console.log('d93: startSerge');
    serge.currentTime=0;
    serge.play().catch(function(e){ console.warn('d93: serge blocked',e); });
  }

  function primeSerge(){
    /* play+pause to unlock serge in the browser's autoplay context */
    serge.play().then(function(){
      serge.pause(); serge.currentTime=0; sergeReady=true;
      console.log('d93: serge primed');
    }).catch(function(){ sergeReady=false; });
  }

  function unlock(){
    if(unlocked) return; unlocked=true;
    drone.play().catch(function(){});
    primeSerge();
  }

  /* keep drone alive */
  drone.addEventListener('pause', function(){
    setTimeout(function(){ drone.play().catch(function(){}); }, 100);
  });

  /* try autoplay on load */
  drone.play().then(function(){
    unlocked=true;
    console.log('d93: drone autoplayed');
    primeSerge();
  }).catch(function(){
    document.addEventListener('click',     unlock, {once:true});
    document.addEventListener('touchstart',unlock, {once:true});
  });

  /* serge starts when zone 2 enters view — never stops after that */
  var s2=document.getElementById('slot2');
  if(s2){
    new IntersectionObserver(function(entries){
      if(!entries[0].isIntersecting) return;
      console.log('d93: slot2 in view, unlocked='+unlocked+' ready='+sergeReady);
      if(unlocked){ startSerge(); }
    },{threshold:0}).observe(s2);
  }
})();

/* ---- wire up slots 2-6 ---- */
var handlers={};
document.querySelectorAll('.slot--fade').forEach(function(s){ handlers[s.id]=makeFade(s); });
document.querySelectorAll('.slot--pulse').forEach(function(s){ handlers[s.id]=makePulse(s); });
document.querySelectorAll('.slot--lfo').forEach(function(s){ handlers[s.id]=makeLFO(s); });
document.querySelectorAll('.slot--jitter').forEach(function(s){ handlers[s.id]=makeJitter(s); });

/* scroll: IntersectionObserver @ 20% */
var io=new IntersectionObserver(function(entries){
  entries.forEach(function(e){
    var h=handlers[e.target.id]; if(!h) return;
    if(e.isIntersecting){ h.show(); console.log('d93: in-view',e.target.id); }
    else { h.hide(); }
  });
},{threshold:0.20});
Object.keys(handlers).forEach(function(id){ var el=document.getElementById(id); if(el) io.observe(el); });

/* hover also triggers */
Object.keys(handlers).forEach(function(id){
  var el=document.getElementById(id); if(!el) return;
  el.addEventListener('mouseenter',function(){ handlers[id].show(); });
  el.addEventListener('click',function(){ handlers[id].show(); });
});

console.log('d93: music4 slots ready');
})();
</script>
</body>
