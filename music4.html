<script>
(function(){
'use strict';
console.log('d93: music4 init');

/* ---- WebGL shaders ---- */
var VS = [
  'attribute vec2 aPos;',
  'varying vec2 vUV;',
  'void main(){',
  '  vUV = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);',
  '  gl_Position = vec4(aPos, 0.0, 1.0);',
  '}'
].join('\n');

var FS = [
  'precision mediump float;',
  'uniform sampler2D uVideo;',
  'uniform float uTime;',
  'varying vec2 vUV;',
  'void main(){',
  '  vec4 c = texture2D(uVideo, vUV);',
  '  float t = uTime * 0.001;',
  '  float w1 = sin(vUV.x * 3.8 + t * 0.7) * 0.5 + 0.5;',
  '  float w2 = sin(vUV.y * 2.6 + t * 0.55 + 1.57) * 0.5 + 0.5;',
  '  float w3 = sin((vUV.x - vUV.y) * 2.2 + t * 0.35) * 0.5 + 0.5;',
  '  float alpha = smoothstep(0.15, 0.65, (w1 + w2 * 0.8 + w3 * 0.5) / 2.3);',
  '  gl_FragColor = vec4(c.rgb, alpha);',
  '}'
].join('\n');

function mkShader(gl, type, src){
  var s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error('d93: shader', gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}

function buildGL(canvas){
  var gl = canvas.getContext('webgl', {alpha:true, premultipliedAlpha:false});
  if(!gl){ console.warn('d93: no webgl'); return null; }

  var vs = mkShader(gl, gl.VERTEX_SHADER, VS);
  var fs = mkShader(gl, gl.FRAGMENT_SHADER, FS);
  if(!vs || !fs) return null;

  var prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){
    console.error('d93: link', gl.getProgramInfoLog(prog)); return null;
  }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  gl.uniform1i(gl.getUniformLocation(prog, 'uVideo'), 0);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0,0,0,0);

  return { gl:gl, tex:tex, uTime:gl.getUniformLocation(prog, 'uTime') };
}

function renderGL(state, vid, raf){
  var gl = state.gl, canvas = gl.canvas;
  var w = canvas.parentElement.clientWidth;
  var h = canvas.parentElement.clientHeight;
  if(canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  if(vid.readyState >= 2){
    gl.bindTexture(gl.TEXTURE_2D, state.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, vid);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform1f(state.uTime, performance.now());
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  if(raf.on) raf.id = requestAnimationFrame(function(){ renderGL(state, vid, raf); });
}

/* ---- mobile detection (no UA sniff — CSS computed style) ---- */
function isMobile(trigger){
  return !trigger || window.getComputedStyle(trigger).display === 'none';
}

/* ---- FADE slot ---- */
function setupFade(slot){
  var vid = slot.querySelector('video');
  var zone = slot.querySelector('.trigger');

  function show(){ vid.play().catch(function(){}); vid.style.transition='opacity 0.6s ease-in-out'; vid.style.opacity='1'; }
  function hide(){ vid.style.transition='opacity 0.6s ease-in-out'; vid.style.opacity='0'; }

  if(zone){
    zone.addEventListener('mouseenter', show);
    zone.addEventListener('mouseleave', hide);
  }
  slot.addEventListener('click', function(){
    if(isMobile(zone)){ vid.style.opacity==='1' ? hide() : show(); }
  });
}

/* ---- WEBGL slot ---- */
function setupWebGL(slot){
  var vid = slot.querySelector('video');
  var zone = slot.querySelector('.trigger');
  var canvas = slot.querySelector('canvas.gl-canvas');
  var state = canvas ? buildGL(canvas) : null;
  var raf = {on:false, id:null};

  if(!state){
    console.warn('d93: webgl fallback fade', slot.id);
    setupFade(slot); return;
  }

  function show(){
    vid.play().catch(function(){});
    canvas.style.opacity = '1';
    if(!raf.on){ raf.on = true; raf.id = requestAnimationFrame(function(){ renderGL(state, vid, raf); }); }
    console.log('d93: webgl show', slot.id);
  }
  function hide(){
    canvas.style.opacity = '0';
    raf.on = false;
    if(raf.id){ cancelAnimationFrame(raf.id); raf.id = null; }
    console.log('d93: webgl hide', slot.id);
  }

  if(zone){
    zone.addEventListener('mouseenter', show);
    zone.addEventListener('mouseleave', hide);
  }
  slot.addEventListener('click', function(){
    if(isMobile(zone)){ raf.on ? hide() : show(); }
  });
}

/* ---- LFO flicker + glow-die slot ---- */
function setupLFO(slot){
  var vid = slot.querySelector('video');
  var zone = slot.querySelector('.trigger');
  var anim = null;

  function startFlicker(){
    if(anim) anim.cancel();
    vid.play().catch(function(){});
    vid.style.transition = '';
    vid.style.opacity = '1';
    vid.style.filter = 'brightness(1)';
    console.log('d93: lfo start', slot.id);

    var t0 = performance.now();
    var rafId = null;
    var dead = false;

    function tick(now){
      if(dead) return;
      var el = now - t0;
      if(el < 1000){
        vid.style.filter = 'brightness(' + (Math.floor(el / 100) % 2 === 0 ? 1 : 0) + ')';
        rafId = requestAnimationFrame(tick);
      } else {
        var g0 = performance.now();
        (function glow(now2){
          if(dead) return;
          var p = Math.min((now2 - g0) / 200, 1);
          vid.style.filter = 'brightness(' + (1 + p * 1.5).toFixed(2) + ')';
          if(p < 1){ rafId = requestAnimationFrame(glow); }
          else {
            vid.style.filter = 'brightness(2.5)';
            vid.style.transition = 'opacity 400ms ease';
            vid.style.opacity = '0';
            setTimeout(function(){
              if(!dead){ vid.style.transition=''; vid.style.filter=''; anim=null; console.log('d93: lfo done', slot.id); }
            }, 420);
          }
        })(performance.now());
      }
    }
    rafId = requestAnimationFrame(tick);

    anim = { cancel: function(){
      dead = true;
      if(rafId) cancelAnimationFrame(rafId);
      vid.style.transition=''; vid.style.filter=''; vid.style.opacity='0'; anim=null;
    }};
  }

  function stopFlicker(){ if(anim) anim.cancel(); }

  if(zone){
    zone.addEventListener('mouseenter', startFlicker);
    zone.addEventListener('mouseleave', stopFlicker);
  }
  slot.addEventListener('click', function(){
    if(isMobile(zone)) startFlicker();
  });
}

/* ---- init ---- */
document.querySelectorAll('.slot--fade').forEach(setupFade);
document.querySelectorAll('.slot--webgl').forEach(setupWebGL);
document.querySelectorAll('.slot--lfo').forEach(setupLFO);
console.log('d93: music4 slots ready');

})();
</script>
