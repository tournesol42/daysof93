:root {
  /* All grav vars 0–1. Set MIDI fader min=0 max=1 for all. */
  --grav-gm:       0.20;   /* → GRAV_GM:       0.00005 + v*0.00195  */
  --grav-z-vel:    0.24;   /* → GRAV_Z_VEL:    v*0.025             */
  --grav-opacity:  0.65;   /* → opacity:       direct              */
  --grav-size:     0.43;   /* → GRAV_SIZE_RANGE: v*0.15            */
  --grav-decimate: 1.00;   /* → particle count: fraction           */
  --grav-spawn-sc: 0.30;   /* → GRAV_SPAWN_SC: 0.5 + v*3.0        */
}
body { background: #FAC300; overflow: hidden; cursor: none; }

#d93-grid {
  position: fixed; inset: 0;
  z-index: 4; pointer-events: none;
  opacity: 0; transition: opacity 1.5s;
}

#ws-ch {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 999; opacity: 0;
  transition: opacity 0.3s;
}
#ws-ch-v {
  position: absolute;
  top: 0; bottom: 0; left: 50%;
  width: 0.75px;
  background: rgba(0,0,0,0.28);
}
#ws-ch-h {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 0.75px;
  background: rgba(0,0,0,0.28);
}
#ws-ch-sq {
  position: absolute;
  width: 7px; height: 7px;
  border: 0.75px solid rgba(0,0,0,0.38);
  transform: translate(-50%, -50%);
  top: 50%; left: 50%;
}
#c { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; opacity: 0; transition: opacity 0.8s; z-index: 3; }
#mj-img { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; z-index: 4; display: none; }
#text-93 { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'VT323', monospace; font-size: min(34vw, 60vh); color: #000000; line-height: 1; pointer-events: none; z-index: 5; user-select: none; letter-spacing: 0.04em; opacity: 0; }
.audio-dot {
  position: fixed;
  width: 176px; height: 176px;
  background: #FF6B00;
  left: 44%; top: 46%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 200;
  animation: d93pulse 1.4s ease-in-out infinite;
}
.audio-square {
  position: fixed;
  width: 132px; height: 132px;
  border-radius: 50%;
  background: #4D6B39;
  bottom: 44px; right: 64px;
  cursor: pointer;
  z-index: 200;
  display: none;
  animation: d93pulse 1.4s ease-in-out infinite;
}
@keyframes d93pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.25; }
}
</style>

(function initTDCompositor() {
  var VS = [
    'attribute vec2 a_pos;',
    'varying vec2 v_uv;',
    'void main() {',
    '  v_uv = vec2(a_pos.x*0.5+0.5, 1.0-(a_pos.y*0.5+0.5));',
    '  gl_Position = vec4(a_pos, 0.0, 1.0);',
    '}'
  ].join('\n');

  var FS = [
    'precision highp float;',
    'uniform sampler2D u_tex;',
    'varying vec2 v_uv;',
    'void main() {',
    '  vec3 col   = texture2D(u_tex, vec2(v_uv.x*0.5,       v_uv.y)).rgb;',
    '  float alph = texture2D(u_tex, vec2(v_uv.x*0.5+0.5,  v_uv.y)).r;',
    '  gl_FragColor = vec4(col, alph);',
    '}'
  ].join('\n');

  function compileShader(type, src) {
    var s = tdGl.createShader(type);
    tdGl.shaderSource(s, src); tdGl.compileShader(s); return s;
  }
  var prog = tdGl.createProgram();
  tdGl.attachShader(prog, compileShader(tdGl.VERTEX_SHADER,   VS));
  tdGl.attachShader(prog, compileShader(tdGl.FRAGMENT_SHADER, FS));
  tdGl.linkProgram(prog); tdGl.useProgram(prog);

  var buf = tdGl.createBuffer();
  tdGl.bindBuffer(tdGl.ARRAY_BUFFER, buf);
  tdGl.bufferData(tdGl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), tdGl.STATIC_DRAW);
  var aPos = tdGl.getAttribLocation(prog, 'a_pos');
  tdGl.enableVertexAttribArray(aPos);
  tdGl.vertexAttribPointer(aPos, 2, tdGl.FLOAT, false, 0, 0);

  var tex = tdGl.createTexture();
  tdGl.bindTexture(tdGl.TEXTURE_2D, tex);
  tdGl.texParameteri(tdGl.TEXTURE_2D, tdGl.TEXTURE_MIN_FILTER, tdGl.NEAREST);
  tdGl.texParameteri(tdGl.TEXTURE_2D, tdGl.TEXTURE_MAG_FILTER, tdGl.NEAREST);
  tdGl.texParameteri(tdGl.TEXTURE_2D, tdGl.TEXTURE_WRAP_S, tdGl.CLAMP_TO_EDGE);
  tdGl.texParameteri(tdGl.TEXTURE_2D, tdGl.TEXTURE_WRAP_T, tdGl.CLAMP_TO_EDGE);

  tdVid.addEventListener('playing', function() { tdReady = true; });

  (function tdTick() {
    requestAnimationFrame(tdTick);
    if (!tdActive || !tdReady || tdVid.readyState < 2) return;
    tdGl.texImage2D(tdGl.TEXTURE_2D, 0, tdGl.RGBA,
                    tdGl.RGBA, tdGl.UNSIGNED_BYTE, tdVid);
    tdGl.drawArrays(tdGl.TRIANGLE_STRIP, 0, 4);
  })();
})();

function resizeTD() {
  var dpr = window.devicePixelRatio || 1;
  tdCv.width  = window.innerWidth  * dpr;
  tdCv.height = window.innerHeight * dpr;
  tdGl.viewport(0, 0, tdCv.width, tdCv.height);
}
resizeTD();
window.addEventListener('resize', resizeTD);

function playXploreNext() {
  var file = XPLORE_FILES[xploreIdx];
  xploreIdx = (xploreIdx + 1) % XPLORE_FILES.length;

  // Fade in
  tdCv.style.transition = 'opacity 1.0s';
  tdCv.style.opacity    = '1';
  tdActive = true;

  tdVid.removeAttribute('loop');
  tdVid.src = XPLORE_CDN + file;
  tdVid.load();
  tdVid.muted = true;
  tdVid.play().catch(function(){});

  tdVid.onended = function() {
    // Fade out over 1.5s
    tdActive = false;
    tdCv.style.transition = 'opacity 1.5s';
    tdCv.style.opacity    = '0';
    // Random pause 2–8s after fade
    var pause = 2000 + Math.random() * 6000;
    setTimeout(playXploreNext, pause + 1500);
  };
}

function startXploreVideos() {
  setTimeout(playXploreNext, 10000);
}

function normalizeAngle(a) {
  while (a >  Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function lerpAngle(a, b, t) {
  var diff = b - a;
  while (diff >  Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

// ── Vertex deform injection ────────────────────────────────────
function injectDeform(material) {
  var ref = {
    uDeformMode:  { value: 0 },
    uDeformAmt:   { value: 0.0 },
    uDeformSpd:   { value: 1.0 },
    uDeformTime:  { value: 0.0 },
  };
  deformShaderRefs.push(ref);

  material.onBeforeCompile = function (shader) {
    shader.uniforms.uDeformMode  = ref.uDeformMode;
    shader.uniforms.uDeformAmt   = ref.uDeformAmt;
    shader.uniforms.uDeformSpd   = ref.uDeformSpd;
    shader.uniforms.uDeformTime  = ref.uDeformTime;

    shader.vertexShader =
      'uniform int   uDeformMode;\n' +
      'uniform float uDeformAmt, uDeformSpd, uDeformTime;\n' +
      shader.vertexShader;

    var deformBlock = [
      'if (uDeformMode == 0) {',
      '  float angle = transformed.y * uDeformAmt * 6.28318;',
      '  float c = cos(angle), s = sin(angle);',
      '  float x = transformed.x * c - transformed.z * s;',
      '  float z = transformed.x * s + transformed.z * c;',
      '  transformed.x = x; transformed.z = z;',
      '} else if (uDeformMode == 1) {',
      '  float angle = transformed.x * uDeformAmt * 2.0;',
      '  float c = cos(angle), s = sin(angle);',
      '  float y = transformed.y * c - transformed.z * s;',
      '  float z = transformed.y * s + transformed.z * c;',
      '  transformed.y = y; transformed.z = z;',
      '}',
    ].join('\n');

    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' + deformBlock
    );
  };
}

function filledSlots() {

}
function slotEl(i) {

  for (var i = 0; i < 100; i++) {
    var el = slotEl(i);

function saveToSlot() {
  var snap = {};
  for (var key in S) {
    var val = S[key];
    if (val === null || val === undefined) {
      snap[key] = val;
    } else if (val && val.isColor) {
      snap[key] = '#' + val.getHexString();
    } else if (typeof val === 'object' && !Array.isArray(val)) {
      continue;
    } else {
      snap[key] = val;
    }
  }
  snap._camX      = camera.position.x;
  snap._camY      = camera.position.y;
  snap._camZ      = camera.position.z;
  snap._tgtX      = controls.target.x;
  snap._tgtY      = controls.target.y;
  snap._tgtZ      = controls.target.z;
  snap._rotX      = currentGroup ? normalizeAngle(currentGroup.rotation.x) : 0;
  snap._rotY      = currentGroup ? normalizeAngle(currentGroup.rotation.y) : 0;
  snap._rotZ      = currentGroup ? normalizeAngle(currentGroup.rotation.z) : 0;
  snap._scaleX    = currentGroup ? currentGroup.scale.x : 1;
  snap._scaleY    = currentGroup ? currentGroup.scale.y : 1;
  snap._scaleZ    = currentGroup ? currentGroup.scale.z : 1;
  snap._meshIndex = currentMeshIndex;
  presets[activeSlot] = snap;
  renderSlots();
  persistPresets();
}
function clearSlot() {
  presets[activeSlot] = null;
  renderSlots();
}
function applySnapImmediate(p) {
  var targetIdx = -1;
  if (p._meshName) {
    targetIdx = findMeshByName(p._meshName);
    if (targetIdx < 0) pendingMeshName = p._meshName;
  }
  if (targetIdx < 0 && p._meshIndex !== undefined) {
    targetIdx = p._meshIndex;
  }
  if (targetIdx >= 0 && targetIdx !== currentMeshIndex) {
    switchToMesh(targetIdx);
  } else if (currentGroup) {
    applyMeshMaterials(currentGroup);
  }
  syncDisplayUniforms();
  renderer.setClearColor(S.bgColor, 1);
}
function applySnapFull(p) {
  for (var key in p) {
    if (key.charAt(0) === '_') continue;
    if (!(key in S)) continue;
    if (SESSION_KEYS.has(key)) continue;
    var val = p[key];
    if (S[key] && S[key].isColor) {
      S[key].set(val);
    } else if (typeof S[key] === 'object' && S[key] !== null && !S[key].isColor) {
      continue;
    } else {
      S[key] = val;
    }
  }
  applySnapImmediate(p);
  if (p._camX !== undefined) {
    camera.position.set(p._camX, p._camY, p._camZ);
    controls.target.set(p._tgtX, p._tgtY, p._tgtZ);
    controls.update();
  }
  if (currentGroup && p._rotX !== undefined)
    currentGroup.rotation.set(p._rotX, p._rotY, p._rotZ);
  if (currentGroup && p._scaleX !== undefined)
    currentGroup.scale.set(p._scaleX, p._scaleY, p._scaleZ);
  syncAllUI();
  syncDisplayUniforms();
  renderer.setClearColor(S.bgColor, 1);
}
function startInterp(snap) {
  interpFrom   = {};

  for (var key in S) {
    var v = S[key];
    if (v && v.isColor) { interpFrom[key] = '#' + v.getHexString(); }
    else if (typeof v === 'number') { interpFrom[key] = v; }
    else { interpFrom[key] = v; }
  }
  interpFrom._camX  = camera.position.x; interpFrom._camY  = camera.position.y; interpFrom._camZ  = camera.position.z;
  interpFrom._tgtX  = controls.target.x; interpFrom._tgtY  = controls.target.y; interpFrom._tgtZ  = controls.target.z;
  interpFrom._rotX  = currentGroup ? currentGroup.rotation.x : 0;
  interpFrom._rotY  = currentGroup ? currentGroup.rotation.y : 0;
  interpFrom._rotZ  = currentGroup ? currentGroup.rotation.z : 0;
  interpFrom._scaleX = currentGroup ? currentGroup.scale.x : 1;
  interpFrom._scaleY = currentGroup ? currentGroup.scale.y : 1;
  interpFrom._scaleZ = currentGroup ? currentGroup.scale.z : 1;
  interpTo     = snap;
  interpT0     = performance.now();
  interpActive = true;
  applySnapImmediate(snap);

function loadSlot(i) {
  var p = presets[i];
  if (!p) return;
  activeSlot = i;
  renderSlots();
  scrollSlotIntoView(i);
  if (S.interpOn) {
    startInterp(p);
  } else {
    applySnapFull(p);
  }
  persistViewerState();
}
function nextSlot() {
  var filled = filledSlots();
  if (!filled.length) return;
  var cur = filled.indexOf(activeSlot);
  loadSlot(filled[(cur + 1) % filled.length]);
}
function prevSlot() {
  var filled = filledSlots();
  if (!filled.length) return;
  var cur = filled.indexOf(activeSlot);
  loadSlot(filled[(cur - 1 + filled.length) % filled.length]);
}
function randomSlot() {
  var filled = filledSlots();
  if (filled.length < 2) return;
  var i;
  do { i = filled[Math.floor(Math.random() * filled.length)]; } while (i === activeSlot);
  loadSlot(i);
}

// ── Render loop ────────────────────────────────────────────────
var lastT  = performance.now();
var frames = 0;
var SMOOTH = 0.06;

function render() {
  requestAnimationFrame(render);

  if (masterLPF) {
    if (drumMouseActive && drumMouseGain) {
      drumVolSmooth += (drumVolTarget - drumVolSmooth) * 0.05;
      drumMouseGain.gain.value = drumVolSmooth;
    }
    lpfSmooth += (lpfTarget - lpfSmooth) * 0.05;
    masterLPF.frequency.value = lpfSmooth;
    if (arpGainNode) {
      var arpVol = Math.max(0, Math.min(1, (lpfSmooth - 800) / (20000 - 800)));
      arpGainNode.gain.value = arpVol;
    }
  }

  if (analyser && currentGroup) {
    analyser.getByteTimeDomainData(analyserData);
    var rmsSum = 0;
    for (var ei = 0; ei < analyserData.length; ei++) {
      var v = (analyserData[ei] - 128.0) / 128.0;
      rmsSum += v * v;
    }
    var rms = Math.sqrt(rmsSum / analyserData.length);
    var lag = rms > envAmp ? 0.45 : ENV_LAG;
    envAmp = envAmp * lag + rms * (1.0 - lag);
    var envT = 0.0;
    if (envAmp > ENV_THRESHOLD) {
      envT = Math.min((envAmp - ENV_THRESHOLD) / (1.0 - ENV_THRESHOLD), 1.0);
      audioScale += (1.0 + envT * (ENV_SCALE_MAX - 1.0) - audioScale) * 0.15;
    } else {
      audioScale += (1.0 - audioScale) * 0.04;
    }
    currentGroup.scale.setScalar(S.manualScale * audioScale);

    audioRotMult = 1.0 + envT * (ENV_ROT_MAX - 1.0);
  }

  controls.update();

  // ── Preset interpolation tick ─────────────────────────────────
  if (interpActive && interpFrom && interpTo) {
    var tRaw = (performance.now() - interpT0) / (S.interpDur * 1000);
    var t = tRaw >= 1.0 ? 1.0 : tRaw * tRaw * (3.0 - 2.0 * tRaw); // cubic ease in-out
    for (var ikey in interpTo) {
      if (ikey.charAt(0) === '_') continue;
      if (!(ikey in S)) continue;
      if (SESSION_KEYS.has(ikey)) continue;
      var fromV = interpFrom[ikey];
      var toV   = interpTo[ikey];
      if (S[ikey] && S[ikey].isColor) {
        var fc = new THREE.Color(fromV), tc = new THREE.Color(toV);
        S[ikey].setRGB(
          fc.r + (tc.r - fc.r) * t,
          fc.g + (tc.g - fc.g) * t,
          fc.b + (tc.b - fc.b) * t
        );
      } else if (typeof toV === 'number' && typeof fromV === 'number') {
        S[ikey] = fromV + (toV - fromV) * t;
      }
    }
    // camera
    if (interpTo._camX !== undefined) {
      camera.position.set(
        interpFrom._camX + (interpTo._camX - interpFrom._camX) * t,
        interpFrom._camY + (interpTo._camY - interpFrom._camY) * t,
        interpFrom._camZ + (interpTo._camZ - interpFrom._camZ) * t
      );
      controls.target.set(
        interpFrom._tgtX + (interpTo._tgtX - interpFrom._tgtX) * t,
        interpFrom._tgtY + (interpTo._tgtY - interpFrom._tgtY) * t,
        interpFrom._tgtZ + (interpTo._tgtZ - interpFrom._tgtZ) * t
      );
      controls.update();
    }
    // rotation + scale
    if (currentGroup && interpTo._rotX !== undefined) {
      currentGroup.rotation.set(
        lerpAngle(interpFrom._rotX, interpTo._rotX, t),
        lerpAngle(interpFrom._rotY, interpTo._rotY, t),
        lerpAngle(interpFrom._rotZ, interpTo._rotZ, t)
      );
    }
    if (currentGroup && interpTo._scaleX !== undefined) {
      currentGroup.scale.set(
        interpFrom._scaleX + (interpTo._scaleX - interpFrom._scaleX) * t,
        interpFrom._scaleY + (interpTo._scaleY - interpFrom._scaleY) * t,
        interpFrom._scaleZ + (interpTo._scaleZ - interpFrom._scaleZ) * t
      );
    }
    if (tRaw >= 1.0) {
      interpActive = false;
      applySnapFull(interpTo);
    } else {
      syncDisplayUniforms();
    }
  }

  var elapsed = (performance.now() - startTime) / 1000;

  // ── MIDI: hold or smooth-return each channel ──────────────────
  // Scale (MIDI × manual)
  var midiScaleVal;
  if (S.midiScaleOn) {
    if (!midiActive.scale) midiVals.scale += (1.0 - midiVals.scale) * SMOOTH;
    midiScaleVal = midiVals.scale;
  } else {
    midiVals.scale = 1.0;
    midiScaleVal = 1.0;
  }
  currentScale = S.manualScale * midiScaleVal;
  if (currentGroup && !analyser) currentGroup.scale.setScalar(currentScale);

  // Rotation with inertia
  if (!midiActive.rot) {
    midiVals.rot += (0 - midiVals.rot) * SMOOTH;
  }
  var targetRotSpeed = (S.midiRotOn && midiActive.rot) ? midiVals.rot : S.rotSpeed;
  smoothRotSpeed += (targetRotSpeed - smoothRotSpeed) * (1.0 - S.rotLag);
  if (S.autoRot && currentGroup) {
    currentGroup.rotation[S.rotAxis] += smoothRotSpeed * audioRotMult;
    currentGroup.rotation.x = normalizeAngle(currentGroup.rotation.x);
    currentGroup.rotation.y = normalizeAngle(currentGroup.rotation.y);
    currentGroup.rotation.z = normalizeAngle(currentGroup.rotation.z);
  }

  // ── Crosshair: direct (chPos kept for meshB/grid modulation) ───
  chPos.x = chTarget.x;
  chPos.y = chTarget.y;

  // ── MeshB rotation speed from crosshair Y ──────────────────────
  var yNorm = 1.0 - (chPos.y / window.innerHeight);
  var meshBSpeedTarget = yNorm > 0.8
    ? 1.0 + (yNorm - 0.8) * 50.0
    : yNorm * 1.25;
  meshBSpeedMult += (meshBSpeedTarget - meshBSpeedMult) * 0.06;

  if (meshBGroup.visible) {
    meshBGroup.rotation.x = normalizeAngle(meshBGroup.rotation.x + meshBRotSpeedX * meshBSpeedMult);
    meshBGroup.rotation.y = normalizeAngle(meshBGroup.rotation.y + meshBRotSpeedY * meshBSpeedMult);
  }

  // ── Grid skew from crosshair — lagged ──────────────────────────
  var gTargX = (chPos.x / window.innerWidth  - 0.5) * window.innerWidth  * 0.06;
  var gTargY = (chPos.y / window.innerHeight - 0.6) * window.innerHeight * 0.04;
  gridSkewX += (gTargX - gridSkewX) * 0.03;
  gridSkewY += (gTargY - gridSkewY) * 0.03;
  if (Math.abs(gridSkewX - prevGridSkewX) > 0.15 || Math.abs(gridSkewY - prevGridSkewY) > 0.15) {
    buildGrid();
    prevGridSkewX = gridSkewX;
    prevGridSkewY = gridSkewY;
  }

  // Deform amount
  if (!midiActive.deform) {
    midiVals.deform += (0 - midiVals.deform) * SMOOTH;
  }
  var deformAmt = S.midiDeformOn ? midiVals.deform : S.deformAmt;

  // Deform uniforms — unconditional so mode changes always propagate
  for (var di = 0; di < deformShaderRefs.length; di++) {
    var dr = deformShaderRefs[di];
    dr.uDeformMode.value  = S.deformMode;
    dr.uDeformAmt.value   = deformAmt;
    dr.uDeformSpd.value   = S.deformSpeed;
    dr.uDeformTime.value  = elapsed;
  }

  // Brightness
  if (!midiActive.bri) {
    midiVals.bri += (0 - midiVals.bri) * SMOOTH;
  }
  if (S.midiBriOn) {
    displayMat.uniforms.uBri.value = midiVals.bri;
  }

  // Hue
  if (!midiActive.hue) {
    midiVals.hue += (0 - midiVals.hue) * SMOOTH;
  }

  // Decay
  if (!midiActive.decay) {
    midiVals.decay += (S.decay - midiVals.decay) * SMOOTH;
  }
  var effectiveDecay = (S.midiDecayOn && midiActive.decay) ? midiVals.decay : S.decay;

  // Sync static display uniforms first, then hue mod / MIDI hue override uHue
  syncDisplayUniforms();

  // Hue modulator (runs after syncDisplayUniforms to override uHue)
  if (S.hueMod && !S.midiHueOn) {
    huePhase += S.hueModRate;
    var wave;
    if (S.hueModWave === 'sine')     wave = (Math.sin(huePhase * Math.PI / 180) + 1) * 0.5;
    else if (S.hueModWave === 'tri') wave = Math.abs(((huePhase / 180) % 2) - 1);
    else                             wave = Math.random();
    displayMat.uniforms.uHue.value = S.hue + wave * S.hueModDepth;
  } else if (S.midiHueOn) {
    displayMat.uniforms.uHue.value = S.hue + midiVals.hue;
  }

  if (S.trailOn) {
    var frameDecay;
    if (S.trailType === 'paint') {
      frameDecay = 1.0;
    } else if (S.trailType === 'echo') {
      echoFrame++;
      frameDecay = (echoFrame % S.echoInterval === 0) ? 1.0 : 0.96;
    } else {
      frameDecay = effectiveDecay;
    }

    renderer.setRenderTarget(rtScene);
    renderer.setClearColor(0x000000, 1);
    renderer.clear();
    curtainSmooth += (curtainTarget - curtainSmooth) * 0.06;
    // trail already black — no curtain needed
    renderer.render(scene, camera);

    feedbackMat.uniforms.tCur.value   = rtScene.texture;
    feedbackMat.uniforms.tPrev.value  = rtA.texture;
    feedbackMat.uniforms.uDecay.value = frameDecay;
    feedbackMat.uniforms.uBlend.value = S.blendMode;
    postQuad.material = feedbackMat;
    renderer.setRenderTarget(rtB);
    renderer.clear();
    renderer.render(postScene, postCamera);

    displayMat.uniforms.tIn.value = rtB.texture;
    postQuad.material = displayMat;
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);

    var tmp = rtA; rtA = rtB; rtB = tmp;

  } else {
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
    curtainSmooth += (curtainTarget - curtainSmooth) * 0.06;
    if (curtainActive) {
      renderer.setClearColor(0x000000, curtainSmooth);
    }
    renderer.render(scene, camera);
  }

  // MeshB renders outside trail pipeline — no trail accumulation
  if (meshBGroup.visible) {
    renderer.autoClear = false;
    renderer.render(sceneB, camera);
    renderer.autoClear = true;
  }

  // ── Drums envelope → TD video opacity ──────────────────────────
  if (drumsAnalyser) {
    drumsAnalyser.getByteTimeDomainData(drumsAnalyserData);
    var _dRms = 0;
    for (var _di = 0; _di < drumsAnalyserData.length; _di++) {
      var _dv = (drumsAnalyserData[_di] - 128.0) / 128.0;
      _dRms += _dv * _dv;
    }
    _dRms = Math.sqrt(_dRms / drumsAnalyserData.length);
    var _dLag = _dRms > drumsEnvAmp ? 0.45 : ENV_LAG;
    drumsEnvAmp = drumsEnvAmp * _dLag + _dRms * (1.0 - _dLag);
    var _dEnvT = drumsEnvAmp > ENV_THRESHOLD
      ? Math.min((drumsEnvAmp - ENV_THRESHOLD) / (0.12 - ENV_THRESHOLD), 1.0)
      : 0.0;
    tdOpacity += (_dEnvT - tdOpacity) * 0.08;
    tdCv.style.opacity = tdOpacity.toFixed(3);
  }


  // ── MJ image opacity modulation ────────────────────────────────
  if (mjActive && mjImg) {
    mjSpikeLevel += (mjBaseOpacity - mjSpikeLevel) * 0.08;
    mjImg.style.opacity = mjSpikeLevel.toFixed(3);
    mjPosX += mjVelX;
    mjPosY += mjVelY;
    if (Math.abs(mjPosX) > 130) mjVelX *= -1;
    if (Math.abs(mjPosY) > 90)  mjVelY *= -1;
    mjImg.style.transform = 'translate(' + mjPosX.toFixed(1) + 'px,' + mjPosY.toFixed(1) + 'px)';
    // Wire darkening: spike above base pushes lines toward pure black
    var _dkT = mjSpikeLevel > mjBaseOpacity
      ? Math.min((mjSpikeLevel - mjBaseOpacity) / (1.0 - mjBaseOpacity + 0.001), 1.0)
      : 0.0;
    mjThickT += (_dkT - mjThickT) * 0.06;
    if (_dkT > 0.005) {
      var _wc = S.wireColor.clone().lerp(_mjBlack, _dkT * 0.70);
      wireMats.forEach(function(m) {
        if (m.color) m.color.copy(_wc);
        m.opacity = Math.min(1.0, S.opacity + (1.0 - S.opacity) * _dkT * 0.95);
        m.transparent = true;
      });
    } else {
      wireMats.forEach(function(m) {
        if (m.color) m.color.copy(S.wireColor);
        m.opacity = S.opacity;
        m.transparent = S.opacity < 1;
      });
    }
    canvas.style.filter = mjThickT > 0.01
      ? 'blur(' + (mjThickT * 1.8).toFixed(2) + 'px)'
      : '';
  }

  if (gravMesh) updateGravParticles();
  if (greenCubeMesh) tickGreenCubes();

  // ── Camera path: record or playback ────────────────────────────
  if (_camRec !== null) {
    // Recording: capture position when it moves
    var _cp = camera.position;
    var _cl = _camRec[_camRec.length - 1];
    if (!_cl || Math.abs(_cp.x-_cl.x)>0.003 || Math.abs(_cp.y-_cl.y)>0.003 || Math.abs(_cp.z-_cl.z)>0.003) {
      _camRec.push({t:Math.round(performance.now()-_camRecStart), x:+_cp.x.toFixed(4), y:+_cp.y.toFixed(4), z:+_cp.z.toFixed(4)});
    }
  } else if (BAKED_CAM.length > 1) {
    // Playback: set camera position from baked path, looping
    var _elapsed = (performance.now() - _camPlayStart) % BAKED_CAM_DUR;
    var _cf = BAKED_CAM[0];
    for (var _fi = 0; _fi < BAKED_CAM.length; _fi++) {
      if (BAKED_CAM[_fi].t > _elapsed) break;
      _cf = BAKED_CAM[_fi];
    }
    camera.position.set(_cf.x, _cf.y, _cf.z);
  }

  // MIDI color overrides — applied after syncDisplayUniforms so they persist
  if (_midiBgColor) {
    displayMat.uniforms.uBgColor.value.copy(_midiBgColor);
    document.body.style.background = '#' + _midiBgColor.getHexString();
  }
  if (_midiWireColor) {
    S.wireColor.copy(_midiWireColor);
    wireMats.forEach(function(m) { if (m.color) m.color.copy(_midiWireColor); });
  }

  frames++;
  var now = performance.now();
  if (now - lastT > 600) {
    frames = 0; lastT = now;
  }
}

// ── Resize ─────────────────────────────────────────────────────
function onResize() {
  var w = cw(), h = ch();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  rtScene.setSize(w, h); rtA.setSize(w, h); rtB.setSize(w, h);
  lineRes.set(w, h);
  wireMats.forEach(function (m) { if (m.isLineMaterial) m.resolution.set(w, h); });
}
window.addEventListener('resize', onResize);
onResize();

// ── Trail helpers ──────────────────────────────────────────────
function clearTrail() {
  [rtA, rtB].forEach(function (rt) {
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
  });
  renderer.setRenderTarget(null);
}

// ── Mesh material helpers ──────────────────────────────────────
function applyMeshMaterials(group) {
  wireMats = []; lineMats = []; edgeLines = []; deformShaderRefs = [];

  // Remove edge overlay children
  var toRemove = [];
  group.traverse(function (c) {
    if (c.userData.edgeOverlay) toRemove.push(c);
  });
  toRemove.forEach(function (c) {
    if (c.parent) c.parent.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  });

  // Re-show original meshes
  group.traverse(function (child) {
    if (child.isMesh && !child.userData.edgeOverlay) child.visible = true;
  });

  group.traverse(function (child) {
    if (!child.isMesh || child.userData.edgeOverlay) return;
    child.renderOrder = 0;
    var color = S.wireColor.clone();

    if (S.meshMode === 'edge') {
      child.visible = false;
      var eg = new THREE.EdgesGeometry(child.geometry, 15);
      var mat, lines;
      if (S.lineThickness <= 1) {
        mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: S.opacity });
        injectDeform(mat);
        lines = new THREE.LineSegments(eg, mat);
      } else {
        mat = new THREE.LineMaterial({ color: color.getHex(), linewidth: S.lineThickness, resolution: lineRes, transparent: true, opacity: S.opacity, depthWrite: true, depthTest: true });
        var lsg = new THREE.LineSegmentsGeometry();
        lsg.setPositions(Array.from(eg.attributes.position.array));
        lines = new THREE.LineSegments2(lsg, mat);
      }
      lines.renderOrder = 2;
      lines.material.depthWrite = true;
      lines.material.depthTest  = true;
      lines.userData.edgeOverlay = true;
      lines.position.copy(child.position);
      lines.quaternion.copy(child.quaternion);
      lines.scale.copy(child.scale);
      child.parent.add(lines);
      wireMats.push(mat);
      edgeLines.push(lines);
    } else {
      child.visible = false;
      var eg = new THREE.EdgesGeometry(child.geometry, 5);
      var mat, lines;
      if (S.lineThickness <= 1) {
        mat = new THREE.LineBasicMaterial({ color: S.wireColor.getHex(), transparent: true, opacity: S.opacity });
        injectDeform(mat);
        lines = new THREE.LineSegments(eg, mat);
      } else {
        mat = new THREE.LineMaterial({ color: S.wireColor.getHex(), linewidth: S.lineThickness, resolution: lineRes, transparent: true, opacity: S.opacity, depthWrite: true, depthTest: true });
        var lsg = new THREE.LineSegmentsGeometry();
        lsg.setPositions(Array.from(eg.attributes.position.array));
        lines = new THREE.LineSegments2(lsg, mat);
      }
      lines.renderOrder = 2;
      lines.material.depthWrite = true;
      lines.material.depthTest  = true;
      lines.userData.edgeOverlay = true;
      lines.position.copy(child.position);
      lines.quaternion.copy(child.quaternion);
      lines.scale.copy(child.scale);
      child.parent.add(lines);
      wireMats.push(mat);
    }

  });
}

function syncWireColor() {
  wireMats.forEach(function (m) { if (m.color) m.color.set(S.wireColor.getHex()); });
}
function syncWireOpacity() {
  wireMats.forEach(function (m) { m.opacity = S.opacity; m.transparent = S.opacity < 1; });
}

// ── GLB loader ─────────────────────────────────────────────────
var loader = new THREE.GLTFLoader();

function normaliseGroup(group) {
  var box    = new THREE.Box3().setFromObject(group);
  var centre = box.getCenter(new THREE.Vector3());
  var size   = box.getSize(new THREE.Vector3());
  group.position.sub(centre);
  var maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, 0, maxDim * 2.2);
  controls.reset();
}

function loadGLB(file) {
  var url = URL.createObjectURL(file);
  loader.load(url, function (gltf) {
    URL.revokeObjectURL(url);

    var group = gltf.scene;
    var tris  = 0, verts = 0;
    group.traverse(function (c) {
      if (c.isMesh) {
        var g = c.geometry;
        verts += g.attributes.position.count;
        tris  += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      }
    });

    normaliseGroup(group);
    var meshName = file.name.replace('.glb', '');
    meshBank.push({ name: meshName, group: group });
    switchToMesh(meshBank.length - 1);

    clearTrail();
    setMeshInfo(Math.round(tris), verts, meshName);
    var hint = document.getElementById('dropHint');
    if (hint) hint.classList.remove('show');
  }, undefined, function (err) { console.error('GLB load error', err); });
}

// ── localStorage persistence ───────────────────────────────────
function persistPresets() {
  localStorage.setItem('d93_presets', JSON.stringify(presets));
  localStorage.setItem('d93_activeSlot', activeSlot);
}

function persistMeshLib() {
  var lib = meshBank.map(function (m) { return { name: m.name, url: m.url || null }; });
  localStorage.setItem('d93_meshLib', JSON.stringify(lib));
}

function persistViewerState() {
  var snap = {};
  for (var key in S) {
    var val = S[key];
    if (val && val.isColor) snap[key] = '#' + val.getHexString();
    else if (typeof val !== 'object') snap[key] = val;
  }
  snap._camX = camera.position.x; snap._camY = camera.position.y; snap._camZ = camera.position.z;
  snap._tgtX = controls.target.x; snap._tgtY = controls.target.y; snap._tgtZ = controls.target.z;
  snap._rotX = currentGroup ? currentGroup.rotation.x : 0;
  snap._rotY = currentGroup ? currentGroup.rotation.y : 0;
  snap._rotZ = currentGroup ? currentGroup.rotation.z : 0;
  snap._meshIndex = currentMeshIndex;
  localStorage.setItem('d93_viewerState', JSON.stringify(snap));
}

function loadPersistedPresets() {
  try {
    var raw = localStorage.getItem('d93_presets');
    if (raw) {
      var loaded = JSON.parse(raw);
      loaded.forEach(function (p, i) { if (i < 100) presets[i] = p; });
    }
    var slot = localStorage.getItem('d93_activeSlot');
    if (slot !== null) activeSlot = parseInt(slot);
    renderSlots();
  } catch(e) { console.warn('d93: preset load failed', e); }
}

function loadPersistedMeshLib() {
  try {
    var raw = localStorage.getItem('d93_meshLib');
    if (!raw) return;
    var lib = JSON.parse(raw);
    var toLoad = lib.filter(function(e) { return e.url; });
    var loaded = 0;
    var total = toLoad.length;
    toLoad.forEach(function(entry) {
      loader.load(entry.url, function(gltf) {
        var group = gltf.scene;
        var box = new THREE.Box3().setFromObject(group);
        var centre = box.getCenter(new THREE.Vector3());
        group.position.sub(centre);
        group.visible = false;
        scene.add(group);
        applyMeshMaterials(group);
        meshBank.push({ name: entry.name, url: entry.url, group: group });
        loaded++;
        if (typeof _pendingMeshIndex === 'number') {
          if (meshBank.length - 1 === _pendingMeshIndex || loaded === total) {
            switchToMesh(_pendingMeshIndex);
            _pendingMeshIndex = null;
          }
        }
      }, undefined, function(err) {
        loaded++;
        if (typeof _pendingMeshIndex === 'number' && loaded === total) {
          switchToMesh(Math.min(_pendingMeshIndex, meshBank.length - 1));
          _pendingMeshIndex = null;
        }
      });
    });
  } catch(e) { console.warn('meshlib load failed', e); }
}

// ── MIDI engine ────────────────────────────────────────────────
function onMIDI(e) {
  var cmd = e.data[0] & 0xF0;
  var vel = e.data[2];
  var isNoteOn  = cmd === 0x90 && vel > 0;
  var isNoteOff = cmd === 0x80 || (cmd === 0x90 && vel === 0);
  var t = vel / 127;

  var note = e.data[1];

  if (isNoteOn) {
    if (S.midiScaleOn)  { midiVals.scale  = S.midiScaleMin  + t * (S.midiScaleMax  - S.midiScaleMin);  midiActive.scale  = true; }
    if (S.midiRotOn)    { midiVals.rot    = S.midiRotMin    + t * (S.midiRotMax    - S.midiRotMin);    midiActive.rot    = true; }
    if (S.midiDeformOn) { midiVals.deform = S.midiDeformMin + t * (S.midiDeformMax - S.midiDeformMin); midiActive.deform = true; }
    if (S.midiBriOn)    { midiVals.bri    = S.midiBriMin    + t * (S.midiBriMax    - S.midiBriMin);    midiActive.bri    = true; }
    if (S.midiHueOn)    { midiVals.hue    = S.midiHueMin    + t * (S.midiHueMax    - S.midiHueMin);    midiActive.hue    = true; }
    if (S.midiDecayOn)  { midiVals.decay  = S.midiDecayMin  + t * (S.midiDecayMax  - S.midiDecayMin);  midiActive.decay  = true; }
    if (S.midiTriggerPreset) {
      if (presetSeqMode === 'RANDOM') { randomSlot(); }
      else if (S.presetDir === 'next') { nextSlot(); }
      else { prevSlot(); }
    }
  }
  if (isNoteOff) {
    midiActive.scale  = false;
    midiActive.rot    = false;
    midiActive.deform = false;
    midiActive.bri    = false;
    midiActive.hue    = false;
    midiActive.decay  = false;
  }
}

function selectMIDIPort(id) {
  if (midiPort) midiPort.onmidimessage = null;
  if (!id || !midiAccess) {
    midiPort       = null;
    midiConnected  = false;
    updateMidiPill();
    return;
  }
  midiPort = midiAccess.inputs.get(id);
  if (midiPort) {
    midiPort.onmidimessage = onMIDI;
    midiConnected = true;
  } else {
    midiConnected = false;
  }
  updateMidiPill();
}

function populateMIDIPorts() {
  var sel = document.getElementById('midiPortSel');
  if (!sel) {
    // No UI — just connect first available port
    if (midiAccess) {
      var first = null;
      midiAccess.inputs.forEach(function (input) { if (!first) first = input.id; });
      if (first) selectMIDIPort(first);
    }
    return;
  }
  var current = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  if (!midiAccess) return;
  midiAccess.inputs.forEach(function (input) {
    var opt = document.createElement('option');
    opt.value = input.id;
    opt.textContent = input.name;
    sel.appendChild(opt);
  });
  if (current && midiAccess.inputs.has(current)) {
    sel.value = current;
  }
  selectMIDIPort(sel.value);
}

function updateMidiPill() {
  var pill = document.getElementById('pillMidi');
  if (pill) { pill.textContent = midiConnected ? 'MIDI ON' : 'MIDI OFF'; pill.classList.toggle('active', midiConnected); }
}

function initMIDI() {
  if (!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess().then(function (access) {
    midiAccess = access;
    populateMIDIPorts();
    access.onstatechange = function () { populateMIDIPorts(); };
  }, function () {
    console.warn('MIDI access denied');
  });
}

function findMeshByName(name) {
  for (var i = 0; i < meshBank.length; i++) {
    if (meshBank[i].name === name) return i;
  }
  return -1;
}

var pendingMeshName = null;
var firstPresetFired = false;

function loadMeshLibrary() {
  MESH_LIBRARY.forEach(function(entry) {
    if (!entry.url) return;
    loader.load(entry.url, function(gltf) {
      var group = gltf.scene;
      var box = new THREE.Box3().setFromObject(group);
      var centre = box.getCenter(new THREE.Vector3());
      group.position.sub(centre);
      group.visible = false;
      scene.add(group);
      applyMeshMaterials(group);
      meshBank.push({ name: entry.name, url: entry.url, group: group });
      console.log('Mesh loaded:', entry.name, 'bank size:', meshBank.length, 'pending:', pendingMeshName);
      // Fire first preset as soon as its mesh is ready
      if (!firstPresetFired && BAKED_PRESETS[0] && entry.name === BAKED_PRESETS[0]._meshName) {
        firstPresetFired = true;
        switchToMesh(meshBank.length - 1);
        loadSlot(0);
        document.getElementById('d93-grid').style.opacity = '1';
        setTimeout(function() {
          document.getElementById('audioSquare').style.display = 'block';
        }, 20000);
        setTimeout(startAutoPreset, 2000);
      }

function initAudio() {

  seqReverbSend.gain.value = 0;

  seqConvolver.buffer = createReverbIR(audioCtx, 8.0, 1.2);
  seqReverbSend.connect(seqConvolver);
  seqConvolver.connect(audioCtx.destination);

  masterLimiter.threshold.value = -1;
  masterLimiter.knee.value = 0;

  masterLimiter.attack.value = 0.001;
  masterLimiter.release.value = 0.08;
  masterVolGain = audioCtx.createGain();
  masterVolGain.gain.value = 1.0;
  masterLPF.connect(masterLimiter);
  masterLimiter.connect(masterVolGain);
  masterVolGain.connect(audioCtx.destination);
  masterGain.disconnect(audioCtx.destination);
  masterGain.connect(masterLPF);
  seqConvolver.disconnect(audioCtx.destination);
  seqConvolver.connect(masterLPF);
  musicGain = audioCtx.createGain();
  musicGain.gain.value = 3.162;
  musicGain.connect(masterLPF);
}

function createReverbIR(ctx, duration, decay) {
  var rate = ctx.sampleRate;
  var length = Math.ceil(rate * duration);
  var preDelay = Math.floor(rate * 0.04);
  var ir = ctx.createBuffer(2, length, rate);
  for (var c = 0; c < 2; c++) {
    var ch = ir.getChannelData(c);
    for (var i = preDelay; i < length; i++) {
      var t = (i - preDelay) / (length - preDelay);
      ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
    }
  }
  return ir;
}

function sampleHoldReverbSend() {
  if (!seqReverbSend || !drumsStarted) return;
  var v = Math.pow(Math.random(), 4) * 0.8;

}

function loadAndPlay(base, files, indexRef, onEnded) {
  var idx;
  do { idx = Math.floor(Math.random() * files.length); }
  while (idx === indexRef.val && files.length > 1);
  indexRef.val = idx;

  var xhr = new XMLHttpRequest();
  xhr.open('GET', base + files[idx], true);
  xhr.responseType = 'arraybuffer';
  xhr.onload = function() {
    audioCtx.decodeAudioData(xhr.response, function(buffer) {
      var src = audioCtx.createBufferSource();
      src.buffer = buffer;
      if (base === MUSIC_BASE && musicGain) {
        src.connect(musicGain);
      } else {
        src.connect(masterGain);
      }
      if (seqReverbSend && base === SEQ_BASE) {
        src.connect(seqReverbSend);
      }
      src.onended = onEnded;
      src.start(0);
    });
  };
  xhr.send();
}

}

  do { idx = filled[Math.floor(Math.random() * filled.length)]; }

}

function cloneMeshToB(bankIdx) {
  meshBGroup.children.slice().forEach(function(c) { if (c.geometry) c.geometry.dispose(); });
  meshBMats.forEach(function (m) { m.dispose(); });
  meshBMats = [];
  while (meshBGroup.children.length) meshBGroup.remove(meshBGroup.children[0]);
  if (bankIdx < 0 || bankIdx >= meshBank.length) return;
  var srcGroup = meshBank[bankIdx].group;
  srcGroup.traverse(function (child) {
    if (!child.userData || !child.userData.edgeOverlay) return;
    var mat, ls;
    if (child.isLineSegments2) {
      mat = new THREE.LineMaterial({
        color: meshBColor, linewidth: 1, resolution: lineRes,
        transparent: true, opacity: meshBOpacity, depthWrite: false, depthTest: false
      });
      ls = new THREE.LineSegments2(child.geometry.clone(), mat);
    } else {
      mat = new THREE.LineBasicMaterial({ color: meshBColor, transparent: true, opacity: meshBOpacity, depthWrite: false, depthTest: false });
      ls = new THREE.LineSegments(child.geometry.clone(), mat);
    }
    ls.renderOrder = 2;
    ls.position.copy(child.position);
    ls.quaternion.copy(child.quaternion);
    ls.scale.copy(child.scale);
    meshBGroup.add(ls);
    meshBMats.push(mat);
  });
  meshBGroup.scale.setScalar(meshBScale);
  meshBGroup.rotation.set(0, 0, 0);
  meshBGroup.visible = meshBGroup.children.length > 0;
  meshBMeshIndex = bankIdx;
}

// ── Minimal MIDI parser – note-on events only ──────────────────
function parseMidiNoteOns(arrayBuffer) {
  var u8 = new Uint8Array(arrayBuffer);
  var pos = 0;
  function readU32() {
    return (((u8[pos++]<<24)|(u8[pos++]<<16)|(u8[pos++]<<8)|u8[pos++])>>>0);
  }
  function readU16() { return ((u8[pos++]<<8)|u8[pos++]); }
  function readVarLen() {
    var val=0, b;
    do { b=u8[pos++]; val=(val<<7)|(b&0x7f); } while (b&0x80);
    return val;
  }
  pos = 8;
  var format = readU16(), numTracks = readU16(), tpb = readU16();
  var secPerBeat = 60 / DRUMS_BPM;
  var events = [];
  for (var t = 0; t < numTracks; t++) {
    while (pos < u8.length-4) {
      if (u8[pos]===0x4D&&u8[pos+1]===0x54&&u8[pos+2]===0x72&&u8[pos+3]===0x6B) { pos+=4; break; }
      pos++;
    }
    if (pos >= u8.length) break;
    var trackLen = readU32(), trackEnd = pos+trackLen;
    var absTick = 0, lastStatus = 0;
    while (pos < trackEnd) {
      var delta = readVarLen();
      absTick += delta;
      var b = u8[pos], status;
      if (b & 0x80) { status=b; pos++; if (status<0xF0) lastStatus=status; }
      else { status=lastStatus; }
      var type = status & 0xF0;
      if (type===0x90) {
        var note=u8[pos++], vel=u8[pos++];
        if (vel>0) events.push({ timeSec:(absTick/tpb)*secPerBeat, note:note, vel:vel });
      } else if (type===0x80||type===0xA0||type===0xB0||type===0xE0) { pos+=2; }
        else if (type===0xC0||type===0xD0) { pos+=1; }
        else if (status===0xFF) { pos++; var ml=readVarLen(); pos+=ml; }
        else if (status===0xF0||status===0xF7) { while(pos<trackEnd&&u8[pos]!==0xF7)pos++; pos++; }
        else if (status===0xF2) { pos+=2; }
        else if (status===0xF3) { pos+=1; }
    }
    pos = trackEnd;
  }
  return events;
}

// ── Drums: load ────────────────────────────────────────────────
function loadDrumsSystem() {
  var xhrA = new XMLHttpRequest();
  xhrA.open('GET', DRUMS_BASE + DRUMS_AUDIO_FILE, true);
  xhrA.responseType = 'arraybuffer';
  xhrA.onload = function () {
    drumsAudioRaw = xhrA.response;
    console.log('d93: drums audio fetched');
  };
  xhrA.send();
  var xhrM = new XMLHttpRequest();
  xhrM.open('GET', DRUMS_BASE + DRUMS_MIDI_FILE, true);
  xhrM.responseType = 'arraybuffer';
  xhrM.onload = function () {
    drumsMidiEvents = parseMidiNoteOns(xhrM.response);
    console.log('d93: drums MIDI parsed,', drumsMidiEvents.length, 'note-ons');
  };
  xhrM.send();
}

function scheduleMidiLoop(loopStartTimeSec) {
  if (!drumsStarted) return;
  var now = audioCtx.currentTime;
  drumsMidiEvents.forEach(function (ev, evIdx) {
    var delay = Math.max(0, (loopStartTimeSec + ev.timeSec - now) * 1000);
    var stagger = evIdx * 0.3;
    setTimeout(triggerMeshB, delay + stagger);
    setTimeout(onMJMidiTrigger, delay + stagger);
    setTimeout(sampleHoldReverbSend, delay + stagger);
    setTimeout(function () {
      atmosMidiCount++;
      if (atmosMidiCount % 3 === 0) triggerAtmos();
    }, delay + stagger);
  });
  var msUntilNext = Math.max(0, (loopStartTimeSec + drumsDurationSec - now) * 1000 - 100);
  setTimeout(function () { scheduleMidiLoop(loopStartTimeSec + drumsDurationSec); }, msUntilNext);
}

// ── Drums: start (called from bottom-left mouse zone) ──────────
function startDrumsSystem() {
  if (drumsStarted) return;
  if (!drumsAudioRaw) { console.warn('d93: drums audio not ready'); return; }
  if (!audioCtx) initAudio();
  drumsStarted = true;
  audioCtx.decodeAudioData(drumsAudioRaw, function (buf) {
    drumsAudioBuffer = buf;
    drumsAudioSrc = audioCtx.createBufferSource();
    drumsAudioSrc.buffer = buf;
    drumsAudioSrc.loop = true;
    drumsAnalyser = audioCtx.createAnalyser();
    drumsAnalyser.fftSize = 2048;
    drumsAnalyser.smoothingTimeConstant = 0.0;
    drumsAnalyserData = new Uint8Array(drumsAnalyser.fftSize);
    drumsAudioSrc.connect(drumsAnalyser);
    var drumsGain = audioCtx.createGain();
    drumsGain.gain.value = 0.7;
    drumsAudioSrc.connect(drumsGain);
    drumsGain.connect(audioCtx.destination);
    drumsAudioSrc.start(0);
    drumMouseGain = audioCtx.createGain();
    drumMouseGain.gain.value = 1.0;
    drumsGain.disconnect(audioCtx.destination);
    drumsGain.connect(drumMouseGain);
    if (masterLPF) {
      drumMouseGain.connect(masterLPF);
      console.log('d93: drumsGain → drumMouseGain → masterLPF OK');
    } else {
      console.warn('d93: masterLPF missing, drums connecting direct to destination');
      drumMouseGain.connect(masterVolGain ? masterVolGain : audioCtx.destination);
    }
    setTimeout(function() { drumMouseActive = true; }, 8000);
    if (!arpSource) {
      var xhrArp = new XMLHttpRequest();
      xhrArp.open('GET', 'https://daysof93-cdn.b-cdn.net/Explore3_arp.mp3', true);
      xhrArp.responseType = 'arraybuffer';
      xhrArp.onload = function() {
        audioCtx.decodeAudioData(xhrArp.response, function(buf) {
          var arpGain = audioCtx.createGain();
          arpGain.gain.value = 1.0;
          arpGainNode = arpGain;
          arpSource = audioCtx.createBufferSource();
          arpSource.buffer = buf;
          arpSource.loop = true;
          arpSource.connect(arpGain);
          arpGain.connect(masterLPF);
          arpSource.start(0);
          setTimeout(function() {
            arpGain.gain.setValueAtTime(arpGain.gain.value * 1.778, audioCtx.currentTime);
          }, buf.duration * 1000);
          console.log('d93: arp started');
        }, function(e) { console.warn('d93: arp decode failed', e); });
      };
      xhrArp.onerror = function(e) { console.warn('d93: arp xhr failed', e); };
      xhrArp.send();
    }
    // startXploreVideos(); // TD videos disabled
    scheduleMidiLoop(audioCtx.currentTime);
    console.log('d93: drums started, loop', drumsDurationSec.toFixed(1) + 's');
  });
}

// ── Atmos: trigger one pad sound (fetch-on-demand) ─────────────
function triggerAtmos() {
  if (!atmosStarted || atmosPlaying) return;
  var idx;
  do { idx = Math.floor(Math.random() * ATMOS_COUNT); } while (idx === atmosLastIdx);
  atmosLastIdx = idx;
  var fileNum = idx < 14 ? idx + 1 : idx + 2; // skip futureatmos15.wav (was index 14)
  var url = ATMOS_BASE + 'futureatmos' + fileNum + '.wav';
  atmosPlaying = true;
  fetch(url)
    .then(function (r) { return r.arrayBuffer(); })
    .then(function (ab) { return audioCtx.decodeAudioData(ab); })
    .then(function (buf) {
      var src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(masterVolGain || audioCtx.destination);
      src.onended = function () { atmosPlaying = false; };
      src.start(0);
    })
    .catch(function (e) { atmosPlaying = false; console.warn('d93: atmos fetch failed', e); });
}

// ── Invert burst ───────────────────────────────────────────────
function startInvertBurst() {
  if (invertPhase !== 'off') return;
  var count = 1 + Math.floor(Math.random() * 6);
  var i = 0;
  function nextFlicker() {
    if (i >= count) {
      invertPhase = 'off';
      syncWireColor();
      meshBMats.forEach(function(m) { if (m.color) m.color.set(meshBColor); });
      return;
    }
    invertPhase = 'on';
    i++;
    var duration = 80 + Math.random() * 170; // 80–250ms snappy flash
    setTimeout(function() {
      invertPhase = 'off';
      syncWireColor();
      meshBMats.forEach(function(m) { if (m.color) m.color.set(meshBColor); });
      setTimeout(nextFlicker, 280 + Math.random() * 200); // 280–480ms visible gap
    }, duration);
  }
  nextFlicker();
}

// ── MJ image functions ─────────────────────────────────────────
function startMJSystem() {
  if (mjActive) return;
  mjActive      = true;
  mjImg         = document.getElementById('mj-img');
  mjCurrentIdx  = 2; // start with mj3
  mjImg.src     = MJ_BASE + MJ_FILES[mjCurrentIdx];
  mjImg.style.display = 'block';
  mjBaseOpacity = 0.0;
  mjSpikeLevel  = 0.0;
  mjVelX = (Math.random() - 0.5) * 0.30;
  mjVelY = (Math.random() - 0.5) * 0.30;
}

function onMJMidiTrigger() {
  if (!mjActive) return;
  // Spike-only mode: 5% chance per MIDI note
  if (Math.random() < 0.05) {
    mjSpikeLevel = 1.0;
    // Switch randomly between mj3 (idx 2) and mj5 (idx 4)
    mjCurrentIdx = Math.random() < 0.5 ? 2 : 4;
    mjImg.src = MJ_BASE + MJ_FILES[mjCurrentIdx];
    // New drift direction on image change
    mjVelX = (Math.random() - 0.5) * 0.30;
    mjVelY = (Math.random() - 0.5) * 0.30;
  }
}

function mjSetImage(idx) {
  mjCurrentIdx = ((idx % 6) + 6) % 6;
  if (mjImg) mjImg.src = MJ_BASE + MJ_FILES[mjCurrentIdx];
}

// ── Gravity: collect spawn pool from current mesh vertices ──────
function updateGravSpawnPool() {
  gravSpawnPool = [];
  if (!currentGroup) return;
  currentGroup.traverse(function(child) {
    if (!child.isMesh || child.userData.edgeOverlay || !child.geometry) return;
    var pa = child.geometry.attributes.position;
    if (!pa) return;
    for (var vi = 0; vi < pa.count; vi += 2) {
      gravSpawnPool.push(pa.getX(vi), pa.getY(vi), pa.getZ(vi));
    }
  });
}

function spawnGravParticle(p) {
  var sx, sy, sz;
  if (gravSpawnPool.length >= 3) {
    var si = Math.floor(Math.random() * (gravSpawnPool.length / 3)) * 3;
    sx = gravSpawnPool[si]   * GRAV_SPAWN_SC;
    sy = gravSpawnPool[si+1] * GRAV_SPAWN_SC;
    sz = gravSpawnPool[si+2] * GRAV_SPAWN_SC * 0.6;
  } else {
    var a = Math.random() * Math.PI * 2;
    var r = Math.sqrt(Math.random()) * 1.8;
    sx = Math.cos(a)*r; sy = Math.sin(a)*r; sz = 0;
  }
  p.pos.set(sx, sy, sz);
  var ang = Math.atan2(sy, sx);
  var r3  = Math.max(p.pos.length(), 0.12);
  var cs  = Math.sqrt(GRAV_GM / r3) * (0.75 + Math.random() * 0.5);
  p.vel.set(-Math.sin(ang)*cs, Math.cos(ang)*cs, (Math.random()-0.5)*GRAV_Z_VEL);
  p.age      = 0;
  p.lifespan = 8 + Math.random() * 10;
  p.baseSize = 0.018 + Math.random() * GRAV_SIZE_RANGE;
  p.rot.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
  p.rotVel.set((Math.random()-0.5)*0.04, (Math.random()-0.5)*0.04, (Math.random()-0.5)*0.04);
}

// MIDI fader → gravity params via CustomEvent (CC 0–5, min=0 max=1 on all)
// F1(CC0)=orbital tight  F2(CC1)=Z spread  F3(CC2)=opacity
// F4(CC3)=box size       F5(CC4)=density   F6(CC5)=spawn radius
window.addEventListener('midicc', function(e) {
  var cc = e.detail.cc, v = e.detail.mapped;
  if (cc === 0) GRAV_GM    = 0.00005 + v * 0.00195;
  if (cc === 1) GRAV_Z_VEL = v * 0.025;
  if (cc === 2 && gravMesh) gravMesh.material.opacity = v;
  if (cc === 3) GRAV_SPEED = 0.05 + v * 2.95;  // very slow → fast
  if (cc === 4 && gravMesh) gravMesh.count = Math.max(1, Math.floor(GRAV_COUNT * v));
  // F6 BG colour, F7 mesh engine 1 colour, F8 particle colour
  if (cc === 5) { if (!_midiBgColor) _midiBgColor = new THREE.Color(); _midiBgColor.set(_ralPick(v)); }
  if (cc === 6) { if (!_midiWireColor) _midiWireColor = new THREE.Color(); _midiWireColor.set(_ralPick(v)); }
  if (cc === 7 && gravMesh) { gravMesh.material.color.set(_ralPick(v)); }
});

function initGreenCubes() {
  var mat = new THREE.MeshPhongMaterial({ color: 0x4D6B39, transparent: true, opacity: 0.85 });
  var geo = new THREE.BoxGeometry(1, 1, 1);

    greenCubeOffsets.push(new THREE.Vector3(
      (Math.random() - 0.5) * 2.0,
      (Math.random() - 0.5) * 2.0,
      (Math.random() - 0.5) * 2.0
    ));
  }
}

function updateGreenCubes() {
  if (!greenCubeMesh || gravSpawnPool.length < 1) return;
  var count = 3 + Math.floor(Math.random() * 5);
  greenCubeMesh.count = count;
  greenCubeStates = [];
  for (var i = 0; i < count; i++) {
    var si = Math.floor(Math.random() * (gravSpawnPool.length / 3)) * 3;
    var scale = 1.4 + Math.random() * 0.8;
    var size = (0.06 + Math.random() * 0.10);
    greenCubeStates.push({
      pos: new THREE.Vector3(
        gravSpawnPool[si]   * scale + greenCubeOffsets[i].x,
        gravSpawnPool[si+1] * scale + greenCubeOffsets[i].y,
        gravSpawnPool[si+2] * scale + greenCubeOffsets[i].z
      ),
      rot: new THREE.Vector3(
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2,
        Math.random() * Math.PI * 2
      ),
      rotSpeed: new THREE.Vector3(
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.02,
        (Math.random() - 0.5) * 0.02
      ),
      size: size
    });
  }
}

function tickGreenCubes() {
  if (!greenCubeMesh || greenCubeStates.length === 0) return;
  for (var i = 0; i < greenCubeStates.length; i++) {
    var s = greenCubeStates[i];
    s.rot.x += s.rotSpeed.x;
    s.rot.y += s.rotSpeed.y;
    s.rot.z += s.rotSpeed.z;
    greenCubeDummy.position.copy(s.pos);
    greenCubeDummy.rotation.set(s.rot.x, s.rot.y, s.rot.z);
    greenCubeDummy.scale.set(s.size, s.size, s.size);
    greenCubeDummy.updateMatrix();
    greenCubeMesh.setMatrixAt(i, greenCubeDummy.matrix);
  }
  greenCubeMesh.instanceMatrix.needsUpdate = true;
}

function initGravParticles() {
  sceneB.add(gravGroup);
  var geo = new THREE.BoxGeometry(1, 1, 1);
  var mat = new THREE.MeshPhongMaterial({
    color: 0x9ba8b8, shininess: 55, specular: 0x334455,
    transparent: true, opacity: 0.65
  });
  gravMesh = new THREE.InstancedMesh(geo, mat, GRAV_COUNT);
  gravMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  gravGroup.add(gravMesh);
  for (var i = 0; i < GRAV_COUNT; i++) {
    var p = { pos: new THREE.Vector3(), vel: new THREE.Vector3(),
              rot: new THREE.Euler(), rotVel: new THREE.Vector3(),
              age: 0, lifespan: 12, baseSize: 0.04 };
    spawnGravParticle(p);
    p.age = Math.random() * p.lifespan;
    gravParticles.push(p);
  }
}

function updateGravParticles() {
  // Read MIDI CSS vars

  for (var i = 0; i < GRAV_COUNT; i++) {
    var p = gravParticles[i];
    p.age += 0.01667;
    if (p.age >= p.lifespan) { spawnGravParticle(p); }
    _gravDir.set(-p.pos.x, -p.pos.y, -p.pos.z);
    var r = _gravDir.length(); if (r < 0.06) r = 0.06;
    _gravDir.normalize().multiplyScalar(GRAV_GM / (r*r));
    p.vel.add(_gravDir);
    p.pos.addScaledVector(p.vel, GRAV_SPEED);
    p.rot.x += p.rotVel.x * GRAV_SPEED;
    p.rot.y += p.rotVel.y * GRAV_SPEED;
    p.rot.z += p.rotVel.z * GRAV_SPEED;
    var na = p.age / p.lifespan;
    var sf = na < 0.08 ? na/0.08 : na > 0.85 ? (1-na)/0.15 : 1.0;
    gravDummy.position.copy(p.pos);
    gravDummy.rotation.copy(p.rot);
    gravDummy.scale.setScalar(p.baseSize * sf);
    gravDummy.updateMatrix();
    gravMesh.setMatrixAt(i, gravDummy.matrix);
  }
  gravMesh.instanceMatrix.needsUpdate = true;
}

function buildGrid() {
  var svg = document.getElementById('d93-grid');
  var w = window.innerWidth, h = window.innerHeight;
  svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  var vpX = w * 0.5 + gridSkewX, vpY = h * 0.60 + gridSkewY;
  var lines = '';
  var bands = 18;
  for (var i = 0; i <= bands; i++) {
    var t = i / bands;
    var y = vpY + Math.pow(t, 1.8) * (h - vpY);
    var op = (0.32 * (1 - t * 0.5)).toFixed(3);
    lines += '<line x1="0" y1="' + y.toFixed(1) + '" x2="' + w +
             '" y2="' + y.toFixed(1) + '" stroke="rgba(0,0,0,0.08)" stroke-width="0.75" opacity="' + op + '"/>';
  }
  var cols = 16;
  for (var i = 0; i <= cols; i++) {
    var x = (i / cols) * w;
    var x2 = vpX + (x - vpX) * 0.12;
    lines += '<line x1="' + x.toFixed(1) + '" y1="' + h + '" x2="' +
             x2.toFixed(1) + '" y2="' + vpY.toFixed(1) +
             '" stroke="rgba(0,0,0,0.08)" stroke-width="0.75" opacity="0.26"/>';
  }
  lines += '<line x1="0" y1="' + vpY.toFixed(1) + '" x2="' + w +
           '" y2="' + vpY.toFixed(1) + '" stroke="rgba(0,0,0,0.08)" stroke-width="0.75" opacity="0.32"/>';
  lines += '<line x1="' + vpX.toFixed(1) + '" y1="0" x2="' + vpX.toFixed(1) +
           '" y2="' + h + '" stroke="rgba(0,0,0,0.08)" stroke-width="0.75" opacity="0.28"/>';
  svg.innerHTML = lines;
}

function stopAll(){
  if(recState==='recording'&&selP!==null&&recEvts.length){
    presets[selP].rec={dur:Date.now()-recStart,evts:[...recEvts]};svP();updPresets();
  }
  playTmrs.forEach(clearTimeout);playTmrs=[];
  recState='idle';updHeader();updTransport();
}
function startPlay(){
  if(selP===null||!presets[selP].rec)return;
  stopAll();
  const{dur,evts}=presets[selP].rec;
  recState='playing';
  // Reset frame: fire known-good values at t=0 before recording events
  onFV(5,86);  // CC5 BG colour → yellow (mapped 0.677)
  playTmrs=evts.map(e=>setTimeout(()=>onFV(e.cc,e.v),e.t));
  playTmrs.push(setTimeout(()=>{if(recState==='playing'){startPlay();}else{recState='idle';updHeader();updTransport();}},dur+50));
  updHeader();updTransport();
}
// Auto-start P1 loop on page load
setTimeout(function(){
  if(presets[0]&&presets[0].rec){selP=0;startPlay();}
},3000);
function saveToPreset(){
  if(selP===null)return;
  presets[selP].faders=F.map(f=>({...f}));svP();updPresets();
}
function recallPreset(i){
  stopAll();selP=i;
  if(presets[i].faders)presets[i].faders.forEach((pf,j)=>Object.assign(F[j],pf));
  F.forEach(applyF);F.forEach((_,j)=>updViz(j));updPresets();
}
function updViz(i){
  const f=F[i],p=(f.value/127)*100,act=!!f.target;
  const fill=box.querySelector('[data-fill="'+i+'"]');
  const hdl=box.querySelector('[data-hdl="'+i+'"]');
  const val=box.querySelector('[data-fval="'+i+'"]');
  if(fill){fill.style.height=p+'%';fill.style.background=act?'#ffad00':'rgba(255,255,255,.2)';}
  if(hdl)hdl.style.bottom='calc('+p+'% - 3px)';
  if(val)val.textContent=fmt(f);
}
function updPresets(){
  box.querySelectorAll('[data-ps]').forEach(el=>{
    const i=+el.dataset.ps,p=presets[i],sel=selP===i;
    el.style.borderColor=sel?'#ffad00':'rgba(255,255,255,.12)';
    el.style.color=sel?'#ffad00':p.faders?'rgba(255,255,255,.65)':'rgba(255,255,255,.2)';
    el.innerHTML='<span>'+p.name+'</span>'+(p.rec?'<span style="color:#ff6060;font-size:9px;margin-left:3px">●</span>':'');
  });
}
function updHeader(){
  const h=box.querySelector('#mc-hdr');if(!h)return;
  h.style.color=recState==='recording'?'#ff4444':recState==='playing'?'rgba(0,200,100,.8)':'rgba(255,173,0,.5)';
  h.textContent=recState==='recording'?'● RECORDING':recState==='playing'?'▶ PLAYING':midi?'CONNECTED':'NO DEVICE';
}
function updTransport(){
  const r=box.querySelector('#mc-rec');const pl=box.querySelector('#mc-play');const st=box.querySelector('#mc-stop');
  if(r){r.style.background=recState==='recording'?'rgba(255,60,60,.25)':'rgba(255,255,255,.04)';r.style.color=recState==='recording'?'#ff4444':'rgba(255,80,80,.8)';}
  if(pl){pl.style.background=recState==='playing'?'rgba(0,200,100,.2)':'rgba(255,255,255,.04)';pl.style.color=recState==='playing'?'rgba(0,200,100,.9)':'rgba(255,255,255,.6)';}
  if(st)st.style.opacity=recState!=='idle'?'1':'0.35';
}
document.addEventListener('mousemove',e=>{
  if(!drag)return;
  const trk=box.querySelector('[data-trk="'+drag.idx+'"]');if(!trk)return;
  const r=trk.getBoundingClientRect();if(!r.height)return;
  onFV(drag.idx,Math.max(0,Math.min(127,Math.round(drag.sv+(drag.sy-e.clientY)/r.height*127))));
});
document.addEventListener('mouseup',()=>{drag=null;});
function buildPresets(){
  return'<div style="display:flex;gap:5px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid rgba(255,255,255,.06)">'+
  presets.map((p,i)=>'<div data-ps="'+i+'" style="flex:1;display:flex;align-items:center;justify-content:center;gap:2px;font-size:8px;letter-spacing:.08em;padding:5px 3px;border:1px solid '+(selP===i?'#ffad00':'rgba(255,255,255,.12)')+';color:'+(selP===i?'#ffad00':p.faders?'rgba(255,255,255,.65)':'rgba(255,255,255,.2)')+';cursor:pointer;user-select:none"><span>'+p.name+'</span>'+(p.rec?'<span style="color:#ff6060;font-size:9px">●</span>':'')+'</div>').join('')+'</div>';
}
function buildFaders(){
  return F.map((f,i)=>{const p=(f.value/127)*100,act=!!f.target;
    return'<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0"><div data-trk="'+i+'" style="position:relative;height:96px;width:16px;background:rgba(255,255,255,.06);border-radius:2px;cursor:ns-resize;user-select:none"><div data-fill="'+i+'" style="position:absolute;bottom:0;left:0;right:0;height:'+p+'%;background:'+(act?'#ffad00':'rgba(255,255,255,.2)')+';border-radius:2px;pointer-events:none"></div><div data-hdl="'+i+'" style="position:absolute;bottom:calc('+p+'% - 3px);left:-3px;right:-3px;height:6px;background:'+(act?'#ffad00':'#aaa')+';border-radius:1px;pointer-events:none"></div></div><div data-fval="'+i+'" style="font-size:9px;color:rgba(255,255,255,.45)">'+fmt(f)+'</div><div data-lbl="'+i+'" style="font-size:8px;color:'+(act?'#ffad00':'rgba(255,255,255,.3)')+';cursor:pointer;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;padding:1px 2px;border-bottom:'+(eIdx===i?'1px solid #ffad00':'1px solid transparent')+'">'+( f.label||'F'+(i+1))+'</div><div style="font-size:7px;color:rgba(255,255,255,.18)">CC'+f.cc+'</div></div>';
  }).join('');
}
function buildTransport(){
  return'<div style="display:flex;gap:5px;margin-top:8px"><button id="mc-save-p" style="flex:2;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.13);color:#fff;font-family:monospace;font-size:8px;letter-spacing:.12em;padding:5px 0;cursor:pointer">SAVE</button><button id="mc-rec" style="flex:1;background:'+(recState==='recording'?'rgba(255,60,60,.25)':'rgba(255,255,255,.04)')+';border:1px solid rgba(255,80,80,.4);color:'+(recState==='recording'?'#ff4444':'rgba(255,80,80,.8)')+';font-family:monospace;font-size:11px;padding:5px 0;cursor:pointer" title="Record (CC45)">●</button><button id="mc-play" style="flex:1;background:'+(recState==='playing'?'rgba(0,200,100,.2)':'rgba(255,255,255,.04)')+';border:1px solid rgba(255,255,255,.13);color:'+(recState==='playing'?'rgba(0,200,100,.9)':'rgba(255,255,255,.6)')+';font-family:monospace;font-size:11px;padding:5px 0;cursor:pointer" title="Play (CC41)">▶</button><button id="mc-stop" style="flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.13);color:rgba(255,255,255,.6);font-family:monospace;font-size:11px;padding:5px 0;cursor:pointer;opacity:'+(recState!=='idle'?1:.35)+'" title="Stop (CC42)">■</button><button id="mc-savej" style="flex:2;background:rgba(255,173,0,.1);border:1px solid rgba(255,173,0,.3);color:#ffad00;font-family:monospace;font-size:8px;letter-spacing:.1em;padding:5px 0;cursor:pointer">JSON</button></div>';
}
function rEdit(){
  const ec=box.querySelector('#mc-edit');if(!ec)return;
  const ef=eIdx!==null?F[eIdx]:null;
  ec.innerHTML=ef?'<div style="background:rgba(255,173,0,.05);border:1px solid rgba(255,173,0,.15);padding:8px;margin-bottom:8px"><div style="font-size:7px;color:rgba(255,173,0,.45);letter-spacing:.22em;margin-bottom:6px">FADER '+(eIdx+1)+' — ASSIGN</div><div style="display:flex;flex-direction:column;gap:5px"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:8px;color:rgba(255,255,255,.25);width:40px">LABEL</span><input id="mc-el" value="'+ef.label+'" style="flex:1;background:transparent;border:1px solid rgba(255,255,255,.13);color:#fff;font-family:monospace;font-size:9px;padding:2px 5px;outline:none"></div><div style="display:flex;gap:8px;align-items:center"><span style="font-size:8px;color:rgba(255,255,255,.25);width:40px">TARGET</span><input id="mc-et" value="'+ef.target+'" placeholder="--css-variable" style="flex:1;background:transparent;border:1px solid rgba(255,173,0,.3);color:#ffad00;font-family:monospace;font-size:9px;padding:2px 5px;outline:none"></div><div style="display:flex;gap:10px"><div style="display:flex;gap:6px;align-items:center"><span style="font-size:8px;color:rgba(255,255,255,.25);width:28px">MIN</span><input id="mc-emn" type="number" step="0.01" value="'+ef.min+'" style="width:52px;background:transparent;border:1px solid rgba(255,255,255,.13);color:#fff;font-family:monospace;font-size:9px;padding:2px 5px;outline:none"></div><div style="display:flex;gap:6px;align-items:center"><span style="font-size:8px;color:rgba(255,255,255,.25);width:28px">MAX</span><input id="mc-emx" type="number" step="0.01" value="'+ef.max+'" style="width:52px;background:transparent;border:1px solid rgba(255,255,255,.13);color:#fff;font-family:monospace;font-size:9px;padding:2px 5px;outline:none"></div></div></div></div>':'';
  if(ef){
    box.querySelector('#mc-el')?.addEventListener('input',e=>{F[eIdx].label=e.target.value;svF();updViz(eIdx);});
    box.querySelector('#mc-et')?.addEventListener('input',e=>{F[eIdx].target=e.target.value;applyF(F[eIdx]);svF();updViz(eIdx);});
    box.querySelector('#mc-emn')?.addEventListener('input',e=>{F[eIdx].min=+e.target.value||0;applyF(F[eIdx]);svF();});
    box.querySelector('#mc-emx')?.addEventListener('input',e=>{F[eIdx].max=+e.target.value||1;applyF(F[eIdx]);svF();});
  }
}
function bindAll(){
  box.querySelectorAll('[data-ps]').forEach(el=>el.addEventListener('click',()=>recallPreset(+el.dataset.ps)));
  box.querySelectorAll('[data-trk]').forEach(el=>el.addEventListener('mousedown',e=>{drag={idx:+el.dataset.trk,sy:e.clientY,sv:F[+el.dataset.trk].value};e.preventDefault();}));
  box.querySelectorAll('[data-lbl]').forEach(el=>el.addEventListener('click',()=>{eIdx=eIdx===+el.dataset.lbl?null:+el.dataset.lbl;rEdit();F.forEach((_,j)=>{const l=box.querySelector('[data-lbl="'+j+'"]');if(l)l.style.borderBottom=eIdx===j?'1px solid #ffad00':'1px solid transparent';});}));
  box.querySelector('#mc-save-p')?.addEventListener('click',saveToPreset);
  box.querySelector('#mc-rec')?.addEventListener('click',()=>{recState==='idle'?startRec():stopAll();});
  box.querySelector('#mc-play')?.addEventListener('click',startPlay);
  box.querySelector('#mc-stop')?.addEventListener('click',stopAll);
  box.querySelector('#mc-savej')?.addEventListener('click',async()=>{
    const snap={timestamp:new Date().toISOString(),controller:'nanoKONTROL2',faders:F.map(f=>({...f,mappedValue:+fmt(f)})),presets};
    const blob=new Blob([JSON.stringify(snap,null,2)],{type:'application/json'});
    if('showSaveFilePicker'in window){try{const h=await window.showSaveFilePicker({suggestedName:'midi-snapshot-'+Date.now()+'.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(blob);await w.close();return;}catch{}}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='midi-snapshot-'+Date.now()+'.json';a.click();
  });
}
function rPanel(){
  box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.06)"><span style="font-size:8px;color:rgba(255,255,255,.3);letter-spacing:.2em">NANOKONTROL2 · CH 1</span><span id="mc-hdr" style="font-size:8px;letter-spacing:.15em"></span></div>'+buildPresets()+'<div id="mc-faders" style="display:flex;gap:7px;margin-bottom:10px">'+buildFaders()+'</div><div id="mc-edit"></div>'+buildTransport();
  updHeader();bindAll();rEdit();
}
function updBtn(){btn.style.background=open?'rgba(255,173,0,.9)':'rgba(20,20,20,.9)';btn.style.color=open?'#000':'#555';btn.textContent=midi?'◆ MIDI':'◇ MIDI';}
btn.onclick=()=>{open=!open;box.style.display=open?'block':'none';updBtn();if(open)rPanel();};
document.addEventListener('keydown',e=>{if(e.altKey&&e.key.toLowerCase()==='m')btn.click();});
updBtn();
if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess().then(acc=>{
    const h=msg=>{
      const[s,cc,val]=msg.data;
      if((s&0xF0)!==0xB0)return;
      if(cc<N){onFV(cc,val);if(!midi){midi=true;updBtn();if(open)updHeader();}}
      // nanoKONTROL2 transport (value 127 = press)
      if(val===127){
        if(cc===45)recState==='idle'?startRec():stopAll(); // ●
        if(cc===41)startPlay();                            // ▶
        if(cc===42)stopAll();                              // ■
      }
    };
    for(const inp of acc.inputs.values())inp.onmidimessage=h;
    acc.onstatechange=e=>{if(e.port.type==='input')e.port.onmidimessage=h;};
    midi=[...acc.inputs.values()].length>0;updBtn();
  }).catch(()=>{});
}
})();
</script>
