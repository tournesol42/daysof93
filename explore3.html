<!-- build: explore3-v02-dynamic-grid -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore 3 — Days of 93</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --field: #ffffff;
  --ink: #000000;
  --line: #000000;
  --axis-x: #000000;
  --axis-y: #000000;
  --hair: 0.75px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; cursor: none; }

#field {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}

#td-video {
  position: fixed; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 10; pointer-events: none;
}

#ch {
  position: fixed; inset: 0; pointer-events: none;
  z-index: 999; opacity: 0; transition: opacity 0.3s;
}
#ch-v {
  position: absolute; top: 0; bottom: 0; left: 50%;
  width: 0.75px; background: rgba(0,0,0,0.30);
}
#ch-h {
  position: absolute; left: 0; right: 0; top: 50%;
  height: 0.75px; background: rgba(0,0,0,0.30);
}
#ch-sq {
  position: absolute; width: 7px; height: 7px;
  border: 0.75px solid rgba(0,0,0,0.45);
  transform: translate(-50%, -50%); top: 50%; left: 50%;
}

#dev-ui {
  display: flex;
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: rgba(0,0,0,0.80);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 12px 18px;
  border-radius: 4px;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

#dev-ui label { opacity: 0.55; }
#dev-ui select {
  background: #222; color: #fff;
  border: 1px solid #555;
  font-family: 'Space Mono', monospace;
  font-size: 11px; padding: 4px 6px; border-radius: 2px;
}
#dev-ui button {
  background: #222; color: #fff;
  border: 1px solid #555;
  font-family: 'Space Mono', monospace;
  font-size: 11px; padding: 4px 10px;
  border-radius: 2px; cursor: pointer;
}
#dev-ui button:hover { background: #444; }
#btn-rec { border-color: #ff4444; }
#btn-rec.active { background: #ff4444; border-color: #ff4444; }
#rec-status { color: #ff4444; min-width: 80px; }
</style>
</head>
<body>

<svg id="field" xmlns="http://www.w3.org/2000/svg"></svg>

<video id="td-video" playsinline muted loop style="will-change:transform;transform:translateZ(0);backface-visibility:hidden;"></video>

<div id="ch">
  <div id="ch-v"></div>
  <div id="ch-h"></div>
  <div id="ch-sq"></div>
</div>

<div id="dev-ui">
  <label>MIDI</label>
  <select id="midi-port-sel"><option value="">— no port —</option></select>
  <button id="btn-rec">● REC</button>
  <button id="btn-stop">■ STOP</button>
  <button id="btn-play">▶ PLAY</button>
  <button id="btn-save">↓ SAVE</button>
  <span id="rec-status"></span>
</div>

<script>
// ── build: explore3-v02-dynamic-grid ─────────────────────────────────

// ── Grid ─────────────────────────────────────────────────────────────
function dayOfYear(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function daySeed(){ const d=new Date(); return d.getFullYear()*1000+dayOfYear(d); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
const SEED = daySeed();

let mouseVpX = window.innerWidth * 0.5;
let mouseVpY = window.innerHeight * 0.55;
let rafGrid = null;

function drawField(){
  const svg=document.getElementById('field');
  const w=window.innerWidth, h=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const vpX = mouseVpX;
  const vpY = mouseVpY;
  let L='';
  const bands=18;
  for(let i=0;i<=bands;i++){
    const t=i/bands,y=vpY+Math.pow(t,1.8)*(h-vpY),op=0.34*(1-t*0.65);
    L+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+op.toFixed(3)+'"/>';
  }
  const cols=16;
  for(let i=0;i<=cols;i++){
    const x=(i/cols)*w;
    L+='<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="0.18"/>';
  }
  L+='<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+vpY+'" stroke="var(--axis-x)" stroke-width="var(--hair)" opacity="0.48"/>';
  L+='<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="var(--axis-y)" stroke-width="var(--hair)" opacity="0.42"/>';
  if(w>=720){
    const upperBand=vpY*0.72, strays=4;
    for(let i=0;i<strays;i++){
      const s1=seededRand(SEED+100+i*3.1),s2=seededRand(SEED+200+i*5.7);
      const s3=seededRand(SEED+300+i*2.3),s4=seededRand(SEED+350+i*4.9);
      const x1=s1*w,y1=s2*upperBand,x2=s3*w,y2=s4*upperBand;
      if(s2>0.5){
        const mx=(x1+x2)/2+(s3-0.5)*140,my=(y1+y2)/2+(s1-0.5)*70;
        L+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' Q'+mx.toFixed(1)+' '+my.toFixed(1)+' '+x2.toFixed(1)+' '+y2.toFixed(1)+'" fill="none" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s4*0.12).toFixed(3)+'"/>';
      } else {
        L+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+(0.17+s1*0.12).toFixed(3)+'"/>';
      }
    }
    const s1=seededRand(SEED+600),s2=seededRand(SEED+700);
    L+='<line x1="'+(s1*w*0.4).toFixed(1)+'" y1="'+(s2*upperBand*0.5).toFixed(1)+'" x2="'+((0.5+s2*0.5)*w).toFixed(1)+'" y2="'+((0.4+s1*0.6)*upperBand).toFixed(1)+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="0.14"/>';
  }
  svg.innerHTML=L;
}
drawField();
window.addEventListener('resize', ()=>{ mouseVpX=window.innerWidth*0.5; mouseVpY=window.innerHeight*0.55; drawField(); });

// ── Videos ───────────────────────────────────────────────────────────
const CDN = 'https://daysof93-cdn.b-cdn.net/Explore_3_TDFILES/';
const VIDEOS = Array.from({length:14}, (_,i) => 'td'+String(i+1).padStart(2,'0'));
let lastVideo = null;
let pool = [];

function pickVideo(){
  if(!pool.length) pool = VIDEOS.filter(v=>v!==lastVideo).sort(()=>Math.random()-0.5);
  return pool.shift();
}

function playVideo(name){
  const vid = document.getElementById('td-video');
  lastVideo = name;
  vid.innerHTML =
    '<source src="'+CDN+name+'.mov" type=\'video/mp4; codecs="hvc1"\'>' +
    '<source src="'+CDN+name+'.webm" type="video/webm">';
  vid.load();
  vid.play().catch(e=>console.log('d93: video play err',e));
  console.log('d93: playing', name);
}

playVideo(pickVideo());

// ── Crosshair ─────────────────────────────────────────────────────────
const ch=document.getElementById('ch');
const chV=document.getElementById('ch-v');
const chH=document.getElementById('ch-h');
const chSq=document.getElementById('ch-sq');
let chTimer=null;

function moveCrosshair(x,y){
  chV.style.left=x+'px';
  chH.style.top=y+'px';
  chSq.style.left=x+'px';
  chSq.style.top=y+'px';
  ch.style.opacity='1';
  clearTimeout(chTimer);
  chTimer=setTimeout(()=>{ ch.style.opacity='0'; },2000);
}
document.addEventListener('mousemove', e=>{
  moveCrosshair(e.clientX, e.clientY);
  mouseVpX = e.clientX;
  mouseVpY = e.clientY;
  if(!rafGrid){ rafGrid = requestAnimationFrame(()=>{ drawField(); rafGrid=null; }); }
});

// ── MIDI ─────────────────────────────────────────────────────────────
let midiAccess=null, activeInput=null;
let isRecording=false, recStart=0, recEvents=[];
let playbackTimers=[];

function onMidiMessage(e){
  const [status,note,velocity]=e.data;
  if((status&0xf0)===0x90 && velocity>0){
    const name=pickVideo();
    playVideo(name);
    if(isRecording){
      recEvents.push({t:Math.round(performance.now()-recStart),note,velocity,video:name});
      updateRecStatus();
    }
  }
}

function connectPort(id){
  if(activeInput) activeInput.onmidimessage=null;
  if(!id||!midiAccess) return;
  activeInput=midiAccess.inputs.get(id);
  if(activeInput){ activeInput.onmidimessage=onMidiMessage; console.log('d93: MIDI port',activeInput.name); }
}

function populatePorts(){
  const sel=document.getElementById('midi-port-sel');
  const prev=sel.value;
  sel.innerHTML='<option value="">— no port —</option>';
  if(!midiAccess) return;
  midiAccess.inputs.forEach((inp,id)=>{
    const o=document.createElement('option');
    o.value=id; o.textContent=inp.name;
    if(id===prev) o.selected=true;
    sel.appendChild(o);
  });
}

if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess().then(a=>{
    midiAccess=a;
    populatePorts();
    a.onstatechange=populatePorts;
    console.log('d93: MIDI ready');
  }).catch(e=>console.log('d93: MIDI denied',e));
}

document.getElementById('midi-port-sel').addEventListener('change',e=>connectPort(e.target.value));

// ── Recorder ─────────────────────────────────────────────────────────
function updateRecStatus(){
  document.getElementById('rec-status').textContent=
    isRecording?'● '+recEvents.length+' events':'';
}

document.getElementById('btn-rec').addEventListener('click',()=>{
  recEvents=[]; recStart=performance.now(); isRecording=true;
  document.getElementById('btn-rec').classList.add('active');
  updateRecStatus();
  console.log('d93: REC start');
});

document.getElementById('btn-stop').addEventListener('click',()=>{
  isRecording=false;
  document.getElementById('btn-rec').classList.remove('active');
  updateRecStatus();
  console.log('d93: REC stop,',recEvents.length,'events');
});

document.getElementById('btn-play').addEventListener('click',()=>{
  if(!recEvents.length) return;
  playbackTimers.forEach(clearTimeout); playbackTimers=[];
  recEvents.forEach(ev=>{
    playbackTimers.push(setTimeout(()=>playVideo(ev.video), ev.t));
  });
  console.log('d93: playback');
});

document.getElementById('btn-save').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({version:1,created:new Date().toISOString(),events:recEvents},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='explore3-'+Date.now()+'.json';
  a.click();
  console.log('d93: JSON saved');
});

</script>
</body>
</html>
