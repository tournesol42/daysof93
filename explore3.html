<script>
(function () {

// ── Bunny CDN config ───────────────────────────────────────────
var BUNNY_CDN_BASE = 'https://daysof93-cdn.b-cdn.net/meshes/';

// ── Angle helpers ──────────────────────────────────────────────
function normalizeAngle(a) {
  while (a >  Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function lerpAngle(a, b, t) {
  var diff = b - a;
  while (diff >  Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  return a + diff * t;
}

// ── State ──────────────────────────────────────────────────────
var S = {
  trailOn:      false,
  trailType:    'fade',
  echoInterval: 8,
  autoRot:      true,
  rotAxis:      'y',
  rotSpeed:     0.007,
  meshMode:     'wire',
  blendMode:    0,
  decay:        0.92,
  opacity:      1.0,
  wireColor:    new THREE.Color(0xffffff),
  bgColor:      new THREE.Color(0x000000),
  tintColor:    new THREE.Color(0xffffff),
  hue:          0,
  brightness:   0,
  contrast:     1,
  saturation:   1,
  hueMod:       false,
  hueModRate:   1.0,
  hueModDepth:  60,
  hueModWave:   'sine',
  // MIDI channel enables
  midiScaleOn:  false,
  midiRotOn:    false,
  midiDeformOn: false,
  midiBriOn:    false,
  midiHueOn:    false,
  midiDecayOn:  false,
  // MIDI ranges (velocity 0-127 maps min→max)
  midiScaleMin:  0.25, midiScaleMax:  2.0,
  midiRotMin:    0.0,  midiRotMax:    0.07,
  midiDeformMin: 0.0,  midiDeformMax: 2.0,
  midiBriMin:   -1.0,  midiBriMax:    1.0,
  midiHueMin:    0.0,  midiHueMax:    360.0,
  midiDecayMin:  0.5,  midiDecayMax:  0.999,
  // Deform
  deformMode:   0,
  deformAmt:    0.0,
  deformSpeed:  1.0,
  lineThickness: 1,
  // Preset gate
  midiTriggerPreset: false,
  presetDir: 'next',
  // Scale / rotation extras
  manualScale: 1.0,
  rotLag:      0.0,
  // Preset interpolation
  interpOn:    false,
  interpDur:   1.0,
};

var echoFrame      = 0;
var huePhase       = 0;
var currentScale   = 1.0;
var smoothRotSpeed = 0.007;

var interpActive = false;
var interpFrom   = null;
var interpTo     = null;
var interpT0     = 0;

// MIDI — per-channel values and active flags (note-hold model)
var midiVals = {
  scale: 1.0, rot: 0.0, deform: 0.0,
  bri: 0.0,   hue: 0.0, decay: 0.92,
};
var midiActive = {
  scale: false, rot: false, deform: false,
  bri: false,   hue: false, decay: false,
};

var midiAccess       = null;
var midiPort         = null;
var midiConnected    = false;
var deformShaderRefs = [];
var startTime        = performance.now();
var meshBank         = [];
var currentMeshIndex = -1;
var presets       = Array.from({length: 100}, function () { return null; });
var activeSlot    = 0;
var presetSeqMode = 'SEQ';

var SESSION_KEYS = new Set([
  'midiScaleOn',  'midiScaleMin',  'midiScaleMax',
  'midiBriOn',    'midiBriMin',    'midiBriMax',
  'midiRotOn',    'midiRotMin',    'midiRotMax',
  'midiHueOn',    'midiHueMin',    'midiHueMax',
  'midiDecayOn',  'midiDecayMin',  'midiDecayMax',
  'midiDeformOn', 'midiDeformMin', 'midiDeformMax',
  'midiTriggerPreset',
  'presetDir',
  'interpOn',
  'interpDur',
]);

// ── Renderer ───────────────────────────────────────────────────
var canvas  = document.getElementById('c');
var cw = function () { return window.innerWidth; };
var ch = function () { return window.innerHeight; };

var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(cw(), ch());

// ── Scene ──────────────────────────────────────────────────────
var scene  = new THREE.Scene();
var camera = new THREE.PerspectiveCamera(50, cw() / ch(), 0.001, 1000);
camera.position.set(0, 0, 3.5);

var controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping  = true;
controls.dampingFactor  = 0.06;

// ── Mesh state ─────────────────────────────────────────────────
var currentGroup = null;
var wireMats     = [];
var lineMats     = [];
var edgeLines    = [];

// ── Render targets ─────────────────────────────────────────────
var rtOpts = {
  minFilter: THREE.LinearFilter,
  magFilter: THREE.LinearFilter,
  format:    THREE.RGBAFormat,
  type:      THREE.UnsignedByteType,
};
var rtScene = new THREE.WebGLRenderTarget(cw(), ch(), rtOpts);
var rtA     = new THREE.WebGLRenderTarget(cw(), ch(), rtOpts);
var rtB     = new THREE.WebGLRenderTarget(cw(), ch(), rtOpts);

// ── Post quads ─────────────────────────────────────────────────
var postScene  = new THREE.Scene();
var postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
var postGeo    = new THREE.PlaneGeometry(2, 2);

var feedbackMat = new THREE.ShaderMaterial({
  uniforms: {
    tCur:   { value: null },
    tPrev:  { value: null },
    uDecay: { value: 0.92 },
    uBlend: { value: 0 },
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D tCur, tPrev;',
    'uniform float uDecay; uniform int uBlend;',
    'varying vec2 vUv;',
    'void main() {',
    '  vec4 cur = texture2D(tCur,  vUv);',
    '  vec4 prv = texture2D(tPrev, vUv) * uDecay;',
    '  vec4 res;',
    '  if (uBlend == 0)      res = vec4(clamp(prv.rgb + cur.rgb, 0.0, 1.0), 1.0);',
    '  else if (uBlend == 1) res = vec4(1.0 - (1.0-prv.rgb)*(1.0-cur.rgb), 1.0);',
    '  else                  res = vec4(mix(prv.rgb, cur.rgb, cur.a), 1.0);',
    '  gl_FragColor = res;',
    '}',
  ].join('\n'),
});

var displayMat = new THREE.ShaderMaterial({
  uniforms: {
    tIn:        { value: null },
    uHue:       { value: 0.0 },
    uBri:       { value: 0.0 },
    uCon:       { value: 1.0 },
    uSat:       { value: 1.0 },
    uTnt:       { value: new THREE.Color(1, 1, 1) },
    uBgColor:   { value: new THREE.Color(0, 0, 0) },
    uTrailMode: { value: false },
  },
  vertexShader: [
    'varying vec2 vUv;',
    'void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  ].join('\n'),
  fragmentShader: [
    'uniform sampler2D tIn;',
    'uniform float uHue, uBri, uCon, uSat;',
    'uniform vec3 uTnt, uBgColor;',
    'uniform bool uTrailMode;',
    'varying vec2 vUv;',
    'vec3 hueRot(vec3 c, float angle) {',
    '  float a = angle * 6.28318;',
    '  float s = sin(a), cs = cos(a);',
    '  vec3 k = vec3(0.57735026918);',
    '  return c * cs + cross(k, c) * s + k * dot(k, c) * (1.0 - cs);',
    '}',
    'void main() {',
    '  vec4 px  = texture2D(tIn, vUv);',
    '  vec3 rgb = px.rgb;',
    '  float lum = dot(rgb, vec3(0.299, 0.587, 0.114));',
    '  rgb = mix(vec3(lum), rgb, uSat);',
    '  rgb = (rgb - 0.5) * uCon + 0.5 + uBri;',
    '  rgb = hueRot(rgb, uHue / 360.0);',
    '  rgb *= uTnt;',
    '  if (uTrailMode) { rgb = 1.0 - (1.0 - rgb) * (1.0 - uBgColor); }',
    '  gl_FragColor = vec4(clamp(rgb, 0.0, 1.0), 1.0);',
    '}',
  ].join('\n'),
});

var postQuad = new THREE.Mesh(postGeo, displayMat);
postScene.add(postQuad);

// ── Vertex deform injection ────────────────────────────────────
function injectDeform(material) {
  var ref = {
    uDeformMode:  { value: 0 },
    uDeformAmt:   { value: 0.0 },
    uDeformSpd:   { value: 1.0 },
    uDeformTime:  { value: 0.0 },
  };
  deformShaderRefs.push(ref);

  material.onBeforeCompile = function (shader) {
    shader.uniforms.uDeformMode  = ref.uDeformMode;
    shader.uniforms.uDeformAmt   = ref.uDeformAmt;
    shader.uniforms.uDeformSpd   = ref.uDeformSpd;
    shader.uniforms.uDeformTime  = ref.uDeformTime;

    shader.vertexShader =
      'uniform int   uDeformMode;\n' +
      'uniform float uDeformAmt, uDeformSpd, uDeformTime;\n' +
      shader.vertexShader;

    var deformBlock = [
      'if (uDeformMode == 0) {',
      '  float angle = transformed.y * uDeformAmt * 6.28318;',
      '  float c = cos(angle), s = sin(angle);',
      '  float x = transformed.x * c - transformed.z * s;',
      '  float z = transformed.x * s + transformed.z * c;',
      '  transformed.x = x; transformed.z = z;',
      '} else if (uDeformMode == 1) {',
      '  float angle = transformed.x * uDeformAmt * 2.0;',
      '  float c = cos(angle), s = sin(angle);',
      '  float y = transformed.y * c - transformed.z * s;',
      '  float z = transformed.y * s + transformed.z * c;',
      '  transformed.y = y; transformed.z = z;',
      '}',
    ].join('\n');

    shader.vertexShader = shader.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n' + deformBlock
    );
  };
}

// ── Default mesh ───────────────────────────────────────────────
function makeDefaultMesh() {
  deformShaderRefs = [];
  wireMats  = [];
  edgeLines = [];
  var geo  = new THREE.TorusKnotGeometry(1, 0.32, 220, 36);
  var mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial());
  mesh.visible = false;
  var g    = new THREE.Group();
  g.add(mesh);

  var eg  = new THREE.EdgesGeometry(geo, 5);
  var mat = new THREE.LineBasicMaterial({ color: S.wireColor.getHex(), transparent: true, opacity: S.opacity });
  injectDeform(mat);
  var lines = new THREE.LineSegments(eg, mat);
  lines.renderOrder = 2;
  lines.material.depthWrite = true;
  lines.material.depthTest  = true;
  lines.userData.edgeOverlay = true;
  g.add(lines);
  wireMats = [mat];

  scene.add(g);
  currentGroup = g;
  var tris = geo.index ? geo.index.count / 3 : geo.attributes.position.count / 3;
  setMeshInfo(Math.round(tris), geo.attributes.position.count, 'TorusKnot · default');
  meshBank.push({ name: 'Default', group: g });
  currentMeshIndex = 0;
}
makeDefaultMesh();

function setMeshInfo(tris, verts, name) {
  var el;
  if ((el = document.getElementById('triInfo')))  el.textContent = 'Tris '  + tris.toLocaleString();
  if ((el = document.getElementById('vertInfo'))) el.textContent = 'Verts ' + verts.toLocaleString();
  if ((el = document.getElementById('hdrMesh')))  el.textContent = name;
}

// ── Mesh bank ──────────────────────────────────────────────────
function switchToMesh(index) {
  if (index < 0 || index >= meshBank.length) return;
  if (currentGroup) scene.remove(currentGroup);
  currentMeshIndex = index;
  currentGroup = meshBank[index].group;
  scene.add(currentGroup);
  currentGroup.rotation.set(0, 0, 0);
  applyMeshMaterials(currentGroup);
  updateMeshBankUI();
  var hdrMeshEl = document.getElementById('hdrMesh');
  if (hdrMeshEl) hdrMeshEl.textContent = meshBank[index].name;
  persistViewerState();
}
function nextMesh()   { switchToMesh((currentMeshIndex + 1) % meshBank.length); }
function prevMesh()   { switchToMesh((currentMeshIndex - 1 + meshBank.length) % meshBank.length); }
function randomMesh() {
  if (meshBank.length < 2) return;
  var i;
  do { i = Math.floor(Math.random() * meshBank.length); } while (i === currentMeshIndex);
  switchToMesh(i);
}
function updateMeshBankUI() {
  var list = document.getElementById('meshBankList');
  if (list) {
    list.innerHTML = '';
    meshBank.forEach(function (m, i) {
      var row = document.createElement('div');
      row.className = 'bank-item' + (i === currentMeshIndex ? ' active' : '');
      row.textContent = m.name;
      row.onclick = (function (idx) { return function () { switchToMesh(idx); }; })(i);
      list.appendChild(row);
    });
  }
  var mci = document.getElementById('meshCountInfo');
  if (mci) mci.textContent = (currentMeshIndex + 1) + ' / ' + meshBank.length;
}

// ── Preset slot engine ─────────────────────────────────────────
function filledSlots() {
  var out = [];
  for (var i = 0; i < 100; i++) if (presets[i]) out.push(i);
  return out;
}
function slotEl(i) {
  var strip = document.getElementById('slotStrip');
  return strip ? strip.children[i] : null;
}
function renderSlots() {
  for (var i = 0; i < 100; i++) {
    var el = slotEl(i);
    if (!el) continue;
    el.className = 'slot-box'
      + (presets[i] ? ' filled' : '')
      + (i === activeSlot ? ' active' : '');
  }
}
function scrollSlotIntoView(i) {
  var el = slotEl(i);
  if (el) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
}
function selectSlot(i) {
  activeSlot = i;
  renderSlots();
  scrollSlotIntoView(i);
}
function saveToSlot() {
  var snap = {};
  for (var key in S) {
    var val = S[key];
    if (val === null || val === undefined) {
      snap[key] = val;
    } else if (val && val.isColor) {
      snap[key] = '#' + val.getHexString();
    } else if (typeof val === 'object' && !Array.isArray(val)) {
      continue;
    } else {
      snap[key] = val;
    }
  }
  snap._camX      = camera.position.x;
  snap._camY      = camera.position.y;
  snap._camZ      = camera.position.z;
  snap._tgtX      = controls.target.x;
  snap._tgtY      = controls.target.y;
  snap._tgtZ      = controls.target.z;
  snap._rotX      = currentGroup ? normalizeAngle(currentGroup.rotation.x) : 0;
  snap._rotY      = currentGroup ? normalizeAngle(currentGroup.rotation.y) : 0;
  snap._rotZ      = currentGroup ? normalizeAngle(currentGroup.rotation.z) : 0;
  snap._scaleX    = currentGroup ? currentGroup.scale.x : 1;
  snap._scaleY    = currentGroup ? currentGroup.scale.y : 1;
  snap._scaleZ    = currentGroup ? currentGroup.scale.z : 1;
  snap._meshIndex = currentMeshIndex;
  presets[activeSlot] = snap;
  renderSlots();
  persistPresets();
}
function clearSlot() {
  presets[activeSlot] = null;
  renderSlots();
}
function applySnapImmediate(p) {
  // Apply only non-interpolatable keys: mesh index, materials
  if (p._meshIndex !== undefined && p._meshIndex !== currentMeshIndex) {
    switchToMesh(p._meshIndex);
  } else {
    if (currentGroup) applyMeshMaterials(currentGroup);
  }
  syncDisplayUniforms();
  renderer.setClearColor(S.bgColor, 1);
}
function applySnapFull(p) {
  for (var key in p) {
    if (key.charAt(0) === '_') continue;
    if (!(key in S)) continue;
    if (SESSION_KEYS.has(key)) continue;
    var val = p[key];
    if (S[key] && S[key].isColor) {
      S[key].set(val);
    } else if (typeof S[key] === 'object' && S[key] !== null && !S[key].isColor) {
      continue;
    } else {
      S[key] = val;
    }
  }
  applySnapImmediate(p);
  if (p._camX !== undefined) {
    camera.position.set(p._camX, p._camY, p._camZ);
    controls.target.set(p._tgtX, p._tgtY, p._tgtZ);
    controls.update();
  }
  if (currentGroup && p._rotX !== undefined)
    currentGroup.rotation.set(p._rotX, p._rotY, p._rotZ);
  if (currentGroup && p._scaleX !== undefined)
    currentGroup.scale.set(p._scaleX, p._scaleY, p._scaleZ);
  syncAllUI();
  syncDisplayUniforms();
  renderer.setClearColor(S.bgColor, 1);
}
function startInterp(snap) {
  interpFrom   = {};
  // Snapshot current S numeric/color values
  for (var key in S) {
    var v = S[key];
    if (v && v.isColor) { interpFrom[key] = '#' + v.getHexString(); }
    else if (typeof v === 'number') { interpFrom[key] = v; }
    else { interpFrom[key] = v; }
  }
  interpFrom._camX  = camera.position.x; interpFrom._camY  = camera.position.y; interpFrom._camZ  = camera.position.z;
  interpFrom._tgtX  = controls.target.x; interpFrom._tgtY  = controls.target.y; interpFrom._tgtZ  = controls.target.z;
  interpFrom._rotX  = currentGroup ? currentGroup.rotation.x : 0;
  interpFrom._rotY  = currentGroup ? currentGroup.rotation.y : 0;
  interpFrom._rotZ  = currentGroup ? currentGroup.rotation.z : 0;
  interpFrom._scaleX = currentGroup ? currentGroup.scale.x : 1;
  interpFrom._scaleY = currentGroup ? currentGroup.scale.y : 1;
  interpFrom._scaleZ = currentGroup ? currentGroup.scale.z : 1;
  interpTo     = snap;
  interpT0     = performance.now();
  interpActive = true;
  applySnapImmediate(snap);
}

function loadSlot(i) {
  var p = presets[i];
  if (!p) return;
  activeSlot = i;
  renderSlots();
  scrollSlotIntoView(i);
  if (S.interpOn) {
    startInterp(p);
  } else {
    applySnapFull(p);
  }
  persistViewerState();
}
function nextSlot() {
  var filled = filledSlots();
  if (!filled.length) return;
  var cur = filled.indexOf(activeSlot);
  loadSlot(filled[(cur + 1) % filled.length]);
}
function prevSlot() {
  var filled = filledSlots();
  if (!filled.length) return;
  var cur = filled.indexOf(activeSlot);
  loadSlot(filled[(cur - 1 + filled.length) % filled.length]);
}
function randomSlot() {
  var filled = filledSlots();
  if (filled.length < 2) return;
  var i;
  do { i = filled[Math.floor(Math.random() * filled.length)]; } while (i === activeSlot);
  loadSlot(i);
}

function syncAllUI() {
  function setSlider(id, val, dispId, dec) {
    var el = document.getElementById(id);
    if (el) el.value = val;
    var disp = document.getElementById(dispId);
    if (disp) disp.textContent = typeof dec === 'number' ? parseFloat(val).toFixed(dec) : val;
  }
  setSlider('opac',         S.opacity,       'opacVal',         2);
  setSlider('spd',          (S.rotSpeed * 180 / Math.PI).toFixed(2), 'spdVal', 2);
  setSlider('rotLag',       S.rotLag,        'rotLagVal',       2);
  setSlider('manScale',     S.manualScale,   'manScaleVal',     2);
  setSlider('decay',        S.decay,         'decayVal',        3);
  setSlider('hue',          S.hue,           'hueVal',          0);
  setSlider('brig',         S.brightness,    'brigVal',         2);
  setSlider('cont',         S.contrast,      'contVal',         2);
  setSlider('sat',          S.saturation,    'satVal',          2);
  setSlider('hueModRate',   S.hueModRate,    'hueModRateVal',   1);
  setSlider('hueModDepth',  S.hueModDepth,   'hueModDepthVal',  0);
  setSlider('deformSpd',    S.deformSpeed,   'deformSpdVal',    1);
  setSlider('echoInterval', S.echoInterval,  'echoVal',         0);

  function setColor(swId, hexId, inId, color) {
    var hex = '#' + color.getHexString();
    var sw = document.getElementById(swId); if (sw) sw.style.background = hex;
    var hx = document.getElementById(hexId); if (hx) hx.textContent = hex.toUpperCase();
    var inp = document.getElementById(inId); if (inp) inp.value = hex;
  }
  setColor('swWire', 'hexWire', 'inWire', S.wireColor);
  setColor('swBg',   'hexBg',   'inBg',   S.bgColor);
  setColor('swTint', 'hexTint', 'inTint', S.tintColor);

  function setBtn(id, state, onText, offText) {
    var btn = document.getElementById(id);
    if (!btn) return;
    btn.classList.toggle('on', state);
    btn.textContent = state ? onText : offText;
  }
  setBtn('btnRot',         S.autoRot,      'On',  'Off');
  setBtn('btnTrail',       S.trailOn,      'On',  'Off');
  setBtn('btnHueMod',      S.hueMod,       'On',  'Off');
  setBtn('btnMidiScale',   S.midiScaleOn,  'On',  'Off');
  setBtn('btnMidiRot',     S.midiRotOn,    'On',  'Off');
  setBtn('btnMidiDeform',  S.midiDeformOn, 'On',  'Off');
  setBtn('btnMidiBri',     S.midiBriOn,    'On',  'Off');
  setBtn('btnMidiHue',     S.midiHueOn,    'On',  'Off');
  setBtn('btnMidiDecay',   S.midiDecayOn,  'On',  'Off');
  setBtn('btnTrigPreset',  S.midiTriggerPreset, 'On', 'Off');
  setBtn('btnInterpOn',    S.interpOn,          'On', 'Off');
  setSlider('interpDur',   S.interpDur, 'interpDurVal', 1);

  document.querySelectorAll('[data-axis]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.axis === S.rotAxis);
  });
  document.querySelectorAll('[data-blend]').forEach(function (b) {
    b.classList.toggle('on', parseInt(b.dataset.blend) === S.blendMode);
  });
  document.querySelectorAll('[data-trailtype]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.trailtype === S.trailType);
  });
  document.querySelectorAll('[data-deformmode]').forEach(function (b) {
    b.classList.toggle('on', parseInt(b.dataset.deformmode) === S.deformMode);
  });
  document.querySelectorAll('[data-huewave]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.huewave === S.hueModWave);
  });
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.mode === S.meshMode);
  });

  var pillTrail = document.getElementById('pillTrail');
  if (pillTrail) { pillTrail.textContent = 'Trail ' + (S.trailOn ? 'ON' : 'OFF'); pillTrail.classList.toggle('active', S.trailOn); }
  var pillMode = document.getElementById('pillMode');
  if (pillMode) pillMode.textContent = S.meshMode === 'wire' ? 'Wire' : 'Edge';
  var di = document.getElementById('decayInfo'); if (di) di.textContent = 'Decay ' + S.decay.toFixed(3);
  var bi = document.getElementById('blendInfo'); if (bi) bi.textContent = 'Blend: ' + blendNames[S.blendMode];
}

// ── syncDisplayUniforms ────────────────────────────────────────
function syncDisplayUniforms() {
  if (!S.midiHueOn) displayMat.uniforms.uHue.value = S.hue;
  if (!S.midiBriOn) displayMat.uniforms.uBri.value = S.brightness;
  displayMat.uniforms.uCon.value = S.contrast;
  displayMat.uniforms.uSat.value = S.saturation;
  displayMat.uniforms.uTnt.value.set(S.tintColor.getHex());
  displayMat.uniforms.uBgColor.value.copy(S.bgColor);
  displayMat.uniforms.uTrailMode.value = S.trailOn;
}

// ── Render loop ────────────────────────────────────────────────
var lastT  = performance.now();
var frames = 0;
var SMOOTH = 0.06;

function render() {
  requestAnimationFrame(render);
  controls.update();

  // ── Preset interpolation tick ─────────────────────────────────
  if (interpActive && interpFrom && interpTo) {
    var tRaw = (performance.now() - interpT0) / (S.interpDur * 1000);
    var t = tRaw >= 1.0 ? 1.0 : tRaw * tRaw * (3.0 - 2.0 * tRaw); // cubic ease in-out
    for (var ikey in interpTo) {
      if (ikey.charAt(0) === '_') continue;
      if (!(ikey in S)) continue;
      if (SESSION_KEYS.has(ikey)) continue;
      var fromV = interpFrom[ikey];
      var toV   = interpTo[ikey];
      if (S[ikey] && S[ikey].isColor) {
        var fc = new THREE.Color(fromV), tc = new THREE.Color(toV);
        S[ikey].setRGB(
          fc.r + (tc.r - fc.r) * t,
          fc.g + (tc.g - fc.g) * t,
          fc.b + (tc.b - fc.b) * t
        );
      } else if (typeof toV === 'number' && typeof fromV === 'number') {
        S[ikey] = fromV + (toV - fromV) * t;
      }
    }
    // camera
    if (interpTo._camX !== undefined) {
      camera.position.set(
        interpFrom._camX + (interpTo._camX - interpFrom._camX) * t,
        interpFrom._camY + (interpTo._camY - interpFrom._camY) * t,
        interpFrom._camZ + (interpTo._camZ - interpFrom._camZ) * t
      );
      controls.target.set(
        interpFrom._tgtX + (interpTo._tgtX - interpFrom._tgtX) * t,
        interpFrom._tgtY + (interpTo._tgtY - interpFrom._tgtY) * t,
        interpFrom._tgtZ + (interpTo._tgtZ - interpFrom._tgtZ) * t
      );
      controls.update();
    }
    // rotation + scale
    if (currentGroup && interpTo._rotX !== undefined) {
      currentGroup.rotation.set(
        lerpAngle(interpFrom._rotX, interpTo._rotX, t),
        lerpAngle(interpFrom._rotY, interpTo._rotY, t),
        lerpAngle(interpFrom._rotZ, interpTo._rotZ, t)
      );
    }
    if (currentGroup && interpTo._scaleX !== undefined) {
      currentGroup.scale.set(
        interpFrom._scaleX + (interpTo._scaleX - interpFrom._scaleX) * t,
        interpFrom._scaleY + (interpTo._scaleY - interpFrom._scaleY) * t,
        interpFrom._scaleZ + (interpTo._scaleZ - interpFrom._scaleZ) * t
      );
    }
    if (tRaw >= 1.0) {
      interpActive = false;
      applySnapFull(interpTo);
    } else {
      syncDisplayUniforms();
    }
  }

  var elapsed = (performance.now() - startTime) / 1000;

  // ── MIDI: hold or smooth-return each channel ──────────────────
  // Scale (MIDI × manual)
  var midiScaleVal;
  if (S.midiScaleOn) {
    if (!midiActive.scale) midiVals.scale += (1.0 - midiVals.scale) * SMOOTH;
    midiScaleVal = midiVals.scale;
  } else {
    midiVals.scale = 1.0;
    midiScaleVal = 1.0;
  }
  currentScale = S.manualScale * midiScaleVal;
  if (currentGroup) currentGroup.scale.setScalar(currentScale);

  // Rotation with inertia
  if (!midiActive.rot) {
    midiVals.rot += (0 - midiVals.rot) * SMOOTH;
  }
  var targetRotSpeed = (S.midiRotOn && midiActive.rot) ? midiVals.rot : S.rotSpeed;
  smoothRotSpeed += (targetRotSpeed - smoothRotSpeed) * (1.0 - S.rotLag);
  if (S.autoRot && currentGroup) {
    currentGroup.rotation[S.rotAxis] += smoothRotSpeed;
    currentGroup.rotation.x = normalizeAngle(currentGroup.rotation.x);
    currentGroup.rotation.y = normalizeAngle(currentGroup.rotation.y);
    currentGroup.rotation.z = normalizeAngle(currentGroup.rotation.z);
  }

  // Deform amount
  if (!midiActive.deform) {
    midiVals.deform += (0 - midiVals.deform) * SMOOTH;
  }
  var deformAmt = S.midiDeformOn ? midiVals.deform : S.deformAmt;

  // Deform uniforms — unconditional so mode changes always propagate
  for (var di = 0; di < deformShaderRefs.length; di++) {
    var dr = deformShaderRefs[di];
    dr.uDeformMode.value  = S.deformMode;
    dr.uDeformAmt.value   = deformAmt;
    dr.uDeformSpd.value   = S.deformSpeed;
    dr.uDeformTime.value  = elapsed;
  }

  // Brightness
  if (!midiActive.bri) {
    midiVals.bri += (0 - midiVals.bri) * SMOOTH;
  }
  if (S.midiBriOn) {
    displayMat.uniforms.uBri.value = midiVals.bri;
  }

  // Hue
  if (!midiActive.hue) {
    midiVals.hue += (0 - midiVals.hue) * SMOOTH;
  }

  // Decay
  if (!midiActive.decay) {
    midiVals.decay += (S.decay - midiVals.decay) * SMOOTH;
  }
  var effectiveDecay = (S.midiDecayOn && midiActive.decay) ? midiVals.decay : S.decay;

  // Sync static display uniforms first, then hue mod / MIDI hue override uHue
  syncDisplayUniforms();

  // Hue modulator (runs after syncDisplayUniforms to override uHue)
  if (S.hueMod && !S.midiHueOn) {
    huePhase += S.hueModRate;
    var wave;
    if (S.hueModWave === 'sine')     wave = (Math.sin(huePhase * Math.PI / 180) + 1) * 0.5;
    else if (S.hueModWave === 'tri') wave = Math.abs(((huePhase / 180) % 2) - 1);
    else                             wave = Math.random();
    displayMat.uniforms.uHue.value = S.hue + wave * S.hueModDepth;
  } else if (S.midiHueOn) {
    displayMat.uniforms.uHue.value = S.hue + midiVals.hue;
  }

  if (S.trailOn) {
    var frameDecay;
    if (S.trailType === 'paint') {
      frameDecay = 1.0;
    } else if (S.trailType === 'echo') {
      echoFrame++;
      frameDecay = (echoFrame % S.echoInterval === 0) ? 1.0 : 0.96;
    } else {
      frameDecay = effectiveDecay;
    }

    renderer.setRenderTarget(rtScene);
    renderer.setClearColor(0x000000, 1);
    renderer.clear();
    renderer.render(scene, camera);

    feedbackMat.uniforms.tCur.value   = rtScene.texture;
    feedbackMat.uniforms.tPrev.value  = rtA.texture;
    feedbackMat.uniforms.uDecay.value = frameDecay;
    feedbackMat.uniforms.uBlend.value = S.blendMode;
    postQuad.material = feedbackMat;
    renderer.setRenderTarget(rtB);
    renderer.clear();
    renderer.render(postScene, postCamera);

    displayMat.uniforms.tIn.value = rtB.texture;
    postQuad.material = displayMat;
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);

    var tmp = rtA; rtA = rtB; rtB = tmp;

  } else {
    renderer.setRenderTarget(rtScene);
    renderer.setClearColor(S.bgColor, 1);
    renderer.clear();
    renderer.render(scene, camera);

    displayMat.uniforms.tIn.value = rtScene.texture;
    postQuad.material = displayMat;
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCamera);
  }

  frames++;
  var now = performance.now();
  if (now - lastT > 600) {
    frames = 0; lastT = now;
  }
}

// ── Resize ─────────────────────────────────────────────────────
function onResize() {
  var w = cw(), h = ch();
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  rtScene.setSize(w, h); rtA.setSize(w, h); rtB.setSize(w, h);
}
window.addEventListener('resize', onResize);
onResize();

// ── Trail helpers ──────────────────────────────────────────────
function clearTrail() {
  [rtA, rtB].forEach(function (rt) {
    renderer.setRenderTarget(rt);
    renderer.setClearColor(0x000000, 0);
    renderer.clear();
  });
  renderer.setRenderTarget(null);
}

// ── Mesh material helpers ──────────────────────────────────────
function applyMeshMaterials(group) {
  wireMats = []; lineMats = []; edgeLines = []; deformShaderRefs = [];

  // Remove edge overlay children
  var toRemove = [];
  group.traverse(function (c) {
    if (c.userData.edgeOverlay) toRemove.push(c);
  });
  toRemove.forEach(function (c) {
    if (c.parent) c.parent.remove(c);
    if (c.geometry) c.geometry.dispose();
    if (c.material) c.material.dispose();
  });

  // Re-show original meshes
  group.traverse(function (child) {
    if (child.isMesh && !child.userData.edgeOverlay) child.visible = true;
  });

  group.traverse(function (child) {
    if (!child.isMesh || child.userData.edgeOverlay) return;
    child.renderOrder = 0;
    var color = S.wireColor.clone();

    if (S.meshMode === 'edge') {
      child.visible = false;
      var eg    = new THREE.EdgesGeometry(child.geometry, 15);
      var mat   = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: S.opacity });
      injectDeform(mat);
      var lines = new THREE.LineSegments(eg, mat);
      lines.renderOrder = 2;
      lines.material.depthWrite = true;
      lines.material.depthTest  = true;
      lines.userData.edgeOverlay = true;
      lines.position.copy(child.position);
      lines.quaternion.copy(child.quaternion);
      lines.scale.copy(child.scale);
      child.parent.add(lines);
      wireMats.push(mat);
      edgeLines.push(lines);
    } else {
      child.visible = false;
      var eg  = new THREE.EdgesGeometry(child.geometry, 5);
      var mat = new THREE.LineBasicMaterial({
        color: S.wireColor.getHex(), transparent: true, opacity: S.opacity,
      });
      injectDeform(mat);
      var lines = new THREE.LineSegments(eg, mat);
      lines.renderOrder = 2;
      lines.material.depthWrite = true;
      lines.material.depthTest  = true;
      lines.userData.edgeOverlay = true;
      lines.position.copy(child.position);
      lines.quaternion.copy(child.quaternion);
      lines.scale.copy(child.scale);
      child.parent.add(lines);
      wireMats.push(mat);
    }

  });
}

function syncWireColor() {
  wireMats.forEach(function (m) { if (m.color) m.color.set(S.wireColor.getHex()); });
}
function syncWireOpacity() {
  wireMats.forEach(function (m) { m.opacity = S.opacity; m.transparent = S.opacity < 1; });
}

// ── GLB loader ─────────────────────────────────────────────────
var loader = new THREE.GLTFLoader();

function normaliseGroup(group) {
  var box    = new THREE.Box3().setFromObject(group);
  var centre = box.getCenter(new THREE.Vector3());
  var size   = box.getSize(new THREE.Vector3());
  group.position.sub(centre);
  var maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, 0, maxDim * 2.2);
  controls.reset();
}

function loadGLB(file) {
  var url = URL.createObjectURL(file);
  loader.load(url, function (gltf) {
    URL.revokeObjectURL(url);

    var group = gltf.scene;
    var tris  = 0, verts = 0;
    group.traverse(function (c) {
      if (c.isMesh) {
        var g = c.geometry;
        verts += g.attributes.position.count;
        tris  += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      }
    });

    normaliseGroup(group);
    var meshName = file.name.replace('.glb', '');
    meshBank.push({ name: meshName, group: group });
    switchToMesh(meshBank.length - 1);

    clearTrail();
    setMeshInfo(Math.round(tris), verts, meshName);
    var hint = document.getElementById('dropHint');
    if (hint) hint.classList.remove('show');
  }, undefined, function (err) { console.error('GLB load error', err); });
}

// ── localStorage persistence ───────────────────────────────────
function persistPresets() {
  localStorage.setItem('d93_presets', JSON.stringify(presets));
  localStorage.setItem('d93_activeSlot', activeSlot);
}

function persistMeshLib() {
  var lib = meshBank.map(function (m) { return { name: m.name, url: m.url || null }; });
  localStorage.setItem('d93_meshLib', JSON.stringify(lib));
}

function persistViewerState() {
  var snap = {};
  for (var key in S) {
    var val = S[key];
    if (val && val.isColor) snap[key] = '#' + val.getHexString();
    else if (typeof val !== 'object') snap[key] = val;
  }
  snap._camX = camera.position.x; snap._camY = camera.position.y; snap._camZ = camera.position.z;
  snap._tgtX = controls.target.x; snap._tgtY = controls.target.y; snap._tgtZ = controls.target.z;
  snap._rotX = currentGroup ? currentGroup.rotation.x : 0;
  snap._rotY = currentGroup ? currentGroup.rotation.y : 0;
  snap._rotZ = currentGroup ? currentGroup.rotation.z : 0;
  snap._meshIndex = currentMeshIndex;
  localStorage.setItem('d93_viewerState', JSON.stringify(snap));
}

function loadPersistedPresets() {
  try {
    var raw = localStorage.getItem('d93_presets');
    if (raw) {
      var loaded = JSON.parse(raw);
      loaded.forEach(function (p, i) { if (i < 100) presets[i] = p; });
    }
    var slot = localStorage.getItem('d93_activeSlot');
    if (slot !== null) activeSlot = parseInt(slot);
    renderSlots();
  } catch(e) { console.warn('d93: preset load failed', e); }
}

function loadPersistedMeshLib() {
  try {
    var raw = localStorage.getItem('d93_meshLib');
    if (!raw) return;
    var lib = JSON.parse(raw);
    lib.forEach(function (entry) {
      if (!entry.url) return;
      loader.load(entry.url, function (gltf) {
        var group = gltf.scene;
        normaliseGroup(group);
        applyMeshMaterials(group);
        group.visible = false;
        scene.add(group);
        meshBank.push({ name: entry.name, url: entry.url, group: group });
        updateMeshBankUI();
      });
    });
  } catch(e) { console.warn('d93: meshlib load failed', e); }
}

// ── MIDI engine ────────────────────────────────────────────────
function onMIDI(e) {
  var cmd = e.data[0] & 0xF0;
  var vel = e.data[2];
  var isNoteOn  = cmd === 0x90 && vel > 0;
  var isNoteOff = cmd === 0x80 || (cmd === 0x90 && vel === 0);
  var t = vel / 127;

  var note = e.data[1];

  if (isNoteOn) {
    if (S.midiScaleOn)  { midiVals.scale  = S.midiScaleMin  + t * (S.midiScaleMax  - S.midiScaleMin);  midiActive.scale  = true; }
    if (S.midiRotOn)    { midiVals.rot    = S.midiRotMin    + t * (S.midiRotMax    - S.midiRotMin);    midiActive.rot    = true; }
    if (S.midiDeformOn) { midiVals.deform = S.midiDeformMin + t * (S.midiDeformMax - S.midiDeformMin); midiActive.deform = true; }
    if (S.midiBriOn)    { midiVals.bri    = S.midiBriMin    + t * (S.midiBriMax    - S.midiBriMin);    midiActive.bri    = true; }
    if (S.midiHueOn)    { midiVals.hue    = S.midiHueMin    + t * (S.midiHueMax    - S.midiHueMin);    midiActive.hue    = true; }
    if (S.midiDecayOn)  { midiVals.decay  = S.midiDecayMin  + t * (S.midiDecayMax  - S.midiDecayMin);  midiActive.decay  = true; }
    if (S.midiTriggerPreset) {
      if (presetSeqMode === 'RANDOM') { randomSlot(); }
      else if (S.presetDir === 'next') { nextSlot(); }
      else { prevSlot(); }
    }
  }
  if (isNoteOff) {
    midiActive.scale  = false;
    midiActive.rot    = false;
    midiActive.deform = false;
    midiActive.bri    = false;
    midiActive.hue    = false;
    midiActive.decay  = false;
  }
}

function selectMIDIPort(id) {
  if (midiPort) midiPort.onmidimessage = null;
  if (!id || !midiAccess) {
    midiPort       = null;
    midiConnected  = false;
    updateMidiPill();
    return;
  }
  midiPort = midiAccess.inputs.get(id);
  if (midiPort) {
    midiPort.onmidimessage = onMIDI;
    midiConnected = true;
  } else {
    midiConnected = false;
  }
  updateMidiPill();
}

function populateMIDIPorts() {
  var sel = document.getElementById('midiPortSel');
  if (!sel) {
    // No UI — just connect first available port
    if (midiAccess) {
      var first = null;
      midiAccess.inputs.forEach(function (input) { if (!first) first = input.id; });
      if (first) selectMIDIPort(first);
    }
    return;
  }
  var current = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  if (!midiAccess) return;
  midiAccess.inputs.forEach(function (input) {
    var opt = document.createElement('option');
    opt.value = input.id;
    opt.textContent = input.name;
    sel.appendChild(opt);
  });
  if (current && midiAccess.inputs.has(current)) {
    sel.value = current;
  }
  selectMIDIPort(sel.value);
}

function updateMidiPill() {
  var pill = document.getElementById('pillMidi');
  if (pill) { pill.textContent = midiConnected ? 'MIDI ON' : 'MIDI OFF'; pill.classList.toggle('active', midiConnected); }
}

function initMIDI() {
  if (!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess().then(function (access) {
    midiAccess = access;
    populateMIDIPorts();
    access.onstatechange = function () { populateMIDIPorts(); };
  }, function () {
    console.warn('MIDI access denied');
  });
}

// viewer — no UI bindings
var blendNames = ['add', 'screen', 'mix'];

// ── Viewer boot ────────────────────────────────────────────────
loadPersistedPresets();
loadPersistedMeshLib();

try {
  var _raw = localStorage.getItem('d93_viewerState');
  if (_raw) {
    var _snap = JSON.parse(_raw);
    for (var _key in _snap) {
      if (_key.charAt(0) === '_') continue;
      if (!(_key in S)) continue;
      if (S[_key] && S[_key].isColor) S[_key].set(_snap[_key]);
      else if (typeof S[_key] !== 'object') S[_key] = _snap[_key];
    }
    setTimeout(function () {
      if (_snap._camX !== undefined) {
        camera.position.set(_snap._camX, _snap._camY, _snap._camZ);
        controls.target.set(_snap._tgtX, _snap._tgtY, _snap._tgtZ);
        controls.update();
      }
      if (currentGroup && _snap._rotX !== undefined)
        currentGroup.rotation.set(_snap._rotX, _snap._rotY, _snap._rotZ);
      if (_snap._meshIndex !== undefined)
        switchToMesh(_snap._meshIndex);
    }, 100);
  }
} catch(e) { console.warn('d93: viewer state restore failed', e); }

render();
initMIDI();

})();
</script>
</body>
