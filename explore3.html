<!-- build: explore3-v13-black-fullpage -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore 3 — Days of 93</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --field: #000000;
  --ink: #aaaaaa;
  --line: #aaaaaa;
  --axis-x: #aaaaaa;
  --axis-y: #aaaaaa;
  --hair: 0.75px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }

#field {
  position: fixed; inset: 0; width: 100%; height: 100%;
  z-index: 1; pointer-events: none;
}


#td-video {
  position: fixed; top: -9999px; left: -9999px;
  width: 1px; height: 1px; opacity: 0; pointer-events: none;
}
#td-canvas {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 10; pointer-events: none;
}

#ch {
  position: fixed; inset: 0; pointer-events: none;
  z-index: 999; opacity: 0; transition: opacity 0.3s;
}
#ch-v {
  position: absolute; top: 0; bottom: 0; left: 50%;
  width: 0.75px; background: rgba(255,255,255,0.30);
}
#ch-h {
  position: absolute; left: 0; right: 0; top: 50%;
  height: 0.75px; background: rgba(255,255,255,0.30);
}
#ch-sq {
  position: absolute; width: 7px; height: 7px;
  border: 0.75px solid rgba(255,255,255,0.45);
  transform: translate(-50%, -50%); top: 50%; left: 50%;
}

#dev-ui {
  display: flex;
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  background: rgba(0,0,0,0.80);
  color: #fff;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  padding: 12px 18px;
  border-radius: 4px;
  align-items: center;
  gap: 10px;
  white-space: nowrap;
}

#dev-ui label { opacity: 0.55; }
#dev-ui select {
  background: #222; color: #fff;
  border: 1px solid #555;
  font-family: 'Space Mono', monospace;
  font-size: 11px; padding: 4px 6px; border-radius: 2px;
}
#dev-ui button {
  background: #222; color: #fff;
  border: 1px solid #555;
  font-family: 'Space Mono', monospace;
  font-size: 11px; padding: 4px 10px;
  border-radius: 2px; cursor: pointer;
}
#dev-ui button:hover { background: #444; }
#btn-rec { border-color: #ff4444; }
#btn-rec.active { background: #ff4444; border-color: #ff4444; }
#rec-status { color: #ff4444; min-width: 80px; }
</style>
</head>
<body>

<svg id="field" xmlns="http://www.w3.org/2000/svg"></svg>

<video id="td-video" playsinline muted loop></video>
<canvas id="td-canvas"></canvas>

<div id="ch">
  <div id="ch-v"></div>
  <div id="ch-h"></div>
  <div id="ch-sq"></div>
</div>

<div id="dev-ui">
  <label>MIDI</label>
  <select id="midi-port-sel"><option value="">— no port —</option></select>
  <button id="btn-rec">● REC</button>
  <button id="btn-stop">■ STOP</button>
  <button id="btn-play">▶ PLAY</button>
  <button id="btn-save">↓ SAVE</button>
  <span id="rec-status"></span>
</div>

<script>
// ── build: explore3-v13-black-fullpage ────────────────────────────────

// ── Grid ─────────────────────────────────────────────────────────────
function dayOfYear(d){ const s=new Date(d.getFullYear(),0,0); return Math.floor((d-s)/86400000); }
function daySeed(){ const d=new Date(); return d.getFullYear()*1000+dayOfYear(d); }
function seededRand(seed){ const x=Math.sin(seed)*10000; return x-Math.floor(x); }
const SEED = daySeed();

function drawField(){
  const svg=document.getElementById('field');
  const w=window.innerWidth, h=window.innerHeight;
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  const camX=(seededRand(SEED+1)-0.5)*40;
  const camTilt=(seededRand(SEED+2)-0.5)*0.02;
  const vpX=w*0.5+camX, vpY=h*0.62;
  let L='';
  const bands=18;
  for(let i=0;i<=bands;i++){
    const t=i/bands,y=vpY+Math.pow(t,1.8)*(h-vpY),op=0.34*(1-t*0.65);
    L+='<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="'+op.toFixed(3)+'"/>';
  }
  const cols=16;
  for(let i=0;i<=cols;i++){
    const x=(i/cols)*w;
    L+='<line x1="'+x+'" y1="'+h+'" x2="'+(vpX+(x-vpX)*0.12)+'" y2="'+vpY+'" stroke="var(--line)" stroke-width="var(--hair)" opacity="0.18"/>';
  }
  const ay=Math.sin(camTilt);
  L+='<line x1="0" y1="'+vpY+'" x2="'+w+'" y2="'+(vpY+ay*w)+'" stroke="var(--axis-x)" stroke-width="var(--hair)" opacity="0.48"/>';
  L+='<line x1="'+vpX+'" y1="0" x2="'+vpX+'" y2="'+h+'" stroke="var(--axis-y)" stroke-width="var(--hair)" opacity="0.42"/>';
  svg.innerHTML=L;
}
drawField();
window.addEventListener('resize', drawField);

// ── Videos ───────────────────────────────────────────────────────────
const CDN = 'https://daysof93-cdn.b-cdn.net/Explore3_SBS/';
const VIDEOS = ['td01','td02','td03','td04','td05','td06','td07','td08','td09','td11','td12','td13'];
let lastVideo = null;
let pool = [];

function pickVideo(){
  if(!pool.length) pool = VIDEOS.filter(function(v){ return v!==lastVideo; }).sort(function(){ return Math.random()-0.5; });
  return pool.shift();
}

// ── WebGL SBS compositor ─────────────────────────────────────────────
const vid    = document.getElementById('td-video');
const canvas = document.getElementById('td-canvas');
const gl     = canvas.getContext('webgl', {premultipliedAlpha:false, alpha:true});

const VS = `
  attribute vec2 aPos;
  varying vec2 vUV;
  void main(){
    vUV = vec2(aPos.x*0.5+0.5, 0.5-aPos.y*0.5);
    gl_Position = vec4(aPos,0.0,1.0);
  }`;

const FS = `
  precision mediump float;
  uniform sampler2D uTex;
  varying vec2 vUV;
  void main(){
    vec2 cUV = vec2(vUV.x*0.5,        vUV.y);
    vec2 aUV = vec2(vUV.x*0.5 + 0.5,  vUV.y);
    vec3 color = texture2D(uTex, cUV).rgb;
    float alpha = texture2D(uTex, aUV).r;
    gl_FragColor = vec4(color, alpha);
  }`;

function makeShader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s); return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, makeShader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, makeShader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.uniform1i(gl.getUniformLocation(prog,'uTex'), 0);

gl.enable(gl.BLEND);
gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

let rafId = null;
function startCompositor(){
  if(rafId) return;
  function tick(){
    if(vid.readyState >= vid.HAVE_CURRENT_DATA){
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      if(canvas.width !== sw || canvas.height !== sh){
        canvas.width = sw; canvas.height = sh;
        gl.viewport(0,0,sw,sh);
      }
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,vid);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    }
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function playVideo(name){
  lastVideo = name;
  vid.crossOrigin = 'anonymous';
  vid.src = CDN + name + '_sbs.mp4';
  vid.load();
  vid.play().catch(function(e){ console.log('d93: video play err',e); });
  startCompositor();
  console.log('d93: playing', name);
}

playVideo(pickVideo());

// ── Crosshair ─────────────────────────────────────────────────────────
const ch=document.getElementById('ch');
const chV=document.getElementById('ch-v');
const chH=document.getElementById('ch-h');
const chSq=document.getElementById('ch-sq');
let chTimer=null;

function moveCrosshair(x,y){
  chV.style.left=x+'px';
  chH.style.top=y+'px';
  chSq.style.left=x+'px';
  chSq.style.top=y+'px';
  ch.style.opacity='1';
  clearTimeout(chTimer);
  chTimer=setTimeout(()=>{ ch.style.opacity='0'; },2000);
}
document.addEventListener('mousemove', e=>moveCrosshair(e.clientX,e.clientY));

// ── MIDI ─────────────────────────────────────────────────────────────
let midiAccess=null, activeInput=null;
let isRecording=false, recStart=0, recEvents=[];
let playbackTimers=[];

function onMidiMessage(e){
  const [status,note,velocity]=e.data;
  if((status&0xf0)===0x90 && velocity>0){
    const name=pickVideo();
    playVideo(name);
    if(isRecording){
      recEvents.push({t:Math.round(performance.now()-recStart),note,velocity,video:name});
      updateRecStatus();
    }
  }
}

function connectPort(id){
  if(activeInput) activeInput.onmidimessage=null;
  if(!id||!midiAccess) return;
  activeInput=midiAccess.inputs.get(id);
  if(activeInput){ activeInput.onmidimessage=onMidiMessage; console.log('d93: MIDI port',activeInput.name); }
}

function populatePorts(){
  const sel=document.getElementById('midi-port-sel');
  const prev=sel.value;
  sel.innerHTML='<option value="">— no port —</option>';
  if(!midiAccess) return;
  midiAccess.inputs.forEach((inp,id)=>{
    const o=document.createElement('option');
    o.value=id; o.textContent=inp.name;
    if(id===prev) o.selected=true;
    sel.appendChild(o);
  });
}

if(navigator.requestMIDIAccess){
  navigator.requestMIDIAccess().then(a=>{
    midiAccess=a;
    populatePorts();
    a.onstatechange=populatePorts;
    console.log('d93: MIDI ready');
  }).catch(e=>console.log('d93: MIDI denied',e));
}

document.getElementById('midi-port-sel').addEventListener('change',e=>connectPort(e.target.value));

// ── Recorder ─────────────────────────────────────────────────────────
function updateRecStatus(){
  document.getElementById('rec-status').textContent=
    isRecording?'● '+recEvents.length+' events':'';
}

document.getElementById('btn-rec').addEventListener('click',()=>{
  recEvents=[]; recStart=performance.now(); isRecording=true;
  document.getElementById('btn-rec').classList.add('active');
  updateRecStatus();
  console.log('d93: REC start');
});

document.getElementById('btn-stop').addEventListener('click',()=>{
  isRecording=false;
  document.getElementById('btn-rec').classList.remove('active');
  updateRecStatus();
  console.log('d93: REC stop,',recEvents.length,'events');
});

document.getElementById('btn-play').addEventListener('click',()=>{
  if(!recEvents.length) return;
  playbackTimers.forEach(clearTimeout); playbackTimers=[];
  recEvents.forEach(ev=>{
    playbackTimers.push(setTimeout(()=>playVideo(ev.video), ev.t));
  });
  console.log('d93: playback');
});

document.getElementById('btn-save').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({version:1,created:new Date().toISOString(),events:recEvents},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='explore3-'+Date.now()+'.json';
  a.click();
  console.log('d93: JSON saved');
});

</script>
</body>
</html>
