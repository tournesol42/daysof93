<!DOCTYPE html>
<!-- build: explore4-v14-edges-clean -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 5);

let model = null;
let modelHeight = 1;
const SPEED = 0.003;

// Frustum half-height at a given z depth in world space
function frustumHalfH(z) {
  const dist = camera.position.z - z;
  return dist * Math.tan((camera.fov / 2) * Math.PI / 180);
}

const loader = new THREE.GLTFLoader();
loader.load('https://daysof93-cdn.b-cdn.net/explore4font3.glb', (gltf) => {
  const group = new THREE.Group();

  gltf.scene.updateWorldMatrix(true, true);

  gltf.scene.traverse((child) => {
    if (!child.isMesh) return;
    const geom = child.geometry.clone();
    geom.applyMatrix4(child.matrixWorld);
    const edges = new THREE.EdgesGeometry(geom, 15);
    const lines = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xa8bfff }));
    group.add(lines);
  });

  // Center group at origin
  const box = new THREE.Box3().setFromObject(group);
  const center = new THREE.Vector3();
  box.getCenter(center);
  group.position.sub(center);

  modelHeight = box.max.y - box.min.y;

  // Start just above the top of the frustum
  const halfH = frustumHalfH(group.position.z);
  group.position.y = halfH + modelHeight / 2;

  model = group;
  scene.add(model);
});

function animate() {
  requestAnimationFrame(animate);

  if (model) {
    model.position.y -= SPEED;

    const modelZ = model.position.z;
    const halfH = frustumHalfH(modelZ);
    const bottomEdge = -halfH - modelHeight / 2;
    const topEntry = halfH + modelHeight / 2;

    if (model.position.y < bottomEdge) {
      model.position.y = topEntry;
    }
  }

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
