<!DOCTYPE html>
<!-- build: explore4-v28-pivot-group -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(0, 1, 2);
scene.add(dirLight);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

const loader = new THREE.GLTFLoader();
loader.load('/explore4fontmesh6.glb', function(gltf) {
  var gltfScene = gltf.scene;

  // 1. Raw bounds before any rotation
  var box = new THREE.Box3().setFromObject(gltfScene);
  var center = box.getCenter(new THREE.Vector3());
  var size = box.getSize(new THREE.Vector3());

  // 2. Shift gltfScene so geometry center sits at pivot origin
  gltfScene.position.sub(center);

  // 3. Wrap in a pivot group; rotating the pivot spins around geometry center
  var pivot = new THREE.Group();
  pivot.add(gltfScene);
  pivot.rotation.x = -Math.PI / 2;

  // 4. Camera distance: XZ footprint becomes XY after -90° rotation
  var maxDim = Math.max(size.x, size.z);
  var fovRad = (camera.fov * Math.PI) / 180;
  var dist = (maxDim / 2) / Math.tan(fovRad / 2) / 0.6;
  camera.position.set(0, 0, dist);
  camera.updateProjectionMatrix();

  // 5. Material override
  gltfScene.traverse(function(child) {
    if (child.isMesh) child.material = new THREE.MeshBasicMaterial({ color: 0xa8bfff });
  });

  console.log('v28 size', size, 'dist', dist.toFixed(1));
  scene.add(pivot);
});

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
