<!DOCTYPE html>
<!-- build: explore4-v1-font-test -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TEXT = 'Insert coin to play';

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth;
  const H = window.innerHeight;
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.scale(dpr, dpr);

  ctx.clearRect(0, 0, W, H);

  // Binary-search font size so text spans ~75% of viewport width
  const target = W * 0.75;
  let lo = 1, hi = W;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    ctx.font = `${mid}px 'VT323', monospace`;
    ctx.font = `${mid}px 'VT323', monospace`; // set twice to ensure applied
    const w = ctx.measureText(TEXT).width;
    if (w < target) lo = mid; else hi = mid;
  }
  const size = (lo + hi) / 2;

  ctx.font = `${size}px 'VT323', monospace`;
  ctx.lineWidth = 1;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#a8bfff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(TEXT, W / 2, H / 2);
}

document.fonts.ready.then(draw);

window.addEventListener('resize', draw);
</script>
</body>
</html>
