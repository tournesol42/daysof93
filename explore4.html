<!DOCTYPE html>
<!-- build: explore4-v18-fontmesh1 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);

const loader = new THREE.GLTFLoader();
loader.load('https://daysof93-cdn.b-cdn.net/explore4fontmesh1.glb', function(gltf) {
  var root = gltf.scene;

  // Center at origin
  var box = new THREE.Box3().setFromObject(root);
  var center = box.getCenter(new THREE.Vector3());
  root.position.sub(center);

  // Position camera so model fills ~60% of viewport height
  var size = box.getSize(new THREE.Vector3());
  var maxDim = Math.max(size.x, size.y, size.z);
  var fovRad = (camera.fov * Math.PI) / 180;
  var dist = (maxDim / 2) / Math.tan(fovRad / 2) / 0.6;
  camera.position.set(0, 0, dist);
  camera.updateProjectionMatrix();

  scene.add(root);
  renderer.render(scene, camera);
});

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
