<!DOCTYPE html>
<!-- build: explore4-v7-faster-bigger -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<style>
@font-face {
  font-family: 'VectorBattle';
  src: url('./fonts/VectorBattle-e9XO.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const TEXT = '8 16 32 64 128 256 512 1025';

function lerpHex(a, b, t) {
  const p = s => [parseInt(s.slice(1,3),16), parseInt(s.slice(3,5),16), parseInt(s.slice(5,7),16)];
  const [ar,ag,ab] = p(a), [br,bg,bb] = p(b);
  const r = Math.round(ar + (br-ar)*t).toString(16).padStart(2,'0');
  const g = Math.round(ag + (bg-ag)*t).toString(16).padStart(2,'0');
  const bh = Math.round(ab + (bb-ab)*t).toString(16).padStart(2,'0');
  return `#${r}${g}${bh}`;
}

const DIM = '#2a4aaa', BRIGHT = '#b0ccff';
let fontSize = null;

function computeSize(W) {
  const target = W * 0.50;
  let lo = 1, hi = W;
  for (let i = 0; i < 24; i++) {
    const mid = (lo + hi) / 2;
    ctx.font = `${mid}px 'VectorBattle', monospace`;
    if (ctx.measureText(TEXT).width < target) lo = mid; else hi = mid;
  }
  return (lo + hi) / 2;
}

function frame() {
  const dpr = window.devicePixelRatio || 1;
  const W = window.innerWidth;
  const H = window.innerHeight;

  if (cv.width !== W * dpr || cv.height !== H * dpr) {
    cv.width = W * dpr;
    cv.height = H * dpr;
    fontSize = null;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (fontSize === null) fontSize = computeSize(W);

  const s = (Math.sin(Date.now() * 0.003) + 1) / 2;
  const t = s * s * (3 - 2 * s);
  ctx.font = `${fontSize}px 'VectorBattle', monospace`;
  ctx.lineWidth = 0.4;
  ctx.lineJoin = 'round';
  ctx.strokeStyle = lerpHex(DIM, BRIGHT, t);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(TEXT, W / 2, H / 2);

  requestAnimationFrame(frame);
}

window.addEventListener('resize', () => { fontSize = null; });

document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
</body>
</html>
