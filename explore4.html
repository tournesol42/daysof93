<!DOCTYPE html>
<!-- build: explore4-v30-aspect-aware-dist -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>explore4 — days of 93</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
canvas { display: block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 1000);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
dirLight.position.set(0, 1, 2);
scene.add(dirLight);

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

const loader = new THREE.GLTFLoader();
loader.load('/explore4fontmesh6.glb', function(gltf) {
  var root = gltf.scene;

  // Add first so world matrices are correct for Box3
  scene.add(root);

  var box = new THREE.Box3().setFromObject(root);
  var center = box.getCenter(new THREE.Vector3());
  var size = box.getSize(new THREE.Vector3());

  // Center root (geometry center → world origin)
  root.position.sub(center);

  // Model is flat in XZ (y ≈ 0). Camera looks straight down from Y.
  // Must fit both dimensions: size.x in horizontal FOV, size.z in vertical FOV.
  var aspect = window.innerWidth / window.innerHeight;
  var fovRad = (camera.fov * Math.PI) / 180;
  var tanHalfVFov = Math.tan(fovRad / 2);
  var distZ = (size.z / 2) / tanHalfVFov / 0.6;
  var distX = (size.x / 2) / (aspect * tanHalfVFov) / 0.6;
  var dist = Math.max(distX, distZ);
  camera.position.set(0, dist, 0);
  camera.up.set(0, 0, -1);
  camera.lookAt(0, 0, 0);

  // DoubleSide so normals facing either direction render
  root.traverse(function(child) {
    if (child.isMesh) child.material = new THREE.MeshBasicMaterial({ color: 0xa8bfff, side: THREE.DoubleSide });
  });

  console.log('v30 size', size, 'distX', distX.toFixed(1), 'distZ', distZ.toFixed(1), 'dist', dist.toFixed(1));
});

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
